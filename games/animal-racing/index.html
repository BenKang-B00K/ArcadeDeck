<div id="stage" class="stage" aria-hidden="true"></div>

<!-- boot splash: one of the racing banners at random, picked before first paint; game.js lifts it once the game is ready.
     The banners may be missing: the art then stays hidden and the title shows on the ambient background -->
<div id="splash" aria-hidden="true"><img class="blur" alt="" decoding="async"><div class="card"><img class="art" alt="" decoding="async"><svg class="title" viewBox="0 0 640 96"><linearGradient id="spT" x2="0" y2="1"><stop offset=".1" style="stop-color:var(--t1)"/><stop offset=".9" style="stop-color:var(--t2)"/></linearGradient><text x="320" y="74" textLength="600" lengthAdjust="spacingAndGlyphs">ANIMAL RACING</text></svg></div></div>
<script>
{
  const s = document.querySelector('#splash'), b = ['neon-arcade', 'toy-diorama', 'storybook', 'festival'][Math.random() * 4 | 0], have = document.documentElement.dataset.banners.split(' ');
  s.dataset.b = b; // title colours per banner (style.css)
  s.querySelectorAll('img').forEach(i => { if (!have.includes(b)) return i.remove(); i.onload = () => { i.classList.add('on'); s.classList.add('art'); }; i.onerror = () => i.remove(); i.src = `banners/${b}.webp`; });
}
</script>

<!-- top bar on menu screens: back (left), language + volume (right). The volume widget moves into the pause dialog during a race -->
<header id="bar">
  <button id="backBtn" class="icon-btn" type="button" data-i18n-aria="back"><svg class="ic"><use href="#i-back"/></svg></button>
  <div class="tools">
    <button id="lang" class="lang icon-btn" type="button"><svg class="ic"><use href="#i-globe"/></svg><span></span></button>
    <div id="vol" class="vol">
      <button id="volBtn" class="icon-btn" type="button" aria-expanded="false" aria-controls="volPop" data-i18n-aria="volume"><svg class="ic"><use id="volIcon" href="#i-vol-high"/></svg></button>
      <div id="volPop" class="pop" hidden>
        <div class="vrow">
          <button class="icon-btn sm" type="button" data-mute="music" data-i18n-aria="music"><svg class="ic"><use href="#i-music"/></svg><span class="vlab" aria-hidden="true" data-i18n="bgm"></span></button>
          <span class="vs"><input id="musicVol" type="range" min="0" max="100" step="1" data-i18n-aria="music"><output class="vtip" for="musicVol" aria-hidden="true"></output></span>
        </div>
        <div class="vrow">
          <button class="icon-btn sm" type="button" data-mute="sfx" data-i18n-aria="sfx"><svg class="ic"><use href="#i-vol-high"/></svg><span class="vlab" aria-hidden="true" data-i18n="fx"></span></button>
          <span class="vs"><input id="sfxVol" type="range" min="0" max="100" step="1" data-i18n-aria="sfx"><output class="vtip" for="sfxVol" aria-hidden="true"></output></span>
        </div>
      </div>
    </div>
  </div>
</header>

<main id="app">
  <section id="title" class="screen menu">
    <div class="hero">
      <svg class="big-title" viewBox="0 0 900 130" role="heading" aria-level="1"><defs><linearGradient id="ttG" x2="0" y2="1"><stop offset=".1" stop-color="#fff"/><stop offset=".9" stop-color="#ffc8f0"/></linearGradient></defs><text x="450" y="98" data-i18n="title">Animal Racing</text></svg>
      <p class="tagline" data-i18n="tagline"></p>
      <div id="parade" class="parade" aria-hidden="true"></div>
      <div class="title-btns">
        <button id="startBtn" class="btn primary big" type="button"><svg class="ic"><use href="#i-play"/></svg><span data-i18n="start"></span></button>
        <button id="setBtn" class="btn ghost" type="button"><svg class="ic"><use href="#i-gear"/></svg><span data-i18n="settings"></span></button>
        <button class="btn ghost link-btn" type="button"><svg class="ic"><use href="#i-link"/></svg><span data-i18n="link"></span></button>
        <button id="installBtn" class="btn ghost install" type="button" hidden><svg class="ic"><use href="#i-download"/></svg><span data-i18n="install"></span></button>
        <p id="iosHint" class="note ios-hint" hidden><svg class="ic"><use href="#i-share"/></svg><span data-i18n="iosInstall"></span></p>
      </div>
    </div>
  </section>

  <section id="mode" class="screen menu" hidden>
    <div class="inner">
      <h2 class="head" data-i18n="chooseMode"></h2>
      <div class="panel">
        <div class="modes">
          <button class="mode-card" type="button" data-mode="quick"><svg class="ic"><use href="#i-flag"/></svg><b data-i18n="quick"></b><small data-i18n="quickSub"></small></button>
          <button class="mode-card" type="button" data-mode="gp"><svg class="gly"><use href="#g-win"/></svg><b data-i18n="gp"></b><small data-i18n="gpSub"></small></button>
        </div>
        <h3 class="sec"><span data-i18n="speed"></span></h3>
        <div class="row">
          <span class="seg"><button class="pill help" type="button" data-i18n-aria="tipHelp" data-i18n-tip="tipSpeed">?<span class="tip" aria-hidden="true"></span></button></span>
          <div class="seg">
            <button class="pill" type="button" data-speed="chill" data-i18n-tip="tipChill"><span data-i18n="chill"></span><span class="tip" aria-hidden="true"></span></button>
            <button class="pill" type="button" data-speed="normal" data-i18n-tip="tipNormal"><span data-i18n="normal"></span><span class="tip" aria-hidden="true"></span></button>
            <button class="pill" type="button" data-speed="turbo" data-i18n-tip="tipTurbo"><span data-i18n="turbo"></span><span class="tip" aria-hidden="true"></span></button>
          </div>
        </div>
        <small class="tip-line" id="speedTip" aria-hidden="true"></small>
        <h3 class="sec"><span data-i18n="stakes"></span></h3>
        <div class="row">
          <button id="stakesBtn" class="pill toggle" type="button" aria-pressed="false"><i class="knob"></i><span data-i18n="stakes"></span></button>
          <small class="note" data-i18n="stakesSub"></small>
        </div>
        <div id="stakePanel" class="stake-panel" hidden>
          <div class="presets tabs">
            <span class="pair"><button class="pill" type="button" data-stake="win" data-i18n="pWin"></button><button class="pill" type="button" data-stake="pen" data-i18n="pPen"></button></span>
            <button class="pill" type="button" data-stake="rank" data-i18n="pRank"></button>
            <button class="pill" type="button" data-stake="team" data-i18n="pTeam"></button>
            <button class="pill" type="button" data-stake="bill" data-i18n="pBill"></button>
          </div>
          <div id="stakeSub" class="presets sub"></div>
        </div>
      </div>
      <div class="foot"><button id="modeNext" class="btn primary big" type="button"><span data-i18n="next"></span><svg class="ic"><use href="#i-arrow"/></svg></button></div>
    </div>
  </section>

  <section id="lobby" class="screen menu" hidden>
    <div class="inner wide">
      <h2 class="head" data-i18n="pickRacer"></h2>
      <div class="panel">
        <div id="slots" class="slots"></div>
        <div class="lobby-main">
          <div id="preview" class="preview"><b id="pvName" class="pv-name"></b></div>
          <ol id="zoo" class="zoo"></ol>
        </div>
      </div>
      <div class="foot">
        <button class="icon-btn link-btn" type="button" data-i18n-aria="link"><svg class="ic"><use href="#i-link"/></svg></button>
        <button id="randBtn" class="btn ghost" type="button"><svg class="ic"><use href="#i-dice"/></svg><span data-i18n="random"></span></button>
        <button id="lobbyNext" class="btn primary big" type="button"><span data-i18n="next"></span><svg class="ic"><use href="#i-arrow"/></svg></button>
        <p class="note net-wait" data-i18n="waitHost"></p>
      </div>
    </div>
  </section>

  <section id="track" class="screen menu" hidden>
    <div class="inner wide">
      <h2 class="head" data-i18n="pickTrack"></h2>
      <div id="tracks" class="tracks"></div>
      <div class="foot"><button id="trackGo" class="btn primary big" type="button"><svg class="ic"><use href="#i-flag"/></svg><span data-i18n="race"></span></button></div>
    </div>
  </section>

  <section id="race" class="screen" hidden>
    <canvas id="view3d"></canvas>
    <div id="hud"></div>
    <button id="pauseBtn" class="icon-btn" type="button" data-i18n-aria="pause"><svg class="ic"><use href="#i-pause"/></svg></button>
  </section>

  <section id="results" class="screen menu" hidden>
    <div class="inner wide">
      <h2 class="head" data-i18n="results"></h2>
      <p id="resTrack" class="note sub"></p>
      <div class="res-main">
        <div id="podium" class="podium"></div>
        <ol id="resList" class="res-list"></ol>
      </div>
      <div class="foot">
        <button id="toTitle" class="btn ghost" type="button"><svg class="ic"><use href="#i-home"/></svg><span data-i18n="toTitle"></span></button>
        <button id="changeBtn" class="btn ghost" type="button"><svg class="ic"><use href="#i-users"/></svg><span data-i18n="change"></span></button>
        <button id="sumBtn" class="btn ghost" type="button" hidden><svg class="ic"><use href="#i-list"/></svg><span data-i18n="summary"></span></button>
        <button id="rematchBtn" class="btn primary big" type="button"><svg class="ic"><use href="#i-reset"/></svg><span data-i18n="rematch"></span></button>
        <button id="nextBtn" class="btn primary big" type="button" hidden><span data-i18n="nextTrack"></span><svg class="ic"><use href="#i-arrow"/></svg></button>
        <p class="note net-wait" data-i18n="waitHost"></p>
      </div>
    </div>
  </section>
</main>

<dialog id="pauseDlg">
  <h2 data-i18n="paused"></h2>
  <p id="pausedBy" class="note"></p>
  <div id="pauseVol" class="pause-vol"></div>
  <div class="dlg-actions col">
    <button id="resumeBtn" class="btn primary" type="button" autofocus><svg class="ic"><use href="#i-play"/></svg><span data-i18n="resume"></span></button>
    <button id="restartBtn" class="btn ghost" type="button"><svg class="ic"><use href="#i-reset"/></svg><span data-i18n="restart"></span></button>
    <button id="quitBtn" class="btn ghost" type="button"><svg class="ic"><use href="#i-home"/></svg><span data-i18n="quit"></span></button>
  </div>
</dialog>

<dialog id="setDlg">
  <h2 data-i18n="settings"></h2>
  <div class="set-grid">
    <span class="label" data-i18n="laps"></span><div class="seg" data-set="laps"><button class="pill" type="button" data-v="2">2</button><button class="pill" type="button" data-v="3">3</button><button class="pill" type="button" data-v="5">5</button></div>
    <span class="label" data-i18n="racers"></span><div class="seg" data-set="racers"><button class="pill" type="button" data-v="4">4</button><button class="pill" type="button" data-v="6">6</button><button class="pill" type="button" data-v="8">8</button></div>
    <span class="label" data-i18n="layout"></span><div class="seg wrap" data-set="layout"><button class="pill" type="button" data-v="auto" data-i18n="lAuto"></button><button class="pill" type="button" data-v="tb" data-i18n="lTb"></button><button class="pill" type="button" data-v="sbs" data-i18n="lSbs"></button></div>
    <span class="label" data-i18n="quality"></span><div class="seg wrap" data-set="tier"><button class="pill" type="button" data-v="auto" data-i18n="qAuto"></button><button class="pill" type="button" data-v="high" data-i18n="qHigh"></button><button class="pill" type="button" data-v="medium" data-i18n="qMed"></button><button class="pill" type="button" data-v="low" data-i18n="qLow"></button></div>
    <span class="label" data-i18n="saver"></span><div><button id="saverBtn" class="pill toggle knob-only" type="button" aria-pressed="false" data-i18n-aria="saver"><i class="knob"></i></button></div>
    <span class="label touch-only" data-i18n="tilt"></span><div class="touch-only"><button id="tiltBtn" class="pill toggle knob-only" type="button" aria-pressed="false" data-i18n-aria="tilt"><i class="knob"></i></button></div>
  </div>
  <div class="dlg-actions"><button id="setClose" class="btn primary" type="button"><svg class="ic"><use href="#i-check"/></svg><span data-i18n="done"></span></button></div>
</dialog>

<dialog id="summary">
  <h2 data-i18n="summary"></h2>
  <ol id="sumList"></ol>
  <div class="dlg-actions"><button id="sumClose" class="btn primary" type="button" autofocus><svg class="ic"><use href="#i-check"/></svg><span data-i18n="close"></span></button></div>
</dialog>

<div id="rotate" class="rotate" aria-live="polite"><svg class="ic"><use href="#i-rotate"/></svg><p data-i18n="rotate"></p></div>
</body>
</html>
