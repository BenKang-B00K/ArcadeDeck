<style>
  :root { --cyan: #2ef2ff; --cyan-d: rgba(46,242,255,.22); --ink: #e6fbff; --mute: #8ea4bb; --bg: #120e2a; --gold: #ffc21a; --game: 'Lilita One', system-ui, sans-serif; --btn: #161c34; --btn-hi: #1f2748;
          --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--ink);
               font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Apple SD Gothic Neo", "Noto Sans JP", "Noto Sans KR", sans-serif;
               touch-action: none; /* iOS ignores user-scalable=no: no page pinch / double-tap zoom anywhere */ user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; }
  [hidden] { display: none !important; }
  button { touch-action: manipulation; font: inherit; }
  .panel { position: fixed; display: flex; gap: 12px; align-items: center; font-size: 20px; padding: 8px 12px; border-radius: 16px;
           background: linear-gradient(180deg, rgba(26,32,64,.72), rgba(10,14,30,.78)); border: 1px solid var(--cyan-d);
           box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 10px 30px rgba(0,0,0,.45); backdrop-filter: blur(10px) saturate(1.3); -webkit-backdrop-filter: blur(10px) saturate(1.3); }
  #hud { top: calc(12px + var(--st)); left: calc(12px + var(--sl)); }
  #hud span { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  #hud span:nth-child(2) { flex-shrink: 1; min-width: 0; } /* only the progress bar gives way on narrow screens */
  #hud b { font-family: var(--game); font-weight: 400; min-width: 2ch; font-variant-numeric: tabular-nums; letter-spacing: .01em; display: inline-block; }
  #hud .ic { color: var(--cyan); filter: drop-shadow(0 0 4px rgba(46,242,255,.5)); }
  svg.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  #bar { display: inline-block; position: relative; min-width: 24px; flex-shrink: 1; width: min(140px, 26vw); height: 10px; background: #0d1226; border-radius: 6px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.6); }
  #fill { display: block; height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, #1aa8ff, var(--cyan)); box-shadow: 0 0 10px var(--cyan); transition: width .15s; position: relative; overflow: hidden; }
  #fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.55) 50%, transparent 80%); transform: translateX(-100%); animation: shine 2.4s infinite; }
  @keyframes shine { 60%, 100% { transform: translateX(100%); } }
  #lvlw { padding: 2px 9px 2px 6px; border-radius: 10px; background: rgba(255,194,26,.14); color: var(--gold); }
  #lvlw .ic { color: var(--gold); filter: drop-shadow(0 0 4px rgba(255,194,26,.6)); }
  #shop { bottom: calc(14px + var(--sb)); right: calc(12px + var(--sr)); gap: 6px; padding: 6px; }
  /* shop sits bottom-right: tips right-align so the last one never runs off screen */
  #shop .tip { left: auto; right: 0; transform: translate(0, 6px); }
  #shop button.show > .tip, #shop button:focus-visible > .tip { transform: none; }
  @media (hover: hover) { #shop button:hover > .tip { transform: none; } }
  #shop .tip::before { left: auto; right: 22px; margin-left: 0; } #shop .tip::after { left: auto; right: 23px; margin-left: 0; }
  #shop button { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 58px; padding: 6px 0 5px; border: 1px solid transparent; border-radius: 10px;
                 background: linear-gradient(180deg, var(--btn-hi), var(--btn)); color: var(--ink); cursor: pointer; position: relative; transition: transform .12s, opacity .2s, border-color .2s, box-shadow .2s; }
  #shop button::before { content: ''; position: absolute; left: 6px; bottom: 2px; height: 3px; border-radius: 2px; width: calc(var(--p, 0) * (100% - 12px)); background: var(--cyan); opacity: .55; transition: width .2s; } /* progress toward affordable */
  #shop button .ic { width: 22px; height: 22px; }
  #shop button .cost { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 3px; }
  #shop button .cost .ic { width: 11px; height: 11px; opacity: .8; }
  #shop button .dots { font-size: 9px; font-weight: 700; color: var(--cyan); height: 10px; line-height: 10px; }
  #shop button.can { border-color: rgba(46,242,255,.6); box-shadow: 0 0 14px rgba(46,242,255,.25), inset 0 0 12px rgba(46,242,255,.12); }
  #shop button.can > .ic { color: var(--cyan); filter: drop-shadow(0 0 5px rgba(46,242,255,.7)); }
  #shop button.off > :not(.tip) { opacity: .5; } /* not the button itself, or its tip fades too */
  #shop button:active { transform: scale(.93); }
  @media (hover: hover) { #shop button:hover { transform: translateY(-3px) scale(1.06); } }
  #shop button.buy { animation: buy .35s; }
  #shop #bulk { width: 34px; align-self: stretch; justify-content: center; }
  #shop #bulk .tip::before { right: 10px; } #shop #bulk .tip::after { right: 11px; }
  #shop #bulk.on { color: var(--cyan); border-color: rgba(46,242,255,.6); }
  #shop button .cost sub { font-size: 9px; color: var(--cyan); vertical-align: baseline; }
  @keyframes buy { 0% { box-shadow: 0 0 0 0 var(--cyan); background: var(--cyan); } 100% { box-shadow: 0 0 24px 8px transparent; } }
  #opt { top: calc(12px + var(--st)); right: calc(12px + var(--sr)); padding: 4px; gap: 4px; font-size: 16px; }
  #opt button { display: grid; place-items: center; color: var(--ink); width: 36px; height: 36px; border: 0; border-radius: 9px;
               background: linear-gradient(180deg, var(--btn-hi), var(--btn)); cursor: pointer; position: relative; transition: transform .1s, color .15s; }
  #opt button:active { transform: scale(.9); }
  #opt .ic { width: 20px; height: 20px; }
  #opt button.on { color: var(--cyan); box-shadow: inset 0 0 0 1px rgba(46,242,255,.5); }
  #volb.on > .tip { opacity: 0 !important; }
  #lang i { position: absolute; right: 3px; bottom: 2px; font: 700 9px/1 system-ui, sans-serif; font-style: normal; color: var(--cyan); }
  /* volume popover: icon-only slider (mute ◀ ▶ loud) */
  #volpop { position: fixed; gap: 10px; padding: 10px 14px; } /* top / right set from the volume button on open */
  #volpop .ic { width: 20px; height: 20px; color: var(--mute); }
  #vol { -webkit-appearance: none; appearance: none; width: min(180px, 44vw); height: 28px; background: transparent; margin: 0; touch-action: none; }
  #vol::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--cyan) var(--v, 70%), #243052 var(--v, 70%)); }
  #vol::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--cyan) var(--v, 70%), #243052 var(--v, 70%)); }
  #vol::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%; background: #fff; border: 3px solid var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  #vol::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  /* tooltip: real element so it can hold a title / value / description; opaque bg + shadow for readability over the 3D scene */
  .tip { position: absolute; z-index: 5; left: 50%; bottom: calc(100% + 14px); transform: translate(-50%, 6px); opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s;
         text-align: left; white-space: nowrap; font-size: 14px; font-weight: 400; line-height: 1.4; color: var(--ink); background: #0f1426; padding: 9px 13px; border-radius: 10px;
         border: 1px solid rgba(46,242,255,.55); box-shadow: 0 10px 28px rgba(0,0,0,.6), 0 0 14px rgba(46,242,255,.18); }
  .tip::before, .tip::after { content: ''; position: absolute; left: 50%; top: 100%; border: 7px solid transparent; border-top-color: rgba(46,242,255,.55); margin-left: -7px; }
  .tip::after { border-width: 6px; margin-left: -6px; margin-top: -1px; border-top-color: #0f1426; }
  .tip b { display: block; font-size: 15px; font-weight: 600; color: var(--cyan); letter-spacing: .01em; }
  .tip em { font-style: normal; font-variant-numeric: tabular-nums; }
  .tip em::after { content: ' → '; color: #7f93a8; }
  .tip em + em::after { content: ''; }
  .tip em + em { color: var(--cyan); font-weight: 600; }
  .tip small { display: block; margin-top: 3px; font-size: 12.5px; color: #9fb3c8; }
  .tip kbd { display: inline-block; min-width: 18px; padding: 1px 4px; margin-right: 2px; text-align: center; font: 600 11px/16px system-ui, sans-serif; color: var(--ink); border: 1px solid rgba(46,242,255,.45); border-radius: 4px; }
  @media (hover: none) { #help { display: none !important; } } /* keyboard help: touch-only devices have no keys */
  button.show > .tip, button:focus-visible > .tip { opacity: 1; transform: translate(-50%, 0); }
  @media (hover: hover) { button:hover > .tip { opacity: 1; transform: translate(-50%, 0); } #opt button:hover > .tip { transform: translate(0, 0); } }
  #opt .tip { left: auto; bottom: auto; right: 0; top: calc(100% + 14px); transform: translate(0, -6px); }
  #opt .tip::before, #opt .tip::after { top: auto; bottom: 100%; left: auto; right: 11px; margin: 0; border-top-color: transparent; border-bottom-color: rgba(46,242,255,.55); }
  #opt .tip::after { right: 12px; margin-bottom: -1px; border-bottom-color: #0f1426; }
  #opt button.show > .tip, #opt button:focus-visible > .tip { transform: translate(0, 0); }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  #fade { position: fixed; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity .5s; }
  .float { position: fixed; color: var(--cyan); font-family: var(--game); font-size: 24px; font-weight: 400; pointer-events: none; text-shadow: 0 0 10px var(--cyan), 0 2px 0 rgba(0,0,0,.5); animation: float .8s cubic-bezier(.2,.8,.3,1) forwards; }
  .float.sm { font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 0 6px var(--cyan), 0 1px 0 rgba(0,0,0,.6); animation-duration: .6s; }
  /* crit: hot gradient text (distinct from gold HIRED) + fire glow + bigger pop */
  .float.crit { font-size: 20px; font-weight: 900; color: #ff6a2e; background: linear-gradient(180deg, #fffbd0 10%, #ffc21a 45%, #ff3d2e 90%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
                text-shadow: none; filter: drop-shadow(0 0 6px rgba(255,90,40,.9)) drop-shadow(0 1px 0 rgba(0,0,0,.6)); animation: crit .75s cubic-bezier(.2,.8,.3,1) forwards; z-index: 1; }
  @keyframes crit { 0% { transform: translate(-50%, -100%) scale(.5) rotate(-8deg); } 18% { transform: translate(-50%, -115%) scale(1.5) rotate(4deg); } 30% { transform: translate(-50%, -112%) scale(1.2) rotate(0); } 100% { transform: translate(-50%, -100%) translateY(-70px) scale(1); opacity: 0; } }
  .float.hire { animation-duration: 1.5s; font-size: 11px; letter-spacing: .08em; color: #ffc21a; text-shadow: 0 0 6px rgba(255,194,26,.7), 0 1px 0 rgba(0,0,0,.6); }
  @keyframes float { 0% { transform: translate(-50%, -100%) scale(.6); } 20% { transform: translate(-50%, -110%) scale(1.15); } 100% { transform: translate(-50%, -100%) translateY(-60px) scale(.9); opacity: 0; } }
  #toasts { position: fixed; top: calc(76px + var(--st)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 14px; color: var(--ink); font-size: 20px; font-weight: 700; white-space: nowrap;
           background: linear-gradient(180deg, rgba(26,32,64,.85), rgba(10,14,30,.9)); border: 1px solid var(--cyan); box-shadow: 0 0 18px rgba(46,242,255,.4), 0 8px 24px rgba(0,0,0,.4); animation: toast 1.8s ease-out forwards; }
  .toast.long { font-size: 16px; animation-duration: 5s; white-space: normal; text-align: center; }
  .toast .ic { width: 26px; height: 26px; color: var(--cyan); }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-16px) scale(.8); } 10% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
  #lvl.bump { animation: bump .5s; }
  @keyframes bump { 40% { transform: scale(1.7); color: var(--cyan); text-shadow: 0 0 12px var(--cyan); } }
  #hint { position: fixed; left: 50%; bottom: calc(118px + var(--sb)); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600;
          color: var(--ink); pointer-events: none; text-shadow: 0 2px 8px #000; animation: hint 1.6s ease-in-out infinite; transition: opacity .4s; }
  #hint .ic { color: var(--cyan); width: 26px; height: 26px; }
  @keyframes hint { 50% { transform: translateX(-50%) translateY(-6px); } }
  /* loading screen = banner art, always fills; tall screens crop to the left side so the logo stays whole */
  #boot { position: fixed; inset: 0; overflow: hidden; background: var(--bg); transition: opacity .6s; z-index: 10; }
  #boot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  @media (max-aspect-ratio: 4/3) { #boot img { object-position: 0 50%; } }
  #boot h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); margin: 0; } /* the art carries the logo; kept for screen readers */
  #boot .load { position: absolute; left: 50%; bottom: calc(22px + var(--sb)); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 14px;
                background: rgba(10,8,30,.6); border: 1px solid var(--cyan-d); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #boot .ic { width: 28px; height: 28px; color: var(--gold); filter: drop-shadow(0 0 8px var(--cyan)); animation: swing 1s ease-in-out infinite; transform-origin: 30% 70%; }
  #boot p { margin: 0; color: var(--ink); font-size: 15px; font-weight: 600; }
  @keyframes swing { 50% { transform: rotate(-35deg); } }
  #boot.gone { opacity: 0; pointer-events: none; }
  /* phones (portrait): options stack down the right edge so they never collide with the HUD; tips open to the left */
  @media (max-width: 560px) {
    #opt { flex-direction: column; }
    #hud { box-sizing: border-box; max-width: calc(100vw - 92px - var(--sl) - var(--sr)); } /* leave room for the option column */
    .toast { max-width: calc(100vw - 160px); } /* centred: clear of the option column */
    #opt .tip { top: 50%; right: calc(100% + 14px); transform: translate(6px, -50%); }
    #opt button.show > .tip { transform: translate(0, -50%); }
    #opt .tip::before, #opt .tip::after { bottom: auto; top: 50%; right: auto; left: 100%; margin: -7px 0 0; border-bottom-color: transparent; border-left-color: rgba(46,242,255,.55); }
    #opt .tip::after { margin: -6px 0 0 -1px; border-left-color: #0f1426; }
  }
  @media (max-width: 420px) { .panel { font-size: 17px; gap: 9px; } #hud { padding: 7px 10px; } #shop button { width: 50px; } #shop #bulk { width: 30px; } }
  @media (pointer: coarse) { #opt button { width: 44px; height: 44px; } } /* 44 px touch targets */
  @media (max-width: 360px) { #shop { gap: 4px; padding: 4px; box-sizing: border-box; max-width: calc(100vw - 24px - var(--sl) - var(--sr)); } #shop button { width: 44px; flex-shrink: 1; min-width: 0; } #shop #bulk { width: 28px; } #hud { gap: 7px; } } /* 320 px phones fit as is; narrower (fold covers) squeeze the buttons */
  @media (prefers-reduced-motion: reduce) { #fill::after, #hint, #boot .ic { animation: none; } }
</style>
</head>

<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs>

<div id="hud" class="panel">
  <span><svg class="ic"><use href="#i-click"/></svg> <b id="clicks">0</b></span>
  <span><svg class="ic"><use href="#i-crane"/></svg> <i id="bar"><i id="fill"></i></i></span>
  <span id="lvlw"><svg class="ic"><use href="#i-flag"/></svg> <b id="lvl">1</b></span>
</div>
<div id="shop" class="panel"></div>
<div id="opt" class="panel">
  <button id="install" hidden aria-label="install"><svg class="ic"><use href="#i-install"/></svg><span class="tip"><b data-t="install"></b><small data-t="installSub"></small></span></button>
  <button id="zoom" aria-label="zoom"><svg class="ic"><use href="#i-zoom"/></svg><span class="tip"><b data-t="zoom"></b><small data-t="zoomSub"></small></span></button>
  <button id="lang" aria-label="language"><svg class="ic"><use href="#i-globe"/></svg><i></i><span class="tip"><b data-t="lang"></b><small data-t="langSub"></small></span></button>
  <button id="volb" aria-label="volume"><svg class="ic"><use href="#i-vol2"/></svg><span class="tip"><b data-t="vol"></b><small data-t="volSub"></small></span></button>
  <button id="help" aria-label="keys"><svg class="ic"><use href="#i-help"/></svg><span class="tip"><b data-t="keys"></b><small><kbd>Q</kbd> <kbd>E</kbd> <span data-t="keysQE"></span></small><small><kbd>A</kbd> <kbd>D</kbd> <span data-t="keysAD"></span></small><small><kbd>W</kbd> <kbd>S</kbd> <span data-t="keysWS"></span></small></span></button>
</div>
<div id="volpop" class="panel" hidden>
  <svg class="ic"><use href="#i-vol0"/></svg><input id="vol" type="range" min="0" max="100" step="1" aria-label="volume"><svg class="ic"><use href="#i-vol3"/></svg>
</div>
<div id="hint" hidden><svg class="ic"><use href="#i-click"/></svg><span data-t="tap"></span></div>
<div id="toasts"></div>
<div id="fade"></div>
<div id="boot"><img src="icons/banner.webp" alt="" fetchpriority="high"><h1 data-t="title">Build Site Clicker</h1><div class="load"><svg class="ic"><use href="#i-hammer"/></svg><p data-t="loading">Loading…</p></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { createApp, LOW } from './src/scene.js';
import { makeLandmark } from './src/landmark.js';
import { Worker, REACH } from './src/worker.js';
import { levelSpec, makeProps } from './src/levels.js';
import { UPGRADES, cost, derived, crewTiers, bulk, CRIT } from './src/upgrades.js';
import { state, load, save } from './src/state.js';
import { delay } from './src/vfx.js';
import { release } from './src/toon.js';
import { sfx, getVolume, setVolume } from './src/sound.js';
import { t, num, lang, setLang, nextLang } from './src/i18n.js';

const $ = id => document.getElementById(id), ico = id => `<svg class="ic"><use href="#i-${id}"/></svg>`;
const q = new URLSearchParams(location.search);
const buzz = ms => navigator.vibrate?.(ms); // Android haptics; no-op on iOS
setLang(lang);
load();

const app = createApp();
const workers = [];
const MAX_WORKERS = LOW ? 40 : 80; // ponytail: hard cap; pool + InstancedMesh if it ever matters
let spec, landmark, props, slot = 0, transitioning = false, zoomed = false;
let D = derived(state.up), payAcc = 0;
const scr = new THREE.Vector3(), pan = p => Math.max(-1, Math.min(1, scr.copy(p).project(app.camera).x)); // world pos → stereo pan

// ---------- level ----------
function buildLevel(animateCam) {
  spec = levelSpec(state.level);
  app.setGround(spec.ground, spec.k); app.grid.scale.set(spec.k, 1, spec.k); // bigger cycles = longer bridges
  props = makeProps(spec); app.world.add(props);
  landmark = makeLandmark({ ...spec, type: spec.landmark }); app.world.add(landmark.group);
  landmark.setHits(state.points);
  app.setCamera(spec.cam, spec.target, animateCam); zoomed = false; $('zoom').classList.remove('on');
  hud();
  if (landmark.done) clearLevel(); // saved mid-celebration → finish the transition
}
function clearLevel() {
  transitioning = true; buzz([30, 60, 60]);
  delay(1.8, () => {
    workers.forEach(w => w.leave());
    $('fade').style.opacity = 1;
    delay(0.6, () => {
      landmark.dispose(); app.world.remove(props); release(props);
      state.level++; state.points = 0; save();
      buildLevel(true);
      sfx.clear();
      $('lvl').classList.remove('bump'); void $('lvl').offsetWidth; $('lvl').classList.add('bump');
      $('fade').style.opacity = 0;
      transitioning = false;
    });
  });
}

// ---------- click → workers ----------
// build points already on their way: each worker swings once, so an un-swung worker still owes power × worth
const owed = () => workers.reduce((s, w) => s + (w.state === 'leave' || w.hitDone ? 0 : D.power * w.worth), 0);
function spawnWorker(tier = 1, worth = 1) {
  if (landmark.done || transitioning || workers.length >= MAX_WORKERS) return;
  if (owed() >= landmark.total - landmark.hits) return; // enough crew en route to finish the building
  // random deck; spawn 6–7.5 out along its outward direction (±35°) so the walk is long enough for speed upgrades to matter
  const sl = (slot++ % 3) - 1, deck = Math.floor(Math.random() * landmark.decks);
  let fi = landmark.current();
  const { at: to, face } = landmark.stand(sl, REACH, deck);
  const a = face + (Math.random() - 0.5) * 1.2, r = 6 + Math.random() * 1.5;
  const from = new THREE.Vector3(to.x - Math.sin(a) * r, 0, to.z - Math.cos(a) * r);
  sfx.spawn(pan(from));
  worldFloat(from, 1.1, t('hired'), 'hire'); // above the hard hat
  const w = new Worker(app.world, {
    speed: D.speed, tier, worth,
    floorY: () => landmark.floorY(),
    aim: () => landmark.current() === fi ? null : (fi = landmark.current(), landmark.stand(sl, REACH, deck)), // floor finished en route → new spot (tapers / shifts move the face)
    onHit: (p, worth) => {
      const crit = Math.random() < D.luck, n = D.power * worth * (crit ? CRIT : 1), ev = landmark.addHits(n);
      state.points = landmark.hits;
      payAcc += n * D.pay; if (payAcc >= 1) { const k = Math.floor(payAcc); payAcc -= k; state.clicks += k; } // payroll; fraction carried
      hud();
      worldFloat(p, 0, '+' + num(n) + (crit ? '!' : ''), crit ? 'crit' : 'hit');
      const lv = crit ? Math.max(ev.level, 1) : ev.level; // crit → at least the "phase" burst + sound
      sfx.hit(lv, pan(p));
      if (ev.level >= 2) buzz(ev.level === 3 ? 80 : 25);
      if (ev.level === 3) clearLevel();
      return { ...ev, level: lv };
    },
  });
  w.spawnAt(from).goTo(to, face);
  workers.push(w);
}
// tiny world-anchored text ("+N" at hammer, "HIRED" at spawn); ponytail: 40 ms throttle per kind caps DOM churn at 80 workers, pool if it ever shows in profiles
const lastFloat = {};
function worldFloat(p, dy, txt, kind) {
  const now = performance.now(); if (now - (lastFloat[kind] ?? 0) < 40) return;
  scr.copy(p); scr.y += dy; scr.project(app.camera); if (scr.z > 1) return; // behind camera
  lastFloat[kind] = now;
  float((scr.x + 1) / 2 * innerWidth, (1 - scr.y) / 2 * innerHeight, txt, 'sm ' + kind);
}
function float(x, y, txt, cls = '') { const f = document.createElement('div'); f.className = 'float ' + cls; f.textContent = txt; f.style.left = x + 'px'; f.style.top = y + 'px'; document.body.appendChild(f); f.onanimationend = () => f.remove(); }
function click(x, y) {
  state.clicks++; state.total++;
  if (x != null) { float(x, y, '+1'); sfx.click(x / innerWidth * 1.6 - 0.8); buzz(8); }
  if (!$('hint').hidden) { $('hint').style.opacity = 0; setTimeout(() => $('hint').hidden = true, 400); }
  for (const { tier, count, worth } of crewTiers(D.crew)) spawnWorker(tier, count * worth); // one worker per tier carries the whole digit: keeps spawns under MAX_WORKERS
  hud(); $('clicks').animate([{ transform: 'scale(1.18)' }, { transform: 'none' }], 140);
}
// anti auto-clicker: script-made events, > 20 taps/s, or a machine-steady rhythm (12 gaps nearly identical) earn nothing.
// ponytail: client-side only, a randomized clicker under 20/s still passes; server-side checks if there is ever a leaderboard
const TAP_MAX = 20, recent = [], gaps = [];
let lastTap = 0, botToast = -1e9;
function human(e) {
  const now = e.timeStamp;
  if (lastTap) { gaps.push(now - lastTap); if (gaps.length > 12) gaps.shift(); } lastTap = now;
  while (recent.length && now - recent[0] > 1000) recent.shift();
  const m = gaps.reduce((s, g) => s + g, 0) / gaps.length, sd = Math.sqrt(gaps.reduce((s, g) => s + (g - m) ** 2, 0) / gaps.length);
  const bot = !e.isTrusted || recent.length >= TAP_MAX || (gaps.length === 12 && m < 400 && sd < Math.min(4, m * 0.03)); // 3 % spread: tight drummers ~3–6 %, OS clickers ~1 %
  if (!bot) recent.push(now);
  else if (now - botToast > 5000) { botToast = now; toast('click', t('bot'), true); }
  return !bot;
}
// every finger is its own tap (multi-touch drumming); a touch drag (orbit) is not a tap
const downs = new Map(), cv = app.renderer.domElement;
cv.addEventListener('pointerdown', e => downs.set(e.pointerId, [e.clientX, e.clientY]));
cv.addEventListener('pointerup', e => {
  const d = downs.get(e.pointerId); downs.delete(e.pointerId);
  if (d && (e.pointerType === 'mouse' ? e.button === 0 : Math.hypot(e.clientX - d[0], e.clientY - d[1]) < 10) && human(e)) click(e.clientX, e.clientY); // left mouse never orbits → any release is a click
});
cv.addEventListener('pointercancel', e => downs.delete(e.pointerId));

// ---------- shop ----------
const shop = $('shop');
for (const u of UPGRADES) {
  const b = document.createElement('button'); b.dataset.id = u.id; b.setAttribute('aria-label', u.id);
  b.innerHTML = `${ico(u.icon)}<span class="cost"></span><span class="dots"></span><span class="tip"></span>`;
  b.onclick = () => {
    const [n, c] = bulk(u, state.up[u.id], state.bulk ? state.clicks : Math.min(state.clicks, cost(u, state.up[u.id])));
    if (!n) return;
    state.clicks -= c; state.up[u.id] += n; D = derived(state.up); sfx.buy(); buzz(15);
    toast(u.icon, LABEL[u.id](D));
    if (u.id === 'crew' && D.crew >= 10 && Math.floor(Math.log10(D.crew)) > Math.floor(Math.log10(D.crew - n))) toast(u.icon, ico('star').repeat(Math.floor(Math.log10(D.crew)) + 1)); // evolved
    b.classList.remove('buy'); void b.offsetWidth; b.classList.add('buy');
    hud(); save();
  };
  shop.appendChild(b);
}
// buy-max toggle (last in the shop)
const bulkB = document.createElement('button'); bulkB.id = 'bulk'; bulkB.setAttribute('aria-label', 'buy max');
bulkB.innerHTML = `${ico('max')}<span class="tip"><b data-t="bulk">${t('bulk')}</b><small data-t="bulkSub">${t('bulkSub')}</small></span>`;
bulkB.onclick = () => { state.bulk = !state.bulk; bulkB.classList.toggle('on', state.bulk); sfx.tick(); hud(); save(); };
bulkB.classList.toggle('on', state.bulk);
shop.appendChild(bulkB);
// icon-only toast: what the upgrade is now
const pct = v => `${Math.round(v * 100)}%`;
const LABEL = { power: D => `×${num(D.power)}`, crew: D => `×${num(D.crew)}`, speed: D => `×${(D.speed / 1.6).toFixed(2)}`, pay: D => pct(D.pay), luck: D => pct(D.luck) };
function toast(icon, txt, long) {
  const el = document.createElement('div'); el.className = 'toast' + (long ? ' long' : ''); el.innerHTML = `${ico(icon)}${long ? '' : ico('up')}<span>${txt}</span>`;
  $('toasts').appendChild(el); el.onanimationend = () => el.remove();
}

// hud: many hits per frame → coalesce into one DOM pass per frame; tooltips only rebuilt when their text changes
let hudQ = false;
function hud() { if (!hudQ) { hudQ = true; requestAnimationFrame(drawHud); } }
function drawHud() {
  hudQ = false;
  $('clicks').textContent = num(state.clicks);
  $('lvl').textContent = state.level;
  $('fill').style.width = (100 * landmark.hits / landmark.total) + '%';
  for (const b of shop.children) {
    const u = UPGRADES.find(u => u.id === b.dataset.id); if (!u) continue;
    const lvl = state.up[u.id], max = lvl >= u.max, c = cost(u, lvl), [n, sum] = state.bulk ? bulk(u, lvl, state.clicks) : [0];
    b.querySelector('.cost').innerHTML = max ? ico('star') : n > 1 ? ico('click') + num(sum) + `<sub>×${n}</sub>` : ico('click') + num(c);
    b.querySelector('.dots').textContent = u.max === Infinity ? lvl : '●'.repeat(Math.min(lvl, 8));
    b.classList.toggle('off', !max && state.clicks < c);
    b.classList.toggle('can', !max && state.clicks >= c);
    b.style.setProperty('--p', max ? 0 : Math.min(1, state.clicks / c));
    const key = lang + lvl;
    if (b.dataset.k !== key) {
      b.dataset.k = key;
      const next = derived({ ...state.up, [u.id]: lvl + 1 });
      b.querySelector('.tip').innerHTML = `<b>${t(u.id)}</b><em>${LABEL[u.id](D)}</em><em>${LABEL[u.id](next)}</em><small>${t(u.id + 'Desc')}</small>`;
    }
  }
}

// touch: long-press a button to show its tip (no hover on touch); the release after a long-press is not a click
let press;
addEventListener('pointerdown', e => {
  const b = e.target.closest('button'); if (e.pointerType === 'mouse' || !b?.querySelector('.tip')) return;
  delete b.dataset.lp;
  press = setTimeout(() => { b.dataset.lp = 1; b.classList.add('show'); buzz(10); }, 450);
}, true);
for (const ev of ['pointerup', 'pointercancel']) addEventListener(ev, () => { clearTimeout(press); const b = document.querySelector('button.show'); if (b) setTimeout(() => b.classList.remove('show'), 1200); }, true);
addEventListener('click', e => { const b = e.target.closest('button'); if (b?.dataset.lp) { delete b.dataset.lp; e.stopPropagation(); } }, true);
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('gesturestart', e => e.preventDefault()); // iOS Safari: no page pinch-zoom over the HUD / shop

// ---------- options ----------
$('zoom').onclick = () => { zoomed = !zoomed; $('zoom').classList.toggle('on', zoomed); zoomed ? app.fit(landmark.bounds()) : app.setCamera(spec.cam, spec.target); };
const LANG_TAG = { en: 'EN', ko: '한', ja: '日' };
const showLang = () => $('lang').querySelector('i').textContent = LANG_TAG[lang];
$('lang').onclick = () => { nextLang(); showLang(); hud(); };
showLang();
// volume: icon mirrors level; tap opens an icon-only slider
const volIcon = v => $('volb').querySelector('use').setAttribute('href', `#i-vol${v === 0 ? 0 : v < 0.34 ? 1 : v < 0.67 ? 2 : 3}`);
const vol = $('vol');
const showVol = v => { vol.value = Math.round(v * 100); vol.style.setProperty('--v', vol.value + '%'); volIcon(v); };
showVol(getVolume());
$('volb').onclick = e => {
  e.stopPropagation(); const pop = $('volpop'); pop.hidden = !pop.hidden; $('volb').classList.toggle('on', !pop.hidden);
  if (pop.hidden) return;
  const b = $('volb').getBoundingClientRect(), col = getComputedStyle($('opt')).flexDirection === 'column'; // beside the button in the portrait column, below it in the row
  pop.style.top = (col ? b.top + b.height / 2 - pop.offsetHeight / 2 : b.bottom + 12) + 'px';
  pop.style.right = innerWidth - (col ? b.left - 10 : b.right) + 'px';
};
vol.oninput = () => { setVolume(vol.value / 100); showVol(getVolume()); };
vol.onchange = () => sfx.tick();
addEventListener('resize', () => { $('volpop').hidden = true; $('volb').classList.remove('on'); }); // placed for the old layout
addEventListener('pointerdown', e => { if (!$('volpop').hidden && !e.target.closest('#volpop, #volb')) { $('volpop').hidden = true; $('volb').classList.remove('on'); } });

// ---------- install (PWA) ----------
let deferred;
const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('install').hidden = false; });
addEventListener('appinstalled', () => $('install').hidden = true);
if (iOS && !standalone) $('install').hidden = false; // Safari has no prompt API: show how
$('install').onclick = async () => {
  if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; $('install').hidden = true; }
  else toast('share', t('iosInstall'), true);
};
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js');

// ---------- loop ----------
buildLevel(false);
app.start(dt => {
  for (const w of workers) w.update(dt);
  for (let i = workers.length - 1; i >= 0; i--) if (workers[i].dead) workers.splice(i, 1);
  landmark.update(dt);
});
// banner stays up at least 1.5 s from page start so it reads even on a cached / fast load
requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(() => { $('boot').classList.add('gone'); setTimeout(() => $('boot').remove(), 700); }, Math.max(0, 1500 - performance.now()))));
if (!state.total) $('hint').hidden = false;
// ArcadeDeck host: idle-style heartbeat — score = landmarks built, subScore = lifetime clicks
const report = () => { if (parent !== window) try { parent.postMessage({ type: 'GAME_OVER', score: state.level - 1, subScore: state.total }, '*'); } catch {} };
setInterval(() => { save(); report(); }, 5000);
addEventListener('visibilitychange', save);
addEventListener('pagehide', () => { save(); report(); }); // iOS doesn't reliably fire beforeunload
addEventListener('beforeunload', save);
window.dbg = { app, state, workers, get landmark() { return landmark; }, THREE, ...(q.has('debug') && { human }) }; // human: tap-check test hook, ?debug only
</script>
</body>
</html>
