<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

<body>
  <div id="app">
  <header id="hud">
    <div class="stat" id="gold"><img class="coin stat-icon" src="./sprites/icon_gold1.png" alt=""><span id="gold-val">0</span></div>
    <div class="stat" id="mult-stat" style="display:none" data-tip="Every hatched wyrmling: +5% gold to all floors"><img class="stat-icon" src="./sprites/icon_multiplier.png" alt="">×<b id="mult-val">1.00</b></div>

    <div class="stat" id="rocks-stat"><span id="res-label">Rocks</span> <b id="rocks-val">12</b></div>
    <div class="stat"><span id="hatch-label">Hatched</span> <b id="hatch-val">0</b></div>
    <button id="sfx-btn" class="stat" data-tip="SFX volume">🔊</button>
    <button id="lang-btn" class="stat" data-tip="Language">EN</button>
    <div id="hint">Drag back from the rock pile to throw — or aim with the left stick, hold <b>A</b>.</div>
  </header>

  <nav id="rail"></nav>

  <main id="stage">
    <div id="view">
      <canvas id="game" width="640" height="480"></canvas>
      <div id="overlay"></div>
    </div>
  </main>

  <aside id="panel"></aside>
  </div>
