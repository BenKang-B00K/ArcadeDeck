<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Obstacle Showcase</title>
<style>
  body {
    margin: 0;
    background: #07080f;
    color: #e6e9ff;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 24px;
  }
  h1 {
    text-align: center;
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #a48bff, #ff8bd0, #ffd86b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0 0 24px;
  }
  .cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 26px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .col {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    align-content: start;
  }
  .col-title {
    grid-column: 1 / -1;
    font-size: 16px;
    letter-spacing: 5px;
    font-weight: 800;
    color: #d8d2ff;
    padding: 8px 4px 12px;
    border-bottom: 1px solid rgba(180, 160, 255, 0.25);
    text-align: center;
  }
  @media (max-width: 900px) {
    .cols { grid-template-columns: 1fr; }
  }
  .cell {
    background: linear-gradient(180deg, #0e1230 0%, #1a0d2e 100%);
    border-radius: 12px;
    box-shadow: 0 0 26px rgba(120, 90, 255, 0.18), 0 0 0 1px rgba(180, 160, 255, 0.12);
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .cell canvas {
    border-radius: 8px;
    background: radial-gradient(ellipse at 50% 0%, #2a2360 0%, transparent 60%), #0a0a18;
    display: block;
  }
  .name {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #c8c2ff;
  }
  .meta {
    font-size: 11px;
    opacity: 0.55;
    letter-spacing: 1px;
  }
  .tuner {
    max-width: 1400px;
    margin: 0 auto 22px;
    background: linear-gradient(180deg, #0e1230 0%, #1a0d2e 100%);
    border-radius: 12px;
    box-shadow: 0 0 26px rgba(120, 90, 255, 0.18), 0 0 0 1px rgba(180, 160, 255, 0.12);
    padding: 14px 16px;
  }
  .tuner-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .tuner-title {
    font-size: 12px;
    letter-spacing: 3px;
    font-weight: 700;
    color: #c8c2ff;
  }
  .tuner button {
    background: linear-gradient(180deg, #4a3a8a, #2a1a5a);
    color: #e8e2ff;
    border: 1px solid rgba(180, 160, 255, 0.4);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 11px;
    letter-spacing: 1px;
    font-weight: 700;
    cursor: pointer;
  }
  .tuner button:hover { background: linear-gradient(180deg, #5a4aa0, #3a2a70); }
  .tuner-status {
    font-size: 11px;
    opacity: 0.7;
    color: #a0ffa0;
  }
  .tuner-status.err { color: #ff8080; }
  .tuner textarea {
    width: 100%;
    min-height: 220px;
    box-sizing: border-box;
    background: #07080f;
    color: #c8e8ff;
    border: 1px solid rgba(180, 160, 255, 0.22);
    border-radius: 6px;
    padding: 10px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.5;
    resize: vertical;
  }
  .cell .reload {
    background: rgba(80, 60, 140, 0.4);
    color: #d8d2ff;
    border: 1px solid rgba(180, 160, 255, 0.3);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    margin-top: 2px;
  }
  .cell .reload:hover { background: rgba(120, 90, 200, 0.5); }
</style>
</head>
<body>
<h1>OBSTACLE SHOWCASE</h1>

<div class="tuner">
  <div class="tuner-head">
    <div class="tuner-title">PARAMS (NEW OBSTACLES)</div>
    <button id="apply-btn">APPLY &amp; RELOAD</button>
    <button id="reset-btn">RESET TO DEFAULTS</button>
    <span class="tuner-status" id="tuner-status">ready</span>
  </div>
  <textarea id="params-edit" spellcheck="false"></textarea>
</div>

<script type="application/json" id="default-params">
{
  "stalactite": {
    "count": 3,
    "mountW": 32,
    "triggerW": 50,
    "spikeW": 20,
    "spikeH": 28,
    "cycleMs": 1900,
    "warnMs": 420,
    "fallMs": 200,
    "holdMs": 380,
    "staggerMs": 600
  },
  "boomerang": {
    "size": 14,
    "rangeMargin": 50,
    "dur": 1600,
    "spinRate": 0.4,
    "bobAmp": 18
  },
  "spikeCurtain": {
    "count": 4,
    "tipW": 26,
    "tipH": 118
  },
  "yoyo": {
    "ballR": 16,
    "minRope": 30,
    "maxRope": 130,
    "spinRate": 0.18,
    "cycleMs": 1500,
    "anchorOffset": 50
  }
}
</script>

<div class="cols">
  <div class="col" id="col-v"><div class="col-title">VERTICAL</div></div>
  <div class="col" id="col-h"><div class="col-title">HORIZONTAL</div></div>
</div>

<script type="module">
const CELL_W = 240;
const CELL_H = 200;

let ctx;
let W = CELL_W;
let H = CELL_H;
let timeMs = 0;

const DEFAULT_PARAMS = JSON.parse(document.getElementById('default-params').textContent);
let PARAMS = JSON.parse(JSON.stringify(DEFAULT_PARAMS));

function roundRect(x, y, w, h, r, fill) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) ctx.fill();
}

function drawBar(o, c0, c1, c2, glow) {
  const grd = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
  grd.addColorStop(0, c0); grd.addColorStop(0.5, c1); grd.addColorStop(1, c2);
  ctx.fillStyle = grd;
  ctx.shadowColor = glow; ctx.shadowBlur = 16;
  roundRect(o.x, o.y, o.w, o.h, 5, true);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(o.x + 4, o.y + 2, o.w - 8, 1.5);
}

function drawSpike(o, points, big) {
  ctx.save();
  ctx.translate(o.x + o.w / 2, o.y + o.h / 2);
  ctx.rotate(o.spin || 0);
  const grd = ctx.createRadialGradient(0, 0, 2, 0, 0, o.w / 2);
  if (big) {
    grd.addColorStop(0, '#ffe2ff'); grd.addColorStop(0.5, '#ff7adb'); grd.addColorStop(1, '#7a1a66');
    ctx.shadowColor = 'rgba(255, 130, 220, 0.9)';
  } else {
    grd.addColorStop(0, '#fff4c8'); grd.addColorStop(0.5, '#ffcc66'); grd.addColorStop(1, '#cc7a1a');
    ctx.shadowColor = 'rgba(255, 200, 80, 0.85)';
  }
  ctx.fillStyle = grd;
  ctx.shadowBlur = big ? 22 : 14;
  ctx.beginPath();
  const s = o.w / 2;
  const inner = big ? 0.55 : 0.45;
  for (let i = 0; i < points * 2; i++) {
    const ang = (i / (points * 2)) * Math.PI * 2;
    const r = i % 2 === 0 ? s : s * inner;
    ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
  }
  ctx.closePath(); ctx.fill();
  if (big) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(0, 0, o.w * 0.12, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawLaser(o) {
  const grd = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
  grd.addColorStop(0, '#3a4a6a'); grd.addColorStop(1, '#1a2235');
  ctx.fillStyle = grd;
  ctx.shadowColor = 'rgba(120, 180, 255, 0.5)'; ctx.shadowBlur = 10;
  roundRect(o.x, o.y, o.w, o.h, 4, true);
  ctx.shadowBlur = 0;
  const ex = o.x + o.w / 2;
  const ey = o.y + 2;
  const beamX = ex - o.beamW / 2;
  if (o.phase !== 'fire') {
    ctx.strokeStyle = 'rgba(255, 100, 100, 0.18)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 6]);
    ctx.beginPath();
    ctx.moveTo(ex, H); ctx.lineTo(ex, ey + o.h);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  if (o.phase === 'warn') {
    const pulse = 0.55 + Math.sin(o.t * 0.045) * 0.4;
    ctx.fillStyle = `rgba(255, 60, 60, ${0.08 * pulse})`;
    ctx.fillRect(beamX - 2, o.y + o.h, o.beamW + 4, H - (o.y + o.h));
    ctx.strokeStyle = `rgba(255, 90, 90, ${pulse})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 6]);
    ctx.shadowColor = '#ff4040'; ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(beamX, o.y + o.h); ctx.lineTo(beamX, H);
    ctx.moveTo(beamX + o.beamW, o.y + o.h); ctx.lineTo(beamX + o.beamW, H);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.setLineDash([]);
  } else if (o.phase === 'fire') {
    const bg = ctx.createLinearGradient(beamX, 0, beamX + o.beamW, 0);
    bg.addColorStop(0, 'rgba(255, 80, 80, 0.35)');
    bg.addColorStop(0.5, '#ffeeee');
    bg.addColorStop(1, 'rgba(255, 80, 80, 0.35)');
    ctx.fillStyle = bg;
    ctx.shadowColor = '#ff4040'; ctx.shadowBlur = 24;
    ctx.fillRect(beamX, o.y + o.h, o.beamW, H - (o.y + o.h));
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(ex, o.y + o.h, 6, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(120, 180, 255, 0.6)';
    ctx.beginPath(); ctx.arc(ex, o.y + o.h, 3, 0, Math.PI * 2); ctx.fill();
  }
}

function drawHoming(o) {
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  ctx.save();
  ctx.translate(cx, cy);
  const grd = ctx.createRadialGradient(0, 0, 2, 0, 0, o.w / 2);
  grd.addColorStop(0, '#fff'); grd.addColorStop(0.4, '#ff7a7a'); grd.addColorStop(1, '#6a0a0a');
  ctx.fillStyle = grd;
  ctx.shadowColor = '#ff3030'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.arc(0, 0, o.w / 2 * 0.9, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-7, 0); ctx.lineTo(7, 0);
  ctx.moveTo(0, -7); ctx.lineTo(0, 7);
  ctx.stroke();
  ctx.restore();
}

function drawRotor(o) {
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(o.angle);
  const grd = ctx.createLinearGradient(-o.w/2, 0, o.w/2, 0);
  grd.addColorStop(0, '#9aff8a'); grd.addColorStop(0.5, '#39d06a'); grd.addColorStop(1, '#0a4a28');
  ctx.fillStyle = grd;
  ctx.shadowColor = 'rgba(120, 255, 140, 0.6)'; ctx.shadowBlur = 14;
  roundRect(-o.w / 2, -o.h / 2, o.w, o.h, 5, true);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a3a1a';
  ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawSaw(o) {
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  const r = o.w / 2;
  ctx.strokeStyle = 'rgba(180, 180, 200, 0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, cy); ctx.lineTo(W, cy);
  ctx.stroke();
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(o.spin);
  ctx.shadowColor = 'rgba(200, 220, 255, 0.8)'; ctx.shadowBlur = 18;
  ctx.fillStyle = '#d8dde8';
  ctx.beginPath();
  const teeth = 14;
  for (let i = 0; i < teeth * 2; i++) {
    const ang = (i / (teeth * 2)) * Math.PI * 2;
    const rr = i % 2 === 0 ? r : r * 0.7;
    ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
  }
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  const hg = ctx.createRadialGradient(0, 0, 2, 0, 0, r * 0.45);
  hg.addColorStop(0, '#fff'); hg.addColorStop(1, '#7a8aa0');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a2030';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.18, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawSwarmUnit(o) {
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  ctx.save();
  ctx.translate(cx, cy);
  const grd = ctx.createRadialGradient(-2, -2, 1, 0, 0, o.w / 2);
  grd.addColorStop(0, '#ffe0a0'); grd.addColorStop(0.5, '#ff6a3c'); grd.addColorStop(1, '#3a0a00');
  ctx.fillStyle = grd;
  ctx.shadowColor = '#ff5520'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(0, 0, o.w / 2 * 0.9, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#1a0a00';
  ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawBomb(o) {
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  if (o.state === 'tick') {
    const k = o.stateT / o.fuse;
    ctx.strokeStyle = `rgba(255, 120, 60, ${0.15 + k * 0.3})`;
    ctx.setLineDash([4, 5]);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, o.maxR, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    const pulse = 1 + Math.sin(o.stateT * (0.015 + k * 0.04)) * 0.18;
    const r = (o.w / 2) * pulse;
    const grd = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, r);
    grd.addColorStop(0, '#fff'); grd.addColorStop(0.4, '#ffb020'); grd.addColorStop(1, '#5a1a00');
    ctx.fillStyle = grd;
    ctx.shadowColor = '#ff5020'; ctx.shadowBlur = 14 + k * 14;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff7c0';
    ctx.beginPath(); ctx.arc(cx + 4, cy - r - 2, 2 + Math.random(), 0, Math.PI * 2); ctx.fill();
  } else if (o.state === 'boom') {
    const prog = o.stateT / o.boomDur;
    const r = o.maxR * prog;
    const grd = ctx.createRadialGradient(cx, cy, 2, cx, cy, r);
    grd.addColorStop(0, `rgba(255, 240, 200, ${1 - prog})`);
    grd.addColorStop(0.6, `rgba(255, 140, 60, ${0.7 * (1 - prog)})`);
    grd.addColorStop(1, 'rgba(120, 30, 0, 0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(255, 200, 120, ${1 - prog})`;
    ctx.lineWidth = 3 * (1 - prog) + 1;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawSpinner(o) {
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalAlpha = 0.18;
  ctx.strokeStyle = '#ffb060';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 6]);
  ctx.beginPath(); ctx.arc(0, 0, o.armLen, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  const sweepDir = o.vAng > 0 ? 1 : -1;
  for (let i = 0; i < o.arms; i++) {
    const baseAng = o.angle + i * Math.PI;
    ctx.save();
    ctx.rotate(baseAng - sweepDir * 0.35);
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#ffb060';
    roundRect(0, -o.armW / 2, o.armLen, o.armW, 4, true);
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.save();
    ctx.rotate(baseAng);
    const grd = ctx.createLinearGradient(0, 0, o.armLen, 0);
    grd.addColorStop(0, '#e8e0c8'); grd.addColorStop(0.5, '#c08838'); grd.addColorStop(1, '#5a2810');
    ctx.fillStyle = grd;
    ctx.shadowColor = 'rgba(255, 180, 80, 0.7)'; ctx.shadowBlur = 12;
    roundRect(0, -o.armW / 2, o.armLen, o.armW, 4, true);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd060';
    ctx.beginPath();
    ctx.moveTo(o.armLen, -o.armW / 2 - 4);
    ctx.lineTo(o.armLen + 10, 0);
    ctx.lineTo(o.armLen, o.armW / 2 + 4);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  const hg = ctx.createRadialGradient(0, 0, 1, 0, 0, 8);
  hg.addColorStop(0, '#ffe8b0'); hg.addColorStop(1, '#8a5020');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawPendulum(o) {
  const ax = o.anchorX;
  const ay = o.y + 8;
  const wx = ax + Math.sin(o.angle) * o.armLen;
  const wy = ay + Math.cos(o.angle) * o.armLen;
  ctx.fillStyle = '#3a3548';
  roundRect(ax - 10, o.y, 20, 8, 3, true);
  ctx.fillStyle = '#1a1a25';
  ctx.beginPath(); ctx.arc(ax, ay, 4, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.translate(ax, ay);
  ctx.rotate(Math.atan2(wy - ay, wx - ax) - Math.PI / 2);
  const grd = ctx.createLinearGradient(0, 0, 0, o.armLen);
  grd.addColorStop(0, '#9aa0b0'); grd.addColorStop(1, '#5a5566');
  ctx.fillStyle = grd;
  ctx.shadowColor = 'rgba(180, 180, 220, 0.4)'; ctx.shadowBlur = 8;
  roundRect(-o.armW / 2, 0, o.armW, o.armLen, 3, true);
  ctx.shadowBlur = 0;
  ctx.restore();
  ctx.save();
  ctx.translate(wx, wy);
  const wg = ctx.createRadialGradient(-4, -4, 2, 0, 0, o.weightR);
  wg.addColorStop(0, '#ffe2b8'); wg.addColorStop(0.4, '#d06a30'); wg.addColorStop(1, '#3a0f00');
  ctx.fillStyle = wg;
  ctx.shadowColor = '#ff7a30'; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.arc(0, 0, o.weightR, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff6c0';
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * o.weightR * 0.7, Math.sin(a) * o.weightR * 0.7, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function jaggedPath(x0, y0, x1, y1, segs, jitter, seed) {
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  for (let i = 1; i < segs; i++) {
    const t = i / segs;
    const x = x0 + (x1 - x0) * t;
    const y = y0 + (y1 - y0) * t;
    const j = (Math.sin(seed + i * 12.9898) * 43758.5453 % 1);
    const offN = (j - Math.floor(j) - 0.5) * 2;
    const dx = x1 - x0, dy = y1 - y0;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    ctx.lineTo(x + nx * offN * jitter, y + ny * offN * jitter);
  }
  ctx.lineTo(x1, y1);
}

function drawLightning(o) {
  const beamY = o.y + o.h / 2;
  const gx = o.gapCx - o.gapW / 2;
  const gx2 = o.gapCx + o.gapW / 2;
  const drawGapMarker = (alpha) => {
    ctx.fillStyle = `rgba(125, 255, 176, ${alpha * 0.18})`;
    ctx.fillRect(gx, beamY - o.beamH, o.gapW, o.beamH * 2);
    ctx.strokeStyle = `rgba(160, 255, 200, ${alpha})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(gx, beamY - o.beamH); ctx.lineTo(gx, beamY + o.beamH);
    ctx.moveTo(gx2, beamY - o.beamH); ctx.lineTo(gx2, beamY + o.beamH);
    ctx.stroke();
    ctx.setLineDash([]);
  };
  if (o.phase === 'warn') {
    const pulse = 0.5 + Math.sin(o.t * 0.04) * 0.4;
    ctx.strokeStyle = `rgba(180, 220, 255, ${pulse})`;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(0, beamY); ctx.lineTo(gx, beamY);
    ctx.moveTo(gx2, beamY); ctx.lineTo(W, beamY);
    ctx.stroke();
    ctx.setLineDash([]);
    drawGapMarker(0.5 + pulse * 0.3);
  } else if (o.phase === 'fire') {
    const drawSeg = (x1, x2) => {
      const bg = ctx.createLinearGradient(0, beamY - o.beamH, 0, beamY + o.beamH);
      bg.addColorStop(0, 'rgba(120, 180, 255, 0)');
      bg.addColorStop(0.5, 'rgba(220, 240, 255, 0.85)');
      bg.addColorStop(1, 'rgba(120, 180, 255, 0)');
      ctx.fillStyle = bg;
      ctx.shadowColor = '#80b0ff'; ctx.shadowBlur = 22;
      ctx.fillRect(x1, beamY - o.beamH, x2 - x1, o.beamH * 2);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
      ctx.shadowColor = '#aad0ff'; ctx.shadowBlur = 14;
      jaggedPath(x1, beamY, x2, beamY, 18, 9, o.jagSeed + timeMs * 0.01);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(180, 220, 255, 0.6)'; ctx.lineWidth = 1;
      jaggedPath(x1, beamY, x2, beamY, 18, 14, o.jagSeed + 100 + timeMs * 0.013);
      ctx.stroke();
      ctx.shadowBlur = 0;
    };
    drawSeg(0, gx);
    drawSeg(gx2, W);
    drawGapMarker(0.85);
  } else {
    ctx.strokeStyle = 'rgba(150, 180, 255, 0.15)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 8]);
    ctx.beginPath();
    ctx.moveTo(0, beamY); ctx.lineTo(gx, beamY);
    ctx.moveTo(gx2, beamY); ctx.lineTo(W, beamY);
    ctx.stroke();
    ctx.setLineDash([]);
    drawGapMarker(0.35);
  }
}

function drawBouncer(o) {
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(o.spin);
  const grd = ctx.createRadialGradient(-3, -3, 2, 0, 0, o.w / 2);
  grd.addColorStop(0, '#fff'); grd.addColorStop(0.4, '#80ffd0'); grd.addColorStop(1, '#10503a');
  ctx.fillStyle = grd;
  ctx.shadowColor = '#40e0a0'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.arc(0, 0, o.w / 2 * 0.9, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(20, 60, 40, 0.6)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.arc(0, 0, o.w / 2 * 0.55, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawGate(o) {
  const lx = o.gateCenter - o.gapW / 2;
  const rx = o.gateCenter + o.gapW / 2;
  const lpiece = { x: 0,  y: o.y, w: lx,     h: o.h };
  const rpiece = { x: rx, y: o.y, w: W - rx, h: o.h };
  drawBar(lpiece, '#7adfff', '#3aa8e0', '#0a3a5a', 'rgba(100, 200, 255, 0.7)');
  drawBar(rpiece, '#7adfff', '#3aa8e0', '#0a3a5a', 'rgba(100, 200, 255, 0.7)');
  ctx.fillStyle = 'rgba(180, 230, 255, 0.6)';
  ctx.fillRect(lx - 2, o.y, 2, o.h);
  ctx.fillRect(rx,    o.y, 2, o.h);
}

function drawSlider(o) {
  drawBar(o, '#8affc4', '#39e08c', '#106648', 'rgba(80, 255, 160, 0.7)');
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  const cy = o.y + o.h / 2;
  const dir = Math.sign(o.vx) || 1;
  for (let i = 0; i < 2; i++) {
    const ax = o.x + o.w / 2 + dir * (i * 8 + 4);
    ctx.beginPath();
    ctx.moveTo(ax, cy - 4);
    ctx.lineTo(ax + dir * 5, cy);
    ctx.lineTo(ax, cy + 4);
    ctx.closePath(); ctx.fill();
  }
}

function drawChaser(o) {
  drawBar(o, '#ffb38a', '#ff7438', '#7a2f0c', 'rgba(255, 120, 60, 0.8)');
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a0a00';
  const eyeOff = Math.sin(timeMs * 0.003) * 2;
  ctx.beginPath(); ctx.arc(cx + eyeOff, cy, 2, 0, Math.PI * 2); ctx.fill();
}

function drawBlinker(o) {
  if (o.blinkPhase == null) {
    drawBar(o, '#8b95ad', '#4a5670', '#1f2535', 'rgba(140,160,200,0.5)');
  } else if (o.active) {
    drawBar(o, '#c9a4ff', '#9a6cff', '#3e1f7a', 'rgba(150, 100, 255, 0.7)');
  } else {
    ctx.strokeStyle = 'rgba(140, 255, 180, 0.85)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.shadowColor = 'rgba(140, 255, 180, 0.7)';
    ctx.shadowBlur = 8;
    ctx.strokeRect(o.x + 1, o.y + 1, o.w - 2, o.h - 2);
    ctx.shadowBlur = 0;
    ctx.setLineDash([]);
    const cx = o.x + o.w / 2;
    const bob = Math.sin(timeMs * 0.006) * 3;
    const cy = o.y - 14 + bob;
    ctx.fillStyle = 'rgba(160, 255, 200, 0.95)';
    ctx.shadowColor = 'rgba(140, 255, 180, 0.8)';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(cx - 10, cy);
    ctx.lineTo(cx + 10, cy);
    ctx.lineTo(cx, cy + 8);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawShrinker(o) {
  if (o.w > 0) drawBar(o, '#ffd56b', '#ff9a2c', '#7a4810', 'rgba(255, 180, 60, 0.7)');
}

function drawGrowBar(o) {
  drawBar(o, '#ffce6b', '#ff9028', '#7a3a08', 'rgba(255, 160, 40, 0.7)');
  const cy = o.y + o.h / 2;
  ctx.fillStyle = 'rgba(255, 240, 200, 0.7)';
  ctx.beginPath();
  ctx.moveTo(o.x - 6, cy); ctx.lineTo(o.x, cy - 5); ctx.lineTo(o.x, cy + 5);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(o.x + o.w + 6, cy); ctx.lineTo(o.x + o.w, cy - 5); ctx.lineTo(o.x + o.w, cy + 5);
  ctx.closePath(); ctx.fill();
}

function drawCrusher(o) {
  ctx.strokeStyle = '#5a5566';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(o.x + 10, 0); ctx.lineTo(o.x + 10, o.y);
  ctx.moveTo(o.x + o.w - 10, 0); ctx.lineTo(o.x + o.w - 10, o.y);
  ctx.stroke();
  if (o.shadowA > 0) {
    ctx.fillStyle = `rgba(255, 80, 80, ${o.shadowA * 0.55})`;
    ctx.fillRect(o.x, H - 5, o.w, 5);
    ctx.strokeStyle = `rgba(255, 100, 100, ${o.shadowA})`;
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(o.x, o.y + o.h); ctx.lineTo(o.x, H);
    ctx.moveTo(o.x + o.w, o.y + o.h); ctx.lineTo(o.x + o.w, H);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  const grd = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
  grd.addColorStop(0, '#a8a8b8'); grd.addColorStop(0.5, '#5a5a68'); grd.addColorStop(1, '#1a1a22');
  ctx.fillStyle = grd;
  ctx.shadowColor = 'rgba(255, 120, 80, 0.55)'; ctx.shadowBlur = 14;
  roundRect(o.x, o.y, o.w, o.h, 4, true);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#d8d8e0';
  const teeth = 6;
  const tw = o.w / teeth;
  for (let i = 0; i < teeth; i++) {
    ctx.beginPath();
    ctx.moveTo(o.x + i * tw, o.y + o.h);
    ctx.lineTo(o.x + (i + 0.5) * tw, o.y + o.h + 9);
    ctx.lineTo(o.x + (i + 1) * tw, o.y + o.h);
    ctx.closePath(); ctx.fill();
  }
}

function drawVortex(o) {
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(o.angle);
  for (let arm = 0; arm < o.arms; arm++) {
    const baseA = (arm / o.arms) * Math.PI * 2;
    ctx.strokeStyle = `hsla(${275 + arm * 14}, 90%, 65%, 0.85)`;
    ctx.lineWidth = 4;
    ctx.shadowColor = '#b060ff'; ctx.shadowBlur = 12;
    ctx.beginPath();
    for (let i = 0; i <= 36; i++) {
      const t = i / 36;
      const r = t * o.maxR;
      const a = baseA + t * Math.PI * 1.8;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  const cg = ctx.createRadialGradient(0, 0, 1, 0, 0, 14);
  cg.addColorStop(0, '#fff'); cg.addColorStop(0.5, '#ff80ff'); cg.addColorStop(1, '#2a0040');
  ctx.fillStyle = cg;
  ctx.shadowColor = '#d040ff'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawPortalPair(o) {
  const drawRing = (px, py, hue) => {
    ctx.save();
    ctx.translate(px, py);
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = `hsla(${hue}, 95%, 65%, ${0.85 - i * 0.22})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = `hsl(${hue}, 100%, 60%)`; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.ellipse(0, 0, o.ringR - i * 3, (o.ringR - i * 3) * 0.42, o.ringSpin * (i % 2 ? -1 : 1), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.fillStyle = `hsla(${hue}, 100%, 80%, 0.45)`;
    ctx.beginPath(); ctx.ellipse(0, 0, o.ringR * 0.55, o.ringR * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  };
  drawRing(o.aX, o.aY, 210);
  drawRing(o.bX, o.bY, 30);
  if (o.ballOn) {
    const g = ctx.createRadialGradient(o.ballX - 2, o.ballY - 2, 1, o.ballX, o.ballY, 9);
    g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#ff80d0'); g.addColorStop(1, '#400020');
    ctx.fillStyle = g;
    ctx.shadowColor = '#ff40a0'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(o.ballX, o.ballY, 8, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawSpikeTunnel(o) {
  const sw = W / o.count;
  for (let i = 0; i < o.count; i++) {
    const ph = o.t * 0.004 + i * 0.55;
    const offset = Math.sin(ph) * o.amp;
    const topH = o.baseH + offset;
    const botH = o.baseH - offset;
    const x = i * sw;
    const tg = ctx.createLinearGradient(0, 0, 0, topH);
    tg.addColorStop(0, '#ff90b0'); tg.addColorStop(1, '#8b1a3c');
    ctx.fillStyle = tg;
    ctx.shadowColor = 'rgba(255, 80, 120, 0.5)'; ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x + sw, 0); ctx.lineTo(x + sw / 2, topH); ctx.closePath();
    ctx.fill();
    const bg = ctx.createLinearGradient(0, H - botH, 0, H);
    bg.addColorStop(0, '#8b1a3c'); bg.addColorStop(1, '#ff90b0');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x, H); ctx.lineTo(x + sw, H); ctx.lineTo(x + sw / 2, H - botH); ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// ---------- horizontal variants ----------

function drawLaserH(o) {
  const grd = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y);
  grd.addColorStop(0, '#3a4a6a'); grd.addColorStop(1, '#1a2235');
  ctx.fillStyle = grd;
  ctx.shadowColor = 'rgba(120, 180, 255, 0.5)'; ctx.shadowBlur = 10;
  roundRect(o.x, o.y, o.w, o.h, 4, true);
  ctx.shadowBlur = 0;
  const ex = o.x + o.w - 2;
  const ey = o.y + o.h / 2;
  const beamY = ey - o.beamW / 2;
  if (o.phase !== 'fire') {
    ctx.strokeStyle = 'rgba(255, 100, 100, 0.18)';
    ctx.lineWidth = 1; ctx.setLineDash([3, 6]);
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(W, ey); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (o.phase === 'warn') {
    const pulse = 0.55 + Math.sin(o.t * 0.045) * 0.4;
    ctx.fillStyle = `rgba(255, 60, 60, ${0.08 * pulse})`;
    ctx.fillRect(ex, beamY - 2, W - ex, o.beamW + 4);
    ctx.strokeStyle = `rgba(255, 90, 90, ${pulse})`;
    ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
    ctx.shadowColor = '#ff4040'; ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(ex, beamY); ctx.lineTo(W, beamY);
    ctx.moveTo(ex, beamY + o.beamW); ctx.lineTo(W, beamY + o.beamW);
    ctx.stroke();
    ctx.shadowBlur = 0; ctx.setLineDash([]);
  } else if (o.phase === 'fire') {
    const bg = ctx.createLinearGradient(0, beamY, 0, beamY + o.beamW);
    bg.addColorStop(0, 'rgba(255, 80, 80, 0.35)');
    bg.addColorStop(0.5, '#ffeeee');
    bg.addColorStop(1, 'rgba(255, 80, 80, 0.35)');
    ctx.fillStyle = bg;
    ctx.shadowColor = '#ff4040'; ctx.shadowBlur = 24;
    ctx.fillRect(ex, beamY, W - ex, o.beamW);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex, ey, 6, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(120, 180, 255, 0.6)';
    ctx.beginPath(); ctx.arc(ex, ey, 3, 0, Math.PI * 2); ctx.fill();
  }
}

function drawChaserH(o) {
  drawBar(o, '#ffb38a', '#ff7438', '#7a2f0c', 'rgba(255, 120, 60, 0.8)');
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a0a00';
  const eyeOff = Math.sin(timeMs * 0.003) * 2;
  ctx.beginPath(); ctx.arc(cx, cy + eyeOff, 2, 0, Math.PI * 2); ctx.fill();
}

function drawSawH(o) {
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  const r = o.w / 2;
  ctx.strokeStyle = 'rgba(180, 180, 200, 0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, 0); ctx.lineTo(cx, H);
  ctx.stroke();
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(o.spin);
  ctx.shadowColor = 'rgba(200, 220, 255, 0.8)'; ctx.shadowBlur = 18;
  ctx.fillStyle = '#d8dde8';
  ctx.beginPath();
  const teeth = 14;
  for (let i = 0; i < teeth * 2; i++) {
    const ang = (i / (teeth * 2)) * Math.PI * 2;
    const rr = i % 2 === 0 ? r : r * 0.7;
    ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
  }
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  const hg = ctx.createRadialGradient(0, 0, 2, 0, 0, r * 0.45);
  hg.addColorStop(0, '#fff'); hg.addColorStop(1, '#7a8aa0');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a2030';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.18, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawGateH(o) {
  const ty = o.gateCenter - o.gapH / 2;
  const by = o.gateCenter + o.gapH / 2;
  const tpiece = { x: o.x, y: 0,  w: o.w, h: ty };
  const bpiece = { x: o.x, y: by, w: o.w, h: H - by };
  drawBar(tpiece, '#7adfff', '#3aa8e0', '#0a3a5a', 'rgba(100, 200, 255, 0.7)');
  drawBar(bpiece, '#7adfff', '#3aa8e0', '#0a3a5a', 'rgba(100, 200, 255, 0.7)');
  ctx.fillStyle = 'rgba(180, 230, 255, 0.6)';
  ctx.fillRect(o.x, ty - 2, o.w, 2);
  ctx.fillRect(o.x, by,     o.w, 2);
}

function drawGrowBarH(o) {
  drawBar(o, '#ffce6b', '#ff9028', '#7a3a08', 'rgba(255, 160, 40, 0.7)');
  const cx = o.x + o.w / 2;
  ctx.fillStyle = 'rgba(255, 240, 200, 0.7)';
  ctx.beginPath();
  ctx.moveTo(cx, o.y - 6); ctx.lineTo(cx - 5, o.y); ctx.lineTo(cx + 5, o.y);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx, o.y + o.h + 6); ctx.lineTo(cx - 5, o.y + o.h); ctx.lineTo(cx + 5, o.y + o.h);
  ctx.closePath(); ctx.fill();
}

function drawLightningH(o) {
  const beamX = o.x + o.w / 2;
  const gy = o.gapCy - o.gapH / 2;
  const gy2 = o.gapCy + o.gapH / 2;
  const drawGapMarker = (alpha) => {
    ctx.fillStyle = `rgba(125, 255, 176, ${alpha * 0.18})`;
    ctx.fillRect(beamX - o.beamW, gy, o.beamW * 2, o.gapH);
    ctx.strokeStyle = `rgba(160, 255, 200, ${alpha})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(beamX - o.beamW, gy);  ctx.lineTo(beamX + o.beamW, gy);
    ctx.moveTo(beamX - o.beamW, gy2); ctx.lineTo(beamX + o.beamW, gy2);
    ctx.stroke();
    ctx.setLineDash([]);
  };
  if (o.phase === 'warn') {
    const pulse = 0.5 + Math.sin(o.t * 0.04) * 0.4;
    ctx.strokeStyle = `rgba(180, 220, 255, ${pulse})`;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(beamX, 0);  ctx.lineTo(beamX, gy);
    ctx.moveTo(beamX, gy2); ctx.lineTo(beamX, H);
    ctx.stroke();
    ctx.setLineDash([]);
    drawGapMarker(0.5 + pulse * 0.3);
  } else if (o.phase === 'fire') {
    const drawSeg = (y1, y2) => {
      const bg = ctx.createLinearGradient(beamX - o.beamW, 0, beamX + o.beamW, 0);
      bg.addColorStop(0, 'rgba(120, 180, 255, 0)');
      bg.addColorStop(0.5, 'rgba(220, 240, 255, 0.85)');
      bg.addColorStop(1, 'rgba(120, 180, 255, 0)');
      ctx.fillStyle = bg;
      ctx.shadowColor = '#80b0ff'; ctx.shadowBlur = 22;
      ctx.fillRect(beamX - o.beamW, y1, o.beamW * 2, y2 - y1);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
      ctx.shadowColor = '#aad0ff'; ctx.shadowBlur = 14;
      jaggedPath(beamX, y1, beamX, y2, 18, 9, o.jagSeed + timeMs * 0.01);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(180, 220, 255, 0.6)'; ctx.lineWidth = 1;
      jaggedPath(beamX, y1, beamX, y2, 18, 14, o.jagSeed + 100 + timeMs * 0.013);
      ctx.stroke();
      ctx.shadowBlur = 0;
    };
    drawSeg(0, gy);
    drawSeg(gy2, H);
    drawGapMarker(0.85);
  } else {
    ctx.strokeStyle = 'rgba(150, 180, 255, 0.15)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 8]);
    ctx.beginPath();
    ctx.moveTo(beamX, 0);   ctx.lineTo(beamX, gy);
    ctx.moveTo(beamX, gy2); ctx.lineTo(beamX, H);
    ctx.stroke();
    ctx.setLineDash([]);
    drawGapMarker(0.35);
  }
}

function drawWormTunnelV(o) {
  const ch = o.channelW;
  const amp = o.amp;
  const freq = o.freq;
  const segs = 36;
  const wallGrd = ctx.createLinearGradient(0, 0, W, 0);
  wallGrd.addColorStop(0, '#2a1a4e');
  wallGrd.addColorStop(0.5, '#3a2a5e');
  wallGrd.addColorStop(1, '#2a1a4e');
  ctx.fillStyle = wallGrd;
  ctx.shadowColor = 'rgba(180, 120, 255, 0.45)'; ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  for (let i = 0; i <= segs; i++) {
    const y = (i / segs) * H;
    const cxv = W / 2 + Math.sin(y * freq + o.phase) * amp;
    ctx.lineTo(cxv - ch / 2, y);
  }
  ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W, 0);
  for (let i = 0; i <= segs; i++) {
    const y = (i / segs) * H;
    const cxv = W / 2 + Math.sin(y * freq + o.phase) * amp;
    ctx.lineTo(cxv + ch / 2, y);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(200, 150, 255, 0.9)';
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(180, 120, 255, 0.7)'; ctx.shadowBlur = 8;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      const y = (i / segs) * H;
      const cxv = W / 2 + Math.sin(y * freq + o.phase) * amp;
      const px = cxv + side * ch / 2;
      if (i === 0) ctx.moveTo(px, y); else ctx.lineTo(px, y);
    }
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255, 200, 255, 0.25)';
  for (let i = 0; i < 6; i++) {
    const y = (i + 0.5) / 6 * H;
    const cxv = W / 2 + Math.sin(y * freq + o.phase) * amp;
    ctx.beginPath();
    ctx.arc(cxv, y, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawWormTunnelH(o) {
  const ch = o.channelW;
  const amp = o.amp;
  const freq = o.freq;
  const segs = 36;
  const wallGrd = ctx.createLinearGradient(0, 0, 0, H);
  wallGrd.addColorStop(0, '#2a1a4e');
  wallGrd.addColorStop(0.5, '#3a2a5e');
  wallGrd.addColorStop(1, '#2a1a4e');
  ctx.fillStyle = wallGrd;
  ctx.shadowColor = 'rgba(180, 120, 255, 0.45)'; ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  for (let i = 0; i <= segs; i++) {
    const x = (i / segs) * W;
    const cyh = H / 2 + Math.sin(x * freq + o.phase) * amp;
    ctx.lineTo(x, cyh - ch / 2);
  }
  ctx.lineTo(W, 0); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i <= segs; i++) {
    const x = (i / segs) * W;
    const cyh = H / 2 + Math.sin(x * freq + o.phase) * amp;
    ctx.lineTo(x, cyh + ch / 2);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(200, 150, 255, 0.9)';
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(180, 120, 255, 0.7)'; ctx.shadowBlur = 8;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      const x = (i / segs) * W;
      const cyh = H / 2 + Math.sin(x * freq + o.phase) * amp;
      const py = cyh + side * ch / 2;
      if (i === 0) ctx.moveTo(x, py); else ctx.lineTo(x, py);
    }
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255, 200, 255, 0.25)';
  for (let i = 0; i < 6; i++) {
    const x = (i + 0.5) / 6 * W;
    const cyh = H / 2 + Math.sin(x * freq + o.phase) * amp;
    ctx.beginPath();
    ctx.arc(x, cyh, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawStalactite(o) {
  ctx.fillStyle = '#3a3548';
  roundRect(o.anchorX - o.mountW / 2, 0, o.mountW, 8, 2, true);
  if (o.phase === 'warn') {
    const pulse = 0.5 + Math.sin(o.t * 0.04) * 0.4;

    ctx.fillRect(o.anchorX - o.triggerW / 2, 8, o.triggerW, H - 8);
    ctx.strokeStyle = `rgba(255, 90, 90, ${pulse})`;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.shadowColor = '#ff4040'; ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(o.anchorX - o.triggerW / 2, 8); ctx.lineTo(o.anchorX - o.triggerW / 2, H);
    ctx.moveTo(o.anchorX + o.triggerW / 2, 8); ctx.lineTo(o.anchorX + o.triggerW / 2, H);

  }

  grd.addColorStop(0, '#b8b0c8'); grd.addColorStop(0.5, '#7a6a8a'); grd.addColorStop(1, '#3a2a4a');

function drawBoomerang(o) {

  ctx.lineTo(-o.size, o.size * 0.35);
  ctx.lineTo(-o.size * 0.35, 0);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;

}

function drawSpikeCurtain(o) {
  const stepX = W / o.count;
  for (let i = 0; i < o.count; i++) {
    const fromTop = i % 2 === 0;
    const ax = i * stepX + stepX / 2;
    ctx.save();
    ctx.translate(ax, fromTop ? 0 : H);
    if (!fromTop) ctx.scale(1, -1);
    const grd = ctx.createLinearGradient(0, 0, 0, o.tipH);
    grd.addColorStop(0, '#ff90b0'); grd.addColorStop(0.5, '#d04060'); grd.addColorStop(1, '#5a0a20');
    ctx.fillStyle = grd;
    ctx.shadowColor = 'rgba(255, 80, 120, 0.7)'; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(-o.tipW / 2, 0);
    ctx.lineTo(o.tipW / 2, 0);
    ctx.lineTo(0, o.tipH);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.moveTo(-2, 0); ctx.lineTo(2, 0); ctx.lineTo(0, o.tipH * 0.8);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawYoyo(o) {
  const fromTop = o.anchorSide === 'top';
  const ay = fromTop ? 0 : H;
  const ballY = fromTop ? ay + o.rope : ay - o.rope;
  ctx.fillStyle = '#3a3548';
  if (fromTop) roundRect(o.anchorX - 12, 0, 24, 8, 2, true);
  else roundRect(o.anchorX - 12, H - 8, 24, 8, 2, true);
  ctx.strokeStyle = 'rgba(200, 200, 220, 0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(o.anchorX, ay); ctx.lineTo(o.anchorX, ballY); ctx.stroke();
  ctx.save();
  ctx.translate(o.anchorX, ballY);
  ctx.rotate(o.spin);
  const grd = ctx.createRadialGradient(-3, -3, 2, 0, 0, o.ballR);
  grd.addColorStop(0, '#fff'); grd.addColorStop(0.4, '#ff80a0'); grd.addColorStop(1, '#5a1030');
  ctx.fillStyle = grd;
  ctx.shadowColor = '#ff5080'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.arc(0, 0, o.ballR, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(40, 10, 20, 0.7)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * o.ballR * 0.5, Math.sin(a) * o.ballR * 0.5);
    ctx.lineTo(Math.cos(a) * o.ballR * 0.9, Math.sin(a) * o.ballR * 0.9);
    ctx.stroke();
  }
  ctx.fillStyle = '#1a0010';
  ctx.beginPath(); ctx.arc(0, 0, o.ballR * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

    name: 'vortex', meta: 'spinning spiral',
    init: () => [{ x: cx - 70, y: cy - 70, w: 140, h: 140, angle: 0, vAng: 0.04, arms: 4, maxR: 60 }],
    update: (os, dt) => os.forEach(o => o.angle += o.vAng * dt / 16.67),
    draw: (os) => os.forEach(drawVortex)
  },
  {
    name: 'crusher', meta: 'top/bottom slam',
    init: () => {
      const mkCrusher = () => {
        const w = 40 + Math.random() * 100;
        const x = Math.random() * (CELL_W - w);
        const side = Math.random() < 0.5 ? 'T' : 'B';
        const slamDist = 70 + Math.random() * 70;
        const slamPxPerFrame = 5 + Math.random() * 7;
        const slamMs = (slamDist / slamPxPerFrame) * 16.67;
        const holdMs = 200 + Math.random() * 700;
        const warnMs = 220 + slamMs * 1.2 + holdMs * 0.4;
        const retractMs = slamMs * 2.5;
        const cycleMs = warnMs + slamMs + holdMs + retractMs + 200;
        const h = 24;
        const baseY = side === 'T' ? 4 : CELL_H - 4 - h;
        const slamY = side === 'T' ? baseY + slamDist : baseY - slamDist;
        return {
          x, y: baseY, w, h,
          side, baseY, slamY,
          t: Math.random() * cycleMs,
          cycleMs, warnMs, slamMs, holdMs, retractMs,
          shadowA: 0
        };
      };
      return [mkCrusher()];
    },
    update: (os, dt) => {
      for (const o of os) {
        o.t = (o.t + dt) % o.cycleMs;
        const a = o.warnMs, b = a + o.slamMs, c = b + o.holdMs;
        if (o.t < a) {
          o.y = o.baseY;
          o.shadowA = o.t / a;
        } else if (o.t < b) {
          const k = (o.t - a) / o.slamMs;
          o.y = o.baseY + (o.slamY - o.baseY) * k;
          o.shadowA = 1;
        } else if (o.t < c) {
          o.y = o.slamY;
          o.shadowA = 1 - (o.t - b) / o.holdMs;
        } else {
          const k = Math.min(1, (o.t - c) / o.retractMs);
          o.y = o.slamY + (o.baseY - o.slamY) * k;
          o.shadowA = 0;
        }
      }
    },
    draw: (os) => os.forEach(o => {
      const dir = o.side === 'T' ? 1 : -1;
      const tailY = o.side === 'T' ? 0 : H;
      const railTopY = dir > 0 ? o.y : o.y + o.h;
      ctx.strokeStyle = '#5a5566';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(o.x + 6, tailY);          ctx.lineTo(o.x + 6, railTopY);
      ctx.moveTo(o.x + o.w - 6, tailY);    ctx.lineTo(o.x + o.w - 6, railTopY);
      ctx.stroke();
      if (o.shadowA > 0) {
        const farY = dir > 0 ? H - 5 : 0;
        ctx.fillStyle = `rgba(255, 80, 80, ${o.shadowA * 0.55})`;
        ctx.fillRect(o.x, farY, o.w, 5);
        ctx.strokeStyle = `rgba(255, 100, 100, ${o.shadowA})`;
        ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
        ctx.beginPath();
        if (dir > 0) {
          ctx.moveTo(o.x,       o.y + o.h); ctx.lineTo(o.x,       H);
          ctx.moveTo(o.x + o.w, o.y + o.h); ctx.lineTo(o.x + o.w, H);
        } else {
          ctx.moveTo(o.x,       o.y); ctx.lineTo(o.x,       0);
          ctx.moveTo(o.x + o.w, o.y); ctx.lineTo(o.x + o.w, 0);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }
      const grd = ctx.createLinearGradient(0, o.y, 0, o.y + o.h);
      grd.addColorStop(0, '#a8a8b8'); grd.addColorStop(0.5, '#5a5a68'); grd.addColorStop(1, '#1a1a22');
      ctx.fillStyle = grd;
      ctx.shadowColor = 'rgba(255, 120, 80, 0.55)'; ctx.shadowBlur = 14;
      roundRect(o.x, o.y, o.w, o.h, 4, true);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#d8d8e0';
      const teeth = Math.max(4, Math.floor(o.w / 16));
      const tw = o.w / teeth;
      const faceY = dir > 0 ? o.y + o.h : o.y;
      for (let i = 0; i < teeth; i++) {
        ctx.beginPath();
        ctx.moveTo(o.x + i * tw,       faceY);
        ctx.lineTo(o.x + (i + 0.5) * tw, faceY + dir * 10);
        ctx.lineTo(o.x + (i + 1) * tw, faceY);
        ctx.closePath(); ctx.fill();
      }
    })
  },
  {
    name: 'pendulum', meta: 'spiked swing',
    init: () => [{ anchorX: W / 2, x: W / 2 - 8, y: 12, w: 16, h: 120, armLen: 90, armW: 8, weightR: 16, swingAmp: 0.95, swingSpeed: 0.003, phase: 0, angle: 0, t: 0 }],
    update: (os, dt) => {
      for (const o of os) {
        o.t += dt;
        o.angle = o.swingAmp * Math.sin(o.t * o.swingSpeed + o.phase);
      }
    },
    draw: (os) => os.forEach(drawPendulum)
  },
  {
    name: 'rotor', meta: 'rotating bar',
    init: () => [{ x: cx - 95, y: cy - 10, w: 190, h: 20, angle: 0, vAng: 0.065 }],
    update: (os, dt) => os.forEach(o => o.angle += o.vAng * dt / 16.67),
    draw: (os) => os.forEach(drawRotor)
  },
  {
    name: 'bomb_h', meta: 'tick → explode',
    init: () => [{ x: cx - 16, y: cy - 16, w: 32, h: 32, state: 'tick', stateT: 0, fuse: 1050, boomDur: 460, maxR: 90 }],
    update: (os, dt) => {
      for (const o of os) {
        o.stateT += dt;
        if (o.state === 'tick' && o.stateT > o.fuse) { o.state = 'boom'; o.stateT = 0; }
        else if (o.state === 'boom' && o.stateT > o.boomDur) { o.state = 'tick'; o.stateT = 0; }
      }
    },
    draw: (os) => os.forEach(drawBomb)
  },
  {
    name: 'laser_h', meta: 'top beam',
    init: () => [{ x: cx - 20, y: 20, w: 40, h: 26, phase: 'warn', t: 0, beamW: 14, cycleMs: 1300, warnMs: 380, fireMs: 380 }],
    update: (os, dt) => {
      for (const o of os) {
        o.t += dt;
        const cyc = o.t % o.cycleMs;
        o.phase = cyc < o.warnMs ? 'warn' : (cyc < o.warnMs + o.fireMs ? 'fire' : 'idle');
      }
    },
    draw: (os) => os.forEach(drawLaser)
  },
  {
    name: 'chaser_h', meta: 'follows player y',
    init: () => [{ x: cx - 14, y: cy - 25, w: 28, h: 50 }],
    update: (os, dt) => {
      const f = dt / 16.67;
      const target = cy + Math.sin(timeMs * 0.0015) * 60 - 25;
      for (const o of os) {
        let step = (target - o.y) * (1 - Math.pow(1 - 0.045, f));
        const cap = 6 * f;
        if (step > cap) step = cap;
        else if (step < -cap) step = -cap;
        o.y += step;
      }
    },
    draw: (os) => os.forEach(drawChaserH)
  },
  {
    name: 'blinker_h', meta: 'doors cycle on/off',
    init: () => {
      const holeH = 36;
      const wallH = (H - 3 * holeH) / 4;
      const aY = wallH;
      const bY = wallH * 2 + holeH;
      const cY = wallH * 3 + holeH * 2;
      const segs = [
        { y: 0, y2: aY, blink: null },
        { y: aY, y2: aY + holeH, blink: 'A' },
        { y: aY + holeH, y2: bY, blink: null },
        { y: bY, y2: bY + holeH, blink: 'B' },
        { y: bY + holeH, y2: cY, blink: null },
        { y: cY, y2: cY + holeH, blink: 'C' },
        { y: cY + holeH, y2: H, blink: null }
      ];
      return segs.map(s => ({
        x: cx - 12, y: s.y, w: 24, h: s.y2 - s.y,
        blinkPhase: s.blink, periodMs: 1100, t: 0, active: true
      }));
    },
    update: (os, dt) => {
      for (const o of os) {
        o.t += dt;
        if (o.blinkPhase == null) { o.active = true; continue; }
        const idx = Math.floor(o.t / o.periodMs) % 3;
        const cur = idx === 0 ? 'A' : (idx === 1 ? 'B' : 'C');
        o.active = o.blinkPhase === cur;
      }
    },
    draw: (os) => os.forEach(drawBlinker)
  },
  {
    name: 'homing_h', meta: 'tracker missile',
    init: () => [{ x: cx - 13, y: cy - 13, w: 26, h: 26 }],
    update: (os, dt) => {
      const f = dt / 16.67;
      const target = cy + Math.sin(timeMs * 0.0012) * 60 - 13;
      for (const o of os) {
        let step = (target - o.y) * (1 - Math.pow(1 - 0.038, f));
        const cap = 5.5 * f;
        if (step > cap) step = cap;
        else if (step < -cap) step = -cap;
        o.y += step;
      }
    },
    draw: (os) => os.forEach(drawHoming)
  },
  {
    name: 'saw_h', meta: 'sliding sawblade',
    init: () => [{ x: cx - 26, y: 10, w: 52, h: 52, vy: 3.0, spin: 0, spinRate: 0.32 }],
    update: (os, dt) => {
      const f = dt / 16.67;
      for (const o of os) {
        o.spin += o.spinRate * f;
        o.y += o.vy * f;
        if (o.y < 0) { o.y = 0; o.vy = Math.abs(o.vy); }
        if (o.y + o.h > H) { o.y = H - o.h; o.vy = -Math.abs(o.vy); }
      }
    },
    draw: (os) => os.forEach(drawSawH)
  },
  {
    name: 'shrinker_h', meta: 'closing wall',
    init: () => {
      const startGap = 160, endGap = 50, dur = 1700;
      return [
        { side: 'T', x: cx - 50, y: 0, w: 100, h: cy - startGap / 2, startGap, endGap, cy, age: 0, dur, dir: 1 },
        { side: 'B', x: cx - 50, y: cy + startGap / 2, w: 100, h: H - (cy + startGap / 2), startGap, endGap, cy, age: 0, dur, dir: 1 }
      ];
    },
    update: (os, dt) => {
      for (const o of os) {
        o.age += dt * o.dir;
        if (o.age > o.dur) { o.dir = -1; o.age = o.dur; }
        if (o.age < 0)     { o.dir = 1;  o.age = 0; }
        const t = Math.min(1, o.age / o.dur);
        const gap = o.startGap + (o.endGap - o.startGap) * t;
        if (o.side === 'T') {
          o.h = Math.max(0, o.cy - gap / 2);
        } else {
          o.y = o.cy + gap / 2;
          o.h = Math.max(0, H - o.y);
        }
      }
    },
    draw: (os) => os.forEach(o => { if (o.h > 0) drawBar(o, '#ffd56b', '#ff9a2c', '#7a4810', 'rgba(255, 180, 60, 0.7)'); })
  },
  {
    name: 'gate_h', meta: 'sliding gap',
    init: () => [{ x: cx - 14, y: 0, w: 28, h: H, gapH: 60, range: 50, cy0: cy, phase: 0, phaseSpeed: 0.0025, gateCenter: cy, t: 0 }],
    update: (os, dt) => {
      for (const o of os) {
        o.t += dt;
        const c = o.cy0 + Math.sin(o.t * o.phaseSpeed + o.phase) * o.range;
        o.gateCenter = Math.max(o.gapH / 2 + 4, Math.min(H - o.gapH / 2 - 4, c));
      }
    },
    draw: (os) => os.forEach(drawGateH)
  },
  {
    name: 'growBar_h', meta: 'expanding bar',
    init: () => [{ x: cx - 14, y: cy - 30, w: 28, h: 60, cy0: cy, startH: 60, endH: 170, t: 0 }],
    update: (os, dt) => {
      for (const o of os) {
        o.t += dt;
        const prog = (Math.sin(o.t * 0.0015) + 1) / 2;
        o.h = o.startH + (o.endH - o.startH) * prog;
        o.y = o.cy0 - o.h / 2;
        if (o.y < 0) o.y = 0;
        if (o.y + o.h > H) o.y = H - o.h;
      }
    },
    draw: (os) => os.forEach(drawGrowBarH)
  },
  {
    name: 'lightning_h', meta: 'beam with safe gap',
    init: () => [{ x: cx - 11, y: 0, w: 22, h: H, phase: 'warn', t: 0, cycleMs: 900, warnMs: 320, fireMs: 180, beamW: 10, gapH: 50, gapCy: cy, jagSeed: Math.random() * 1000 }],
    update: (os, dt) => {
      for (const o of os) {
        o.t += dt;
        const cyc = o.t % o.cycleMs;
        o.phase = cyc < o.warnMs ? 'warn' : (cyc < o.warnMs + o.fireMs ? 'fire' : 'idle');
      }
    },
    draw: (os) => os.forEach(drawLightningH)
  },
  {
    name: 'wormTunnel_h', meta: 'wavy channel',
    init: () => [{ channelW: 110, amp: 18, freq: 0.038, phase: 0.6 }],
    update: () => {},
    draw: (os) => os.forEach(drawWormTunnelH)
  },
  {
    name: 'stalactite', meta: 'ceiling drop spike',
    init: () => {
      const p = PARAMS.stalactite;
      const out = [];
      for (let i = 0; i < p.count; i++) {
        const anchorX = (i + 0.5) * (W / p.count);
        out.push({
          anchorX, mountW: p.mountW, triggerW: p.triggerW,
          spikeW: p.spikeW, spikeH: p.spikeH,
          y: 0, restY: 0, fallY: H - p.spikeH - 4,
          phase: 'idle', t: i * p.staggerMs,
          cycleMs: p.cycleMs, warnMs: p.warnMs, fallMs: p.fallMs, holdMs: p.holdMs
        });
      }
      return out;
    },
    update: (os, dt) => {
      for (const o of os) {
        o.t += dt;
        const cyc = o.t % o.cycleMs;
        const a = o.warnMs, b = a + o.fallMs, c = b + o.holdMs;
        if (cyc < a) {
          o.phase = 'warn'; o.y = o.restY;
        } else if (cyc < b) {
          o.phase = 'fall';
          const k = (cyc - a) / o.fallMs;
          o.y = o.restY + (o.fallY - o.restY) * k;
        } else if (cyc < c) {
          o.phase = 'hold'; o.y = o.fallY;
        } else {
          o.phase = 'idle';
          const k = Math.min(1, (cyc - c) / (o.cycleMs - c));
          o.y = o.fallY + (o.restY - o.fallY) * k;
        }
      }
    },
    draw: (os) => os.forEach(drawStalactite)
  },
  {
    name: 'spikeCurtain', meta: 'zigzag spike weave',
    init: () => {
      const p = PARAMS.spikeCurtain;
      return [{ count: p.count, tipW: p.tipW, tipH: p.tipH }];
    },
    update: () => {},
    draw: (os) => os.forEach(drawSpikeCurtain)
  },
  {
    name: 'yoyo', meta: 'paired top/bottom drop',
    init: () => {
      const p = PARAMS.yoyo;
      return [
        {
          anchorX: cx - p.anchorOffset, anchorSide: 'top',
          ballR: p.ballR,
          rope: p.minRope, minRope: p.minRope, maxRope: p.maxRope,
          spin: 0, spinRate: p.spinRate,
          t: 0, cycleMs: p.cycleMs
        },
        {
          anchorX: cx + p.anchorOffset, anchorSide: 'bottom',
          ballR: p.ballR,
          rope: p.minRope, minRope: p.minRope, maxRope: p.maxRope,
          spin: 0, spinRate: -p.spinRate,
          t: p.cycleMs / 2, cycleMs: p.cycleMs
        }
      ];
    },
    update: (os, dt) => {
      const f = dt / 16.67;
      for (const o of os) {
        o.t += dt;
        o.spin += o.spinRate * f;
        const k = (1 - Math.cos(o.t / o.cycleMs * Math.PI * 2)) / 2;
        o.rope = o.minRope + (o.maxRope - o.minRope) * k;
      }
    },
    draw: (os) => os.forEach(drawYoyo)
  }
];

const cells = [];
const TUNABLE = new Set(Object.keys(DEFAULT_PARAMS));

function mount(list, containerId) {
  const container = document.getElementById(containerId);
  for (const ob of list) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const cvs = document.createElement('canvas');
    cvs.width = CELL_W;
    cvs.height = CELL_H;
    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = ob.name;
    const metaEl = document.createElement('div');
    metaEl.className = 'meta';
    metaEl.textContent = ob.meta;
    cell.appendChild(cvs);
    cell.appendChild(nameEl);
    cell.appendChild(metaEl);
    const cellRef = { cvs, c2d: cvs.getContext('2d'), ob, state: null };
    if (TUNABLE.has(ob.name)) {
      const btn = document.createElement('button');
      btn.className = 'reload';
      btn.textContent = 'RELOAD';
      btn.addEventListener('click', () => {
        ctx = cellRef.c2d; W = CELL_W; H = CELL_H;
        cellRef.state = ob.init();
      });
      cell.appendChild(btn);
    }
    container.appendChild(cell);
    ctx = cellRef.c2d; W = CELL_W; H = CELL_H;
    cellRef.state = ob.init();
    cells.push(cellRef);
  }
}

mount(VERTICAL_OBSTACLES, 'col-v');
mount(HORIZONTAL_OBSTACLES, 'col-h');

// ---------- tuner ----------
const editEl = document.getElementById('params-edit');
const statusEl = document.getElementById('tuner-status');
const applyBtn = document.getElementById('apply-btn');
const resetBtn = document.getElementById('reset-btn');

function setStatus(msg, isErr) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('err', !!isErr);
}

function loadIntoEditor(params) {
  editEl.value = JSON.stringify(params, null, 2);
}

function reloadTunableCells() {
  for (const c of cells) {
    if (!TUNABLE.has(c.ob.name)) continue;
    ctx = c.c2d; W = CELL_W; H = CELL_H;
    c.state = c.ob.init();
  }
}

applyBtn.addEventListener('click', () => {
  try {
    const next = JSON.parse(editEl.value);
    for (const k of Object.keys(DEFAULT_PARAMS)) {
      if (next[k]) PARAMS[k] = { ...DEFAULT_PARAMS[k], ...next[k] };
    }
    reloadTunableCells();
    setStatus('applied ' + new Date().toLocaleTimeString(), false);
  } catch (e) {
    setStatus('parse error: ' + e.message, true);
  }
});

resetBtn.addEventListener('click', () => {
  PARAMS = JSON.parse(JSON.stringify(DEFAULT_PARAMS));
  loadIntoEditor(PARAMS);
  reloadTunableCells();
  setStatus('reset to defaults', false);
});

loadIntoEditor(PARAMS);

let lastT = 0;
function loop(t) {
  if (!lastT) lastT = t;
  const dt = Math.min(50, t - lastT);
  lastT = t;
  timeMs += dt;
  for (const c of cells) {
    ctx = c.c2d;
    W = CELL_W; H = CELL_H;
    c.ob.update(c.state, dt);
    ctx.clearRect(0, 0, W, H);
    c.ob.draw(c.state);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
