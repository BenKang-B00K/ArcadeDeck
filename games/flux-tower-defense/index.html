    <style>
      /* Pre-React splash — paints before the bundle parses so the
         window isn't blank for the bootstrap window. React mounts on
         top of #root and its own LoadingScreen takes over (same look,
         continuous transition into the menu fade). */
      html, body {
        margin: 0;
        padding: 0;
        background: #0f0f1b;
        color: #e6f7f0;
        font-family: 'Inter', system-ui, sans-serif;
        overflow: hidden;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 24px;
        background: radial-gradient(circle at 50% 30%, #1a1a2e 0%, #0f0f1b 60%, #07070f 100%);
        z-index: 3000;
      }
      #boot-splash .bs-logo {
        width: 120px;
        height: 120px;
        border: 2px solid #4ecca3;
        border-radius: 50%;
        border-top-color: transparent;
        animation: bs-spin 1.4s linear infinite;
        box-shadow: 0 0 24px rgba(78, 204, 163, 0.4);
      }
      #boot-splash .bs-title {
        font-size: clamp(20px, 2.4vw, 32px);
        font-weight: 700;
        letter-spacing: 0.32em;
        color: #4ecca3;
        text-shadow: 0 0 12px rgba(78, 204, 163, 0.55);
      }
      @keyframes bs-spin {
        to { transform: rotate(360deg); }
      }
