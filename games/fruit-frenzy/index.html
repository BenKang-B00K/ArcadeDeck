function checkAchievements() {
  if (!G || !G.running) return;
  ACHIEVEMENTS.forEach(ac => {
    if (!unlockedAchievements.includes(ac.id) && ac.condition(G)) {
      unlockAchievement(ac.id);
    }
  });
}

let unlockedAchievements = (() => {
  try {
    const v = JSON.parse(localStorage.getItem('ff_achievements') || '[]');
    return Array.isArray(v) ? v : [];
  } catch { return []; }
})();

function unlockAchievement(id) {
  if (unlockedAchievements.includes(id)) return;
  
  unlockedAchievements.push(id);
  localStorage.setItem('ff_achievements', JSON.stringify(unlockedAchievements));
  
  const toast = document.getElementById('achievement-toast');
  const title = document.getElementById('ac-toast-title');
  const desc  = document.getElementById('ac-toast-desc');
  
  title.textContent = tr(`ac_${id}_title`);
  desc.textContent  = tr(`ac_${id}_desc`);
  
  toast.classList.add('show');
  playTone(880, 'sine', 0.1, 0.2);
  setTimeout(() => playTone(1109, 'sine', 0.2, 0.2), 100);
  
  setTimeout(() => {
    toast.classList.remove('show');
  }, 4000);
}

function showAchievements() {
  const overlay = document.getElementById('overlay');

  const totalCount = ACHIEVEMENTS.length;

/* ═══════════════════════════════════════
   RESPONSIVE SIZING
═══════════════════════════════════════ */
const DESIGN_W = 420, DESIGN_H = 580;
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
let W, H, scale = 1;
const DPR = Math.min(window.devicePixelRatio || 1, 2);   // ponytail: cap 2 — 3x phones pay 9x fill for nothing visible
let mouseX = 0;

function resize() {
  const prevScale = scale;
  const prevW = W, prevH = H;
  const vw = window.innerWidth, vh = window.innerHeight;
  const maxW = Math.min(vw - 16, DESIGN_W);
  const maxH = Math.min(vh - 180, DESIGN_H);
  scale = Math.min(maxW / DESIGN_W, maxH / DESIGN_H, 1);
  W = Math.round(DESIGN_W * scale);
  H = Math.round(DESIGN_H * scale);
  canvas.width  = Math.round(W * DPR);           // HiDPI backing store; all drawing stays in CSS px via the transform
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  document.documentElement.style.setProperty('--cw', W + 'px');
  const wrapEl = document.getElementById('wrap');
  wrapEl.style.transform = '';

  if (G && G.running && prevScale && prevW) {
    const r = scale / prevScale;
    const rx = W / prevW, ry = H / prevH;
    G.basket.w = Math.round(G.basket.w * r);
    G.basket.h = Math.round(G.basket.h * r);
    G.basket.x *= rx;
    G.items.forEach(it => {
      it.x *= rx; it.y *= ry;
      it.sz = Math.round(it.sz * r);
      it.speed *= r;
      if (it.vx != null) it.vx *= r;
      if (it.amp != null) it.amp *= r;
      if (it.accel != null) it.accel *= r;
      if (it.vy != null) it.vy *= r;
      if (it.g != null) it.g *= r;
      if (it.maxVy != null) it.maxVy *= r;
      if (it.minSpeed != null) it.minSpeed *= r;
      if (it.floorY != null) it.floorY *= ry;
      if (it.hoverY != null) it.hoverY *= ry;
      if (it.baseX != null) it.baseX *= rx;
      if (it.ghosts) it.ghosts.forEach(g => { g.x *= rx; g.y *= ry; });
    });
    G.particles.forEach(p => {
      p.x *= rx; p.y *= ry;
      p.vx *= r; p.vy *= r; p.sz *= r;
    });
    G.chunks.forEach(c => { c.x *= rx; c.y *= ry; c.vx *= r; c.vy *= r; c.s *= r; });
    G.splats.forEach(s => { s.x *= rx; s.y *= ry; s.s *= r; });
    G.bullets.forEach(b => { b.x *= rx; b.y *= ry; b.vy *= r; });
    G.trail = G.trail.map(t => t * rx);
    mouseX *= rx;
  } else {
    mouseX = W / 2;
  }
  canvasLeft = canvas.getBoundingClientRect().left;
  buildStaticGradients();
}

/* gradients that only depend on W/H — built once per resize, not per frame */
let BG_BASE, BG_BOTTOM, BG_VIG, canvasLeft = 0;
function buildStaticGradients() {
  BG_BASE = ctx.createLinearGradient(0, 0, 0, H);
  BG_BASE.addColorStop(0, '#1a0838');
  BG_BASE.addColorStop(0.55, '#0a031e');
  BG_BASE.addColorStop(1, '#0d0220');
  BG_BOTTOM = ctx.createLinearGradient(0, H - 100 * scale, 0, H);
  BG_BOTTOM.addColorStop(0, 'transparent');
  BG_BOTTOM.addColorStop(1, 'rgba(0,245,255,0.10)');
  BG_VIG = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.75);
  BG_VIG.addColorStop(0, 'transparent');
  BG_VIG.addColorStop(1, 'rgba(0,0,0,0.45)');
}
resize();
window.addEventListener('resize', () => { resize(); });

/* ═══════════════════════════════════════
   AUDIO (Web Audio API — no files needed)
═══════════════════════════════════════ */
let audioCtx = null, soundOn = true;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, type, duration, vol=0.25, startFreq=null) {
  if (!soundOn) return;
  try {
    const ac = getAudioCtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(startFreq || freq, ac.currentTime);
    if (startFreq) osc.frequency.linearRampToValueAtTime(freq, ac.currentTime + duration);
    gain.gain.setValueAtTime(vol, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
    osc.start(ac.currentTime);
    osc.stop(ac.currentTime + duration);
  } catch(e){}
}
function sfxCatch(combo) {
  const freqs = [440, 554, 659, 784, 880, 1047];
  const f = freqs[Math.min(combo, freqs.length-1)];
  playTone(f, 'sine', .18, .2);
  if (combo >= 3) playTone(f*1.5, 'sine', .25, .12);
}

function sfxShot()  { playTone(1200, 'square', .07, .08, 700); }
function sfxDetonate() { playTone(50, 'square', .3, .22, 300); }
function sfxEmpty() { playTone(180, 'square', .06, .08); }
function sfxAmmo()  { playTone(660, 'sine', .15, .2); setTimeout(() => playTone(990, 'sine', .22, .2), 80); }
function sfxMiss()  { playTone(200, 'triangle', .25, .2, 100); }
function sfxLevel() {
  [523,659,784,1047].forEach((f,i)=> setTimeout(()=>playTone(f,'sine',.3,.25), i*100));
}
function sfxGameOver() {

const SPRITES = {};
const SPRITE_PX = 256; // items draw at <=78 CSS px x DPR 2
for (const [k, svg] of Object.entries(SVG_SOURCES)) {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = SPRITE_PX;
    c.height = k === 'basket' ? Math.round(SPRITE_PX * 0.6) : SPRITE_PX;
    const cx = c.getContext('2d');
    cx.drawImage(img, 0, 0, c.width, c.height);
    if (FRUITS.includes(k)) {                      // uniform 3D shading, clipped to the sprite: lit top-left, shaded bottom-right
      const p = SPRITE_PX;
      const g = cx.createRadialGradient(p*0.38, p*0.36, 0, p*0.5, p*0.52, p*0.56);
      g.addColorStop(0,    'rgba(255,255,255,0.34)');
      g.addColorStop(0.42, 'rgba(255,255,255,0)');
      g.addColorStop(1,    'rgba(0,0,0,0.30)');
      cx.globalCompositeOperation = 'source-atop';
      cx.fillStyle = g;
      cx.fillRect(0, 0, p, p);
    }
    SPRITES[k] = c;
  };
  img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

const svgUrl = svg => `url('data:image/svg+xml;utf8,${encodeURIComponent(svg).replace(/'/g, "%27")}')`;   // single-quoted so it survives inside style="…"

}).join(' ');

function ico(name, cls = '') {
  return UI_SVG[name]
    ? UI_SVG[name].replace('<svg', `<svg class="ico ${cls}"`)
    : `<span class="ico ${cls}" style="background-image:${svgUrl(SVG_SOURCES[name])}"></span>`;
}
document.querySelectorAll('[data-ico]').forEach(el => { el.innerHTML = ico(el.dataset.ico); });

/* DECORATIVE FRUIT — ambient background */
const DECOR_FRUIT_KEYS = Object.keys(SVG_SOURCES).filter(k => k !== 'bomb' && k !== 'basket' && k !== 'ammo');
const decorRoot = document.getElementById('fruit-decor');

function spawnDecorFruit() {
  if (!decorRoot) return null;
  const key = DECOR_FRUIT_KEYS[Math.floor(Math.random() * DECOR_FRUIT_KEYS.length)];
  const svg = SVG_SOURCES[key];
  const el = document.createElement('div');
  el.className = 'decor-fruit';
  el.dataset.fruit = key;
  const edgeX = Math.random() < 0.5 ? Math.random() * 22 : 78 + Math.random() * 22;
  const edgeY = Math.random() < 0.5 ? Math.random() * 25 : 75 + Math.random() * 25;
  const useXEdge = Math.random() < 0.5;
  const px = useXEdge ? edgeX : Math.random() * 100;
  const py = useXEdge ? Math.random() * 100 : edgeY;
  const sz = 30 + Math.random() * 44;
  const dur = 14 + Math.random() * 16;
  const delay = -Math.random() * dur;
  const rot = Math.random() * 360;
  const opac = 0.10 + Math.random() * 0.18;
  el.style.cssText = `left:${px}vw; top:${py}vh; width:${sz}px; height:${sz}px; opacity:${opac}; background-image:${svgUrl(svg)}; animation: decorFloat ${dur}s ease-in-out ${delay}s infinite alternate; --r:${rot}deg;`;
  decorRoot.appendChild(el);
  return el;
}

for (let i = 0; i < 22; i++) spawnDecorFruit();

const claimedFruits = new WeakSet();

function createEater(cfg) {
  if (!decorRoot) return;
  const el = document.createElement('div');
  el.className = 'fruit-eater ' + (cfg.cls || '');
  el.style.backgroundImage = svgUrl(cfg.idleSvg);
  el.innerHTML = `<div class="eater-pupil eater-pupil-l"></div><div class="eater-pupil eater-pupil-r"></div>`;
  const pupils = el.querySelectorAll('.eater-pupil');
  decorRoot.appendChild(el);

  const thought = document.createElement('div');
  thought.className = 'eater-thought ' + (cfg.thoughtCls || '');
  thought.innerHTML = `<div class="eater-thought-fruit"></div>`;
  decorRoot.appendChild(thought);
  const thoughtFruit = thought.querySelector('.eater-thought-fruit');
  let thoughtKey = null;

  let x = cfg.startX;
  let y = cfg.startY;
  let target = null;
  let chompUntil = 0;
  let tiltDeg = 0;
  let eyeDx = 0, eyeDy = 0;
  let thinkingUntil = performance.now() + (cfg.startDelay || 600);
  let thinkSwapAt = 0;

  function startThinking() {
    if (target && target.el) claimedFruits.delete(target.el);
    target = null;
    thinkingUntil = performance.now() + cfg.thinkMin + Math.random() * cfg.thinkVar;
    thinkSwapAt = 0;
  }

  function pickTarget() {
    const fruits = decorRoot.querySelectorAll('.decor-fruit:not(.eaten)');
    if (!fruits.length) return null;
    let best = null, bestDist = Infinity;
    fruits.forEach(f => {
      if (claimedFruits.has(f)) return;
      const r = f.getBoundingClientRect();
      const fx = r.left + r.width/2, fy = r.top + r.height/2;
      const d = Math.hypot(fx - x, fy - y);
      if (d < bestDist) { bestDist = d; best = { el: f, x: fx, y: fy }; }
    });
    if (best) claimedFruits.add(best.el);
    return best;
  }

  function eat(t) {
    t.el.classList.add('eaten');
    claimedFruits.delete(t.el);
    chompUntil = performance.now() + 350;
    el.classList.add('chomping');
    el.style.backgroundImage = svgUrl(cfg.chompSvg);
    setTimeout(() => {
      el.classList.remove('chomping');
      el.style.backgroundImage = svgUrl(cfg.idleSvg);
    }, 350);
    setTimeout(() => { if (t.el.parentNode) t.el.remove(); }, 600);
    setTimeout(() => spawnDecorFruit(), 1200 + Math.random() * 1500);
    target = null;
    setTimeout(startThinking, 400);
  }

  function tick() {
    if (G && G.running) { requestAnimationFrame(tick); return; }
    const now = performance.now();
    const chomping = now < chompUntil;

    let dx = 0, dy = 0, dist = 0;
    const thinking = !chomping && now < thinkingUntil;

    if (!chomping && !thinking) {
      if (!target || !target.el.isConnected || target.el.classList.contains('eaten')) {
        target = pickTarget();
        if (!target) startThinking();
      }
      if (target) {
        const r = target.el.getBoundingClientRect();
        target.x = r.left + r.width/2;
        target.y = r.top + r.height/2;
        dx = target.x - x; dy = target.y - y;
        dist = Math.hypot(dx, dy);
        if (dist < 24) {
          eat(target);
        } else {
          x += (dx / dist) * cfg.speed;
          y += (dy / dist) * cfg.speed;
        }
      }
    }

    const targetEyeDx = dist > 4 ? Math.max(-1, Math.min(1, dx / dist)) : 0;
    const targetEyeDy = dist > 4 ? Math.max(-1, Math.min(1, dy / dist)) : 0;
    eyeDx += (targetEyeDx - eyeDx) * 0.15;
    eyeDy += (targetEyeDy - eyeDy) * 0.15;
    const targetTilt = dist > 4 ? Math.max(-10, Math.min(10, (dx / dist) * 10)) : 0;
    tiltDeg += (targetTilt - tiltDeg) * 0.12;

    pupils[0].style.transform = `translate(calc(-50% + ${eyeDx * 3}px), calc(-50% + ${eyeDy * 3}px))`;
    pupils[1].style.transform = `translate(calc(-50% + ${eyeDx * 3}px), calc(-50% + ${eyeDy * 3}px))`;

    const bob = Math.sin(now * 0.004 + cfg.bobPhase) * 5;
    const scl = chomping ? 1.15 : 1.0;
    el.style.transform = `translate(${x}px, ${y + bob}px) translate(-50%, -50%) rotate(${tiltDeg}deg) scale(${scl})`;

    if (chomping) {
      thought.classList.remove('show', 'thinking');
      thoughtKey = null;
    } else if (thinking) {
      if (now >= thinkSwapAt) {
        const k = DECOR_FRUIT_KEYS[Math.floor(Math.random() * DECOR_FRUIT_KEYS.length)];
        thoughtKey = k;
        thoughtFruit.style.backgroundImage = svgUrl(SVG_SOURCES[k]);
        thinkSwapAt = now + 110 + Math.random() * 70;
      }
      thought.classList.add('show', 'thinking');
      thought.style.transform = `translate(${x}px, ${y + bob - 30}px) translate(-50%, -100%)`;
    } else if (target) {
      const k = target.el.dataset.fruit;
      if (k !== thoughtKey) {
        thoughtKey = k;
        thoughtFruit.style.backgroundImage = svgUrl(SVG_SOURCES[k]);
      }
      thought.classList.add('show');
      thought.classList.remove('thinking');
      thought.style.transform = `translate(${x}px, ${y + bob - 30}px) translate(-50%, -100%)`;
    } else {
      thought.classList.remove('show', 'thinking');
      thoughtKey = null;
    }
    requestAnimationFrame(tick);
  }
  tick();
}

const AMMO_START = 2, AMMO_CAP = 4, RELOAD_FRAMES = 90;   // ponytail: one bullet back every ~1.5s; tune here
function shoot() {
  if (!G.running) return;
  if (G.ammo <= 0) { G.ammoDeny = 1; sfxEmpty(); return; }
  G.ammo--;
  const by = H - Math.round(55*scale);
  G.bullets.push({ x: G.basket.x, y: by - 6*scale, vy: -13*scale });
  G.basket.sy = 0.85;                              // recoil
  spawnParticles(G.basket.x, by - 4*scale, '#00f5ff', 4);
  sfxShot();
}
function detonate(bomb) {
  G.items.splice(G.items.indexOf(bomb), 1);
  G.bombsAvoided++;
  G.score += 1;
  G.screenShake = Math.max(G.screenShake, 10);
  G.flash = Math.max(G.flash, 0.4);
  spawnParticles(bomb.x, bomb.y, '#ff8c00', 16);
  spawnParticles(bomb.x, bomb.y, '#ffe600', 8);
  spawnShockwave(bomb.x, bomb.y, 'rgba(255,140,0,0.9)', 90);
  spawnShockwave(bomb.x, bomb.y, 'rgba(255,255,255,0.7)', 55);
  addFloater(bomb.x, bomb.y, `${ico('boom')} +1`, '#ff8c00');
  sfxDetonate();
  checkLevelUp();
  updateHUD();
  checkAchievements();
}
function catchAmmo(item) {
  const grew = G.ammoMax < AMMO_CAP;
  if (grew) G.ammoMax++;
  G.ammo = G.ammoMax; G.reload = 0;             // full refill either way
  G.basket.sx = 1.25; G.basket.sy = 0.75;
  G.flash = Math.max(G.flash, 0.4);
  sfxAmmo();
  spawnParticles(item.x, item.y, '#00f5ff', 14);
  spawnShockwave(item.x, item.y, 'rgba(0,245,255,0.9)', 60);
  for (let i = 0; i < 8; i++) spawnSparkle(item.x, item.y, '#e0ffff');
  addFloater(item.x, item.y, grew ? `AMMO +1` : `RELOAD`, '#00f5ff');
}
function shotFruit(fruit) {
  G.items.splice(G.items.indexOf(fruit), 1);
  G.comboCount = 0;
  G.lives--;
  G.screenShake = 15;
  sfxMiss();
  spawnBurst(fruit);
  addFloater(fruit.x, fruit.y, `${ico('heartbreak')} -1`, '#ff2d78');
  updateHUD();
  if (G.lives <= 0) gameOver();
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  document.body.classList.add('playing');
  canvas.style.cursor = 'none';
  const ac = getAudioCtx();                       // iOS: must create/resume inside a user gesture
  if (ac.state === 'suspended') ac.resume();
  G = newState();
  G.running = true;
  mouseX = W / 2;
  if (FINE_POINTER) canvas.requestPointerLock?.()?.catch?.(() => {});   // must be inside the Start click; rejects harmlessly if denied
  updateHUD();
  requestAnimationFrame(loop);
}

const MOVEMENT_POOL = [
  // base: simple, available all levels
  { type:'straight', weight:[10, 8, 6, 5, 4, 3, 2] },
  { type:'drift',    weight:[ 4, 5, 5, 5, 4, 4, 3] },
  { type:'zigzag',   weight:[ 1, 3, 5, 6, 6, 7, 7] },
  { type:'bounce',   weight:[ 0, 1, 2, 3, 4, 5, 6] },
  { type:'accel',    weight:[ 0, 1, 2, 3, 4, 5, 6] },
  { type:'pendulum', weight:[ 0, 0, 1, 2, 3, 4, 5] },
  // physics-y: hop = down→bounce up→down, brake/skid = friction, hover = stall then plunge
  { type:'hop',      weight:[ 0, 1, 2, 3, 4, 4, 5] },
  { type:'brake',    weight:[ 0, 1, 2, 3, 3, 4, 4] },
  { type:'skid',     weight:[ 0, 1, 2, 3, 4, 4, 5] },
  { type:'hover',    weight:[ 0, 0, 1, 2, 3, 4, 5] },
];

function pickMovement(levelIdx) {
  let total = 0;
  const weights = MOVEMENT_POOL.map(m => m.weight[Math.min(levelIdx, m.weight.length-1)]);
  weights.forEach(w => total += w);
  let r = Math.random() * total;
  for (let i = 0; i < MOVEMENT_POOL.length; i++) {
    r -= weights[i];
    if (r <= 0) return MOVEMENT_POOL[i].type;
  }
  return 'straight';
}

function wallBounce(item) {
  if (item.x < item.sz/2) { item.x = item.sz/2; item.vx = Math.abs(item.vx); }
  else if (item.x > W - item.sz/2) { item.x = W - item.sz/2; item.vx = -Math.abs(item.vx); }
}

function spawnItem() {
  const lv = LEVELS[G.levelIdx];
  const isBomb = Math.random() < lv.bombChance;
  const isStar = !isBomb && Math.random() < 0.04;
  const isAmmo = !isBomb && !isStar && Math.random() < 0.006;   // very rare: ~1 per 3 min at mid levels
  const emoji  = isBomb ? BOMB : isStar ? STAR_F : isAmmo ? 'ammo' : FRUITS[Math.floor(Math.random()*FRUITS.length)];
  const sz = Math.round((28 + Math.random()*12) * scale);

  let move = pickMovement(G.levelIdx);
  if (isStar) move = Math.random() < 0.6 ? 'zigzag' : 'pendulum';
  if (isAmmo) move = 'drift';
  if (isBomb) {
    const r = Math.random();
    if (G.levelIdx >= 1 && r < 0.30) move = 'seek';
    else if (G.levelIdx >= 2 && r < 0.55) move = 'bounce';
    else if (G.levelIdx >= 3 && r < 0.70) move = 'hover';
  }

  const baseX = sz + Math.random()*(W - sz*2);
  const baseSpeed = (lv.speed + Math.random()*1.4) * scale * (isAmmo ? 0.7 : 1);

  const item = {
    x: baseX, y: -sz,
    sz, emoji, isBomb, isStar, isAmmo,
    speed: baseSpeed,
    rot: 0,
    rotSpd: (Math.random()-.5) * 6,
    move,
    t: 0,
    baseX,
    ghosts: [],
    ghostTimer: 0,
  };

  switch (move) {
    case 'drift':
      item.vx = (Math.random()-.5) * 1.6 * scale;
      break;
    case 'zigzag':
      item.amp = (12 + Math.random()*18) * scale;
      item.freq = 0.008 + Math.random()*0.010;
      item.phase = Math.random() * Math.PI * 2;
      break;
    case 'bounce':
      item.vx = (Math.random() < 0.5 ? -1 : 1) * (1.5 + Math.random()*1.8) * scale;
      break;
    case 'accel':
      item.speed = baseSpeed * 0.55;
      item.accel = 0.06 * scale;
      break;
    case 'pendulum':
      item.amp = (40 + Math.random()*50) * scale;
      item.freq = 0.012 + Math.random()*0.012;
      item.phase = Math.random() * Math.PI * 2;
      item.speed = baseSpeed * 0.8;
      break;
    case 'hop':
      item.vy = baseSpeed;
      item.g = 0.06 * scale;
      item.maxVy = baseSpeed * 2.2;              // ponytail: fairness cap, tune if hop feels unfair
      item.floorY = (0.25 + Math.random()*0.35) * H;
      item.bounces = Math.random() < 0.4 ? 2 : 1;
      break;
    case 'brake':
      item.speed = baseSpeed * 2.6;
      item.minSpeed = baseSpeed * 0.45;
      item.friction = 0.965;
      break;
    case 'skid':
      item.vx = (Math.random() < 0.5 ? -1 : 1) * (5 + Math.random()*4) * scale;
      item.friction = 0.955;
      break;
    case 'hover':
      item.vy = 0;
      item.maxVy = baseSpeed * 2.2;
      item.hoverY = (0.2 + Math.random()*0.35) * H;
      item.hoverT = 30 + Math.random()*30;
      break;
    case 'seek':
      item.vx = 0; item.rotSpd = 0;
      item.speed = baseSpeed * 0.85;
      break;
  }

  G.items.push(item);
}

function spawnParticles(x, y, color, count=10) {
  for (let i=0; i<count; i++) {
    const a = (Math.PI*2/count)*i + Math.random()*.5;
    const sp= (2+Math.random()*4)*scale;
    G.particles.push({
      x, y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life:1, color,
      sz: (3+Math.random()*5)*scale,
    });
  }
}

function spawnJuice(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, sp = (1.5 + Math.random()*3.5)*scale;
    G.particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 1.5*scale, life: 1, color, sz: (2+Math.random()*3)*scale, juice: true });
  }
}
/* catch: sprite splits into quarters that fly apart, plus juice */
function spawnBurst(item) {
  const img = SPRITES[item.emoji];
  if (!img) return;
  const s = item.sz * 1.4, hw = img.width/2, hh = img.height/2;
  for (let q = 0; q < 4; q++) {
    const dx = q & 1 ? 1 : -1, dy = q >> 1 ? 1 : -1;
    G.chunks.push({
      img, s, sx: (q & 1) * hw, sy: (q >> 1) * hh, hw, hh,
      x: item.x + dx*s/4, y: item.y + dy*s/4, rot: item.rot,
      vx: dx * (1 + Math.random()*2) * scale,
      vy: (dy * (1 + Math.random()*1.5) - 2.5) * scale,
      rotSpd: (Math.random()-.5) * 16, life: 1,
    });
  }
  spawnJuice(item.x, item.y, FRUIT_COLORS[item.emoji], 8);
}
/* miss: fruit squashes on the floor under the basket, puddle spreads */
function spawnSplat(item) {
  const y = H - Math.round(55*scale) + G.basket.h;
  const color = FRUIT_COLORS[item.emoji];
  G.splats.push({ img: SPRITES[item.emoji], x: item.x, y, s: item.sz*1.4, color, life: 1 });
  spawnJuice(item.x, y, color, 6);
}

function checkLevelUp() {
  const lv = LEVELS[G.levelIdx];
  if (G.levelIdx < LEVELS.length-1 && G.score >= lv.scoreTarget) {
    G.levelIdx++;
    G.basket.w = Math.max(Math.round((82 - G.levelIdx*4)*scale), Math.round(55*scale));
    showLevelUp(G.levelIdx+1);
    G.screenShake = 18;
    checkAchievements();
  }
}

function gameOver() {
  G.running = false; G.over = true;
  document.body.classList.remove('playing');
  canvas.style.cursor = 'auto';
  if (document.pointerLockElement === canvas) document.exitPointerLock();
  sfxGameOver();
  if (G.score > best) {
    best = G.score;
    localStorage.setItem('ff_best', best);
  }

  // ArcadeDeck integration
  window.parent.postMessage({
    type: 'GAME_OVER',
    score: unlockedAchievements.length,
    subScore: best
  }, '*');

  renderGameOver();
}

/* ═══════════════════════════════════════
   DRAW
═══════════════════════════════════════ */
function drawBG() {
  // base vertical gradient
  ctx.fillStyle = BG_BASE;
  ctx.fillRect(0, 0, W, H);

  // animated nebula blobs (cheap radial gradients)
  const t = G ? G.bgTime : 0;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const blobs = [
    { x: 0.25 + Math.sin(t*0.0006)*0.08, y: 0.30 + Math.cos(t*0.0008)*0.05, r: 0.55, col: 'rgba(255,45,160,0.10)' },
    { x: 0.75 + Math.cos(t*0.0007)*0.08, y: 0.65 + Math.sin(t*0.0005)*0.05, r: 0.50, col: 'rgba(0,180,255,0.09)' },
    { x: 0.50 + Math.sin(t*0.0004)*0.12, y: 0.85,                            r: 0.45, col: 'rgba(160,32,240,0.10)' },
  ];
  blobs.forEach(b => {
    const cx = b.x * W, cy = b.y * H, rr = b.r * Math.max(W, H);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
    g.addColorStop(0, b.col);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  });
  ctx.restore();

  // subtle hex-ish grid
  ctx.strokeStyle = 'rgba(255,255,255,0.022)';
  ctx.lineWidth = 1;
  const gs = Math.round(40 * scale);
  ctx.beginPath();
  for (let x = 0; x < W; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y < H; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  // edge glow rainbow shift on high combo
  if (G && G.edgeGlow > 0.01) {
    const hue = (G.bgTime * 0.15) % 360;
    ctx.save();
    ctx.shadowColor = `hsl(${hue},100%,60%)`;
    ctx.shadowBlur = Math.round(30 * scale*DPR);
    ctx.strokeStyle = `hsla(${hue},100%,65%,${G.edgeGlow * 0.55})`;
    ctx.lineWidth = Math.round(6 * scale);
    ctx.strokeRect(2, 2, W - 4, H - 4);
    ctx.strokeStyle = `hsla(${(hue + 60) % 360},100%,70%,${G.edgeGlow * 0.35})`;
    ctx.lineWidth = Math.round(2 * scale);
    ctx.strokeRect(8, 8, W - 16, H - 16);
    ctx.restore();
  }

  // bottom glow
  ctx.fillStyle = BG_BOTTOM;
  ctx.fillRect(0, H - 100 * scale, W, 100 * scale);

  // vignette
  ctx.fillStyle = BG_VIG;
  ctx.fillRect(0, 0, W, H);

  // combo flash
  if (G && G.flash > 0.01) {
    ctx.fillStyle = `rgba(255,255,255,${G.flash * 0.25})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawBasket(x) {
  const bw = G.basket.w, bh = G.basket.h;
  const bx = x - bw/2, by = H - Math.round(55*scale);
  const sx = G.basket.sx, sy = G.basket.sy;
  const comboBoost = Math.min(1, G.comboCount / 10);

  // trail — gradient fade, wider on combo
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  G.trail.forEach((t,i) => {
    const a = (i/G.trail.length) * (0.10 + comboBoost*0.18);
    const hue = G.comboCount >= 5 ? (G.bgTime*0.4 + i*8) % 360 : 188;
    ctx.fillStyle = `hsla(${hue},100%,60%,${a})`;
    ctx.beginPath();
    ctx.roundRect(t - bw/2, by, bw, bh, 8*scale);
    ctx.fill();
  });
  ctx.restore();

  // ground glow puddle
  ctx.save();
  const pg = ctx.createRadialGradient(x, by+bh+2*scale, 0, x, by+bh+2*scale, bw*0.9);
  pg.addColorStop(0, `rgba(0,245,255,${0.25 + comboBoost*0.25})`);
  pg.addColorStop(1, 'transparent');
  ctx.fillStyle = pg;
  ctx.fillRect(x - bw, by, bw*2, bh*3);
  ctx.restore();

  ctx.save();
  ctx.translate(x, by + bh);
  ctx.scale(sx, sy);
  ctx.translate(-x, -(by + bh));

  // outer glow halo (combo-pulsed)
  ctx.shadowColor = G.comboCount >= 5 ? `hsl(${(G.bgTime*0.4)%360},100%,65%)` : '#00f5ff';
  ctx.shadowBlur  = Math.round((20 + comboBoost*22) * scale*DPR);

  // body gradient
  const gr = ctx.createLinearGradient(bx, by, bx, by+bh);
  gr.addColorStop(0,'rgba(120,240,255,0.98)');
  gr.addColorStop(0.5,'rgba(0,200,255,0.95)');
  gr.addColorStop(1,'rgba(0,80,180,0.85)');
  ctx.fillStyle = gr;
  ctx.beginPath();
  ctx.roundRect(bx, by, bw, bh, 10*scale);
  ctx.fill();
  ctx.shadowBlur = 0;

  // inner rim shading
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(bx, by, bw, bh, 10*scale);
  ctx.clip();
  const innerShade = ctx.createLinearGradient(bx, by, bx, by+bh);
  innerShade.addColorStop(0, 'rgba(255,255,255,0.0)');
  innerShade.addColorStop(0.6, 'rgba(0,0,0,0.0)');
  innerShade.addColorStop(1, 'rgba(0,0,40,0.35)');
  ctx.fillStyle = innerShade;
  ctx.fillRect(bx, by, bw, bh);
  ctx.restore();

  // top rim highlight
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.roundRect(bx + 6*scale, by + 3*scale, bw - 12*scale, 3*scale, 2*scale);
  ctx.fill();

  // bottom rim shadow stroke
  ctx.strokeStyle = 'rgba(0,200,255,0.7)';
  ctx.lineWidth = 1.5*scale;
  ctx.beginPath();
  ctx.roundRect(bx, by, bw, bh, 10*scale);
  ctx.stroke();

  // weave hint (subtle vertical ticks)
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  const step = 10*scale;
  ctx.beginPath();
  for (let lx = bx + step; lx < bx + bw - 2; lx += step) {
    ctx.moveTo(lx, by + 5*scale);
    ctx.lineTo(lx, by + bh - 3*scale);
  }
  ctx.stroke();

  const basketImg = SPRITES.basket;
  if (basketImg) {
    const bsW = bw * 0.6;
    const bsH = bsW * 0.6;
    ctx.drawImage(basketImg, x - bsW/2, by + bh - bsH*0.1, bsW, bsH);
  }

  ctx.restore();
}

function drawItems() {
  G.items.forEach(item => {
    const img = SPRITES[item.emoji];
    if (!img) return;
    const s = item.sz * 1.4;

    // ground shadow (faux 3D, fades as item nears bottom)
    const groundY = H - Math.round(55*scale);
    const distToGround = Math.max(0, groundY - item.y);
    const shadAlpha = Math.max(0, 0.35 - distToGround/(H*1.2));
    const shadW = s * (0.45 + (1 - distToGround/H) * 0.4);
    ctx.save();
    ctx.globalAlpha = shadAlpha;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(item.x, groundY + 2*scale, shadW, 3*scale, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    const ghostCount = item.ghosts.length;
    for (let i = ghostCount - 1; i >= 0; i--) {
      const g = item.ghosts[i];
      const a = (1 - i / ghostCount) * 0.32;
      const scl = 1 - i * 0.08;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(g.x, g.y);
      ctx.rotate(g.rot * Math.PI/180);
      ctx.drawImage(img, -s*scl/2, -s*scl/2, s*scl, s*scl);
      ctx.restore();
    }

    ctx.save();
    ctx.translate(item.x, item.y);
    ctx.rotate(item.rot * Math.PI/180);
    if (item.isBomb) {
      const pulse = 0.5 + 0.5 * Math.sin(item.t * 0.3);
      ctx.shadowColor = '#ff3333';
      ctx.shadowBlur  = Math.round((14 + pulse*16) * scale*DPR);
      // fuse spark
      const sparkR = (2 + pulse*2) * scale;
      const sg = ctx.createRadialGradient(s*0.18, -s*0.34, 0, s*0.18, -s*0.34, sparkR*3);
      sg.addColorStop(0, `rgba(255,230,0,${0.7 + pulse*0.3})`);
      sg.addColorStop(1, 'transparent');
      ctx.fillStyle = sg;
      ctx.fillRect(-s, -s, s*2, s*2);
    } else if (item.isStar || item.isAmmo) {
      ctx.shadowColor = item.isStar ? '#ffe600' : '#00f5ff';
      ctx.shadowBlur  = Math.round(24* scale*DPR);
      // rotating sparkle halo
      const halo = ctx.createRadialGradient(0,0,0, 0,0, s*0.9);
      halo.addColorStop(0, item.isStar ? 'rgba(255,245,150,0.35)' : 'rgba(0,245,255,0.30)');
      halo.addColorStop(1, 'transparent');
      ctx.fillStyle = halo;
      ctx.fillRect(-s, -s, s*2, s*2);
    }
    ctx.drawImage(img, -s/2, -s/2, s, s);
    ctx.restore();
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  G.particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle   = p.color;
    ctx.beginPath();
    if (p.juice) {   // droplet stretched along its velocity
      const r = p.sz * p.life, len = Math.hypot(p.vx, p.vy) / scale;
      ctx.ellipse(p.x, p.y, r * (1 + len*0.25), r * 0.6, Math.atan2(p.vy, p.vx), 0, Math.PI*2);
    } else {
      ctx.arc(p.x, p.y, p.sz * p.life, 0, Math.PI*2);
    }
    ctx.fill();
  });
  ctx.restore();
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function drawBullets() {
  if (!G.bullets.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.shadowColor = '#00f5ff';
  ctx.shadowBlur = 10*scale*DPR;
  G.bullets.forEach(b => {
    const g = ctx.createLinearGradient(0, b.y, 0, b.y + 26*scale);
    g.addColorStop(0, 'rgba(0,245,255,0.6)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(b.x - 1.5*scale, b.y, 3*scale, 26*scale);      // trail
    ctx.fillStyle = '#e0ffff';
    ctx.beginPath();
    ctx.roundRect(b.x - 2.5*scale, b.y - 8*scale, 5*scale, 12*scale, 2.5*scale);
    ctx.fill();
  });
  ctx.restore();
  ctx.shadowBlur = 0;
}

/* ammo pips, top-left of the panel: filled = ready, outline = empty, the next one fills bottom-up as it reloads */
function drawAmmo() {
  const w = 7*scale, h = 18*scale, py = 14*scale, deny = G.ammoDeny;
  ctx.save();
  ctx.lineWidth = 1.2*scale;
  for (let i = 0; i < G.ammoMax; i++) {
    const x = 17*scale + i*14*scale + (Math.random()-.5) * 4*scale*deny;   // rattles when the player clicks on empty
    ctx.beginPath();
    ctx.roundRect(x - w/2, py, w, h, w/2);
    if (i < G.ammo) {
      ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 8*scale*DPR;
      ctx.fillStyle = '#e0ffff';
      ctx.fill();
      ctx.shadowBlur = 0;
      continue;
    }
    ctx.strokeStyle = deny > 0.05 ? `rgba(255,45,120,${0.4 + deny*0.6})` : 'rgba(0,245,255,0.35)';
    ctx.stroke();
    if (i === G.ammo) {
      ctx.save();
      ctx.clip();
      const p = G.reload / RELOAD_FRAMES;
      ctx.fillStyle = 'rgba(0,245,255,0.55)';
      ctx.fillRect(x - w/2, py + h*(1-p), w, h*p);
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawChunks() {
  G.chunks.forEach(c => {
    ctx.save();
    ctx.globalAlpha = c.life;
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot * Math.PI/180);
    ctx.drawImage(c.img, c.sx, c.sy, c.hw, c.hh, -c.s/4, -c.s/4, c.s/2, c.s/2);
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

function drawSplats() {
  G.splats.forEach(sp => {
    const a = sp.life;
    ctx.save();
    ctx.globalAlpha = a * 0.8;
    ctx.fillStyle = sp.color;
    ctx.beginPath();
    ctx.ellipse(sp.x, sp.y, sp.s * (0.9 - a*0.3), sp.s * 0.14, 0, 0, Math.PI*2);
    ctx.fill();
    if (sp.img) {   // flattened sprite sinking into the puddle
      ctx.globalAlpha = a;
      const h = sp.s * 0.3 * a + 1;
      ctx.drawImage(sp.img, sp.x - sp.s*0.7, sp.y - h, sp.s*1.4, h);
    }
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

function drawShockwaves() {
  if (!G.shockwaves.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  G.shockwaves.forEach(s => {
    const a = s.life;
    ctx.strokeStyle = s.color;
    ctx.globalAlpha = a;
    ctx.lineWidth = (4 * a) * scale;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.stroke();
  });
  ctx.restore();
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function drawSparkles() {
  if (!G.sparkles.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  G.sparkles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    const r = p.sz * p.life;
    // diamond sparkle
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - r);
    ctx.lineTo(p.x + r*0.5, p.y);
    ctx.lineTo(p.x, p.y + r);
    ctx.lineTo(p.x - r*0.5, p.y);
    ctx.closePath();
    ctx.fill();
  });
  ctx.restore();
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function spawnShockwave(x, y, color, maxR) {
  G.shockwaves.push({ x, y, r: 4*scale, maxR: maxR * scale, color, life: 1 });
}
function spawnSparkle(x, y, color) {
  G.sparkles.push({
    x: x + (Math.random()-.5)*8*scale,
    y: y + (Math.random()-.5)*8*scale,
    vx: (Math.random()-.5) * 1.2 * scale,
    vy: (Math.random()*0.5 + 0.3) * scale,
    life: 1, color,
    sz: (3 + Math.random()*3) * scale,
  });
}

/* ═══════════════════════════════════════
   MAIN LOOP
═══════════════════════════════════════ */
function loop() {
  if (!G.running) return;
  requestAnimationFrame(loop);
  
  const now = performance.now();
  const dt = Math.min(100, now - G.lastTime);
  G.lastTime = now;
  const dt_f = dt / 16.666;
  G.bgTime += dt;

  const lv = LEVELS[G.levelIdx];

  // spawn
  G.spawnTimer += dt_f;
  if (G.spawnTimer >= lv.spawnRate) {
    G.spawnTimer = 0;
    spawnItem();
    if (Math.random() < .22 + G.levelIdx*.03) spawnItem();
  }

  // basket
  const bTargetX = Math.max(G.basket.w/2, Math.min(W - G.basket.w/2, mouseX));
  const prevBX = G.basket.x;
  G.basket.x += (bTargetX - G.basket.x) * (1 - Math.pow(0.8, dt_f));
  const bvx = G.basket.x - prevBX;
  if (Math.abs(bvx) > 2.5*scale && Math.random() < 0.7*dt_f) {   // sparks kick off the trailing edge
    G.particles.push({
      x: G.basket.x - Math.sign(bvx) * G.basket.w/2, y: H - Math.round(55*scale) + Math.random()*G.basket.h,
      vx: -bvx*0.25 + (Math.random()-.5)*scale, vy: -(0.5 + Math.random())*scale,
      life: 0.8, color: '#00f5ff', sz: (1.5 + Math.random()*2)*scale,
    });
  }
  G.trail.push(G.basket.x);
  if (G.trail.length > 10) G.trail.shift();

  // items
  G.items = G.items.filter(item => {
    item.t += dt_f;
    switch (item.move) {
      case 'drift':
        item.x += item.vx * dt_f;
        if (item.x < item.sz/2 || item.x > W - item.sz/2) item.vx *= -1;
        item.y += item.speed * dt_f;
        break;
      case 'zigzag':
        item.x = item.baseX + Math.sin(item.t * item.freq * 6 + item.phase) * item.amp;
        item.x = Math.max(item.sz/2, Math.min(W - item.sz/2, item.x));
        item.y += item.speed * dt_f;
        break;
      case 'bounce':
        item.x += item.vx * dt_f;
        wallBounce(item);
        item.y += item.speed * dt_f;
        break;
      case 'hop':
        item.vy = Math.min(item.maxVy, item.vy + item.g * dt_f);
        item.y += item.vy * dt_f;
        if (item.bounces > 0 && item.vy > 0 && item.y >= item.floorY) {
          item.bounces--;
          // rebound capped so the apex stays on screen
          item.vy = -Math.min(item.vy * 0.75, Math.sqrt(2 * item.g * (item.floorY - item.sz)));
        }
        break;
      case 'brake':
        item.speed = Math.max(item.minSpeed, item.speed * Math.pow(item.friction, dt_f));
        item.y += item.speed * dt_f;
        break;
      case 'skid':
        item.vx *= Math.pow(item.friction, dt_f);
        item.x += item.vx * dt_f;
        wallBounce(item);
        item.y += item.speed * dt_f;
        break;
      case 'hover':
        if (item.y < item.hoverY) item.y = Math.min(item.hoverY, item.y + item.speed * dt_f);
        else if (item.hoverT > 0) { item.hoverT -= dt_f; item.rotSpd += (item.rotSpd < 0 ? -0.4 : 0.4) * dt_f; }   // spin-up telegraphs the drop
        else { item.vy = Math.min(item.maxVy, item.vy + 0.25 * scale * dt_f); item.y += item.vy * dt_f; }
        break;
      case 'seek':
        item.vx += Math.sign(G.basket.x - item.x) * 0.10 * scale * dt_f;
        item.vx *= Math.pow(0.97, dt_f);          // friction-damped so it overshoots instead of snapping on
        item.x += item.vx * dt_f;
        wallBounce(item);
        item.rot = item.vx / scale * 6;           // leans into the turn
        item.y += item.speed * dt_f;
        break;
      case 'accel':
        item.speed += item.accel * dt_f;
        item.y += item.speed * dt_f;
        break;
      case 'pendulum':
        item.x = item.baseX + Math.sin(item.t * item.freq * 6 + item.phase) * item.amp;
        item.x = Math.max(item.sz/2, Math.min(W - item.sz/2, item.x));
        item.y += item.speed * dt_f;
        item.rotSpd = Math.cos(item.t * item.freq * 6 + item.phase) * 3;
        break;
      default:
        item.y += item.speed * dt_f;
    }
    item.rot += item.rotSpd * dt_f;

    item.ghostTimer += dt_f;
    if (item.ghostTimer >= 1.6) {
      item.ghostTimer = 0;
      item.ghosts.unshift({ x: item.x, y: item.y, rot: item.rot });
      if (item.ghosts.length > 5) item.ghosts.length = 5;
    }

    // sparkle trail for stars / ammo crates
    if ((item.isStar || item.isAmmo) && Math.random() < 0.5 * dt_f) {
      spawnSparkle(item.x, item.y, item.isStar ? '#ffe600' : '#00f5ff');
    }

    const by = H - Math.round(55*scale);
    const bh = G.basket.h;
    const bw = G.basket.w/2;
    const bx = G.basket.x;

    // catch
    if (item.y + item.sz/2 >= by && item.y - item.sz/2 < by+bh &&
        item.x >= bx-bw && item.x <= bx+bw) {
      if (item.isAmmo) {
        catchAmmo(item);
      } else if (item.isBomb) {
        G.comboCount = 0;
        G.lives--;
        G.screenShake = 25;
        G.flash = 1;
        G.basket.sx = 1.3; G.basket.sy = 0.7;
        sfxBomb();
        spawnParticles(item.x, item.y, FRUIT_COLORS[BOMB], 18);
        spawnShockwave(item.x, item.y, 'rgba(255,60,120,0.95)', 80);
        spawnShockwave(item.x, item.y, 'rgba(255,200,60,0.7)', 50);
        addFloater(item.x, item.y, `${ico('boom')} -1`, '#ff2d78');
        updateHUD();
        if (G.lives <= 0) { gameOver(); return false; }
      } else {
        G.comboCount++;
        G.fruitsTotal++;
        const pts = item.isStar ? 3 : (G.comboCount >= 3 ? 2 : 1);
        G.score += pts;
        checkLevelUp();

        G.basket.sx = 1.25; G.basket.sy = 0.75;
        if (G.comboCount >= 5) G.edgeGlow = Math.min(1.0, G.edgeGlow + 0.3);
        if (G.comboCount > 0 && G.comboCount % 10 === 0) G.flash = 0.8;

        sfxCatch(G.comboCount - 1);
        const col = FRUIT_COLORS[item.emoji];
        const lbl = item.isStar ? `+3 ${ico('star')}` : (G.comboCount>=3 ? `+${pts} ${ico('fire')}` : `+${pts}`);
        spawnParticles(item.x, item.y, col, item.isStar ? 18 : 12);
        spawnBurst(item);
        spawnShockwave(item.x, item.y, col, item.isStar ? 70 : 45);
        if (item.isStar) {
          spawnShockwave(item.x, item.y, 'rgba(255,255,200,0.8)', 95);
          for (let i = 0; i < 10; i++) spawnSparkle(item.x, item.y, '#fff5a3');
        }
        addFloater(item.x, item.y, lbl, col);
        updateHUD();
        checkAchievements();
      }
      return false;
    }

    // missed — the moment it clears the basket's underside it can't be caught, so it hits the floor there
    if (item.y - item.sz/2 >= by + bh) {
      if (item.isAmmo) { /* no penalty */ }
      else if (!item.isBomb) {
        G.comboCount = 0;
        G.lives--;
        G.screenShake = 15;
        sfxMiss();
        spawnSplat(item);
        addFloater(item.x, H - 30*scale, ico('heartbreak'), '#ff2d78');
        updateHUD();
        if (G.lives <= 0) { gameOver(); return false; }
      } else {
        G.bombsAvoided++;
        spawnParticles(item.x, by + bh, '#8a8a8a', 8);            // dud: smoke puff
        spawnShockwave(item.x, by + bh, 'rgba(255,140,60,0.5)', 30);
      }
      checkAchievements();
      return false;
    }
    return true;
  });

  // particles
  G.particles = G.particles.filter(p => {
    p.x += p.vx * dt_f;
    p.y += p.vy * dt_f;
    p.vy += (0.14 * scale) * dt_f;
    p.life -= 0.028 * dt_f;
    return p.life > 0;
  });

  // sparkles
  G.sparkles = G.sparkles.filter(p => {
    p.x += p.vx * dt_f;
    p.y += p.vy * dt_f;
    p.vy += 0.05 * scale * dt_f;
    p.life -= 0.04 * dt_f;
    return p.life > 0;
  });

  // bullets
  if (G.ammo < G.ammoMax && (G.reload += dt_f) >= RELOAD_FRAMES) { G.reload = 0; G.ammo++; }
  G.ammoDeny *= Math.pow(0.9, dt_f);
  const lipY = H - Math.round(55*scale);
  G.bullets = G.bullets.filter(b => {
    b.y += b.vy * dt_f;
    if (b.y < -20*scale) return false;
    // only things still above the basket lip — never snipes a fruit that's already being caught
    const hit = G.items.find(it => !it.isAmmo && it.y + it.sz/2 < lipY && Math.hypot(it.x - b.x, it.y - b.y) < it.sz * 0.6);
    if (!hit) return true;
    if (hit.isBomb) detonate(hit); else shotFruit(hit);
    return false;
  });

  // chunks / splats
  G.chunks = G.chunks.filter(c => {
    c.x += c.vx * dt_f; c.y += c.vy * dt_f;
    c.vy += 0.18 * scale * dt_f;
    c.rot += c.rotSpd * dt_f;
    c.life -= 0.03 * dt_f;
    return c.life > 0;
  });
  G.splats = G.splats.filter(s => { s.life -= 0.02 * dt_f; return s.life > 0; });

  // shockwaves
  G.shockwaves = G.shockwaves.filter(s => {
    s.r += (s.maxR - s.r) * (1 - Math.pow(0.82, dt_f));
    s.life -= 0.045 * dt_f;
    return s.life > 0;
  });

  // animation decay
  G.basket.sx += (1 - G.basket.sx) * (1 - Math.pow(0.85, dt_f));
  G.basket.sy += (1 - G.basket.sy) * (1 - Math.pow(0.85, dt_f));
  G.edgeGlow *= Math.pow(0.96, dt_f);
  G.flash *= Math.pow(0.85, dt_f);

  // screen shake
  let ox=0, oy=0;
  if (G.screenShake > 0) {
    ox = (Math.random()-.5) * G.screenShake * .5;
    oy = (Math.random()-.5) * G.screenShake * .5;
    G.screenShake = Math.max(0, G.screenShake - 2 * dt_f);
  }

  // ── DRAW ──
  ctx.save();
  if (ox||oy) ctx.translate(ox, oy);

  drawBG();
  drawSplats();
  drawItems();
  drawBasket(G.basket.x);
  drawBullets();
  drawChunks();
  drawParticles();
  drawSparkles();
  drawShockwaves();

  // danger line — animated dash
  const dy = H - 55*scale;
  ctx.save();
  ctx.shadowColor = 'rgba(255,45,120,0.5)';
  ctx.shadowBlur = 8*scale*DPR;
  ctx.strokeStyle = 'rgba(255,45,120,0.35)';
  ctx.lineWidth = 1.2;
  ctx.setLineDash([8*scale, 6*scale]);
  ctx.lineDashOffset = -(G.bgTime * 0.03);
  ctx.beginPath();
  ctx.moveTo(0, dy);
  ctx.lineTo(W, dy);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  ctx.restore();
  drawAmmo();
}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
G = newState();
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('bd').textContent = best;

// Prevent scroll bounce on iOS
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });

// Prevent right-click context menu
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
