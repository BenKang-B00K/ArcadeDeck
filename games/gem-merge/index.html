<!DOCTYPE html>
<html lang="en">
<head><script src="/perf.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gem Merge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f9ca24'%3E%3Cpath d='M6 3h12l4 6-10 13L2 9z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
<script>/* offline play: games.arcadedeck.net/sw.js (shared, one cache per game) */if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js',{scope:'./'}).then(()=>navigator.serviceWorker.ready).then(r=>r.active&&r.active.postMessage([location.origin+location.pathname,...performance.getEntriesByType('resource').map(e=>e.name)])).catch(()=>{})})</script>
</head>
<body>

  <!-- Ambient glow blobs -->
  <div class="blob" style="width:320px;height:320px;background:rgba(108,92,231,0.20);top:-60px;left:-80px;animation-duration:13s;"></div>
  <div class="blob" style="width:260px;height:260px;background:rgba(0,206,201,0.14);bottom:80px;right:-40px;animation-duration:10s;animation-delay:-4s;"></div>
  <div class="blob" style="width:220px;height:220px;background:rgba(253,121,168,0.13);top:42%;left:8%;animation-duration:16s;animation-delay:-7s;"></div>
  <div class="blob" style="width:290px;height:290px;background:rgba(249,202,36,0.09);bottom:-90px;left:35%;animation-duration:12s;animation-delay:-2s;"></div>
  <div class="blob" style="width:180px;height:180px;background:rgba(46,213,115,0.10);top:20%;right:5%;animation-duration:18s;animation-delay:-9s;"></div>

  <!-- Center layout -->
  <div id="center-col">
    <div id="title"><span class="gem-icon"></span>GEM MERGE</div>

    <div id="hud">
      <div class="hud-card"><div class="hud-label" data-i18n="score"></div><div class="hud-value" id="score">0</div></div>
      <div class="hud-card"><div class="hud-label" data-i18n="best"></div><div class="hud-value" id="best">0</div></div>
    </div>

    <div id="game-area">

      <!-- LEFT panel: gem guide Lv 1–6 + combo (populated by JS) -->
      <aside class="side-panel" id="panel-left"></aside>

      <!-- Canvas -->
      <div id="game-container">
        <button id="help-btn">?</button>
        <div id="credit">Created by BenjaminK</div>
        <div id="ach-toasts"></div>
        <!-- Sound / catalog / language — sits under the right panel, beside the canvas on phones -->
        <div id="panel-btns">
          <button id="mute-btn" data-i18n-title="muteTitle"></button>
          <button id="catalog-btn" data-i18n-title="catalogTitle"></button>
          <button id="lang-btn" data-i18n-title="langTitle">EN</button>
        </div>
        <!-- Legendary cinematic overlay (shown briefly when Lv11 is created) -->
        <div id="legendary-cinematic" class="hidden">
          <div class="lc-gem gem-icon"></div>
          <div class="lc-text" data-i18n="lcText"></div>
          <div class="lc-sub" data-i18n="lcSub"></div>
        </div>
        <div id="overlay" class="hidden">
          <div id="overlay-box">
            <h2 data-i18n="gameOver"></h2>
            <div class="go-score"><span data-i18n="score"></span> &nbsp;<span id="final-score">0</span></div>
            <button id="restart-btn" data-i18n="restart"></button>
          </div>
        </div>
      </div>

      <!-- RIGHT panel: gem guide Lv 7–11 + how-to (populated by JS) -->
      <aside class="side-panel" id="panel-right"></aside>

    </div><!-- #game-area -->

    <!-- Persistent Legendary Vault -->
    <div id="legendary-vault">
      <span class="vault-label" data-i18n="vault"></span>
      <div id="vault-gems"></div>
    </div>

  </div><!-- #center-col -->

  <!-- Catalog modal -->
  <div id="catalog-modal" class="hidden">
    <div id="catalog-modal-backdrop"></div>
    <div id="catalog-modal-box">
      <button id="catalog-close">✕</button>
      <div class="panel-title" data-i18n="catalog"></div>
      <div id="catalog-list"></div>
      <div class="panel-title" id="ach-title"></div>
      <div id="ach-list"></div>
    </div>
  </div>

  <!-- Help modal (small screens) -->
  <div id="help-modal">
    <div id="help-modal-backdrop"></div>
    <div id="help-modal-box">
      <button id="help-close">✕</button>
      <div class="help-section">
        <div class="panel-title" data-i18n="gems"></div>
        <div class="help-cols" id="help-gems"></div>
      </div>
      <div class="help-section" id="help-how"></div>
      <div class="help-section" id="help-combo"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
