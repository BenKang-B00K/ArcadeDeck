<!DOCTYPE html>
<html lang="en">
<head><script src="/perf.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Just Jump">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Just Jump</title>
<style>
  /* KO/JA pixel fonts — CJK-only subsets (tools/subset_fonts.py); Latin falls through to monospace */
  @font-face { font-family: 'Galmuri11'; font-weight: 400; font-display: swap; src: url(fonts/galmuri11.woff2) format('woff2'); }
  @font-face { font-family: 'Galmuri11'; font-weight: 700; font-display: swap; src: url(fonts/galmuri11-bold.woff2) format('woff2'); }
  @font-face { font-family: 'DotGothic16'; font-display: swap; src: url(fonts/dotgothic16.woff2) format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%;
  }
  #wrap {
    position: fixed; inset: 0;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    background: #0a0a14;
  }
  #hint {
    display: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="g"></canvas></div>
<div id="hint">TAP / SPACE to JUMP</div>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/skins.js"></script>
<script src="js/player_sprite.js"></script>
<script src="js/obstacles.js"></script>
<script src="js/coins.js"></script>
<script src="js/stages.js"></script>
<script src="js/ui.js"></script>
<script>
async function bootstrap() {
  const [skinsData, stagesData, coinsData, obstaclesData] = await Promise.all([
    fetch('data/skins.json').then(r => r.json()),
    fetch('data/stages.json').then(r => r.json()),
    fetch('data/coins.json').then(r => r.json()),
    fetch('data/obstacles.json').then(r => r.json()),
  ]);
  window.OneJump.Skins.loadFromArray(skinsData);
  window.OneJump.Stages.loadFromArray(stagesData);
  window.OneJump.Coins.loadFromArray(coinsData);
  window.OneJump.Obstacles.loadFromArray(obstaclesData);
  startGame();
}
// installable app / offline play (needs http(s); no-op on file://)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
bootstrap().catch(err => {
  console.error('Bootstrap failed:', err);
  document.body.innerHTML = '<div style="color:#fff;padding:20px;font-family:monospace">' +
    window.OneJump.I18N.t('Failed to load game data. Run via local HTTP server (e.g. python -m http.server).') + '<br>' +
    String(err) + '</div>';
});

function startGame() {
(() => {
  const { Skins, PlayerSprite, Obstacles, Coins, Stages, UI } = window.OneJump;
  const { SPR_OFFX, SPR_OFFY } = PlayerSprite;
  const cvs = document.getElementById('g');
  const ctx = cvs.getContext('2d', { alpha: false });  // opaque: every frame paints full raster
  const hint = document.getElementById('hint');

  // Design dimensions switch with orientation. Camera scales to fit viewport.
  const DESIGN_PORTRAIT  = { W: 480, H: 720 };
  const DESIGN_LANDSCAPE = { W: 800, H: 480 };
  let W = DESIGN_PORTRAIT.W, H = DESIGN_PORTRAIT.H;
  let cameraScale = 1, cameraOffX = 0, cameraOffY = 0;
  let pendingDesignChange = false;
  let grads = null;         // cached static gradients; nulled on resize
  let pauseDrawn = false;   // paused frame already painted

  function pickDesign() {
    const ar = window.innerWidth / window.innerHeight;
    return ar >= 1.2 ? DESIGN_LANDSCAPE : DESIGN_PORTRAIT;
  }

  function resize() {
    const d = pickDesign();
    const orientationChanged = (d.W !== W);
    if (orientationChanged) {
      W = d.W; H = d.H;
      GROUND_Y = H - 120;
      pendingDesignChange = true;  // rebuild bg layers + reset player after init
    }
    // backing store at device pixels (capped 2x for fill-rate) → crisp on retina
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = Math.round(window.innerWidth * dpr), ch = Math.round(window.innerHeight * dpr);
    if (!orientationChanged && cw === cvs.width && ch === cvs.height) return;
    cvs.width = cw; cvs.height = ch;
    grads = null; pauseDrawn = false;
    const sx = cvs.width / W, sy = cvs.height / H;
    cameraScale = Math.min(sx, sy);
    cameraOffX = (cvs.width  / cameraScale - W) / 2;
    cameraOffY = (cvs.height / cameraScale - H) / 2;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  // initial design pick before resize binds (so init code below uses right W/H)
  {
    const d = pickDesign();
    W = d.W; H = d.H;
  }
  resize();

  // ---- Game state ----
  const STATE = { READY: 0, PLAY: 1, DEAD: 2 };
  let state = STATE.READY;
  let paused = false;  // set on visibility hidden during PLAY; cleared by next tap

  let GROUND_Y = H - 120;
  const GRAVITY = 1.0;
  // apex ≈ 91px single, ≈ 141px single+double, 28f airtime. Tallest ground obstacle must stay ≤ ~128.
  const JUMP_V = -14;
  const DOUBLE_JUMP_V = -10.5;

  const PLAYER_SCALE = 0.78;
  const player = {
    x: 90, y: GROUND_Y, w: Math.round(36 * PLAYER_SCALE), h: Math.round(44 * PLAYER_SCALE),
    vy: 0, jumps: 0, onGround: true,
    trail: [],
    deadRot: 0,        // current ragdoll rotation (rad)
    deadRotVel: 0,     // angular velocity
  };

  // Ghost: previous run replayed in lane below ground. Flat [y, pose, y, pose...] per frame.
  // pose 0 = ground, 1 = rising, 2 = falling. One run back, saved in jj_ghost.
  let ghostRec = [];
  let lastGhost = null;
  try {
    const g = JSON.parse(localStorage.getItem('jj_ghost'));
    if (Array.isArray(g) && g.length >= 2) lastGhost = g;
  } catch (_) {}

  let obstacles = [];
  let particles = [];
  let clouds = [];
  let stars = [];
  let speed = 5;
  let baseSpeed = 5;
  let stageScore = 0;             // resets each stage clear (drives speed ramp)

  // Stage state
  const stageList = Stages.all();
  let startStageIdx = 0;          // chosen on start screen
  let currentStageIdx = 0;        // active during play
  let stageBanner = null;         // {text, sub, life, age, color}
  const stageCongrats = new Set(); // stages already congratulated this run
  let tierBanner = null;           // {label, color, life, age} — small top-right
  const tierCongrats = new Set();  // tier thresholds reached this run
  const STAGE_UNLOCK_SCORE = 2550;  // PLATINUM tier — gates next-stage unlock
  const TIER_THRESHOLDS = UI.TIERS.filter(t => t.score >= STAGE_UNLOCK_SCORE).reverse();
  try {
    const savedStage = localStorage.getItem('jj_stage');
    if (savedStage != null) {
      const idx = +savedStage;
      if (Number.isFinite(idx) && idx >= 0 && idx < stageList.length
          && Stages.isUnlocked(stageList[idx].id)) {
        startStageIdx = idx;
      }
    }
  } catch (_) {}
  function currentStage() { return stageList[currentStageIdx]; }
  function setStartStage(idx) {
    // skip locked stages while cycling
    const n = stageList.length;
    let i = ((idx % n) + n) % n;
    const dir = idx > startStageIdx ? 1 : -1;
    let safety = 0;
    while (!Stages.isUnlocked(stageList[i].id) && safety++ < n) {
      i = ((i + dir) % n + n) % n;
    }
    if (i !== startStageIdx) Sfx.play('tick', dir > 0 ? 11 : 8);
    startStageIdx = i;
    try { localStorage.setItem('jj_stage', String(startStageIdx)); } catch (_) {}
  }
  function showStageBanner(text, sub, color) {
    stageBanner = { text, sub: sub || '', color: color || '#ffd060', life: 90, age: 0 };
  }
  let score = 0;
  // storage may throw (blocked/private) or hold junk → fall back to default
  function loadNum(key, def) {
    try {
      const raw = localStorage.getItem(key);
      return raw != null && Number.isFinite(+raw) ? +raw : def;
    } catch (_) { return def; }
  }
  // per-stage best score
  const STAGE_BEST_KEY = 'jj_best_per_stage';
  let bestPerStage = {};
  try {
    const raw = localStorage.getItem(STAGE_BEST_KEY);
    const m = raw && JSON.parse(raw);
    if (m && typeof m === 'object' && !Array.isArray(m)) bestPerStage = m;
  } catch (_) {}
  // legacy migration: seed from old single-best key into twilight if no map yet
  if (!Object.keys(bestPerStage).length) {
    const legacy = loadNum('onejump_best', 0);
    if (legacy > 0) bestPerStage['twilight'] = legacy;
  }
  function getStageBest(stageId) { return bestPerStage[stageId] || 0; }
  function setStageBest(stageId, sc) {
    bestPerStage[stageId] = sc;
    try { localStorage.setItem(STAGE_BEST_KEY, JSON.stringify(bestPerStage)); } catch (_) {}
  }
  // lifetime total score (sum of every run score across all stages)
  const TOTAL_SCORE_KEY = 'jj_total_score';
  let totalScore = loadNum(TOTAL_SCORE_KEY, 0);
  function addToTotal(sc) {
    totalScore += sc;
    try { localStorage.setItem(TOTAL_SCORE_KEY, String(totalScore)); } catch (_) {}
  }
  let coinBalance = Math.max(0, loadNum('jj_coins', 0));
  let coinMultiplier = loadNum('jj_mult', 1) || 1;
  let coins = [];           // active coin entities in world
  let coinSpawnTimer = 0;
  let coinSpawnGap = 130;
  function saveCoins() {
    try { localStorage.setItem('jj_coins', String(coinBalance)); } catch (_) {}
  }
  function saveMultiplier() {
    try { localStorage.setItem('jj_mult', String(coinMultiplier)); } catch (_) {}
  }
  // Multiplier earned by previous run. Higher score = bigger next-run boost.
  const multiplierForScore = s => UI.medalForScore(s).mult;

  // Speed → km/h (factor tuned so baseSpeed 5 ≈ 30 km/h, max ≈ 60 km/h)
  const KMH_FACTOR = 6;
  function toKmh(s) { return s * KMH_FACTOR; }

  // Floating text (coin pickup, etc.)
  let floaters = [];
  function addFloater(x, y, text, color) {
    floaters.push({ x, y, vy: -1.4, text, color: color || '#ffd060', life: 60, age: 0 });
  }
  let spawnTimer = 0;
  let spawnGap = 80;
  let frame = 0;
  let worldOffset = 0;     // accumulates only during PLAY, drives parallax
  let shake = 0;
  let flashAlpha = 0;

  // run stats
  let stats = { jumps: 0, doubles: 0, dodged: 0, runFrames: 0, maxSpeed: 0, coins: 0 };
  let lastRun = { score: 0, jumps: 0, doubles: 0, dodged: 0, timeMs: 0, maxSpeed: 0, newBest: false, prevBest: 0 };
  let deadFrame = 0;
  let uiFrame = 0; // always-ticking, for non-play UI animation

  let mountains;
  function rebuildBgLayers() {
    clouds.length = 0;
    stars.length = 0;
    buildings.length = 0;
    const cloudCount = Math.max(2, Math.floor(W / 180));
    for (let i = 0; i < cloudCount; i++) {
      const w = 60 + Math.random() * 80;
      // Build organic puff shape: 4-6 circles w/ varied radius + offset
      const puffCount = 4 + Math.floor(Math.random() * 3);
      const puffs = [];
      for (let p = 0; p < puffCount; p++) {
        const t = p / (puffCount - 1);
        puffs.push({
          dx: (t - 0.5) * w * 0.95 + (Math.random() - 0.5) * 6,
          dy: -Math.sin(t * Math.PI) * w * 0.18 + (Math.random() - 0.5) * 4,
          r:  w * (0.28 + Math.random() * 0.16),
        });
      }
      clouds.push({
        x: Math.random() * W,
        y: 60 + Math.random() * (GROUND_Y * 0.4),
        w, s: 0.3 + Math.random() * 0.4,
        puffs,
        tint: Math.random() < 0.3 ? 'pink' : 'cool',
      });
      bakeCloud(clouds[clouds.length - 1]);
    }
    // ponytail: stars span [-W/2, 1.5W] — covers letterbox bands up to W/2 each side
    const starCount = 2 * Math.max(60, Math.floor(W * H / 5000));
    for (let i = 0; i < starCount; i++) {
      stars.push({
        x: (Math.random() * 2 - 0.5) * W,
        y: Math.random() * (GROUND_Y - 50),
        r: 0.4 + Math.random() * 1.4,
        tw: Math.random() * Math.PI * 2,
        hue: Math.random() < 0.15 ? '#ffd060' : (Math.random() < 0.2 ? '#a0e0ff' : '#fff'),
      });
    }
    const buildingCount = Math.max(10, Math.floor(W / 35));
    for (let i = 0; i < buildingCount; i++) {
      buildings.push({
        x: Math.random() * W * 1.2,
        w: 30 + Math.random() * 40,
        h: 40 + Math.random() * 80,
        roof: Math.floor(Math.random() * 4),  // silhouette variant 0..3, per-stage meaning in CITY
        seed: Math.random() * 1e4,
      });
    }
    buildings.sort((a, b) => b.h - a.h);  // tall first → short ones overlap in front
    mountains = [
      buildMountainLayer(0.12, 130, '#1e1c3e', 0),
      buildMountainLayer(0.28, 100, '#17162f', 1),
      buildMountainLayer(0.5,  70,  '#100f22', 2),
    ];
    bgTiles.clear();
  }
  // Ridge = sum of |sin| harmonics with integer freq over tile width → seamless wrap.
  function buildMountainLayer(parallax, height, color, depth) {
    const harm = [];
    const baseF = 3 + depth;
    for (let k = 0; k < 4; k++) {
      harm.push({ f: baseF * (k + 1) + Math.floor(Math.random() * 2), a: 1 / (k + 1.3), ph: Math.random() * Math.PI });
    }
    return { parallax, color, harm, depth, baseY: GROUND_Y + 40, height };
  }
  const bgTiles = new Map();  // `${stageId}` → baked mountain/city tiles, cleared on layer rebuild
  // declare lazy buildings array first
  const buildings = [];
  rebuildBgLayers();

  function reset() {
    player.y = GROUND_Y; player.vy = 0; player.jumps = 0; player.onGround = true; player.trail = [];
    if (ghostRec.length) lastGhost = ghostRec;
    ghostRec = [];
    obstacles = []; particles = []; coins = []; floaters = [];
    currentStageIdx = startStageIdx;
    baseSpeed = currentStage().startSpeed;
    speed = baseSpeed; score = 0; stageScore = 0; spawnTimer = 0; spawnGap = 80; frame = 0;
    worldOffset = 0;
    coinSpawnTimer = 0; coinSpawnGap = 130;
    shake = 0;
    stageBanner = null;
    stageCongrats.clear();
    tierBanner = null;
    tierCongrats.clear();
    stats = { jumps: 0, doubles: 0, dodged: 0, runFrames: 0, maxSpeed: 0, coins: 0, stagesCleared: 0 };
  }

  const Sfx = OneJump.Audio;
  function jump() {
    if (paused) { paused = false; Sfx.play('resume'); return; }  // first tap after resume only unpauses
    if (state === STATE.READY) {
      state = STATE.PLAY;
      hint.style.display = 'none';
      reset();
      Sfx.play('start');
      player.vy = JUMP_V;
      player.onGround = false;
      player.jumps = 1;
      return;
    }
    if (state === STATE.DEAD) {
      if (deadFrame < 45) return;  // swallow jump-mash taps so results screen isn't skipped
      state = STATE.READY;
      Sfx.play('tick', 7);
      hint.style.display = 'block';
      hint.textContent = OneJump.I18N.t('TAP / SPACE to JUMP');
      return;
    }
    if (state === STATE.PLAY) {
      if (player.onGround) {
        player.vy = JUMP_V;
        player.onGround = false;
        player.jumps = 1;
        stats.jumps++;
        Sfx.play('jump');
        burstParticles(player.x + player.w/2, player.y + player.h, '#fff', 8);
      } else if (player.jumps < 2) {
        player.vy = DOUBLE_JUMP_V;
        player.jumps = 2;
        stats.doubles++;
        Sfx.play('doubleJump');
        burstParticles(player.x + player.w/2, player.y + player.h/2, '#7df', 12);
      }
    }
  }

  // ---- Skin selection ----
  let skinIdx = 0;             // preview index — may point at locked skin
  const skinIds = Skins.all().map(s => s.id);
  // hit-rects for start screen interactive elements (UI module writes to these)
  const hits = { arrowL: null, arrowR: null, stageL: null, stageR: null, ctaRect: null, boost: null, moon: null, lang: null, vol: null, stagePill: null, hover: null };

  function previewSkin() { return Skins.get(skinIds[skinIdx]); }
  function previewLocked() { return !Skins.isUnlocked(skinIds[skinIdx]); }

  function cycleSkin(dir) {
    if (state !== STATE.READY) return false;
    skinIdx = (skinIdx + dir + skinIds.length) % skinIds.length;
    const id = skinIds[skinIdx];
    Sfx.play('tick', dir > 0 ? 12 : 9);
    if (Skins.isUnlocked(id)) {
      setSkin(id);
      try { localStorage.setItem('jj_skin', id); } catch (_) {}
    }
    // locked: UI's atlasFor cache handles preview rendering on demand
    return true;
  }

  function buyPreview() {
    const id = skinIds[skinIdx];
    const skin = Skins.get(id);
    if (!skin || Skins.isUnlocked(id)) return false;
    if (coinBalance < skin.cost) { Sfx.play('denied'); return false; }
    Sfx.play('buy');
    coinBalance -= skin.cost;
    saveCoins();
    Skins.unlock(id);
    setSkin(id);
    try { localStorage.setItem('jj_skin', id); } catch (_) {}
    burstParticles(W/2, H/2 - 50, '#ffd060', 30);
    flashAlpha = 0.4;
    return true;
  }

  // restore last-used skin (only if unlocked)
  try {
    const saved = localStorage.getItem('jj_skin') || localStorage.getItem('onejump_skin');  // legacy key
    if (saved && skinIds.includes(saved) && Skins.isUnlocked(saved)) {
      skinIdx = skinIds.indexOf(saved);
      setSkin(saved);
    }
  } catch (_) {}

  function canvasPointFromEvent(e) {
    const r = cvs.getBoundingClientRect();
    const px = (e.clientX - r.left) * (cvs.width / r.width);
    const py = (e.clientY - r.top) * (cvs.height / r.height);
    // inverse camera: divide by scale, subtract offset → design space
    return {
      x: px / cameraScale - cameraOffX,
      y: py / cameraScale - cameraOffY,
    };
  }

  function pointInRect(p, rct) {
    return rct && p.x >= rct.x && p.x <= rct.x + rct.w && p.y >= rct.y && p.y <= rct.y + rct.h;
  }

  // ---- Input ----
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); jump(); return; }
    if (e.code === 'KeyM') { Sfx.cycleVolume(); return; }
    if (state === STATE.READY) {
      if (e.code === 'ArrowLeft')  { e.preventDefault(); cycleSkin(-1); }
      else if (e.code === 'ArrowRight') { e.preventDefault(); cycleSkin(+1); }
      else if (e.code === 'ArrowDown')  { e.preventDefault(); setStartStage(startStageIdx + 1); }
      else if (e.code === 'ArrowUp')    { e.preventDefault(); setStartStage(startStageIdx - 1); }
      else if (e.code === 'KeyL')       { OneJump.I18N.cycle(); Sfx.play('tick', 10); }
    } else {
      // ArrowUp doubles as jump during play
      if (e.code === 'ArrowUp') { e.preventDefault(); jump(); }
    }
  });
  cvs.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (state === STATE.READY) {
      const p = canvasPointFromEvent(e);
      if (pointInRect(p, hits.lang))   { OneJump.I18N.cycle(); Sfx.play('tick', 10); return; }
      if (pointInRect(p, hits.vol))    { Sfx.cycleVolume(); return; }
      if (pointInRect(p, hits.arrowL)) { cycleSkin(-1); return; }
      if (pointInRect(p, hits.arrowR)) { cycleSkin(+1); return; }
      if (pointInRect(p, hits.stageL)) { setStartStage(startStageIdx - 1); return; }
      if (pointInRect(p, hits.stageR)) { setStartStage(startStageIdx + 1); return; }
      if (pointInRect(p, hits.boost))  { setStartStage(startStageIdx + 1); return; }
      if (pointInRect(p, hits.moon))   { setStartStage(startStageIdx + 1); return; }
      if (pointInRect(p, hits.ctaRect)) {
        if (previewLocked()) { buyPreview(); return; }
        jump();  // unlocked + on CTA → start
        return;
      }
      // tap anywhere else does nothing in READY (prevents accidental start)
      return;
    }
    jump();
  });
  // mouse hover point for UI tooltips (touch/pen skipped — no hover there)
  cvs.addEventListener('pointermove', e => { hits.hover = e.pointerType === 'mouse' ? canvasPointFromEvent(e) : null; });
  cvs.addEventListener('pointerleave', () => { hits.hover = null; });
  document.addEventListener('touchstart', e => { e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());
  // auto-pause when app is backgrounded (home button, call, lock screen)
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) return;
    if (state === STATE.PLAY) { paused = true; pauseDrawn = false; }
    saveCoins();  // mid-run pickups; app may be killed while backgrounded
  });

  // ---- Spawn ----
  function obstacleEnv() {
    const st = currentStage();
    return {
      W: W + cameraOffX, H, GROUND_Y, player, speed, frame, score,  // spawn past right-most visible edge
      allowedIds: st.obstacleIds,
      coinIds: st.coinIds,
    };
  }

  // Low ground obstacle = hitbox top ≤ 58px over ground (at rest for fallers). Solver-checked: two of
  // these 80–160px apart stay clearable at every speed 5–10; anything taller/airborne can make an
  // impossible pair (e.g. tower+tower needs ~27f between, cluster gives 8–16f).
  function isLowGround(o) {
    const hb = Obstacles.hitbox(o.targetY != null ? Object.assign({}, o, { y: o.targetY }) : o);
    return GROUND_Y + player.h - hb.y <= 58;
  }
  // Fallers drop at fixed gravity but travel time shrinks with speed → at high speed (portrait) they
  // were still mid-air passing the player and landed behind. Pre-advance so they land by 70% of travel.
  function settleFallers(list, env) {
    for (const o of list) {
      if (o.landed !== false) continue;
      const c = Object.assign({}, o);
      let n = 0;
      while (!c.landed && n < 300) { Obstacles.update(c, env); n++; }
      for (let k = n - Math.floor((o.x - player.x) / speed * 0.7); k > 0; k--) Obstacles.update(o, env);
    }
  }
  function spawnObstacle() {
    const env = obstacleEnv();
    const newOnes = Obstacles.spawn(env);
    settleFallers(newOnes, env);
    for (const o of newOnes) obstacles.push(o);
    // cluster: chance to spawn extra obstacle offset behind, scales with stageScore. Low pairs only.
    const clusterChance = Math.min(0.45, stageScore / 3500);
    if (Math.random() < clusterChance && newOnes.every(isLowGround)) {
      const offset = 80 + Math.random() * 80;
      const env2 = Object.assign({}, env, { W: env.W + offset });
      const extra = Obstacles.spawn(env2);
      if (extra.every(isLowGround)) {
        settleFallers(extra, env2);
        for (const o of extra) obstacles.push(o);
        spawnTimer = -Math.round(offset / speed);  // keep full spawnGap after the trailing obstacle
      }
    }
  }

  function burstParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.8) * 6,
        life: 24 + Math.random() * 12,
        color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function die() {
    if (state !== STATE.PLAY) return;
    state = STATE.DEAD;
    shake = 18;
    flashAlpha = 0.6;
    deadFrame = 0;
    Sfx.play('death');
    // ragdoll launch
    player.vy = -11;
    player.deadRot = 0;
    player.deadRotVel = 0.18;
    burstParticles(player.x + player.w/2, player.y + player.h/2, '#ff5577', 40);
    // smoke puff
    for (let i = 0; i < 10; i++) {
      particles.push({
        x: player.x + player.w/2,
        y: player.y + player.h/2,
        vx: (Math.random() - 0.5) * 4,
        vy: -1 - Math.random() * 2,
        life: 50 + Math.random() * 20,
        color: '#888aaa',
        size: 4 + Math.random() * 3,
      });
    }
    saveCoins();
    // ponytail: ~12 chars/frame → 10-min run ≈ 450KB; downsample if runs get longer
    try { localStorage.setItem('jj_ghost', JSON.stringify(ghostRec)); } catch (_) {}
    const stageId = currentStage().id;
    const prev = getStageBest(stageId);
    const nb = score > prev;
    if (nb) setStageBest(stageId, score);
    addToTotal(score);
    const oldMult = coinMultiplier;
    const newMult = multiplierForScore(score);
    coinMultiplier = newMult;
    saveMultiplier();
    lastRun = {
      score,
      jumps: stats.jumps,
      doubles: stats.doubles,
      dodged: stats.dodged,
      timeMs: Math.round(stats.runFrames * 1000 / 60),
      maxSpeed: stats.maxSpeed,
      coins: stats.coins,
      stagesCleared: stats.stagesCleared || 0,
      stageName: currentStage().name,
      stageId: currentStage().id,
      stageColor: currentStage().color,
      newBest: nb,
      prevBest: prev,
      multiplier: newMult,
      prevMultiplier: oldMult,
      multiplierChanged: Math.abs(newMult - oldMult) > 0.001,
    };
    // skin collection — shown on game over as a replay goal
    const allSkins = Skins.all();
    const skinsUnlocked = allSkins.filter(s => Skins.isUnlocked(s.id)).length;
    const locked = allSkins.filter(s => !Skins.isUnlocked(s.id));
    lastRun.skinsOwned = skinsUnlocked;
    lastRun.skinsTotal = allSkins.length;
    lastRun.nextSkinCost = locked.length ? Math.min(...locked.map(s => s.cost)) : 0;
    lastRun.coinBalance = coinBalance;
    if (nb) { UI.spawnConfetti(); Sfx.play('newBest'); }
    hint.style.display = 'none';
    // ArcadeDeck.net leaderboard
    try {
      window.parent.postMessage({
        type: 'GAME_OVER',
        score: totalScore,
        subScore: skinsUnlocked
      }, '*');
    } catch (_) {}
  }

  // ---- Update ----
  function update() {
    frame++;
    uiFrame++;
    if (pendingDesignChange) {
      pendingDesignChange = false;
      rebuildBgLayers();
      // discard offscreen-left from new design
      obstacles = obstacles.filter(o => o.x < W + cameraOffX);
      coins = coins.filter(c => c.x < W + cameraOffX);
      if (state !== STATE.PLAY) player.y = GROUND_Y;
    }
    // bg — clouds drift only during PLAY (or READY for ambient feel), frozen on DEAD
    if (state !== STATE.DEAD) {
      const drift = state === STATE.PLAY ? 1 : 0.3;
      for (const c of clouds) {
        c.x -= c.s * drift;
        if (c.x + c.w < -cameraOffX) { c.x = W + cameraOffX + Math.random() * 100; c.y = 60 + Math.random() * 200; }
      }
    }
    // stars twinkle continues regardless (no horizontal motion)
    for (const s of stars) s.tw += 0.05;
    // confetti ticks across all states (spawns during PLAY congrats + DEAD newBest)
    UI.tickConfetti();

    if (state !== STATE.PLAY) {
      // particles still update
      for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--; }
      particles = particles.filter(p => p.life > 0);
      if (shake > 0) shake *= 0.85;
      if (flashAlpha > 0) flashAlpha *= 0.9;
      if (state === STATE.DEAD) {
        deadFrame++;
        // ragdoll physics — bounce + spin until 270°, settle
        const targetRot = 3 * Math.PI / 2;
        if (player.deadRot < targetRot) {
          player.deadRot += player.deadRotVel;
          player.deadRotVel *= 0.97;
          if (player.deadRot >= targetRot) {
            player.deadRot = targetRot;
            player.deadRotVel = 0;
          }
        }
        // bounce
        if (player.y < GROUND_Y) {
          player.vy += GRAVITY;
          player.y += player.vy;
          if (player.y >= GROUND_Y) {
            player.y = GROUND_Y;
            if (Math.abs(player.vy) > 2) {
              player.vy *= -0.45;  // dampened bounce
            } else {
              player.vy = 0;
            }
          }
        }
      }
      return;
    }

    // difficulty ramp (per-stage local progress)
    speed = baseSpeed + Math.min(5, stageScore / 400);
    spawnGap = Math.max(40, 80 - stageScore / 80);

    // unlock threshold = PLATINUM tier (score >= 2550). Banner + confetti once per run.
    // Run continues on SAME stage (no auto-advance). Player picks unlocked stage next run.
    const st = currentStage();
    if (score >= STAGE_UNLOCK_SCORE && !stageCongrats.has(currentStageIdx)) {
      stageCongrats.add(currentStageIdx);
      flashAlpha = 0.6;
      const hasNext = currentStageIdx < stageList.length - 1;
      if (hasNext) {
        const nextStage = stageList[currentStageIdx + 1];
        Stages.unlock(nextStage.id);
        showStageBanner(OneJump.I18N.t('STAGE CLEARED!'), OneJump.I18N.t('UNLOCKED  ▶  {0}', nextStage.name), st.color);
        stats.stagesCleared++;
      } else {
        showStageBanner(OneJump.I18N.t('STAGE MASTERED!'), OneJump.I18N.t('FINAL STAGE COMPLETE'), st.color);
      }
      UI.spawnConfetti();
      Sfx.play('stageClear');
    }

    // player
    player.vy += GRAVITY;
    player.y += player.vy;
    if (player.y >= GROUND_Y) {
      player.y = GROUND_Y;
      player.vy = 0;
      if (!player.onGround) {
        Sfx.play('land');
        burstParticles(player.x + player.w/2, player.y + player.h, '#aac', 6);
      }
      player.onGround = true;
      player.jumps = 0;
    }
    ghostRec.push(Math.round(player.y), player.onGround ? 0 : player.vy < 0 ? 1 : 2);

    // trail
    player.trail.push({ x: player.x + player.w/2, y: player.y + player.h/2, life: 12 });
    for (const t of player.trail) t.life--;
    player.trail = player.trail.filter(t => t.life > 0);

    // obstacles
    spawnTimer++;
    if (spawnTimer >= spawnGap) {
      spawnTimer = 0;
      spawnObstacle();
    }
    const env = obstacleEnv();
    for (const o of obstacles) {
      o.x -= speed;
      Obstacles.update(o, env);
      if (!o.passed && o.x + o.w < player.x) {
        o.passed = true; stats.dodged++;
        // single live toast: back-to-back dodges (doubleSpike, clusters) restart it instead of stacking
        floaters = floaters.filter(f => !f.dodge);
        addFloater(player.x + player.w / 2, player.y - 8, OneJump.I18N.t('DODGE!'), '#7df');
        floaters[floaters.length - 1].dodge = true;
      }
    }
    obstacles = obstacles.filter(o => o.x + o.w > -cameraOffX - 10);

    // collisions
    for (const o of obstacles) {
      if (rectHit(player, Obstacles.hitbox(o))) { die(); break; }
    }

    // coins
    coinSpawnTimer++;
    if (coinSpawnTimer >= coinSpawnGap) {
      coinSpawnTimer = 0;
      coinSpawnGap = 90 + Math.random() * 110;
      const newCoins = Coins.spawn(env);
      for (const c of newCoins) coins.push(c);
    }
    for (const c of coins) {
      c.x -= speed;
      Coins.update(c, env);
    }
    coins = coins.filter(c => c.x + c.w > -cameraOffX - 10 && !c._collected);
    for (const c of coins) {
      if (rectHit(player, Coins.hitbox(c))) {
        c._collected = true;
        const earned = Math.round(c.value * coinMultiplier);
        coinBalance += earned;
        stats.coins += earned;  // persisted in die() / on background — no sync localStorage write mid-run
        Sfx.play('coin');
        burstParticles(c.x + c.w/2, c.y + c.h/2, '#ffd060', 10);
        addFloater(c.x + c.w/2, c.y, '+' + earned, '#ffd060');
      }
    }
    coins = coins.filter(c => !c._collected);

    // floaters update
    for (const f of floaters) {
      f.y += f.vy; f.vy *= 0.96;
      f.age++; f.life--;
    }
    floaters = floaters.filter(f => f.life > 0);

    // stage banner tick
    if (stageBanner) {
      stageBanner.age++;
      stageBanner.life--;
      if (stageBanner.life <= 0) stageBanner = null;
    }
    if (tierBanner) {
      tierBanner.age++;
      tierBanner.life--;
      if (tierBanner.life <= 0) tierBanner = null;
    }

    // particles
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--; }
    particles = particles.filter(p => p.life > 0);

    // score + run stats
    score += 1;
    stageScore += 1;
    worldOffset += speed;
    stats.runFrames++;

    // tier celebration (Platinum and above) — small top-right banner only (no confetti to avoid ambiguity)
    for (const tier of TIER_THRESHOLDS) {
      if (score >= tier.score && !tierCongrats.has(tier.score)) {
        tierCongrats.add(tier.score);
        tierBanner = { label: tier.label, color: tier.color, life: 130, age: 0 };
        if (tier.score > STAGE_UNLOCK_SCORE) Sfx.play('tier');  // 2550 already gets stageClear
      }
    }
    if (speed > stats.maxSpeed) stats.maxSpeed = speed;

    if (shake > 0) shake *= 0.85;
    if (flashAlpha > 0) flashAlpha *= 0.9;
  }

  function rectHit(a, b) {
    // shrink hitbox a bit for forgiveness
    const pad = 4;
    return a.x + pad < b.x + b.w &&
           a.x + a.w - pad > b.x &&
           a.y + pad < b.y + b.h &&
           a.y + a.h - pad > b.y;
  }

  // ---- Draw ----
  function draw() {
    // clear full raster + paint extended sky so letterbox feels seamless
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (!grads) grads = buildGrads();
    ctx.fillStyle = grads.fullSky;
    ctx.fillRect(0, 0, cvs.width, cvs.height);

    ctx.save();
    // camera: design space → viewport (cover scale)
    ctx.scale(cameraScale, cameraScale);
    ctx.translate(cameraOffX, cameraOffY);
    if (shake > 0.5) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawBackground();
    drawGround();

    // trail — tinted by active skin's aura
    const [tr, tg, tb] = Skins.active().aura.rgb;
    for (const t of player.trail) {
      const a = t.life / 12 * 0.4;
      ctx.fillStyle = `rgba(${tr},${tg},${tb},${a})`;
      ctx.beginPath(); ctx.arc(t.x, t.y, 6 * (t.life / 12), 0, Math.PI * 2); ctx.fill();
    }

    // obstacles
    {
      const env = obstacleEnv();
      for (const o of obstacles) Obstacles.draw(ctx, o, env);
      for (const c of coins) Coins.draw(ctx, c, env);
    }

    // player (READY: start-screen preview is the character; skip duplicate behind panel)
    if (state === STATE.PLAY) drawGhost();
    if (state !== STATE.READY) drawPlayer();

    // particles
    for (const p of particles) {
      const a = Math.max(0, p.life / 36);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = a;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // floaters (coin pickups etc.)
    for (const f of floaters) {
      const a = Math.min(1, f.life / 30);
      const scale = 1 + Math.min(0.3, f.age / 10);
      ctx.fillStyle = '#000';
      ctx.globalAlpha = a * 0.6;
      ctx.font = `bold ${Math.floor(10 * scale)}px monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x + 1, f.y + 1);
      ctx.fillStyle = f.color;
      ctx.globalAlpha = a;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    // flash
    if (flashAlpha > 0.01) {
      ctx.fillStyle = `rgba(255,80,100,${flashAlpha})`;
      ctx.fillRect(-cameraOffX, -cameraOffY, W + 2 * cameraOffX, H + 2 * cameraOffY);
    }

    // confetti (PLAY congrats + DEAD newBest both draw it; gameOver overlay also calls)
    if (state === STATE.PLAY) UI.drawConfetti();

    // unified HUD — only during PLAY
    if (state === STATE.PLAY) UI.drawPlayHud();

    // stage banner overlay (during play / brief moment)
    if (stageBanner) UI.drawStageBanner(stageBanner);
    // tier banner — small, non-blocking, top-right
    if (tierBanner) UI.drawTierBanner(tierBanner);

    if (state === STATE.READY) {
      UI.drawStartScreen();
    } else if (state === STATE.DEAD) {
      UI.drawGameOver();
    }

    ctx.restore();
  }

  // Static gradients depend only on canvas/design size → built once per resize, not per frame.
  function buildGrads() {
    const lin = (x0, y0, x1, y1, stops) => {
      const g = ctx.createLinearGradient(x0, y0, x1, y1);
      for (const [o, c] of stops) g.addColorStop(o, c);
      return g;
    };
    const groundTop = GROUND_Y + player.h;
    const neb = ctx.createRadialGradient(W * 0.7, 120, 30, W * 0.7, 120, 260);
    neb.addColorStop(0, 'rgba(180,80,200,0.18)');
    neb.addColorStop(1, 'rgba(180,80,200,0)');
    return {
      fullSky: lin(0, 0, 0, cvs.height, [[0, '#0d1230'], [0.5, '#1a2552'], [1, '#0a0818']]),
      sky: lin(0, 0, 0, GROUND_Y, [[0, '#0d1230'], [0.5, '#1a2552'], [1, '#3a3070']]),
      neb,
      horizon: lin(0, GROUND_Y - 30, 0, groundTop,
        [[0, 'rgba(255,150,200,0)'], [0.7, 'rgba(255,120,180,0.25)'], [1, 'rgba(180,60,120,0.4)']]),
      edge: lin(0, groundTop - 4, 0, groundTop + 6,
        [[0, 'rgba(255,160,210,0)'], [0.5, 'rgba(255,160,210,0.7)'], [1, 'rgba(120,100,180,0.3)']]),
      ground: lin(0, groundTop, 0, H, [[0, '#1a1830'], [0.4, '#252040'], [1, '#0a0818']]),
    };
  }

  // ---- Background ----
  function drawBackground() {
    // sky gradient
    // bg spans full visible width: design rect + letterbox bands (cameraOffX each side)
    const X0 = -cameraOffX, VW = W + 2 * cameraOffX;
    ctx.fillStyle = grads.sky;
    ctx.fillRect(X0, 0, VW, GROUND_Y + player.h);

    // distant nebula glow
    ctx.fillStyle = grads.neb;
    ctx.fillRect(X0, 0, VW, GROUND_Y);

    // stage-tinted atmosphere: nebula wash behind moon, faint left cloud, horizon bloom
    const stage = bgStage();
    if (grads.stageId !== stage.id) {
      const c = hexRgb(stage.color);
      const rad = (x, y, r, a) => {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, rgbaStr(c, a)); g.addColorStop(0.5, rgbaStr(c, a * 0.35)); g.addColorStop(1, rgbaStr(c, 0));
        return g;
      };
      grads.stageId = stage.id;
      grads.tintNeb = rad(W - 80, 100, W * 0.55, 0.16);
      grads.tintNeb2 = rad(W * 0.15, GROUND_Y * 0.3, W * 0.4, 0.07);
      grads.tintHorizon = rad(W * 0.5, GROUND_Y + 40, W * 0.75, 0.2);
    }
    ctx.fillStyle = grads.tintNeb;  ctx.fillRect(X0, 0, VW, GROUND_Y + player.h);
    ctx.fillStyle = grads.tintNeb2; ctx.fillRect(X0, 0, VW, GROUND_Y);
    ctx.fillStyle = grads.tintHorizon; ctx.fillRect(X0, GROUND_Y - W * 0.75 + 40, VW, W * 0.75 + player.h);

    // stars
    for (const s of stars) {
      const a = 0.4 + Math.sin(s.tw) * 0.5;
      ctx.fillStyle = s.hue;
      ctx.globalAlpha = a;
      ctx.fillRect(s.x, s.y, s.r, s.r);
      // bright stars get tiny cross sparkle
      if (s.r > 1.2 && a > 0.8) {
        ctx.fillRect(s.x - 1, s.y + s.r/2 - 0.5, s.r + 2, 1);
        ctx.fillRect(s.x + s.r/2 - 0.5, s.y - 1, 1, s.r + 2);
      }
    }
    ctx.globalAlpha = 1;

    // shooting star — deterministic from uiFrame (no state), one streak every ~7s
    {
      const PERIOD = 420, LIFE = 36;
      const cyc = Math.floor(uiFrame / PERIOD), k = uiFrame % PERIOD;
      if (k < LIFE) {
        const rnd = (n) => { const v = Math.sin(cyc * 127.1 + n * 311.7) * 43758.5453; return v - Math.floor(v); };
        const p = k / LIFE;
        const sx = W * (0.25 + rnd(1) * 0.6), sy = 30 + rnd(2) * GROUND_Y * 0.3;
        const len = 70 + rnd(3) * 50;
        const hx = sx - p * 160, hy = sy + p * 70;           // head travels down-left
        const tx = hx + len * 0.92 * (1 - p * 0.4), ty = hy - len * 0.4 * (1 - p * 0.4);
        const a = Math.sin(p * Math.PI);
        const g = ctx.createLinearGradient(hx, hy, tx, ty);
        g.addColorStop(0, `rgba(255,255,255,${0.9 * a})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = g; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty); ctx.stroke();
        ctx.lineCap = 'butt';
      }
    }

    // mountain layers (parallax, far to near)
    // tiles span wider than visible → clip vertically to design rect
    ctx.save();
    ctx.beginPath(); ctx.rect(X0, 0, VW, H); ctx.clip();
    const tiles = bgTilesFor(stage);
    mountains.forEach((layer, i) => drawMountainLayer(layer, tiles.mtn[i]));

    // city silhouette
    drawCitySilhouette(tiles.city);
    ctx.restore();

    // clouds — layered: bottom shadow, body w/ radial soft edges, top highlight
    for (const c of clouds) drawCloud(c);

    // stage-specific moon — drawn after mountains/clouds so nothing in the bg covers it
    drawStageMoon();

    // horizon glow strip
    ctx.fillStyle = grads.horizon;
    ctx.fillRect(X0, GROUND_Y - 30, VW, 30 + player.h);
  }

  // ---- Stage-specific moon ----
  function drawStageMoon() {
    const moonX = W - 80, moonY = 100, moonR = 36;
    const id = bgStage().id;
    const t = uiFrame * 0.02;
    if (state === STATE.READY) {
      hits.moon = { x: moonX - moonR, y: moonY - moonR, w: moonR * 2, h: moonR * 2 };
    } else {
      hits.moon = null;
    }
    switch (id) {
      case 'twilight': drawBloodMoon(moonX, moonY, moonR); break;
      case 'storm':    drawStormMoon(moonX, moonY, moonR, t); break;
      case 'inferno':  drawInfernoMoon(moonX, moonY, moonR, t); break;
      case 'void':     drawVoidEclipseMoon(moonX, moonY, moonR, t); break;
      case 'aurora':   drawAuroraMoon(moonX, moonY, moonR, t); break;
      case 'nexus':    drawNexusMoon(moonX, moonY, moonR, t); break;
      case 'abyss':    drawAbyssMoon(moonX, moonY, moonR, t); break;
      case 'mirage':   drawMirageMoon(moonX, moonY, moonR, t); break;
      case 'chronos':   drawChronosMoon(moonX, moonY, moonR, t); break;
      case 'grove':     drawGroveMoon(moonX, moonY, moonR, t); break;
      case 'crystal':   drawCrystalMoon(moonX, moonY, moonR, t); break;
      case 'cathedral': drawCathedralMoon(moonX, moonY, moonR, t); break;
      case 'genesis':   drawGenesisMoon(moonX, moonY, moonR, t); break;
      default:          drawBloodMoon(moonX, moonY, moonR);
    }
    if (state === STATE.PLAY) drawMoonMe(moonX, moonY - moonR + 1);
  }

  // Tiny "me" on top of the moon — idle, hops while cheering (~every 12–24s, ~2.5s).
  const MOON_ME_SCALE = 0.3;
  const CHEERS = ['GO GO GO!', 'YOU GOT THIS!', 'NICE JUMP!', 'KEEP GOING!', 'SO FAST!', "DON'T STOP!", 'FIGHTING!'];
  const CHEER_LEN = 150;
  let cheerText = null, cheerAt = 0, cheerNext = 0;
  function drawMoonMe(cx, feet) {
    if (!cheerNext) cheerNext = uiFrame + 720 + Math.random() * 720;
    if (uiFrame >= cheerNext) {
      cheerText = OneJump.I18N.t(CHEERS[Math.floor(Math.random() * CHEERS.length)]);
      cheerAt = uiFrame;
      cheerNext = uiFrame + 720 + Math.random() * 720;
    }
    const age = uiFrame - cheerAt;
    const cheering = cheerText && age <= CHEER_LEN;
    const k = MOON_ME_SCALE, s = PLAYER_SCALE * k;
    const lift = cheering ? -Math.abs(Math.sin(age * Math.PI / 18)) * 7 : 0;  // hop every 18 frames
    const x = cx - player.w * k / 2;
    const y = feet - player.h * k;
    ctx.fillStyle = `rgba(0,0,0,${0.35 * (1 + lift / 14)})`;
    ctx.beginPath(); ctx.ellipse(cx, feet, player.w * k / 2, 1.5, 0, 0, Math.PI * 2); ctx.fill();
    const spr = lift < -1 ? sprites.jump : sprites.idle[Math.floor(uiFrame / 6) % sprites.idle.length];
    ctx.drawImage(spr, x - SPR_OFFX * s, y + lift - SPR_OFFY * s, 72 * s, 80 * s);
    if (cheering) drawMoonCheer(cx, y, age);
  }

  function drawMoonCheer(cx, headY, age) {
    const pop = Math.min(1, age / 8), fade = Math.min(1, (CHEER_LEN - age) / 15);
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.font = 'bold 8px monospace';
    const tw = ctx.measureText(cheerText).width;
    const bw = tw + 14, bh = 16;
    const bx = cx - bw / 2 - 14, by = headY - bh / 2 - 12 - Math.sin(age * 0.15) * 1;
    ctx.translate(bx, by); ctx.scale(pop, pop);
    // cloud = row of puffs over a body + 2 trailing puffs toward the head
    const puffs = [[0, 0, bh / 2 + 1]];
    for (let i = 0, n = Math.max(2, Math.round(bw / 12)); i <= n; i++) {
      const px = -bw / 2 + 4 + (bw - 8) * i / n;
      puffs.push([px, -bh / 2 + 3 - (i % 2) * 2, 6], [px, bh / 2 - 3 + (i % 2) * 1.5, 5.5]);
    }
    puffs.push([bw / 2 - 4, 0, 6], [-bw / 2 + 4, 0, 6], [bw / 2 + 3, bh / 2 + 5, 2.5], [bw / 2 + 8, bh / 2 + 9, 1.5]);
    const body = () => { ctx.beginPath(); ctx.roundRect(-bw / 2 + 2, -bh / 2 + 2, bw - 4, bh - 4, 5); for (const [x, y, r] of puffs) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); } };
    body(); ctx.strokeStyle = '#1a1030'; ctx.lineWidth = 3; ctx.stroke();  // outline = stroke under fill
    body(); ctx.fillStyle = '#fffaf0'; ctx.fill();
    ctx.fillStyle = '#ff5a8a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(cheerText, 0, 0.5);
    ctx.restore();
  }

  function drawBloodMoon(mx, my, mr) {
    const corona = ctx.createRadialGradient(mx, my, mr, mx, my, mr * 3);
    corona.addColorStop(0, 'rgba(255,80,40,0.18)');
    corona.addColorStop(0.5, 'rgba(180,40,20,0.08)');
    corona.addColorStop(1, 'rgba(180,40,20,0)');
    ctx.fillStyle = corona;
    ctx.beginPath(); ctx.arc(mx, my, mr * 3, 0, Math.PI*2); ctx.fill();
    const ring = ctx.createRadialGradient(mx, my, mr * 0.95, mx, my, mr * 1.4);
    ring.addColorStop(0, 'rgba(255,120,60,0.55)');
    ring.addColorStop(1, 'rgba(255,120,60,0)');
    ctx.fillStyle = ring;
    ctx.beginPath(); ctx.arc(mx, my, mr * 1.4, 0, Math.PI*2); ctx.fill();
    const disc = ctx.createRadialGradient(mx - mr*0.2, my - mr*0.2, mr*0.1, mx, my, mr);
    disc.addColorStop(0, '#d04a30'); disc.addColorStop(0.5, '#8a2616'); disc.addColorStop(1, '#3a0c08');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,140,60,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mx, my, mr - 1, 0, Math.PI*2); ctx.stroke();
    drawCraters(mx, my, [[-14,4,4],[-8,18,3],[-18,-8,3],[6,-12,2],[14,6,3],[-2,-2,2]], 'rgba(40,8,4,0.7)', 'rgba(255,120,60,0.3)');
    moonSurface(mx, my, mr, 'rock', 1);
    const flare = ctx.createLinearGradient(mx - mr*2.5, my, mx + mr*2.5, my);
    flare.addColorStop(0, 'rgba(255,80,40,0)');
    flare.addColorStop(0.45, 'rgba(255,140,80,0.18)');
    flare.addColorStop(0.5, 'rgba(255,180,120,0.32)');
    flare.addColorStop(0.55, 'rgba(255,140,80,0.18)');
    flare.addColorStop(1, 'rgba(255,80,40,0)');
    ctx.fillStyle = flare;
    ctx.fillRect(mx - mr * 2.5, my - 1, mr * 5, 2);
  }

  function drawCraters(mx, my, list, color, hi) {
    for (const [dx, dy, cr] of list) {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(mx + dx, my + dy, cr, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = hi;
      ctx.beginPath(); ctx.arc(mx + dx - cr*0.4, my + dy - cr*0.4, cr*0.4, 0, Math.PI*2); ctx.fill();
    }
  }

  // Shared surface pass for celestial bodies — baked once per (kind, radius), drawn clipped to disc.
  //  rock  : maria + small craters + speckle, sphere shading, lit rim (light from upper-left)
  //  star  : granulation + sunspot, limb darkening (no terminator — self-lit)
  //  gas   : sphere shading + rim
  //  face  : soft shading + specular (clock / rose window stay legible)
  //  glass : shading + specular + rim
  const moonSurfCache = new Map();
  function moonSurface(mx, my, mr, kind, seed) {
    const key = kind + ':' + mr + ':' + seed;
    let img = moonSurfCache.get(key);
    if (!img) { img = bakeMoonSurface(mr, kind, seed); moonSurfCache.set(key, img); }
    ctx.drawImage(img, mx - mr, my - mr, mr * 2, mr * 2);
  }
  function bakeMoonSurface(mr, kind, seed) {
    const S = 4;  // camera can scale design ~3x on large screens
    const cv = document.createElement('canvas');
    cv.width = cv.height = Math.ceil(mr * 2 * S);
    const g = cv.getContext('2d');
    g.scale(S, S); g.translate(mr, mr);
    let sd = seed * 9301 + 49297;
    const rnd = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
    const soft = (x, y, r, c0, c1) => {
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, c0); rg.addColorStop(1, c1);
      g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    };
    if (kind === 'rock') {
      for (let i = 0; i < 7; i++) {  // maria
        const a = rnd() * Math.PI * 2, d = rnd() * mr * 0.65;
        soft(Math.cos(a) * d, Math.sin(a) * d, mr * (0.22 + rnd() * 0.3), 'rgba(10,6,20,0.38)', 'rgba(10,6,20,0)');
      }
      for (let i = 0; i < 16; i++) {  // craters: dark bowl + lit lower-right lip
        const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * mr * 0.85, r = 0.8 + rnd() * 2.6;
        const x = Math.cos(a) * d, y = Math.sin(a) * d;
        g.fillStyle = 'rgba(10,6,20,0.35)';
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
        g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 0.7;
        g.beginPath(); g.arc(x, y, r, -0.2, Math.PI * 0.7); g.stroke();
      }
      for (let i = 0; i < 140; i++) {  // regolith speckle
        const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * mr;
        g.fillStyle = rnd() < 0.5 ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.08)';
        g.fillRect(Math.cos(a) * d, Math.sin(a) * d, 0.7, 0.7);
      }
    } else if (kind === 'star') {
      for (let i = 0; i < 170; i++) {  // granulation
        const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * mr * 0.95;
        soft(Math.cos(a) * d, Math.sin(a) * d, 1.2 + rnd() * 2.2, 'rgba(255,255,210,0.18)', 'rgba(255,255,210,0)');
      }
      const sx = mr * 0.25, sy = mr * 0.3;  // sunspot w/ penumbra
      soft(sx, sy, 4.5, 'rgba(90,20,0,0.35)', 'rgba(90,20,0,0)');
      g.fillStyle = 'rgba(60,10,0,0.55)'; g.beginPath(); g.arc(sx, sy, 1.6, 0, Math.PI * 2); g.fill();
    }
    const L = -0.5;  // light dir: upper-left (unit-ish, in mr units)
    if (kind === 'star') {
      // self-lit: strong limb darkening + hot spot nudged toward viewer-light → reads as a ball, not a disc
      const limb = g.createRadialGradient(L * mr * 0.3, L * mr * 0.3, 0, 0, 0, mr);
      limb.addColorStop(0, 'rgba(255,255,235,0.45)');
      limb.addColorStop(0.55, 'rgba(255,210,130,0)');
      limb.addColorStop(0.85, 'rgba(160,40,0,0.25)');
      limb.addColorStop(1, 'rgba(90,10,0,0.7)');
      g.fillStyle = limb; g.fillRect(-mr, -mr, mr * 2, mr * 2);
    } else {
      const soft3d = kind === 'face' || kind === 'glass';
      // 1) diffuse falloff centered on light point
      const diff = g.createRadialGradient(L * mr, L * mr, 0, L * mr * 0.6, L * mr * 0.6, mr * 1.7);
      diff.addColorStop(0, 'rgba(255,255,255,0.18)');
      diff.addColorStop(0.35, 'rgba(8,6,24,0)');
      diff.addColorStop(1, `rgba(8,6,24,${soft3d ? 0.25 : 0.38})`);
      g.fillStyle = diff; g.fillRect(-mr, -mr, mr * 2, mr * 2);
      // 2) terminator: soft-edged night side on lower-right
      const term = g.createRadialGradient(L * mr, L * mr, mr * 0.85, L * mr, L * mr, mr * 1.8);
      term.addColorStop(0, 'rgba(6,4,18,0)');
      term.addColorStop(0.3, `rgba(6,4,18,${soft3d ? 0.32 : 0.55})`);
      term.addColorStop(1, `rgba(6,4,18,${soft3d ? 0.5 : 0.82})`);
      g.fillStyle = term; g.fillRect(-mr, -mr, mr * 2, mr * 2);
      // 3) reflected sky light on the dark limb (bounce) — separates night side from the sky
      g.lineWidth = 1.6;
      for (let i = 0; i < 10; i++) {
        const a0 = Math.PI * (-0.15 + i * 0.07);
        g.strokeStyle = `rgba(150,170,255,${0.28 * Math.sin((i + 0.5) / 10 * Math.PI)})`;
        g.beginPath(); g.arc(0, 0, mr - 1, a0, a0 + Math.PI * 0.075); g.stroke();
      }
      // 4) specular: tight for glass/face, broad + faint for rock/gas
      soft(L * mr * 0.9, L * mr * 0.9, mr * (soft3d ? 0.32 : 0.5), `rgba(255,255,255,${soft3d ? 0.5 : 0.16})`, 'rgba(255,255,255,0)');
      if (soft3d) soft(L * mr * 0.9, L * mr * 0.9, mr * 0.09, 'rgba(255,255,255,0.8)', 'rgba(255,255,255,0)');
      // 5) lit rim, fading along the limb
      if (kind !== 'face') {
        g.lineWidth = 1.5;
        for (let i = 0; i < 12; i++) {
          const a0 = Math.PI * (0.8 + i * 0.07);
          g.strokeStyle = `rgba(255,255,255,${0.7 * Math.sin((i + 0.5) / 12 * Math.PI)})`;
          g.beginPath(); g.arc(0, 0, mr - 0.8, a0, a0 + Math.PI * 0.075); g.stroke();
        }
      }
    }
    g.globalCompositeOperation = 'destination-in';  // clip everything to disc (opaque mask!)
    g.fillStyle = '#000';
    g.beginPath(); g.arc(0, 0, mr, 0, Math.PI * 2); g.fill();
    return cv;
  }

  // Tapered radial beams (wide at limb, fading to a point). len(i) → beam length past the limb.
  function drawSunRays(mx, my, mr, n, rot, len, halfW, rgb) {
    const [r, g, b] = rgb;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rot;
      const L = mr + len(i);
      const x0 = mx + Math.cos(a) * mr * 0.9, y0 = my + Math.sin(a) * mr * 0.9;
      const grd = ctx.createLinearGradient(x0, y0, mx + Math.cos(a) * L, my + Math.sin(a) * L);
      grd.addColorStop(0, `rgba(${r},${g},${b},0.75)`);
      grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(mx + Math.cos(a - halfW) * mr * 0.9, my + Math.sin(a - halfW) * mr * 0.9);
      ctx.lineTo(mx + Math.cos(a) * L, my + Math.sin(a) * L);
      ctx.lineTo(mx + Math.cos(a + halfW) * mr * 0.9, my + Math.sin(a + halfW) * mr * 0.9);
      ctx.closePath(); ctx.fill();
    }
  }
  // Banded ring arc (a0→a1 half of the ellipse), outer→inner bands w/ Cassini-style gap.
  function drawPlanetRings(mx, my, mr, a0, a1, alpha) {
    const bands = [[1.78, 2, 'rgba(200,180,140,'], [1.66, 3, 'rgba(255,232,185,'], [1.52, 1, 'rgba(120,100,80,'], [1.42, 3.5, 'rgba(235,210,160,'], [1.3, 1.5, 'rgba(190,170,130,']];
    for (const [k, w, c] of bands) {
      ctx.strokeStyle = c + (alpha * 0.85) + ')';
      ctx.lineWidth = w;
      ctx.beginPath(); ctx.ellipse(mx, my, mr * k, mr * k * 0.25, -0.12, a0, a1); ctx.stroke();
    }
  }

  // STORM — pale moon obscured by drifting cloud strips + lightning flicker
  function drawStormMoon(mx, my, mr, t) {
    const halo = ctx.createRadialGradient(mx, my, mr, mx, my, mr * 2.5);
    halo.addColorStop(0, 'rgba(180,200,240,0.25)');
    halo.addColorStop(1, 'rgba(80,90,120,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(mx, my, mr * 2.5, 0, Math.PI*2); ctx.fill();
    // disc
    const disc = ctx.createRadialGradient(mx - mr*0.3, my - mr*0.3, mr*0.1, mx, my, mr);
    disc.addColorStop(0, '#e8eef8'); disc.addColorStop(0.6, '#a0b0c8'); disc.addColorStop(1, '#404858');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    drawCraters(mx, my, [[-12,6,3],[8,-8,2.5],[4,12,2]], 'rgba(50,60,80,0.5)', 'rgba(255,255,255,0.3)');
    moonSurface(mx, my, mr, 'rock', 2);
    // cloud strips drifting across
    ctx.save();
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.clip();
    const drift = (t * 6) % (mr * 4) - mr * 2;
    for (let i = 0; i < 3; i++) {
      const sy = my - mr * 0.6 + i * mr * 0.6;
      ctx.fillStyle = `rgba(60,70,90,${0.5 - i * 0.1})`;
      ctx.beginPath();
      ctx.ellipse(mx + drift + i * 18, sy, mr * 0.8, mr * 0.18, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
    // lightning flicker behind
    if ((Math.floor(t * 8) % 31) === 0) {
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(mx - mr * 1.3, my - mr * 1.2);
      ctx.lineTo(mx - mr * 0.6, my - mr * 0.4);
      ctx.lineTo(mx - mr * 1.0, my);
      ctx.stroke();
    }
  }

  // INFERNO — blazing red sun
  function drawInfernoMoon(mx, my, mr, t) {
    const corona = ctx.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 3.2);
    corona.addColorStop(0, 'rgba(255,160,40,0.4)');
    corona.addColorStop(0.5, 'rgba(255,80,20,0.15)');
    corona.addColorStop(1, 'rgba(180,40,0,0)');
    ctx.fillStyle = corona;
    ctx.beginPath(); ctx.arc(mx, my, mr * 3.2, 0, Math.PI*2); ctx.fill();
    // solar flares — tapered flame tongues, lengths flicker independently
    drawSunRays(mx, my, mr, 12, t * 0.5, (i) => mr * (0.35 + 0.25 * Math.abs(Math.sin(t * 1.7 + i * 2.3))), 0.2, [255, 170, 50]);
    // disc — molten
    const disc = ctx.createRadialGradient(mx - mr*0.3, my - mr*0.3, mr*0.2, mx, my, mr);
    disc.addColorStop(0, '#fff8a0'); disc.addColorStop(0.4, '#ff8030'); disc.addColorStop(1, '#a01010');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    // boiling spots
    for (let i = 0; i < 5; i++) {
      const a = i * 1.3 + t * 0.6;
      const sx = mx + Math.cos(a) * mr * 0.55;
      const sy = my + Math.sin(a) * mr * 0.4;
      ctx.fillStyle = `rgba(255,230,120,${0.25 + Math.sin(t * 3 + i) * 0.15})`;
      ctx.beginPath(); ctx.arc(sx, sy, 3.5, 0, Math.PI*2); ctx.fill();
    }
    moonSurface(mx, my, mr, 'star', 3);
  }

  // VOID — total eclipse: black disc, glowing white ring
  function drawVoidEclipseMoon(mx, my, mr, t) {
    const corona = ctx.createRadialGradient(mx, my, mr, mx, my, mr * 2.6);
    corona.addColorStop(0, 'rgba(255,255,255,0.5)');
    corona.addColorStop(0.4, 'rgba(180,160,255,0.2)');
    corona.addColorStop(1, 'rgba(80,40,160,0)');
    ctx.fillStyle = corona;
    ctx.beginPath(); ctx.arc(mx, my, mr * 2.6, 0, Math.PI*2); ctx.fill();
    // coronal streamers — fixed pseudo-random lengths, slow breathing
    ctx.lineCap = 'round';
    for (let i = 0; i < 28; i++) {
      const a = (i / 28) * Math.PI * 2 + Math.sin(i * 7.3) * 0.12;
      const len = mr * (1.25 + ((i * 37) % 11) / 11 * 0.9 + Math.sin(t + i) * 0.06);
      const sg = ctx.createLinearGradient(mx + Math.cos(a) * mr, my + Math.sin(a) * mr, mx + Math.cos(a) * len, my + Math.sin(a) * len);
      sg.addColorStop(0, 'rgba(235,225,255,0.4)'); sg.addColorStop(1, 'rgba(160,130,255,0)');
      ctx.strokeStyle = sg; ctx.lineWidth = 1 + (i % 3) * 0.6;
      ctx.beginPath(); ctx.moveTo(mx + Math.cos(a) * mr, my + Math.sin(a) * mr); ctx.lineTo(mx + Math.cos(a) * len, my + Math.sin(a) * len); ctx.stroke();
    }
    ctx.lineCap = 'butt';
    // bright ring
    ctx.strokeStyle = `rgba(255,255,255,${0.7 + Math.sin(t * 2) * 0.2})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(mx, my, mr * 1.05, 0, Math.PI*2); ctx.stroke();
    // black disc
    const vd = ctx.createRadialGradient(mx - mr * 0.35, my - mr * 0.35, 0, mx, my, mr);
    vd.addColorStop(0, '#1a1030'); vd.addColorStop(0.6, '#07030f'); vd.addColorStop(1, '#010004');
    ctx.fillStyle = vd;  // faint earthshine → dark sphere, not a hole
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    // diamond ring — bright spot at one point
    const beadAngle = t * 1.5;
    const bx = mx + Math.cos(beadAngle) * mr * 1.05;
    const by = my + Math.sin(beadAngle) * mr * 1.05;
    const bead = ctx.createRadialGradient(bx, by, 0.5, bx, by, 6);
    bead.addColorStop(0, '#fff'); bead.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = bead;
    ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI*2); ctx.fill();
  }

  // AURORA — full white moon w/ aurora ribbons
  function drawAuroraMoon(mx, my, mr, t) {
    const halo = ctx.createRadialGradient(mx, my, mr, mx, my, mr * 2.4);
    halo.addColorStop(0, 'rgba(160,255,200,0.3)');
    halo.addColorStop(0.5, 'rgba(120,180,255,0.18)');
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(mx, my, mr * 2.4, 0, Math.PI*2); ctx.fill();
    // aurora ribbon behind
    ctx.save();
    ctx.globalAlpha = 0.55;
    for (let i = 0; i < 3; i++) {
      const ribY = my + Math.sin(t + i) * 6;
      const rg = ctx.createLinearGradient(mx - mr * 2, ribY, mx + mr * 2, ribY);
      rg.addColorStop(0, 'rgba(80,255,180,0)');
      rg.addColorStop(0.4, 'rgba(80,255,180,0.5)');
      rg.addColorStop(0.6, 'rgba(140,180,255,0.5)');
      rg.addColorStop(1, 'rgba(140,180,255,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(mx - mr * 2, ribY);
      ctx.quadraticCurveTo(mx, ribY - 8 - i * 4, mx + mr * 2, ribY);
      ctx.lineTo(mx + mr * 2, ribY + 3);
      ctx.quadraticCurveTo(mx, ribY - 5 - i * 4, mx - mr * 2, ribY + 3);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // disc
    const disc = ctx.createRadialGradient(mx - mr*0.3, my - mr*0.3, mr*0.1, mx, my, mr);
    disc.addColorStop(0, '#ffffff'); disc.addColorStop(0.6, '#dde8f8'); disc.addColorStop(1, '#809cb8');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    drawCraters(mx, my, [[-12,6,4],[8,-10,3],[14,8,2.5],[-4,-12,2]], 'rgba(80,100,140,0.5)', 'rgba(255,255,255,0.4)');
    moonSurface(mx, my, mr, 'rock', 5);
  }

  // NEXUS — cyber wireframe moon
  function drawNexusMoon(mx, my, mr, t) {
    const halo = ctx.createRadialGradient(mx, my, mr, mx, my, mr * 2.3);
    halo.addColorStop(0, 'rgba(255,80,200,0.35)');
    halo.addColorStop(1, 'rgba(120,0,180,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(mx, my, mr * 2.3, 0, Math.PI*2); ctx.fill();
    // bg disc
    const disc = ctx.createRadialGradient(mx, my, mr * 0.2, mx, my, mr);
    disc.addColorStop(0, '#1a0a30'); disc.addColorStop(1, '#08001a');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    // wireframe meridians (rotating)
    ctx.strokeStyle = `rgba(120,255,240,${0.55 + Math.sin(t * 3) * 0.2})`;
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 6; i++) {
      const phase = t * 0.4 + i * (Math.PI / 6);
      const w = Math.abs(Math.cos(phase)) * mr;
      ctx.beginPath();
      ctx.ellipse(mx, my, w, mr, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    // latitudes
    ctx.strokeStyle = 'rgba(255,80,200,0.45)';
    for (let i = -2; i <= 2; i++) {
      const yy = my + (i / 3) * mr;
      const w = Math.sqrt(Math.max(0, mr * mr - (yy - my) * (yy - my)));
      ctx.beginPath();
      ctx.moveTo(mx - w, yy); ctx.lineTo(mx + w, yy);
      ctx.stroke();
    }
    moonSurface(mx, my, mr, 'glass', 6);
    // ring outline
    ctx.strokeStyle = '#80f0ff';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.stroke();
    // pulse pixel
    for (let i = 0; i < 3; i++) {
      const a = t * 2 + i * 2.1;
      const px = mx + Math.cos(a) * mr * 0.7;
      const py = my + Math.sin(a) * mr * 0.7;
      ctx.fillStyle = '#80f0ff';
      ctx.fillRect(px - 1, py - 1, 2, 2);
    }
  }

  // ABYSS — underwater moon w/ wavy refraction
  function drawAbyssMoon(mx, my, mr, t) {
    const halo = ctx.createRadialGradient(mx, my, mr, mx, my, mr * 2.4);
    halo.addColorStop(0, 'rgba(120,220,255,0.28)');
    halo.addColorStop(1, 'rgba(40,80,140,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(mx, my, mr * 2.4, 0, Math.PI*2); ctx.fill();
    // wavy refraction ripples
    ctx.strokeStyle = 'rgba(160,240,255,0.4)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      const r = mr * (1.2 + i * 0.25);
      const offY = Math.sin(t + i) * 3;
      ctx.beginPath();
      ctx.ellipse(mx, my + offY, r, r * 0.85, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    // disc
    const disc = ctx.createRadialGradient(mx - mr*0.3, my - mr*0.3, mr*0.15, mx, my, mr);
    disc.addColorStop(0, '#e8fbff'); disc.addColorStop(0.5, '#80c8e8'); disc.addColorStop(1, '#1a4870');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    drawCraters(mx, my, [[-10,8,3],[12,-6,2.5],[6,14,2]], 'rgba(20,60,100,0.55)', 'rgba(220,240,255,0.4)');
    moonSurface(mx, my, mr, 'rock', 7);
    // bubble streams
    for (let i = 0; i < 4; i++) {
      const a = t * 0.8 + i * 1.5;
      const bx = mx + Math.cos(a) * mr * 1.4;
      const by = my + Math.sin(a) * mr * 0.9;
      ctx.fillStyle = 'rgba(220,250,255,0.6)';
      ctx.beginPath(); ctx.arc(bx, by, 1.5, 0, Math.PI*2); ctx.fill();
    }
  }

  // MIRAGE — desert sun (hot bright yellow w/ heat shimmer)
  function drawMirageMoon(mx, my, mr, t) {
    const corona = ctx.createRadialGradient(mx, my, mr * 0.9, mx, my, mr * 3);
    corona.addColorStop(0, 'rgba(255,220,140,0.55)');
    corona.addColorStop(0.5, 'rgba(255,180,80,0.2)');
    corona.addColorStop(1, 'rgba(255,160,80,0)');
    ctx.fillStyle = corona;
    ctx.beginPath(); ctx.arc(mx, my, mr * 3, 0, Math.PI*2); ctx.fill();
    // ray spikes — long/short alternating tapered beams
    drawSunRays(mx, my, mr, 16, t * 0.15, (i) => mr * (i % 2 ? 0.45 : 0.85) * (1 + Math.sin(t * 2 + i) * 0.06), 0.09, [255, 230, 150]);
    // disc — bright sun
    const disc = ctx.createRadialGradient(mx, my, mr * 0.1, mx, my, mr);
    disc.addColorStop(0, '#ffffe0'); disc.addColorStop(0.6, '#ffd060'); disc.addColorStop(1, '#c07020');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    moonSurface(mx, my, mr, 'star', 8);
    // heat shimmer line below
    ctx.strokeStyle = 'rgba(255,200,120,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = -2; i <= 2; i++) {
      const sx = mx + i * 6;
      const sy = my + mr * 1.6 + Math.sin(t * 4 + i) * 2;
      if (i === -2) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }

  // CHRONOS — clock-face moon w/ rotating hands
  function drawChronosMoon(mx, my, mr, t) {
    const halo = ctx.createRadialGradient(mx, my, mr, mx, my, mr * 2.2);
    halo.addColorStop(0, 'rgba(200,210,240,0.3)');
    halo.addColorStop(1, 'rgba(100,100,140,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(mx, my, mr * 2.2, 0, Math.PI*2); ctx.fill();
    // disc — ivory clock face
    const disc = ctx.createRadialGradient(mx - mr*0.3, my - mr*0.3, mr*0.1, mx, my, mr);
    disc.addColorStop(0, '#fff8e8'); disc.addColorStop(0.7, '#dcc8a0'); disc.addColorStop(1, '#7a6850');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    moonSurface(mx, my, mr, 'face', 9);
    // gold rim
    ctx.strokeStyle = '#a07020'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(mx, my, mr - 1, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = '#3a2a08'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.arc(mx, my, mr - 1, 0, Math.PI*2); ctx.stroke();
    // hour ticks (12)
    ctx.fillStyle = '#3a2a08';
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 - Math.PI/2;
      const r1 = mr * 0.85;
      const r2 = mr * 0.95;
      const major = i % 3 === 0;
      ctx.lineWidth = major ? 2 : 1;
      ctx.strokeStyle = '#3a2a08';
      ctx.beginPath();
      ctx.moveTo(mx + Math.cos(a) * r1, my + Math.sin(a) * r1);
      ctx.lineTo(mx + Math.cos(a) * r2, my + Math.sin(a) * r2);
      ctx.stroke();
    }
    // hands
    const hourA = t * 0.3 - Math.PI / 2;
    const minA = t * 1.2 - Math.PI / 2;
    ctx.strokeStyle = '#1a1208'; ctx.lineCap = 'round';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(mx, my); ctx.lineTo(mx + Math.cos(hourA) * mr * 0.5, my + Math.sin(hourA) * mr * 0.5);
    ctx.stroke();
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(mx, my); ctx.lineTo(mx + Math.cos(minA) * mr * 0.75, my + Math.sin(minA) * mr * 0.75);
    ctx.stroke();
    ctx.lineCap = 'butt';
    // center pin
    ctx.fillStyle = '#a07020';
    ctx.beginPath(); ctx.arc(mx, my, 2, 0, Math.PI*2); ctx.fill();
  }

  // GENESIS — gas giant w/ rings
  function drawGenesisMoon(mx, my, mr, t) {
    const halo = ctx.createRadialGradient(mx, my, mr, mx, my, mr * 2.5);
    halo.addColorStop(0, 'rgba(180,220,255,0.3)');
    halo.addColorStop(1, 'rgba(100,140,200,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(mx, my, mr * 2.5, 0, Math.PI*2); ctx.fill();
    // back ring half
    drawPlanetRings(mx, my, mr, Math.PI, Math.PI * 2, 0.7);
    // planet body (banded)
    const disc = ctx.createLinearGradient(mx, my - mr, mx, my + mr);
    disc.addColorStop(0, '#dce8ff');
    disc.addColorStop(0.3, '#80a0e0');
    disc.addColorStop(0.5, '#a8c0f0');
    disc.addColorStop(0.7, '#5078b8');
    disc.addColorStop(1, '#2a4880');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    // bands
    ctx.save();
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.clip();
    for (let i = -2; i <= 2; i++) {
      const yy = my + i * 8 + Math.sin(t + i) * 1.5;
      ctx.fillStyle = `rgba(40,60,100,${0.25 - Math.abs(i) * 0.04})`;
      ctx.fillRect(mx - mr, yy, mr * 2, 2);
    }
    // great spot
    ctx.fillStyle = 'rgba(255,140,80,0.55)';
    ctx.beginPath();
    ctx.ellipse(mx + mr * 0.2 + Math.sin(t) * 2, my + mr * 0.15, mr * 0.18, mr * 0.1, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    moonSurface(mx, my, mr, 'gas', 13);
    // rim
    ctx.strokeStyle = 'rgba(20,40,80,0.7)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(mx, my, mr - 0.5, 0, Math.PI*2); ctx.stroke();
    // front ring half
    // ring shadow cast on the planet (just below front ring)
    ctx.save();
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.clip();
    ctx.strokeStyle = 'rgba(10,20,50,0.35)'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.ellipse(mx + 2, my + 5, mr * 1.55, mr * 1.55 * 0.25, -0.12, 0, Math.PI); ctx.stroke();
    ctx.restore();
    drawPlanetRings(mx, my, mr, 0, Math.PI, 1);
    // tiny moonlet
    const moonletA = t * 0.6;
    const mlx = mx + Math.cos(moonletA) * mr * 1.7;
    const mly = my + Math.sin(moonletA) * mr * 0.45;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(mlx, mly, 2, 0, Math.PI*2); ctx.fill();
  }

  // GROVE — moon wrapped in vines + leaves drifting around
  function drawGroveMoon(mx, my, mr, t) {
    const halo = ctx.createRadialGradient(mx, my, mr, mx, my, mr * 2.5);
    halo.addColorStop(0, 'rgba(140,220,120,0.25)');
    halo.addColorStop(1, 'rgba(80,140,80,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(mx, my, mr * 2.5, 0, Math.PI*2); ctx.fill();
    // moon disc — pale green
    const disc = ctx.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, mr * 0.2, mx, my, mr);
    disc.addColorStop(0, '#fffae0');
    disc.addColorStop(0.7, '#d8e8b8');
    disc.addColorStop(1, '#88a060');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    // craters
    ctx.fillStyle = 'rgba(80,110,60,0.5)';
    ctx.beginPath(); ctx.arc(mx + mr * 0.2, my - mr * 0.1, mr * 0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx - mr * 0.3, my + mr * 0.25, mr * 0.1, 0, Math.PI*2); ctx.fill();
    // wrapping vine (curves around)
    ctx.save();
    ctx.beginPath(); ctx.arc(mx, my, mr - 0.5, 0, Math.PI*2); ctx.clip();
    ctx.strokeStyle = '#3a8030';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let k = 0; k <= 24; k++) {
      const a = -Math.PI / 2 + (k / 24) * Math.PI * 2.4 + Math.sin(t * 0.6) * 0.1;
      const r = mr * (0.45 + 0.4 * (k / 24));
      const x = mx + Math.cos(a) * r;
      const y = my + Math.sin(a) * r;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    // leaves on vine
    ctx.fillStyle = '#5aa830';
    for (let k = 2; k <= 24; k += 4) {
      const a = -Math.PI / 2 + (k / 24) * Math.PI * 2.4;
      const r = mr * (0.45 + 0.4 * (k / 24));
      const x = mx + Math.cos(a) * r;
      const y = my + Math.sin(a) * r;
      ctx.beginPath();
      ctx.ellipse(x, y, 4, 2.5, a + 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    moonSurface(mx, my, mr, 'rock', 10);
    // rim
    ctx.strokeStyle = 'rgba(40,80,30,0.7)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(mx, my, mr - 0.5, 0, Math.PI*2); ctx.stroke();
    // drifting leaves around
    for (let i = 0; i < 4; i++) {
      const phase = (t * 0.5 + i / 4) % 1;
      const a = i * 1.7 + t * 0.8;
      const lr = mr * (1.4 + Math.sin(t + i) * 0.2);
      const lx = mx + Math.cos(a) * lr;
      const ly = my + Math.sin(a) * lr * 0.6 + phase * 4 - 2;
      ctx.fillStyle = `rgba(120,200,80,${0.6 - phase * 0.4})`;
      ctx.beginPath();
      ctx.ellipse(lx, ly, 4, 2, a + t, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // CRYSTAL — geode moon w/ rainbow refraction + orbiting shards
  function drawCrystalMoon(mx, my, mr, t) {
    const halo = ctx.createRadialGradient(mx, my, mr, mx, my, mr * 2.6);
    halo.addColorStop(0, 'rgba(200,160,255,0.28)');
    halo.addColorStop(0.5, 'rgba(140,200,255,0.16)');
    halo.addColorStop(1, 'rgba(60,40,120,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(mx, my, mr * 2.6, 0, Math.PI*2); ctx.fill();
    // outer dark stone shell
    ctx.fillStyle = '#2a1838';
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    // inner geode opening (off-center crescent of crystals)
    ctx.save();
    ctx.beginPath(); ctx.arc(mx, my, mr - 4, 0, Math.PI*2); ctx.clip();
    // rainbow gradient base
    const inner = ctx.createLinearGradient(mx - mr, my, mx + mr, my);
    inner.addColorStop(0, '#ff80c0');
    inner.addColorStop(0.25, '#c080ff');
    inner.addColorStop(0.5, '#80d0ff');
    inner.addColorStop(0.75, '#80ffc0');
    inner.addColorStop(1, '#fff080');
    ctx.fillStyle = inner;
    ctx.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
    // crystal facets (radiating lines)
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 0.8;
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + t * 0.2;
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.lineTo(mx + Math.cos(a) * mr, my + Math.sin(a) * mr);
      ctx.stroke();
    }
    // bright center
    const core = ctx.createRadialGradient(mx, my, 1, mx, my, mr * 0.5);
    core.addColorStop(0, '#ffffff');
    core.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(mx, my, mr * 0.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    moonSurface(mx, my, mr, 'glass', 11);
    // shell rim
    ctx.strokeStyle = '#1a0a18'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.stroke();
    // orbiting shards
    for (let i = 0; i < 4; i++) {
      const a = t * 0.6 + i * (Math.PI / 2);
      const r = mr * 1.5;
      const sx = mx + Math.cos(a) * r;
      const sy = my + Math.sin(a) * r * 0.55;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(a + t);
      ctx.fillStyle = '#dceeff';
      ctx.beginPath();
      ctx.moveTo(-3, -1.5); ctx.lineTo(3.5, -0.5); ctx.lineTo(0.5, 2.5);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#80a0c8'; ctx.lineWidth = 0.5; ctx.stroke();
      ctx.restore();
    }
  }

  // CATHEDRAL — gothic moon w/ cross + stained-glass rose window halo
  function drawCathedralMoon(mx, my, mr, t) {
    // stained-glass halo
    const halo = ctx.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 2.4);
    halo.addColorStop(0, 'rgba(255,180,80,0.28)');
    halo.addColorStop(0.5, 'rgba(180,80,40,0.18)');
    halo.addColorStop(1, 'rgba(40,20,40,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(mx, my, mr * 2.4, 0, Math.PI*2); ctx.fill();
    // moon disc — warm parchment
    const disc = ctx.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, mr * 0.2, mx, my, mr);
    disc.addColorStop(0, '#fff4d0');
    disc.addColorStop(0.7, '#e0c080');
    disc.addColorStop(1, '#8a6028');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    // rose window pattern (clipped to disc)
    ctx.save();
    ctx.beginPath(); ctx.arc(mx, my, mr - 1, 0, Math.PI*2); ctx.clip();
    // 8 stained-glass spokes radiating
    ctx.strokeStyle = '#3a2008';
    ctx.lineWidth = 1.4;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.lineTo(mx + Math.cos(a) * mr, my + Math.sin(a) * mr);
      ctx.stroke();
    }
    // colored petals between spokes
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
      const colors = ['rgba(180,40,60,0.45)', 'rgba(40,80,180,0.45)', 'rgba(180,160,40,0.45)', 'rgba(40,140,80,0.45)'];
      ctx.fillStyle = colors[i % 4];
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.arc(mx, my, mr * 0.7, a - Math.PI / 8, a + Math.PI / 8);
      ctx.closePath();
      ctx.fill();
    }
    // inner ring
    ctx.strokeStyle = '#3a2008'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(mx, my, mr * 0.35, 0, Math.PI*2); ctx.stroke();
    // central cross
    const crossGlow = 0.5 + Math.sin(t * 1.5) * 0.3;
    ctx.fillStyle = `rgba(255,220,140,${crossGlow})`;
    ctx.fillRect(mx - 1.5, my - mr * 0.3, 3, mr * 0.6);
    ctx.fillRect(mx - mr * 0.18, my - 1.5, mr * 0.36, 3);
    ctx.strokeStyle = '#3a2008';
    ctx.lineWidth = 0.7;
    ctx.strokeRect(mx - 1.5, my - mr * 0.3, 3, mr * 0.6);
    ctx.strokeRect(mx - mr * 0.18, my - 1.5, mr * 0.36, 3);
    ctx.restore();
    moonSurface(mx, my, mr, 'face', 12);
    // outer rim — heavy lead
    ctx.strokeStyle = '#1a1018';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.stroke();
    // orbiting bell glints
    for (let i = 0; i < 3; i++) {
      const a = t * 0.5 + i * (Math.PI * 2 / 3);
      const r = mr * 1.5;
      const x = mx + Math.cos(a) * r;
      const y = my + Math.sin(a) * r * 0.55;
      const glow = 0.5 + Math.sin(t * 3 + i) * 0.4;
      ctx.fillStyle = `rgba(255,200,120,${glow})`;
      ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI*2); ctx.fill();
    }
  }

  // paint cloud centered on its local origin into g (offscreen)
  function paintCloud(g, c) {
    const palette = c.tint === 'pink'
      ? { shadow: 'rgba(80,40,90,0.18)', body: 'rgba(255,200,220,0.16)', edge: 'rgba(255,200,220,0)', hi: 'rgba(255,230,240,0.18)' }
      : { shadow: 'rgba(40,40,80,0.22)', body: 'rgba(220,220,255,0.18)', edge: 'rgba(220,220,255,0)', hi: 'rgba(255,255,255,0.22)' };

    // shadow puff (offset down)
    for (const p of c.puffs) {
      const px = p.dx, py = p.dy + 4;
      const sg = g.createRadialGradient(px, py, p.r * 0.2, px, py, p.r);
      sg.addColorStop(0, palette.shadow);
      sg.addColorStop(1, 'rgba(40,40,80,0)');
      g.fillStyle = sg;
      g.beginPath(); g.arc(px, py, p.r, 0, Math.PI * 2); g.fill();
    }
    // body — soft radial fill per puff
    for (const p of c.puffs) {
      const px = p.dx, py = p.dy;
      const bg = g.createRadialGradient(px, py - p.r * 0.2, p.r * 0.1, px, py, p.r);
      bg.addColorStop(0, palette.body);
      bg.addColorStop(0.7, palette.body);
      bg.addColorStop(1, palette.edge);
      g.fillStyle = bg;
      g.beginPath(); g.arc(px, py, p.r, 0, Math.PI * 2); g.fill();
    }
    // top highlight — small bright caps on upper puffs only
    for (const p of c.puffs) {
      if (p.dy > 0) continue;
      const px = p.dx, py = p.dy - p.r * 0.35;
      const hg = g.createRadialGradient(px, py, 0, px, py, p.r * 0.55);
      hg.addColorStop(0, palette.hi);
      hg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = hg;
      g.beginPath(); g.arc(px, py, p.r * 0.55, 0, Math.PI * 2); g.fill();
    }
  }

  function bakeCloud(c) {
    const RES = 2;  // soft gradients — 2x design res stays smooth after camera scale (literal: runs before later consts init)
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of c.puffs) {
      x0 = Math.min(x0, p.dx - p.r); x1 = Math.max(x1, p.dx + p.r);
      y0 = Math.min(y0, p.dy - p.r); y1 = Math.max(y1, p.dy + p.r + 4);  // +4 shadow offset
    }
    const cv = document.createElement('canvas');
    cv.width = Math.ceil((x1 - x0) * RES);
    cv.height = Math.ceil((y1 - y0) * RES);
    const g = cv.getContext('2d');
    g.scale(RES, RES);
    g.translate(-x0, -y0);
    paintCloud(g, c);

  // ---- Baked parallax tiles (mountains + city), tinted per stage ----
  const BG_RES = 2;

  function bakeMountain(l, tint) {
    const P = W * 1.5, top = l.height * 1.35, hgt = top + 6;
    const [cv, g] = bgCanvas(P, hgt);
    const STEP = 2, n = Math.round(P / STEP);
    const hs = []; let lo = Infinity, hi = -Infinity;
    for (let i = 0; i <= n; i++) {
      const x = i * STEP;

    const fog = [0.3, 0.14, 0.03][l.depth];           // far layers fade into haze

    body.addColorStop(0, rgbaStr(mixRgb(mixRgb(base, tint, 0.12), haze, fog), 1));
