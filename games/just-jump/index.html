        if (v !== 0) return;
        g.strokeStyle = 'rgba(255,200,110,0.55)'; g.lineWidth = 1.2;
        g.beginPath(); g.arc(x + w / 2, y + 12, Math.min(w * 0.18, 8), 0, Math.PI * 2); g.stroke();
      },
      win: { cw: 8, ch: 14, ww: 3, wh: 8, s: 2, dens: 0.2, warm: [255, 200, 110] },
    },
    genesis: {  // cosmic monuments: orb pylons, ringed towers, capstone pyramids, needles
      shape(p, x, y, w, h, v) {
        const cx = x + w / 2, B = y + h;
        if (v === 0) { poly(p, x + w * 0.2, B, x + w * 0.4, y, x + w * 0.6, y, x + w * 0.8, B); circ(p, cx, y - 9, 5); }
        else if (v === 1) p.rect(x + w * 0.3, y, w * 0.4, h);
        else if (v === 2) poly(p, x, B, cx, y, x + w, B);
        else { p.rect(x, y + h * 0.7, w, h * 0.3); poly(p, x + w * 0.35, B, cx, y - 18, x + w * 0.65, B); }
      },
      deco(g, x, y, w, h, v) {
        const gold = [255, 240, 150], cx = x + w / 2;
        if (v === 0) glow(g, cx, y - 9, 12, gold, 0.6);
        else if (v === 1) { g.strokeStyle = 'rgba(255,240,150,0.5)'; g.lineWidth = 1.2; g.beginPath(); g.ellipse(cx, y + h * 0.3, w * 0.5, 4, 0, 0, Math.PI * 2); g.stroke(); }
        else if (v === 2) glow(g, cx, y, 9, gold, 0.7);
        else glow(g, cx, y - 18, 7, gold, 0.6);
      },
      win: { cw: 6, ch: 8, ww: 1.5, wh: 1.5, dens: 0.14, warm: [255, 245, 190] },
    },
  };
  const WIN_DEF = { cw: 7, ch: 9, ww: 2.5, wh: 3.5, s: 0, dens: 0.2, warm: [255, 214, 150] };

  function bakeCity(tint, stageId) {
    const st = CITY[stageId] || CITY.twilight;
    const win = { ...WIN_DEF, ...st.win };
    const P = W * 1.2;
    let maxH = 0; for (const b of buildings) maxH = Math.max(maxH, b.h);
    const hgt = maxH + 22;
    const [cv, g] = bgCanvas(P, hgt);
    const [wcv, wg] = bgCanvas(P, hgt);  // windows on own layer → faded with speed (no strobing)
    const topC = rgbaStr(mixRgb([10, 10, 24], tint, 0.06), 1);
    const edge = rgbaStr(mixRgb(tint, [255, 255, 255], 0.3), 0.16);
    const accent = mixRgb(tint, [255, 255, 255], 0.4);
    for (const b of buildings) {
      const y = hgt - b.h;
      const grad = g.createLinearGradient(0, y, 0, hgt);
      grad.addColorStop(0, topC); grad.addColorStop(1, '#0a0a18');
      const strip = win.s === 3;
      const cols = strip ? 1 : Math.floor((b.w - 6) / win.cw), rows = Math.floor((b.h - 8) / win.ch);
      const ww = strip ? b.w - 8 : win.ww;
      for (const x of [b.x, b.x - P]) {  // wrap copy for seamless tile
        const p = new Path2D();
        st.shape(p, x, y, b.w, b.h, b.roof);
        // body, then rim: edge tint under a (-1,+1)-shifted body fill → lit crescent on top + moon side
        g.fillStyle = grad; g.fill(p);
        g.fillStyle = edge; g.fill(p);
        g.save(); g.translate(-1, 1); g.fillStyle = grad; g.fill(p); g.restore();
        if (st.deco) st.deco(g, x, y, b.w, b.h, b.roof, tint);
        // windows: erase windows of buildings behind, then draw own clipped to silhouette
        wg.globalCompositeOperation = 'destination-out';
        wg.fill(p);
        wg.globalCompositeOperation = 'source-over';
        wg.save(); wg.clip(p);
        let seed = Math.floor(b.seed) + 1;  // same sequence for both copies
        const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed % 1000) / 1000; };
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          const v = rnd();
          if (v > win.dens) continue;
          wg.fillStyle = rgbaStr(v < 0.06 ? accent : win.warm, 0.45 + v * 2);
          const wx = x + 4 + c * win.cw, wy = y + 6 + r * win.ch;
          if (win.s === 1) { wg.beginPath(); wg.arc(wx + ww / 2, wy + win.wh / 2, ww / 2, 0, Math.PI * 2); wg.fill(); }
          else if (win.s === 2) { wg.beginPath(); wg.arc(wx + ww / 2, wy + ww / 2, ww / 2, Math.PI, 0); wg.lineTo(wx + ww, wy + win.wh); wg.lineTo(wx, wy + win.wh); wg.fill(); }
          else wg.fillRect(wx, wy, ww, win.wh);
        }
        wg.restore();
      }
    }
    return { cv, wcv, P, h: hgt };
  }

  function drawTiled(img, P, off, y, h) {
    // step back to left band edge, then tile until right band edge (0.5 overlap hides seam hairline)
    let x = off;
    while (x > -cameraOffX) x -= P - 0.5;
    for (; x < W + cameraOffX; x += P - 0.5) ctx.drawImage(img, x, y, P, h);
  }
  function drawMountainLayer(layer, tile) {
    const off = (-worldOffset * layer.parallax) % tile.P;
    drawTiled(tile.cv, tile.P, off, layer.baseY - tile.h, tile.h);
  }

  function drawCitySilhouette(tile) {
    const baseY = GROUND_Y + player.h - 10;
    const off = (-worldOffset * 0.7) % tile.P - 30;
    drawTiled(tile.cv, tile.P, off, baseY - tile.h, tile.h);
    ctx.globalAlpha = Math.max(0.35, 1 - (speed - 5) / 5 * 0.65);  // dim windows at speed → no strobing
    drawTiled(tile.wcv, tile.P, off, baseY - tile.h, tile.h);
    ctx.globalAlpha = 1;
  }

  // ---- Ground ----
  function drawGround() {
    const groundTop = GROUND_Y + player.h;
    const X0 = -cameraOffX, X1 = W + cameraOffX, VW = X1 - X0;
    // top edge glow
    ctx.fillStyle = grads.edge;
    ctx.fillRect(X0, groundTop - 4, VW, 10);

    // ground gradient (perspective fade: dark near, lighter mid, dark far-down)
    ctx.fillStyle = grads.ground;
    ctx.fillRect(X0, groundTop, VW, H - groundTop);

    // grid pattern (perspective faux 3D)
    const off = (worldOffset) % 40;
    ctx.strokeStyle = 'rgba(140,120,220,0.18)';
    ctx.lineWidth = 1;
    // vertical receding lines
    const groundH = H - groundTop;
    for (let i = Math.floor(X0 / 40) - 1; i < X1 / 40 + 2; i++) {
      const xTop = i * 40 - off;
      const xBot = (i * 40 - off - W/2) * 1.6 + W/2; // exaggerate
      ctx.beginPath();
      ctx.moveTo(xTop, groundTop);
      ctx.lineTo(xBot, H);
      ctx.stroke();
    }
    // horizontal bands (denser near top, sparser bottom = fake depth)
    ctx.strokeStyle = 'rgba(140,120,220,0.22)';
    for (let i = 0; i < 6; i++) {
      const r = i / 5;
      const y = groundTop + Math.pow(r, 1.7) * groundH;
      ctx.beginPath();
      ctx.moveTo(X0, y);
      ctx.lineTo(X1, y);
      ctx.stroke();
    }

    // top edge bright line
    ctx.fillStyle = '#ff85b8';
    ctx.fillRect(X0, groundTop - 0.5, VW, 1.5);
    // secondary line
    ctx.fillStyle = 'rgba(255,210,80,0.6)';
    ctx.fillRect(X0, groundTop + 2, VW, 1);

    // moving dashes on near-ground
    const dashOff = (-worldOffset) % 32;
    ctx.fillStyle = 'rgba(255,210,80,0.65)';
    for (let i = Math.floor(X0 / 32) - 1; i < X1 / 32 + 1; i++) {
      ctx.fillRect(i * 32 + dashOff, groundTop + 16, 16, 2);
    }
  }

  // ---- Sprite cache (built from active skin via PlayerSprite module) ----
  const skinAtlasCache = new Map();
  // LRU-capped: hi-res atlases are ~4MB each; browsing 40 skins must not keep all.
  const ATLAS_CACHE_MAX = 8;
  function atlasFor(id) {
    let a = skinAtlasCache.get(id);
    if (a) skinAtlasCache.delete(id);  // re-insert → most recent
    else a = PlayerSprite.build(Skins.get(id));
    skinAtlasCache.set(id, a);
    if (skinAtlasCache.size > ATLAS_CACHE_MAX) skinAtlasCache.delete(skinAtlasCache.keys().next().value);
    return a;
  }
  let sprites = atlasFor(Skins.active().id);

  function setSkin(id) {
    Skins.setActive(id);
    sprites = atlasFor(Skins.active().id);
  }
  // expose for future skin picker UI
  window.OneJump.setSkin = setSkin;

  function pickSprite() {
    if (state === STATE.DEAD) return sprites.dead;
    if (state === STATE.READY) return sprites.idle[Math.floor(frame / 6) % sprites.idle.length];
    // PLAY
    if (!player.onGround) {
      return player.vy < 0 ? sprites.jump : sprites.fall;
    }
    // running on ground — speed-scaled cycle
    const idx = Math.floor(frame * (speed / 6) / 3) % sprites.run.length;
    return sprites.run[idx];
  }

  const GHOST_SCALE = 0.6;
  const GHOST_LANE = 46;  // ghost feet below ground top line
  function drawGhost() {
    if (!lastGhost) return;
    const n = lastGhost.length / 2;
    const i = Math.max(0, ghostRec.length / 2 - 1);
    let alpha = 0.35, spr;
    if (i >= n) {
      // ghost died here — fade its dead pose out over 60 frames
      alpha *= 1 - (i - n) / 60;
      if (alpha <= 0) return;
      spr = sprites.dead;
    }
    const k = Math.min(i, n - 1) * 2;
    const gy = lastGhost[k], pose = lastGhost[k + 1];
    if (!spr) spr = pose === 1 ? sprites.jump : pose === 2 ? sprites.fall
      : sprites.run[Math.floor(frame * (speed / 6) / 3) % sprites.run.length];
    const s = PLAYER_SCALE * GHOST_SCALE;
    const feet = GROUND_Y + player.h + GHOST_LANE + (gy - GROUND_Y) * GHOST_SCALE;
    const x = player.x + player.w * (1 - GHOST_SCALE) / 2;
    ctx.globalAlpha = alpha;
    ctx.drawImage(spr, x - SPR_OFFX * s, feet - player.h * GHOST_SCALE - SPR_OFFY * s, 72 * s, 80 * s);
    ctx.globalAlpha = alpha * 1.6;
    ctx.fillStyle = '#cfe0ff';
    ctx.font = 'bold 7px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(OneJump.I18N.t('PREVIOUS ME'), x + player.w * GHOST_SCALE / 2, feet + 3);
    ctx.globalAlpha = 1;
  }

  function drawPlayer() {
    const px = player.x, py = player.y;
    const cx = px + player.w/2;

    // shadow
    const shY = GROUND_Y + player.h + 4;
    const shScale = Math.max(0, 1 - Math.max(0, (GROUND_Y - py) / 200));
    if (shScale > 0) {
      ctx.fillStyle = `rgba(0,0,0,${0.45 * shScale})`;
      ctx.beginPath();
      ctx.ellipse(cx, shY, player.w/2 * shScale, 4 * shScale, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    const spr = pickSprite();
    const sw = 72 * PLAYER_SCALE, sh = 80 * PLAYER_SCALE;
    const dx = px - SPR_OFFX * PLAYER_SCALE;
    const dy = py - SPR_OFFY * PLAYER_SCALE;
    if (state === STATE.DEAD && player.deadRot) {
      const bcx = px + player.w/2;
      const bcy = py + player.h/2;
      ctx.save();
      ctx.translate(bcx, bcy);
      ctx.rotate(player.deadRot);
      ctx.translate(-bcx, -bcy);
      ctx.drawImage(spr, dx, dy, sw, sh);
      ctx.restore();
    } else {
      ctx.drawImage(spr, dx, dy, sw, sh);
    }
  }

  // ---- Wire UI module ----
  // ref: getter-backed view of mutable game state. UI reads from these.
  const uiRef = {
    get W() { return W; },
    get H() { return H; },
    get OX() { return cameraOffX; },  // letterbox band size (design px) each side
    get OY() { return cameraOffY; },
    get GROUND_Y() { return GROUND_Y; },
    get state() { return state; },
    STATE,
    get score() { return score; },
    get best() { return getStageBest(stageList[startStageIdx].id); },
    get totalScore() { return totalScore; },
    getStageBest,
    get speed() { return speed; },
    get baseSpeed() { return baseSpeed; },
    get coinBalance() { return coinBalance; },
    get coinMultiplier() { return coinMultiplier; },
    get player() { return player; },
    get stageList() { return stageList; },
    get startStageIdx() { return startStageIdx; },
    get skinIds() { return skinIds; },
    get skinIdx() { return skinIdx; },
    get deadFrame() { return deadFrame; },
    get uiFrame() { return uiFrame; },
    get lastRun() { return lastRun; },
    STAGE_UNLOCK_SCORE,
    currentStage,
    toKmh,
    atlasFor,
    previewSkin,
    previewLocked,
  };
  UI.init(ctx, uiRef, hits);

  // ---- Loop (fixed-timestep w/ delta time) ----
  // Decouples sim from display refresh rate. update() runs at 60Hz logical
  // regardless of monitor (60/120/144Hz), interpolation skipped (rendering reads
  // current state). Catch-up capped to avoid spiral-of-death after tab unfocus.
  const STEP_MS = 1000 / 60;
  const MAX_FRAME_MS = 200;        // cap per-frame catch-up to ~12 steps
  const MAX_STEPS_PER_TICK = 6;    // hard cap to keep frame budget bounded
  let lastTime = 0;
  let acc = 0;
  function drawPauseOverlay() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = 'rgba(5,8,16,0.6)';
    ctx.fillRect(0, 0, cvs.width, cvs.height);
    ctx.fillStyle = '#ffd060';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.round(28 * cameraScale)}px monospace`;
    ctx.fillText(OneJump.I18N.t('PAUSED'), cvs.width / 2, cvs.height / 2 - 18 * cameraScale);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.round(14 * cameraScale)}px monospace`;
    ctx.fillText(OneJump.I18N.t('TAP TO RESUME'), cvs.width / 2, cvs.height / 2 + 18 * cameraScale);
    ctx.restore();
  }
  function loop(now) {
    if (!lastTime) lastTime = now;
    let delta = now - lastTime;
    lastTime = now;
    if (delta > MAX_FRAME_MS) delta = MAX_FRAME_MS;
    acc += delta;
    if (paused) {
      acc = 0;
      if (!pauseDrawn) { draw(); drawPauseOverlay(); pauseDrawn = true; }
      requestAnimationFrame(loop);
      return;
    }
    let steps = 0;
    while (acc >= STEP_MS && steps < MAX_STEPS_PER_TICK) {
      update();
      acc -= STEP_MS;
      steps++;
    }
    if (steps >= MAX_STEPS_PER_TICK) acc = 0;  // drop residual to stay realtime
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
}
</script>
</body>
