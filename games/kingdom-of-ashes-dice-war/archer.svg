<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">

  <!-- Recurve bow: cols 1-3, rows 1-14 -->
  <rect x="2" y="1" width="1" height="2" fill="#5A3010"/>
  <rect x="1" y="3" width="2" height="3" fill="#5A3010"/>
  <rect x="1" y="6" width="1" height="4" fill="#5A3010"/>
  <rect x="1" y="10" width="2" height="3" fill="#5A3010"/>
  <rect x="2" y="13" width="1" height="2" fill="#5A3010"/>
  <!-- Bowstring -->
  <rect x="3" y="2" width="1" height="11" fill="#E8E8E8"/>
  <!-- Arrow nocked at row 7 -->
  <rect x="3" y="7" width="5" height="1" fill="#D0C090"/>
  <rect x="7" y="6" width="1" height="3" fill="#CC0000"/>
  <!-- Left hand on bow cols 3-5 row 7 -->
  <rect x="3" y="7" width="3" height="1" fill="#F0B870"/>

  <!-- Green hood: rows 1-6, cols 6-11 -->
  <rect x="6" y="1" width="5" height="2" fill="#1B5E20"/>
  <rect x="5" y="3" width="7" height="3" fill="#2E7D32"/>
  <rect x="5" y="3" width="1" height="3" fill="#1B5E20"/>
  <rect x="11" y="3" width="1" height="3" fill="#1B5E20"/>
  <!-- Face rows 3-5, cols 6-9 -->
  <rect x="6" y="3" width="4" height="3" fill="#F0B870"/>
  <rect x="6" y="4" width="1" height="1" fill="#1A0E00"/>
  <rect x="8" y="4" width="1" height="1" fill="#1A0E00"/>
  <!-- Hood shadow on forehead -->
  <rect x="6" y="3" width="4" height="1" fill="#2E7D32"/>

  <!-- Body cols 5-11, rows 7-12 -->
  <rect x="5" y="7" width="6" height="5" fill="#7B4F1E"/>
  <!-- Green cloak back -->
  <rect x="11" y="7" width="2" height="5" fill="#2E7D32"/>
  <!-- Belt row 11 -->
  <rect x="5" y="11" width="6" height="1" fill="#5A3010"/>
  <!-- Left arm cols 4-5 rows 7-8 -->
  <rect x="4" y="7" width="2" height="1" fill="#7B4F1E"/>

  <!-- Quiver (back right): col 13, rows 4-11 -->
  <rect x="13" y="4" width="1" height="8" fill="#5A3010"/>
  <rect x="13" y="4" width="1" height="1" fill="#D0D0D0"/>
  <rect x="14" y="5" width="1" height="1" fill="#D0D0D0"/>
  <rect x="13" y="6" width="1" height="1" fill="#D0D0D0"/>

  <!-- Legs rows 12-14 -->
  <rect x="6" y="12" width="2" height="3" fill="#7B4F1E"/>
  <rect x="9" y="12" width="2" height="3" fill="#7B4F1E"/>
  <!-- Boots row 15 -->
  <rect x="5" y="15" width="3" height="1" fill="#3A200A"/>
  <rect x="9" y="15" width="3" height="1" fill="#3A200A"/>

</svg>
