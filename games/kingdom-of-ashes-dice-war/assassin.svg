<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">

  <!-- Upper dagger: cols 0-3 row 5, guard col 4 -->
  <rect x="0" y="5" width="4" height="1" fill="#D0D0D0"/>
  <rect x="0" y="5" width="1" height="1" fill="#B0B0B0"/>
  <rect x="4" y="4" width="1" height="3" fill="#800080"/>

  <!-- Lower dagger: cols 0-3 row 9, guard col 4 -->
  <rect x="0" y="9" width="4" height="1" fill="#D0D0D0"/>
  <rect x="0" y="9" width="1" height="1" fill="#B0B0B0"/>
  <rect x="4" y="8" width="1" height="3" fill="#800080"/>

  <!-- Left arm (upper dagger): cols 4-6 row 6 -->
  <rect x="4" y="6" width="3" height="1" fill="#1A1A2A"/>
  <!-- Left arm (lower dagger): cols 4-6 row 9 -->
  <rect x="4" y="9" width="3" height="1" fill="#1A1A2A"/>

  <!-- Hood: rows 1-5, cols 6-10 -->
  <rect x="6" y="1" width="5" height="5" fill="#1A1A2A"/>
  <rect x="5" y="2" width="1" height="4" fill="#1A1A2A"/>
  <rect x="11" y="2" width="1" height="4" fill="#1A1A2A"/>
  <!-- Face shadow -->
  <rect x="6" y="3" width="4" height="3" fill="#0D0D0D"/>
  <!-- Purple glowing eyes -->
  <rect x="6" y="4" width="1" height="1" fill="#9B59B6"/>
  <rect x="8" y="4" width="1" height="1" fill="#9B59B6"/>
  <!-- Purple mask line row 6 -->
  <rect x="6" y="6" width="4" height="1" fill="#6A0DAD"/>

  <!-- Body cols 5-11, rows 7-12 -->
  <rect x="5" y="7" width="6" height="5" fill="#1A1A2A"/>
  <!-- Purple trim -->
  <rect x="5" y="7" width="1" height="5" fill="#6A0DAD"/>
  <rect x="10" y="7" width="1" height="5" fill="#6A0DAD"/>
  <!-- Purple belt row 11 -->
  <rect x="5" y="11" width="6" height="1" fill="#6A0DAD"/>
  <!-- Right arm col 11 rows 7-10 -->
  <rect x="11" y="7" width="1" height="4" fill="#1A1A2A"/>

  <!-- Legs rows 12-14 (crouched) -->
  <rect x="6" y="12" width="2" height="3" fill="#1A1A2A"/>
  <rect x="9" y="12" width="2" height="3" fill="#1A1A2A"/>
  <!-- Dark boots row 15 -->
  <rect x="5" y="15" width="3" height="1" fill="#0A0A14"/>
  <rect x="9" y="15" width="3" height="1" fill="#0A0A14"/>

</svg>
