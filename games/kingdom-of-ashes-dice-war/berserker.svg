<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">

  <!-- Huge axe: cols 0-4, rows 2-12 -->
  <!-- Axe blade (cutting edge) -->
  <rect x="0" y="2" width="2" height="9" fill="#A0A0A0"/>
  <rect x="0" y="2" width="1" height="9" fill="#C8C8C8"/>
  <!-- Axe body -->
  <rect x="2" y="3" width="2" height="7" fill="#686868"/>
  <!-- Gold eye on axe -->
  <rect x="1" y="6" width="1" height="2" fill="#C8A010"/>
  <!-- Axe handle -->
  <rect x="4" y="2" width="1" height="11" fill="#5A3010"/>
  <rect x="4" y="13" width="1" height="1" fill="#808080"/>

  <!-- Left arm holding axe: cols 4-6 rows 8-9 -->
  <rect x="4" y="8" width="3" height="2" fill="#D4935A"/>

  <!-- Horns! rows 0-2 -->
  <rect x="6" y="0" width="1" height="3" fill="#F0F0D0"/>
  <rect x="5" y="0" width="1" height="2" fill="#F0F0D0"/>
  <rect x="11" y="0" width="1" height="3" fill="#F0F0D0"/>
  <rect x="12" y="0" width="1" height="2" fill="#F0F0D0"/>

  <!-- Leather helmet: rows 2-4, cols 6-11 -->
  <rect x="6" y="2" width="5" height="2" fill="#8B4513"/>
  <!-- Cheek guards rows 4-6 -->
  <rect x="6" y="4" width="1" height="3" fill="#8B4513"/>
  <rect x="10" y="4" width="1" height="3" fill="#8B4513"/>
  <!-- Face rows 4-6, cols 7-9 -->
  <rect x="7" y="4" width="3" height="3" fill="#D4935A"/>
  <!-- Red war paint diagonal -->
  <rect x="7" y="4" width="1" height="1" fill="#CC0000"/>
  <rect x="8" y="5" width="1" height="1" fill="#CC0000"/>
  <rect x="9" y="6" width="1" height="1" fill="#CC0000"/>
  <!-- Eyes -->
  <rect x="7" y="5" width="1" height="1" fill="#1A0E00"/>
  <rect x="9" y="5" width="1" height="1" fill="#1A0E00"/>
  <!-- Beard row 7 -->
  <rect x="7" y="7" width="3" height="1" fill="#8B4513"/>

  <!-- Bare chest: cols 6-12, rows 8-11 -->
  <rect x="6" y="8" width="7" height="1" fill="#D4935A"/>
  <rect x="6" y="9" width="6" height="3" fill="#D4935A"/>
  <!-- War paint stripes on chest -->
  <rect x="7" y="9" width="1" height="3" fill="#CC0000"/>
  <rect x="10" y="9" width="1" height="3" fill="#CC0000"/>
  <!-- Fur belt rows 11-12 -->
  <rect x="6" y="12" width="6" height="2" fill="#8B4513"/>
  <!-- Right arm col 12-13 rows 8-11 (massive) -->
  <rect x="12" y="8" width="2" height="4" fill="#D4935A"/>

  <!-- Legs rows 13-14 (fur pants) -->
  <rect x="7" y="14" width="2" height="1" fill="#8B4513"/>
  <rect x="10" y="14" width="2" height="1" fill="#8B4513"/>
  <!-- Boots row 15 -->
  <rect x="6" y="15" width="3" height="1" fill="#3A200A"/>
  <rect x="10" y="15" width="3" height="1" fill="#3A200A"/>

</svg>
