<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">

  <!-- Spear: col 0, rows 0-14 -->
  <rect x="0" y="3" width="1" height="12" fill="#8B6914"/>
  <!-- Spear tip -->
  <rect x="0" y="0" width="1" height="4" fill="#D0D0D0"/>

  <!-- Round shield: cols 1-4, rows 4-12 -->
  <rect x="1" y="4" width="4" height="9" fill="#CD7F32"/>
  <rect x="2" y="5" width="2" height="7" fill="#D4AF37"/>
  <!-- Red shield boss -->
  <rect x="2" y="8" width="2" height="2" fill="#CC0000"/>
  <!-- Shield grip arm: cols 4-6 row 8 -->
  <rect x="4" y="8" width="3" height="1" fill="#CD7F32"/>

  <!-- Red plume: rows 0-2, cols 7-11 -->
  <rect x="6" y="0" width="5" height="2" fill="#CC0000"/>
  <rect x="7" y="2" width="3" height="1" fill="#CC0000"/>

  <!-- Bronze helmet: rows 3-6, cols 6-11 -->
  <rect x="6" y="3" width="5" height="3" fill="#CD7F32"/>
  <!-- Nose guard -->
  <rect x="8" y="4" width="1" height="3" fill="#CD7F32"/>
  <!-- Eye openings -->
  <rect x="6" y="4" width="2" height="2" fill="#F0B870"/>
  <rect x="9" y="4" width="2" height="2" fill="#F0B870"/>
  <!-- Eyes -->
  <rect x="7" y="4" width="1" height="1" fill="#1A0E00"/>
  <rect x="9" y="4" width="1" height="1" fill="#1A0E00"/>
  <!-- Chin guard row 6 -->
  <rect x="6" y="6" width="5" height="1" fill="#CD7F32"/>

  <!-- Bronze cuirass: cols 5-12, rows 7-11 -->
  <rect x="5" y="7" width="7" height="4" fill="#CD7F32"/>
  <!-- Gold trim -->
  <rect x="5" y="7" width="1" height="4" fill="#D4AF37"/>
  <rect x="11" y="7" width="1" height="4" fill="#D4AF37"/>
  <rect x="5" y="7" width="7" height="1" fill="#D4AF37"/>
  <!-- Muscle detail -->
  <rect x="7" y="8" width="3" height="2" fill="#A86428"/>
  <!-- Gold belt row 11 -->
  <rect x="5" y="11" width="7" height="1" fill="#D4AF37"/>
  <!-- Pteruges (leather strips) rows 12-13 -->
  <rect x="5" y="12" width="1" height="2" fill="#8B6914"/>
  <rect x="7" y="12" width="1" height="2" fill="#8B6914"/>
  <rect x="9" y="12" width="1" height="2" fill="#8B6914"/>
  <rect x="11" y="12" width="1" height="2" fill="#8B6914"/>
  <!-- Right arm col 12 rows 7-10 -->
  <rect x="12" y="7" width="1" height="4" fill="#CD7F32"/>

  <!-- Skin legs rows 13-14 -->
  <rect x="6" y="13" width="2" height="2" fill="#F0B870"/>
  <rect x="9" y="13" width="2" height="2" fill="#F0B870"/>
  <!-- Bronze greaves row 14 -->
  <rect x="6" y="14" width="2" height="1" fill="#CD7F32"/>
  <rect x="9" y="14" width="2" height="1" fill="#CD7F32"/>
  <!-- Sandals row 15 -->
  <rect x="5" y="15" width="3" height="1" fill="#8B6914"/>
  <rect x="9" y="15" width="3" height="1" fill="#8B6914"/>

</svg>
