<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">

  <!-- Staff: col 1, rows 2-14 -->
  <rect x="1" y="2" width="1" height="13" fill="#C8A010"/>
  <!-- Staff top cross -->
  <rect x="0" y="0" width="3" height="1" fill="#C8A010"/>
  <rect x="0" y="1" width="1" height="2" fill="#C8A010"/>
  <rect x="2" y="1" width="1" height="2" fill="#C8A010"/>
  <!-- Glowing orb at cross center -->
  <rect x="1" y="0" width="1" height="1" fill="#ADD8E6"/>

  <!-- Left hand on staff: cols 2-5 row 9 -->
  <rect x="2" y="9" width="4" height="1" fill="#F0B870"/>

  <!-- White hood: rows 1-6, cols 6-11 -->
  <rect x="6" y="1" width="5" height="2" fill="#F0F0F0"/>
  <rect x="5" y="3" width="7" height="3" fill="#F0F0F0"/>
  <rect x="5" y="3" width="1" height="3" fill="#DCDCDC"/>
  <rect x="11" y="3" width="1" height="3" fill="#DCDCDC"/>
  <!-- Face rows 3-5, cols 6-9 -->
  <rect x="6" y="3" width="4" height="3" fill="#F0B870"/>
  <rect x="6" y="4" width="1" height="1" fill="#4A3020"/>
  <rect x="8" y="4" width="1" height="1" fill="#4A3020"/>
  <!-- Gentle expression row 5 -->
  <rect x="7" y="5" width="2" height="1" fill="#E09060"/>
  <!-- Neck row 6 -->
  <rect x="7" y="6" width="2" height="1" fill="#F0B870"/>

  <!-- White robes cols 4-12, rows 7-14 -->
  <rect x="5" y="7" width="6" height="5" fill="#F0F0F0"/>
  <!-- Gold center stripe -->
  <rect x="7" y="7" width="2" height="5" fill="#C8A010"/>
  <!-- Wide sleeves -->
  <rect x="4" y="8" width="2" height="3" fill="#F0F0F0"/>
  <rect x="11" y="8" width="2" height="3" fill="#F0F0F0"/>
  <!-- Gold belt row 11 -->
  <rect x="4" y="11" width="9" height="1" fill="#C8A010"/>
  <!-- Lower robe rows 12-14 -->
  <rect x="4" y="12" width="9" height="3" fill="#F0F0F0"/>
  <!-- Robe center stripe continues -->
  <rect x="7" y="12" width="2" height="3" fill="#C8A010"/>

  <!-- Sandals row 15 -->
  <rect x="6" y="15" width="2" height="1" fill="#C8A010"/>
  <rect x="9" y="15" width="2" height="1" fill="#C8A010"/>

</svg>
