<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">

  <!-- Crossbow: cols 0-5, rows 7-9 -->
  <rect x="0" y="7" width="5" height="2" fill="#5A3010"/>
  <!-- Prod (vertical bow part) -->
  <rect x="3" y="5" width="1" height="7" fill="#606060"/>
  <!-- String -->
  <rect x="4" y="5" width="1" height="1" fill="#E8E8E8"/>
  <rect x="4" y="11" width="1" height="1" fill="#E8E8E8"/>
  <!-- Bolt -->
  <rect x="0" y="7" width="3" height="1" fill="#D0D0D0"/>
  <!-- Trigger -->
  <rect x="3" y="9" width="1" height="2" fill="#606060"/>
  <!-- Left hand: cols 4-6 row 7 -->
  <rect x="4" y="7" width="3" height="1" fill="#1A1A2A"/>

  <!-- Dark blue hood: rows 1-6, cols 6-11 -->
  <rect x="6" y="1" width="5" height="2" fill="#0D1B4A"/>
  <rect x="5" y="3" width="7" height="3" fill="#1A237E"/>
  <rect x="5" y="3" width="1" height="3" fill="#0D1B4A"/>
  <rect x="11" y="3" width="1" height="3" fill="#0D1B4A"/>
  <!-- Face shadow -->
  <rect x="6" y="3" width="4" height="3" fill="#0D0D1A"/>
  <!-- Glowing orange eyes -->
  <rect x="6" y="4" width="1" height="1" fill="#FF6600"/>
  <rect x="8" y="4" width="1" height="1" fill="#FF6600"/>
  <!-- Lower scarf row 6 -->
  <rect x="6" y="6" width="4" height="1" fill="#1A237E"/>

  <!-- Body cols 5-11, rows 7-12 -->
  <rect x="5" y="7" width="6" height="5" fill="#1A1A2A"/>
  <!-- Blue cloak edges -->
  <rect x="5" y="7" width="1" height="5" fill="#1A237E"/>
  <rect x="10" y="7" width="1" height="5" fill="#1A237E"/>
  <!-- Ammo belt row 11 -->
  <rect x="5" y="11" width="6" height="1" fill="#5A3010"/>
  <rect x="6" y="11" width="1" height="1" fill="#606060"/>
  <rect x="8" y="11" width="1" height="1" fill="#606060"/>
  <rect x="10" y="11" width="1" height="1" fill="#606060"/>
  <!-- Right arm col 11 rows 7-9 -->
  <rect x="11" y="7" width="1" height="3" fill="#1A1A2A"/>

  <!-- Legs rows 12-14 -->
  <rect x="6" y="12" width="2" height="3" fill="#1A1A2A"/>
  <rect x="9" y="12" width="2" height="3" fill="#1A1A2A"/>
  <!-- Boots row 15 -->
  <rect x="5" y="15" width="3" height="1" fill="#0D0D14"/>
  <rect x="9" y="15" width="3" height="1" fill="#0D0D14"/>

</svg>
