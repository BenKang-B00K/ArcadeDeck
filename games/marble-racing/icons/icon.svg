<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d1b86"/>
      <stop offset="1" stop-color="#0b0824"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".46" r=".5">
      <stop offset="0" stop-color="#9b6bff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5d8f"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
    <!-- glass: lavender tint, clear middle, rim darkening toward the bottom-right, light from the top-left -->
    <radialGradient id="glass" cx=".4" cy=".36" r=".68">
      <stop offset="0" stop-color="#e9e2ff" stop-opacity=".16"/>
      <stop offset=".72" stop-color="#b9a4ff" stop-opacity=".22"/>
      <stop offset=".93" stop-color="#7d5cff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4a2fb8" stop-opacity=".8"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#cdbbff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff8fd0" stop-opacity=".8"/>
    </linearGradient>
    <filter id="ol" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius=".7" result="d"/><feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="b"/><feOffset in="b" dx=".9" dy="1.2" result="bl"/><feComposite in="SourceAlpha" in2="bl" operator="out" result="tl"/><feOffset in="b" dx="-.9" dy="-1.2" result="bd"/><feComposite in="SourceAlpha" in2="bd" operator="out" result="br"/><feFlood flood-color="#000"/><feComposite in2="d" operator="in" result="o"/><feFlood flood-color="#fff" flood-opacity=".5"/><feComposite in2="tl" operator="in" result="hi"/><feFlood flood-color="#1a0f3a" flood-opacity=".32"/><feComposite in2="br" operator="in" result="sh"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/><feMergeNode in="sh"/><feMergeNode in="hi"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="236" r="210" fill="url(#glow)"/>
  <!-- the track: a pink -> violet ribbon swooshing under the marble -->
  <g fill="none" stroke-linecap="round">
    <path d="M78 384C170 450 330 446 438 326" stroke="url(#track)" stroke-width="78" stroke-opacity=".22"/>
    <path d="M78 384C170 450 330 446 438 326" stroke="url(#track)" stroke-width="42"/>
    <path d="M86 372C176 432 326 428 428 318" stroke="#fff" stroke-opacity=".55" stroke-width="7"/>
    <!-- speed streaks off the marble's back -->
    <path d="M70 196h52M58 244h70M76 292h44" stroke="#fff" stroke-opacity=".5" stroke-width="12"/>
  </g>
  <ellipse cx="262" cy="374" rx="104" ry="20" fill="#05020f" opacity=".45"/>
  <!-- the marble: bunny face inside, glass shell over it -->
  <circle cx="256" cy="236" r="128" fill="#2b1b74" opacity=".55"/>
  <!-- equator band in the brand pink behind the face, tilted with the roll -->
  <ellipse cx="256" cy="236" rx="124" ry="36" transform="rotate(-18 256 236)" fill="none" stroke="#ff5d8f" stroke-opacity=".7" stroke-width="8"/>
  <g transform="translate(150 128) scale(6.6)" filter="url(#ol)">
    <path fill="#f6f2fc" d="M10 3.5c-2.4 0-3.2 3.4-2.7 8 .2 2 .9 3.7 1.7 4.7L13.2 15c0-4.3-.7-11.5-3.2-11.5zM22 3.5c2.4 0 3.2 3.4 2.7 8-.2 2-.9 3.7-1.7 4.7L18.8 15c0-4.3.7-11.5 3.2-11.5z"/>
    <path fill="#ffb3c8" d="M10 6.3c-1 0-1.4 2.2-1 5.3l1.3 2.9 1.3-.4c0-3.7-.6-7.8-1.6-7.8zM22 6.3c1 0 1.4 2.2 1 5.3l-1.3 2.9-1.3-.4c0-3.7.6-7.8 1.6-7.8z"/>
    <ellipse cx="16" cy="20.5" rx="10.5" ry="8.8" fill="#f6f2fc"/>
    <g fill="#2b2140"><circle cx="12.2" cy="19.6" r="2.1"/><circle cx="19.8" cy="19.6" r="2.1"/></g>
    <g fill="#fff"><circle cx="12.85" cy="18.95" r="0.85"/><circle cx="11.48" cy="20.35" r="0.4"/><circle cx="20.45" cy="18.95" r="0.85"/><circle cx="19.09" cy="20.35" r="0.4"/></g>
    <path fill="#ff7aa0" d="M14.7 22.4h2.6L16 23.9z"/>
    <path d="M16 23.9v1M14.3 25.4q1.7 1 1.7-.5q0 1.5 1.7.5" fill="none" stroke="#2b2140" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ff9db4" opacity=".9"><ellipse cx="9.6" cy="23" rx="2.2" ry="1.35"/><ellipse cx="22.4" cy="23" rx="2.2" ry="1.35"/></g>
  </g>
  <circle cx="256" cy="236" r="128" fill="url(#glass)"/>
  <circle cx="256" cy="236" r="125" fill="none" stroke="url(#rim)" stroke-width="7"/>
  <!-- glossy highlights: a big curved one top-left, a small spark bottom-right -->
  <path d="M168 196a94 94 0 0 1 72-74" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="16" stroke-linecap="round"/>
  <circle cx="186" cy="232" r="7" fill="#fff" opacity=".7"/>
  <ellipse cx="322" cy="318" rx="16" ry="8" transform="rotate(-40 322 318)" fill="#fff" opacity=".35"/>
</svg>
