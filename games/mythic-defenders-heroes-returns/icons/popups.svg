<svg xmlns="http://www.w3.org/2000/svg" width="384" height="32" viewBox="0 0 384 32" fill="#fff" stroke="none">
  <!-- Floating-number popup icons. 12 cells × 32px, order = POPUP_ICONS in src/game/textures.ts.
       Drawn white; the game tints each to the popup colour. Black parts stay black under tint. -->
  <!-- 0 sword -->
  <g transform="translate(0 0)" stroke="#fff" stroke-linecap="round" fill="none">
    <path d="M10 22 L25 7" stroke-width="4.5"/>
    <path d="M6 18 L14 26" stroke-width="3.5"/>
    <circle cx="5.5" cy="26.5" r="3" fill="#fff" stroke="none"/>
  </g>
  <!-- 1 star -->
  <path transform="translate(32 0)" d="M16 2 L19.5 12.5 L30 16 L19.5 19.5 L16 30 L12.5 19.5 L2 16 L12.5 12.5 Z"/>
  <!-- 2 skull -->
  <g transform="translate(64 0)">
    <circle cx="16" cy="13" r="11"/>
    <rect x="9" y="20" width="14" height="9" rx="2"/>
    <circle cx="11.5" cy="13" r="3" fill="#000"/>
    <circle cx="20.5" cy="13" r="3" fill="#000"/>
    <path d="M16 17 L14.5 20 L17.5 20 Z" fill="#000"/>
    <path d="M13 24v4M16 24v4M19 24v4" stroke="#000" stroke-width="1.5" fill="none"/>
  </g>
  <!-- 3 heart -->
  <path transform="translate(96 0)" d="M16 29 C6 21 2 15 2 10 A7 7 0 0 1 16 8 A7 7 0 0 1 30 10 C30 15 26 21 16 29 Z"/>
  <!-- 4 drop -->
  <path transform="translate(128 0)" d="M16 2 C16 2 6 14 6 20 A10 10 0 0 0 26 20 C26 14 16 2 16 2 Z"/>
  <!-- 5 snow -->
  <g transform="translate(160 0)" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M16 3v26M4.7 9.5l22.6 13M27.3 9.5L4.7 22.5"/>
    <path d="M12 6l4 4 4-4M12 26l4-4 4 4" stroke-width="2.5"/>
  </g>
  <!-- 6 bolt -->
  <path transform="translate(192 0)" d="M18 2 L6 18 L14 18 L12 30 L26 13 L18 13 Z"/>
  <!-- 7 target -->
  <g transform="translate(224 0)">
    <circle cx="16" cy="16" r="11" stroke="#fff" stroke-width="3.5" fill="none"/>
    <circle cx="16" cy="16" r="4"/>
  </g>
  <!-- 8 coin -->
  <g transform="translate(256 0)">
    <circle cx="16" cy="16" r="13"/>
    <circle cx="16" cy="16" r="9" stroke="#000" stroke-opacity="0.35" stroke-width="2.5" fill="none"/>
    <path d="M16 10 L17.6 14.4 L22 16 L17.6 17.6 L16 22 L14.4 17.6 L10 16 L14.4 14.4 Z" fill="#000" fill-opacity="0.35"/>
  </g>
  <!-- 9 soul (wisp) -->
  <path transform="translate(288 0)" d="M16 2 C11 9 6 13 6 20 A10 10 0 0 0 26 20 C26 15 24 12 21 9 C21 12 19 14 18 13 C18 9 17 5 16 2 Z"/>
  <!-- 10 up (double chevron) -->
  <g transform="translate(320 0)">
    <path d="M16 3 L28 15 L23 15 L16 8 L9 15 L4 15 Z"/>
    <path d="M16 15 L28 27 L23 27 L16 20 L9 27 L4 27 Z"/>
  </g>
  <!-- 11 miss (swish) -->
  <g transform="translate(352 0)" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M4 21 Q10 12 18 8"/>
    <path d="M10 28 Q18 20 28 12"/>
  </g>
</svg>
