<!DOCTYPE html>
<html lang="en">
<head><script src="/perf.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#07070d" />
  <title>NEON STACK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2307070d'/%3E%3Crect x='6' y='18' width='20' height='5' rx='1.5' fill='%2338f0ff'/%3E%3Crect x='9' y='12' width='14' height='5' rx='1.5' fill='%234e8bff'/%3E%3Crect x='12' y='6' width='8' height='5' rx='1.5' fill='%23ff4ecd'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" />
  <script type="module" crossorigin src="./assets/index-DwqXXw4U.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-sl8tL8Ri.css">
<script>/* offline play: games.arcadedeck.net/sw.js (shared, one cache per game) */if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js',{scope:'./'}).then(()=>navigator.serviceWorker.ready).then(r=>r.active&&r.active.postMessage([location.origin+location.pathname,...performance.getEntriesByType('resource').map(e=>e.name)])).catch(()=>{})})</script>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <!-- live HUD -->
    <div id="hud" class="hidden">
      <div id="score">0</div>
      <div id="combo" class="hidden"></div>
    </div>

    <!-- top-right controls -->
    <button id="lang" class="icon-btn lang-btn hidden" data-i18n="lang" data-i18n-aria="langBtn" aria-label="language">EN</button>
    <button id="mute" class="icon-btn hidden" data-i18n-aria="mute" aria-label="toggle sound">&#128266;</button>

    <!-- loading screen (shown first) -->
    <div id="loading" class="overlay">
      <h1 class="logo">NEON<span>STACK</span></h1>
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
      <p class="loadpct"><span id="load-pct">0</span>%</p>
      <p class="hint" data-i18n="loading">loading&hellip;</p>
    </div>

    <!-- menu screen -->
    <div id="menu" class="overlay hidden">
      <h1 class="logo">NEON<span>STACK</span></h1>
      <p class="tag" data-i18n="tag">Stack the slabs. Don't miss.</p>
      <button id="start" class="btn" data-i18n="play">PLAY</button>
      <p class="hint" data-i18n="hint">tap to drop</p>
      <p class="best"><span data-i18n="best">Best</span>: <span id="menu-best">0</span></p>
    </div>

    <!-- game over screen -->
    <div id="gameover" class="overlay hidden">
      <h2 class="go-title" data-i18n="gameover">GAME OVER</h2>
      <div class="go-stats">
        <div class="stat"><span class="stat-num" id="final-score">0</span><span class="stat-label" data-i18n="score">SCORE</span></div>
        <div class="stat"><span class="stat-num" id="final-best">0</span><span class="stat-label" data-i18n="bestLabel">BEST</span></div>
      </div>
      <p id="newbest" class="newbest hidden" data-i18n="newbest">NEW BEST!</p>
      <button id="restart" class="btn" data-i18n="restart">PLAY AGAIN</button>
      <button id="to-menu" class="btn btn-ghost" data-i18n="menu">MAIN MENU</button>
    </div>
  </div>

</body>
</html>
