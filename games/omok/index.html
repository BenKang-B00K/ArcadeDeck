<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="description" content="Play Omok (Gomoku / Five-in-a-row) against AI or a friend">
    <meta name="theme-color" content="#2a2521">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <title>Omok</title>
  <script type="module" crossorigin src="./assets/index-DCupDiYL.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B_z06JKR.css">
</head>
<body>
    <a href="#board" class="skip-link" aria-label="Skip to game board">Skip to Board</a>
    <div id="app-container" class="skin-default" role="application" aria-label="Omok Game">

        <!-- Loading Screen -->
        <div id="loading-screen" role="status" aria-live="polite">
            <div class="spinner" aria-hidden="true"></div>
            <p data-i18n="loading">Loading...</p>
        </div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" style="display: none;" role="region" aria-label="Lobby">
            <div id="lobby-hero" class="has-art" aria-hidden="true"></div>
            <h1 id="lobby-title"><img id="wordmark" src="./art/wordmark-en.webp" alt="Omok" width="288" height="96"></h1>
            <p id="lobby-tagline" data-i18n="tagline">Five in a row wins</p>

            <div id="stats-display" aria-live="polite"></div>

            <div id="mode-select" role="group" aria-label="Game mode">
                <label data-i18n="mode">Mode:</label>
                <div class="mode-buttons">
                    <button class="mode-btn active" data-mode="AI" data-i18n="vsAI" aria-pressed="true">Vs AI</button>
                    <button class="mode-btn" data-mode="LOCAL" data-i18n="twoPlayer" aria-pressed="false">2 Player</button>
                    <button class="mode-btn" data-mode="ONLINE" data-i18n="phoneLink" aria-pressed="false">Phone link</button>
                </div>
            </div>

            <div id="difficulty-select" role="group" aria-label="Difficulty">
                <label data-i18n="difficulty">Difficulty:</label>
                <div class="difficulty-buttons">
                    <button class="diff-btn" data-diff="EASY" data-i18n="easy" aria-pressed="false">Easy</button>
                    <button class="diff-btn" data-diff="BEGINNER" data-i18n="beginner" aria-pressed="false">Beginner</button>
                    <button class="diff-btn active" data-diff="NORMAL" data-i18n="normal" aria-pressed="true">Normal</button>
                    <button class="diff-btn" data-diff="ADVANCED" data-i18n="advanced" aria-pressed="false">Advanced</button>
                    <button class="diff-btn" data-diff="HARD" data-i18n="hard" aria-pressed="false">Hard</button>
                    <button class="diff-btn" data-diff="EXPERT" data-i18n="expert" aria-pressed="false">Expert</button>
                    <button class="diff-btn" data-diff="MASTER" data-i18n="master" aria-pressed="false">Master</button>
                    <button class="diff-btn" data-diff="AUTO" data-i18n="auto" aria-pressed="false">Auto</button>
                </div>
            </div>

            <div id="color-select" role="group" aria-label="Color selection">
                <label data-i18n="playAs">Play as:</label>
                <div class="color-buttons">
                    <button class="color-btn active" data-color="RANDOM" data-i18n="random" aria-pressed="true">Random</button>
                    <button class="color-btn" data-color="BLACK" data-i18n="blackFirst" aria-pressed="false">Black (First)</button>
                    <button class="color-btn" data-color="WHITE" data-i18n="whiteSecond" aria-pressed="false">White (Second)</button>
                </div>
            </div>

            <button id="find-match-btn" data-i18n="startGame">Start Game</button>

            <div id="lobby-footer">
                <div id="lobby-options">
                    <button id="theme-toggle-btn" aria-label="Toggle theme">Theme: Dark</button>
                    <div id="lang-select" role="group" aria-label="Language">
                        <button class="lang-btn active" data-lang="en">EN</button>
                        <button class="lang-btn" data-lang="ko">KO</button>
                        <button class="lang-btn" data-lang="ja">JA</button>
                    </div>
                </div>
                <div id="lobby-extra">
                    <button id="history-btn" data-i18n="gameHistory">Game History</button>
                    <button id="reset-stats-btn" data-i18n="resetStats">Reset Stats</button>
                </div>
            </div>
        </div>

        <!-- History Screen -->
        <div id="history-screen" style="display: none;" role="region" aria-label="Game History">
            <h1 data-i18n="gameHistory">Game History</h1>
            <div id="history-list" role="list"></div>
            <button id="history-back-btn" data-i18n="back">Back</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" style="display: none;" role="region" aria-label="Game Board">
            <div id="game-info">
                <h1 data-i18n="title">Omok</h1>
                <p id="status" aria-live="polite" data-i18n="ready">Ready</p>
                <p id="player-info" aria-live="polite"></p>
            </div>
            <div id="board-wrapper">
                <div id="board" role="grid" aria-label="Game board"></div>
            </div>
            <div id="game-controls" role="toolbar" aria-label="Game controls">
                <button id="undo-btn" disabled data-i18n="undo" aria-label="Undo last move">Undo</button>
                <button id="move-num-btn" aria-label="Toggle move numbers" aria-pressed="false">123</button>
                <button id="forbidden-toggle-btn" aria-label="Toggle forbidden markers" aria-pressed="true">X</button>
                <button id="sound-toggle-btn" data-i18n="sound" aria-label="Toggle sound" aria-pressed="true">Sound</button>
                <button id="save-btn" data-i18n="save" aria-label="Save game">Save</button>
                <button id="load-btn" data-i18n="load" aria-label="Load game">Load</button>
                <button id="surrender-btn" data-i18n="surrender" aria-label="Surrender">Surrender</button>
            </div>

            <!-- Result Overlay -->
            <div id="result-screen" style="display: none;" role="dialog" aria-modal="true" aria-label="Game result">
                <div class="result-box">
                    <h2 id="result-message" aria-live="assertive"></h2>
                    <p id="rematch-wait" data-i18n="waitHost" hidden>Waiting for the host to start the next game…</p>
                    <button id="rematch-btn" data-i18n="rematch" hidden>Rematch</button>
                    <button id="back-to-lobby-btn" data-i18n="backToLobby">Back to Lobby</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./coop.js"></script>
</body>
</html>
