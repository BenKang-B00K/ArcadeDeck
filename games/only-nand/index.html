const stars = (n,par) => n <= par ? 3 : (n <= par+2 ? 2 : 1);
const starText = s => '★'.repeat(s) + '☆'.repeat(3-s);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const bbox = pts => [Math.min(...pts.map(p => p[0])), Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[0])), Math.max(...pts.map(p => p[1]))];
// Outline around parts, with room for the label above each part.
const gatesBox = gs => { const b = bbox(gs.flatMap(g => [[g.x, g.y], [g.x + GW, g.y + gh(PARTS[g.type])]])); return [b[0]-14, b[1]-38, b[2]+14, b[3]+16]; };
const RC = ['#7FD6C8', '#F2A65A', '#B69CF2', '#F28CA6', '#9CD66B', '#6BB8F2'];   // region colours

// Touch targets scale with how small the board is drawn (phones render it at ~0.35x).
let boardScale = 1;
const pinR = () => clamp(22/boardScale, 15, 30);
function measure(){
  boardScale = svg.getBoundingClientRect().width / view.w || 1;
  svg.style.setProperty('--wire-hit', clamp(30/boardScale, 18, 44));
}
new ResizeObserver(measure).observe(svg);
function applyView(){
  view.x = clamp(view.x, 0, Math.max(0, W - view.w)); view.y = clamp(view.y, 0, Math.max(0, H - view.h));
  svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
  measure();
}
function setBoard(w, h, v = {x:0, y:0, w}){
  W = w; H = h;
  svg.querySelectorAll(':scope > rect').forEach(r => { r.setAttribute('width', W); r.setAttribute('height', H); });
  Object.assign(view, v, {h: v.w*RATIO});
  applyView();
}
// Zoom so the board point under (cx, cy) stays put. Sandbox only.
function zoomTo(w, cx, cy){
  const r = svg.getBoundingClientRect(), fx = (cx - r.left)/r.width, fy = (cy - r.top)/r.height;
  const px = view.x + fx*view.w, py = view.y + fy*view.h;
  view.w = clamp(w, 400, W); view.h = view.w*RATIO;
  view.x = px - fx*view.w; view.y = py - fy*view.h;
  applyView();
}
const zoomBy = f => { const r = svg.getBoundingClientRect(); zoomTo(view.w*f, r.left + r.width/2, r.top + r.height/2); };
const zoomFit = () => { Object.assign(view, {x:0, y:0, w:W, h:W*RATIO}); applyView(); };

function pinPos(pin){
  const [nid, pk] = pin.split(':');
  const kind = pk[0], k = +pk.slice(1), L = cur();
  if (nid.startsWith('IN'))  return {x:86,  y:termY(+nid.slice(2), L.ins.length)};
  if (nid.startsWith('OUT')) return {x:W-86, y:termY(+nid.slice(3), L.outs.length)};
  const g = circ().gates.find(q => q.id === nid); if (!g) return null;
  const P = PARTS[g.type], h = gh(P), n = kind === 'i' ? P.ins.length : P.outs.length;
  return {x: g.x + (kind === 'i' ? 0 : GW), y: g.y + h*(k+1)/(n+1)};
}

// Nearest pin within radius R (board units). Geometry, not DOM, so overlapping hit areas pick the closest.
function nearestPin(p, R, skip){
  const L = cur(), ids = isSandbox() ? [] : [...L.ins.map((_,k) => `IN${k}:o0`), ...L.outs.map((_,k) => `OUT${k}:i0`)];
  circ().gates.forEach(g => { const P = PARTS[g.type]; P.ins.forEach((_,k) => ids.push(`${g.id}:i${k}`)); P.outs.forEach((_,j) => ids.push(`${g.id}:o${j}`)); });
  let best = null, bd = R*R;
  for (const id of ids){
    if (id === skip) continue;
    const q = pinPos(id); if (!q) continue;
    const d = (q.x-p.x)**2 + (q.y-p.y)**2;
    if (d < bd){ bd = d; best = id; }
  }
  return best;
}

// prev = gate outputs from the previous step, so feedback loops (latches) keep their state.
function simulate(bits, prev){
  const c = circ(), val = {}, src = {}, sb = isSandbox();
  let si = 0;
  if (!sb) bits.forEach((b,k) => val[`IN${k}:o0`] = !!b);
  c.wires.forEach(w => src[w.to] = w.from);
  c.gates.forEach(g => g.type === 'SW' ? val[`${g.id}:o0`] = !!bits[si++] : PARTS[g.type].outs.forEach((_,j) => { const p = `${g.id}:o${j}`; val[p] = !!(prev && prev[p]); }));
  c.gates.forEach(g => { if (PARTS[g.type].clocked) PARTS[g.type].outs.forEach((_,j) => val[`${g.id}:m${j}`] = !!(prev && prev[`${g.id}:m${j}`])); });
  let stable = false;
  for (let it = 0; it < 80; it++){
    let changed = false;
    for (const g of c.gates){
      if (g.type === 'SW' || g.type === 'LAMP') continue;
      const P = PARTS[g.type];
      const args = P.ins.map((_,k) => !!val[src[`${g.id}:i${k}`]]);
      if (P.clocked){
        const clk = args[args.length-1], q = P.outs.map((_,j) => val[`${g.id}:o${j}`]), nx = clk ? null : P.next(args.slice(0,-1), q);
        P.outs.forEach((_,j) => {
          const mk = `${g.id}:m${j}`, qk = `${g.id}:o${j}`;
          if (!clk && val[mk] !== !!nx[j]){ val[mk] = !!nx[j]; changed = true; }
          if (clk && val[qk] !== val[mk]){ val[qk] = val[mk]; changed = true; }
        });
        continue;
      }
      if (P.latch){
        const [d, e] = args, qk = `${g.id}:o0`;
        if (e && val[qk] !== d){ val[qk] = d; changed = true; }
        continue;
      }
      P.f(...args).forEach((r,j) => { const p = `${g.id}:o${j}`; if (val[p] !== !!r){ val[p] = !!r; changed = true; } });
    }
    if (!changed){ stable = true; break; }
  }
  const lampIn = sb ? c.gates.filter(g => g.type === 'LAMP').map(g => `${g.id}:i0`) : cur().outs.map((_,k) => `OUT${k}:i0`);
  const outs = lampIn.map(p => src[p] ? !!val[src[p]] : null);
  return {val, src, outs, stable};
}

function rows(){
  const L = cur(), n = L.ins.length, list = [];
  if (L.seq){                                       // memory levels: run the steps in order, carrying state
    let val = null;
    return L.seq.map(step => {
      const [i, o] = step.split('>'), bits = [...i].map(ch => ch === '1');
      const sim = simulate(bits, val), exp = [...o].map(ch => ch === 'x' ? null : ch === '1');
      val = sim.val;
      return {bits, exp, got:sim.outs, stable:sim.stable, ok: sim.stable && exp.every((e,j) => e === null || sim.outs[j] === e)};
    });
  }
  for (let r = 0; r < (1<<n); r++){
    const bits = L.ins.map((_,k) => !!((r >> (n-1-k)) & 1));
    const exp = L.f(...bits).map(Boolean);
    const sim = simulate(bits);
    const ok = sim.stable && sim.outs.every((o,j) => o === exp[j]);
    list.push({bits, exp, got:sim.outs, stable:sim.stable, ok});
  }
  return list;
}

/* ---------- rendering ---------- */
// PCB-style trace: horizontal / vertical runs with rounded corners. Backward wires detour around via a side lane.
function curve(a,b){
  const dx = b.x - a.x, pts = dx >= 24 ? [a, {x:a.x+dx/2, y:a.y}, {x:a.x+dx/2, y:b.y}, b]
    : (my => [a, {x:a.x+16, y:a.y}, {x:a.x+16, y:my}, {x:b.x-16, y:my}, {x:b.x-16, y:b.y}, b])
      (Math.abs(b.y-a.y) < 40 ? Math.max(a.y, b.y) + 36 : (a.y+b.y)/2);
  let d = `M${a.x} ${a.y}`;
  for (let i = 1; i < pts.length-1; i++){
    const p = pts[i], q = pts[i-1], n = pts[i+1];
    const k = Math.min(12, Math.hypot(p.x-q.x, p.y-q.y)/2, Math.hypot(n.x-p.x, n.y-p.y)/2);
    const t = (u, v) => { const l = Math.hypot(v.x-u.x, v.y-u.y) || 1; return `${u.x+(v.x-u.x)*k/l} ${u.y+(v.y-u.y)*k/l}`; };
    d += ` L${t(p,q)} Q${p.x} ${p.y} ${t(p,n)}`;
  }
  return d + ` L${b.x} ${b.y}`;
}
const wirePath = (d, on, extra = '') =>
  (on ? `<path d="${d}" class="wire-glow"/>` : '') + `<path d="${d}" class="wire ${on?'hi':'lo'} ${extra}" pointer-events="none"/>` + (on ? `<path d="${d}" class="wire-flow"/>` : '');

function switchSvg(attr, k, y, name, on, hitH = 34, nudge = false){
  const kx = on ? 53 : 31;
  return (nudge ? `<rect class="nudge" x="7" y="${y-24}" width="70" height="48" rx="24"/>` : '') + `<text class="tname" x="42" y="${y-26}" text-anchor="middle">${name}</text>` +
    `<rect class="switch ${on?'on':''}" x="14" y="${y-17}" width="56" height="34" rx="17"/>` +
    `<circle class="knob ${on?'on':''}" cx="${kx}" cy="${y}" r="13"/>` +
    `<text class="klabel ${on?'on':''}" x="${kx}" y="${y+4.5}">${on?1:0}</text>` +
    `<line class="lead" x1="70" y1="${y}" x2="86" y2="${y}"/>` +
    `<rect class="switch-hit" ${attr}="${k}" x="2" y="${y-hitH}" width="74" height="${hitH*2}"/>`;
}
function lampSvg(cx, y, name, on, none){
  return (on ? `<circle cx="${cx}" cy="${y}" r="38" fill="url(#glowG)" pointer-events="none"/>` : '') +
    `<circle class="lamp ${on?'on':''} ${none?'off-none':''}" cx="${cx}" cy="${y}" r="17"/>` +
    `<text class="tname" x="${cx}" y="${y-26}" text-anchor="middle">${name}</text>`;
}

function renderBoard(){
  const L = cur(), c = circ();
  if (isSandbox()) state.inputs = c.gates.filter(g => g.type === 'SW').map(g => !!g.on);
  // Dragging only moves parts, so the logic result from the last render is still valid.
  const keep = L.seq || isSandbox();
  const sim = (state.drag && state.sim) || (state.sim = simulate(state.inputs, keep && state.sim ? state.sim.val : null));
  let s = '';
  if (L.display === 'seg7'){
    const ox = 770, oy = 245, w = 72, h = 130, k = 12, half = h/2 - 12;
    const R_ = [[ox+8, oy, w-16, k], [ox+w-k, oy+8, k, half], [ox+w-k, oy+h/2+4, k, half], [ox+8, oy+h-k, w-16, k], [ox, oy+h/2+4, k, half], [ox, oy+8, k, half], [ox+8, oy+h/2-k/2, w-16, k]];
    s += `<rect class="seg-box" x="${ox-16}" y="${oy-16}" width="${w+32}" height="${h+32}" rx="12"/>` +
      R_.map(([x,y,ww,hh], j) => `<rect class="seg ${sim.outs[j] ? 'on' : ''}" x="${x}" y="${y}" width="${ww}" height="${hh}" rx="${k/2}"/>`).join('');
  }

  // Named free-form regions sit under everything; only their label takes taps.
  const fs = clamp(15/boardScale, 15, 42);
  (c.regions || []).forEach((r, i) => {
    const sel = state.sel?.kind === 'region' && state.sel.id === r.id, rc = RC[i % RC.length];
    const [x0, y0] = bbox(r.pts), w = [...r.name].reduce((a, ch) => a + (ch.charCodeAt(0) > 255 ? 1 : .58), 0)*fs + fs;
    s += `<path class="region ${sel?'sel':''}" style="--rc:${rc}" d="M${r.pts.map(p => p.join(' ')).join('L')}Z"/>` +
      `<g class="rlabel" style="--rc:${rc}" data-region="${r.id}"><title>${esc(t('renameRegion'))}</title><rect x="${x0}" y="${y0 - fs*1.7}" width="${w}" height="${fs*1.6}" rx="${fs*.4}"/>` +
      `<text x="${x0 + fs/2}" y="${y0 - fs*.55}" style="font-size:${fs}px">${esc(r.name)}</text></g>`;
  });

  // Empty space inside a box-selected group is a drag handle for the whole group (wires and parts on top still win).
  if (state.sel?.kind === 'group'){
    const [x0, y0, x1, y1] = gatesBox(c.gates.filter(g => state.sel.ids.includes(g.id)));
    s += `<rect class="grp-hit" data-grp="1" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="14"/>`;
  }

  c.wires.forEach((w,i) => {
    const a = pinPos(w.from), b = pinPos(w.to); if (!a || !b) return;
    const sel = state.sel && state.sel.kind === 'wire' && state.sel.idx === i;
    const d = curve(a,b);
    s += wirePath(d, sim.val[w.from], sel ? 'sel' : '');
    s += `<path d="${d}" class="wire-hit" data-wire="${i}"/>`;
  });

  if (!isSandbox()){
  const hitH = Math.min(34, H/(L.ins.length+1)/2 - 2), nx = isLearn() ? learnNext() : -1;
  L.ins.forEach((name,k) => {
    const y = termY(k, L.ins.length), on = state.inputs[k];
    const nudge = nx >= 0 && !!((nx >> (L.ins.length-1-k)) & 1) !== on;
    s += switchSvg('data-toggle', k, y, name, on, hitH, nudge);
    s += pinSvg(`IN${k}:o0`, 86, y, on);
  });

  L.outs.forEach((name,k) => {
    const y = termY(k, L.outs.length), v = sim.outs[k];
    s += `<line class="lead" x1="${W-86}" y1="${y}" x2="${W-68}" y2="${y}"/>`;
    s += lampSvg(W-50, y, name, v, v === null);
    s += pinSvg(`OUT${k}:i0`, W-86, y, !!v);
  });
  }
  const sws = c.gates.filter(g => g.type === 'SW'), lamps = c.gates.filter(g => g.type === 'LAMP');

  c.gates.forEach(g => {
    const P = PARTS[g.type], h = gh(P);
    const sel = state.sel && (state.sel.kind === 'gate' ? state.sel.id === g.id : state.sel.kind === 'group' && state.sel.ids.includes(g.id));
    s += `<g class="gate ${sel?'sel':''}" data-gate="${g.id}" transform="translate(${g.x} ${g.y})">`;
    if (g.type === 'SW'){
      const on = !!g.on, kx = on ? 53 : 31;
      s += `<rect class="io-hit" x="4" y="-20" width="78" height="${h+24}" rx="10"/>` +
        `<text class="tname" x="42" y="-4" text-anchor="middle">${ioName(sws.indexOf(g))}</text>` +
        `<rect class="switch ${on?'on':''}" x="14" y="8" width="56" height="34" rx="17"/>` +
        `<circle class="knob ${on?'on':''}" cx="${kx}" cy="25" r="13"/><text class="klabel ${on?'on':''}" x="${kx}" y="29.5">${on?1:0}</text>` +
        `<line class="lead" x1="70" y1="25" x2="${GW}" y2="25"/>` + pinSvg(`${g.id}:o0`, GW, 25, on) + '</g>';
      return;
    }
    if (g.type === 'LAMP'){
      const k = lamps.indexOf(g), v = sim.outs[k];
      s += `<rect class="io-hit" x="14" y="-20" width="74" height="${h+24}" rx="10"/>` +
        `<line class="lead" x1="0" y1="25" x2="33" y2="25"/>` + lampSvg(50, 25, 'Y' + (k+1), v, v === null) + pinSvg(`${g.id}:i0`, 0, 25, !!v) + '</g>';
      return;
    }
    P.ins.forEach((_,k) => { const y = h*(k+1)/(P.ins.length+1); s += `<line class="lead" x1="0" y1="${y}" x2="14" y2="${y}"/>`; });
    P.outs.forEach((_,j) => { const y = h*(j+1)/(P.outs.length+1); s += `<line class="lead" x1="${g.type==='NAND'?86:82}" y1="${y}" x2="${GW}" y2="${y}"/>`; });
    if (g.type === 'NAND'){
      const r = h/2, d = `M14 0 H${74-r} A${r} ${r} 0 0 1 ${74-r} ${h} H14 Z`;
      s += `<path class="shade" d="${d}" transform="translate(3 5)"/>`;
      s += `<path class="body nand" d="${d}"/>`;
      s += `<circle class="bubble" cx="80" cy="${h/2}" r="6"/>`;
      s += `<text class="glabel" x="40" y="${h/2+5}" style="font-size:12px">NAND</text>`;
    } else {
      s += `<rect class="shade" x="17" y="5" width="68" height="${h}" rx="6"/>`;
      s += `<rect class="body" x="14" y="0" width="68" height="${h}" rx="6"/>`;
      if (P.pinLabels){
        s += `<text class="gtitle" x="48" y="-8">${P.short}</text>`;
        P.ins.forEach((n,k) => s += `<text class="plabel" x="19" y="${h*(k+1)/(P.ins.length+1)+3.5}">${n}</text>`);
        P.outs.forEach((n,j) => s += `<text class="plabel" x="77" y="${h*(j+1)/(P.outs.length+1)+3.5}" text-anchor="end">${n}</text>`);
      } else {
        s += `<text class="glabel" x="48" y="${h/2+5}">${P.label}</text>`;
      }
    }
    P.ins.forEach((_,k) => { const p = `${g.id}:i${k}`; s += pinSvg(p, 0, h*(k+1)/(P.ins.length+1), !!sim.val[sim.src[p]]); });
    P.outs.forEach((_,j) => { const p = `${g.id}:o${j}`; s += pinSvg(p, GW, h*(j+1)/(P.outs.length+1), !!sim.val[p]); });
    if (isChip(g.type)){
      s += `<g class="zoom-btn" data-zoom="${g.id}"><circle class="zhit" cx="82" cy="${h}" r="20"/><circle class="zbg" cx="82" cy="${h}" r="12"/><circle class="mag" cx="80" cy="${h-2}" r="4.5"/><line class="mag" x1="83.5" y1="${h+1.5}" x2="88" y2="${h+6}"/></g>`;
    }
    s += `</g>`;
  });

  if (state.sel?.kind === 'group'){
    const [x0, y0, x1, y1] = gatesBox(c.gates.filter(g => state.sel.ids.includes(g.id)));
    s += `<rect class="grp-box" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="14"/>`;
  }
  const dr = state.draw;
  if (dr?.kind === 'box' && dr.pts[1]){
    const [x0, y0, x1, y1] = bbox(dr.pts);
    s += `<rect class="marquee" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}"/>`;
  } else if (dr?.kind === 'region') s += `<path class="lasso" d="M${dr.pts.map(p => p.join(' ')).join('L')}"/>`;

  if (state.pending){
    const pp = pinPos(state.pending);
    if (pp){
      s += `<circle class="pending" cx="${pp.x}" cy="${pp.y}" r="11"/>`;
      if (state.ghost && state.wireDrag){
        s += `<path class="ghost-wire" d="${isSrc(state.pending) ? curve(pp, state.ghost) : curve(state.ghost, pp)}"/>`;
      }
    }
  }
  layer.innerHTML = s;
}

// Pin hit circles are only for the hover cursor; hit-testing uses nearestPin().
function pinSvg(id, x, y, on){
  return `<circle class="pin ${on?'hi':''}" cx="${x}" cy="${y}" r="5"/><circle class="pin-hit" cx="${x}" cy="${y}" r="15"/>`;
}

// Coalesce high-rate pointermove renders to one per frame.
let raf = 0;
const boardSoon = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; renderBoard(); }); };

function renderPanel(){
  const L = cur(), c = circ(), list = isSandbox() ? null : rows();
  $('lvlNum').textContent = isSandbox() ? t('sbTag') : t('levelN', state.li+1);
  $('lvlTitle').textContent = lt(L, 'title');
  // First sentence = headline, rest = description (works for en/ko ". " and ja "。")

  $('hintText').innerHTML = rich(lt(L, 'hint') || '', L);
  renderCoach();
  $('delBtn').disabled = !state.sel;
  $('insideBtn').disabled = !(state.sel && state.sel.kind === 'gate' && isChip((c.gates.find(g => g.id === state.sel.id)||{}).type));
  $('ruleCard').hidden = !L.rule;
  if (L.rule) $('ruleText').innerHTML = rich([L.rule.nand && t('ruleNand'), L.rule.max && t('ruleMax', L.rule.max)].filter(Boolean).join(' \u00b7 '), null);
  if (isSandbox()){
    const n = L.ins.length;
    $('meta').textContent = t('sbMeta', n, L.outs.length, c.gates.filter(g => isChip(g.type) || g.type === 'NAND').length);
    let tb = `<caption class="tt-cap">${esc(t(n > 5 ? 'sbTooBig' : 'sbTableCap'))}</caption>`;
    if (n <= 5){
      tb += '<thead><tr>' + L.ins.map(x => `<th>${x}</th>`).join('') + L.outs.map((x,j) => `<th${j?'':' class="grp"'}>${x}</th>`).join('') + '</tr></thead><tbody>';
      for (let r = 0; r < 1 << n; r++){
        const bits = L.ins.map((_,k) => !!((r >> (n-1-k)) & 1)), sim = simulate(bits);
        const live = bits.every((b,k) => b === !!state.inputs[k]);
        tb += `<tr class="${live?'live':''}">` + bits.map(b => `<td>${+b}</td>`).join('') +
          sim.outs.map((o,j) => `<td${j?'':' class="grp"'}>${!sim.stable ? '?' : o === null ? '–' : +o}</td>`).join('') + '</tr>';
      }
      tb += '</tbody>';
    }
    $('tt').innerHTML = tb;
    $('status').textContent = ''; $('status').className = '';
    if (document.activeElement !== $('sbTitle')) $('sbTitle').value = c.title || '';
    $('copyBtn').disabled = !selIds().length;
    $('pasteBtn').disabled = !state.clip;
    const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    const sl = slots();
    $('slots').innerHTML = sl.length ? sl.map((s, i) => `<li><button class="ghost" data-load="${i}">${esc(s.name)}<small>${new Date(s.at).toLocaleDateString(settings.lang)}</small></button>` +
      `<button class="icon-btn" data-del="${i}" aria-label="${esc(t('delSave', s.name))}" data-tip="${esc(t('delSave', s.name))}">${X}</button></li>`).join('') : `<li><p class="sb-empty">${esc(t('noSaves'))}</p></li>`;
    const rg = c.regions || [];
    $('regionList').innerHTML = rg.length ? rg.map((r, i) => `<li><button class="ghost" data-goto="${r.id}"><span class="dot" style="background:${RC[i % RC.length]}"></span>${esc(r.name)}</button></li>`).join('')
      : `<li><p class="sb-empty">${esc(t('noRegions'))}</p></li>`;
    return;
  }
  if (isLearn()){
    const nx = learnNext();
    $('meta').innerHTML = esc(t('tried', state.seen.size, list.length)) + '<span class="next">' +
      (nx < 0 ? esc(t('allTried')) : rich(t('nextTry', L.ins.map((n,k) => `${n} = ${(nx >> (L.ins.length-1-k)) & 1}`).join(', ')), L, true)) + '</span>';
    let tb = `<caption class="tt-cap">${esc(t('ttExplain'))}</caption><thead><tr>` + L.ins.map(n=>`<th>${n}</th>`).join('') + '<th class="grp">Y</th></tr></thead><tbody>';
    list.forEach((r,i) => {
      const live = r.bits.every((b,k) => b === state.inputs[k]);
      tb += `<tr class="${live?'live':''} ${state.focusRow===i?'focus':''}">` + r.bits.map(b=>`<td>${+b}</td>`).join('') +
           `<td class="grp">${state.seen.has(i) ? +r.exp[0] : '?'}</td></tr>`;
    });
    $('tt').innerHTML = tb + '</tbody>';
    $('status').textContent = state.msg;
    $('status').className = state.msgBad ? 'bad' : '';
    return;
  }
  $('meta').textContent = t('partsUsed', c.gates.length, L.par, prog.best[L.id]);

  const nI = L.ins.length, nO = L.outs.length, seq = !!L.seq;
  const isLive = r => !seq && r.bits.every((b,k) => b === state.inputs[k]);
  // Huge tables (4-bit levels): show only the live row plus mismatches after a test.
  const shown = list.length <= 64 ? list : list.filter(r => isLive(r) || (state.tested && !r.ok)).slice(0, 17);
  const cap = seq ? t('seqCap') : list.length > 64 ? t('bigTable', list.length) : '';
  let tb = (cap ? `<caption class="tt-cap">${esc(cap)}</caption>` : '') + `<thead><tr>${seq ? '<th></th>' : ''}<th colspan="${nI}">${t('thInputs')}</th><th class="grp" colspan="${nO}">${t('thTarget')}</th><th class="grp" colspan="${nO}">${t('thYours')}</th>${state.tested?'<th></th>':''}</tr><tr>`;
  if (seq) tb += `<th>#</th>`;
  L.ins.forEach(n => tb += `<th>${n}</th>`);
  L.outs.forEach((n,j) => tb += `<th${j===0?' class="grp"':''}>${n}</th>`);
  L.outs.forEach((n,j) => tb += `<th${j===0?' class="grp"':''}>${n}</th>`);
  if (state.tested) tb += `<th aria-label="${t('thMatch')}"></th>`;
  tb += '</tr></thead><tbody>';
  shown.forEach(r => {
    tb += `<tr class="${isLive(r)?'live':''}">` + (seq ? `<td class="step">${list.indexOf(r)+1}</td>` : '');
    r.bits.forEach(b => tb += `<td>${+b}</td>`);
    r.exp.forEach((e,j) => tb += `<td${j===0?' class="grp"':''}>${e === null ? '·' : +e}</td>`);
    r.got.forEach((g,j) => {
      const txt = !r.stable ? '?' : (g === null ? '–' : +g);
      const miss = state.tested && ((r.exp[j] !== null && g !== r.exp[j]) || !r.stable);
      tb += `<td class="${j===0?'grp':''} ${miss?'miss':''}">${txt}</td>`;
    });
    if (state.tested) tb += `<td class="${r.ok?'mark-ok':'mark-bad'}">${r.ok?'✓':'✗'}</td>`;
    tb += '</tr>';
  });
  $('tt').innerHTML = tb + '</tbody>';

  $('status').textContent = state.msg;
  $('status').className = state.msgBad ? 'bad' : '';
}

// First unseen truth-table row on the intro level, or -1 when all were tried.
function learnNext(){ for (let r = 0; r < (1 << cur().ins.length); r++) if (!state.seen.has(r)) return r; return -1; }

// Step-by-step guidance for newcomers on the first build levels, until that level is solved once.
function renderCoach(){
  const L = cur(), c = circ(), el = $('coach');
  let step = null;
  if (isSandbox()){
    el.hidden = !state.mode;
    if (state.mode) el.textContent = t(state.mode + 'Hint');
    return;
  }
  if (['not','and','or'].includes(L.id) && !isSandbox() && prog.best[L.id] == null){
    const unwired = L.outs.filter((_,k) => (state.sim || simulate(state.inputs)).outs[k] === null);
    if (!c.gates.length) step = [1, t('coachAdd')];
    else if (!c.wires.length) step = [2, t('coachWire')];
    else if (unwired.length) step = [3, t('coachOut', unwired)];
    else step = [4, t(state.tested ? 'coachFix' : 'coachTest')];
  }
  el.hidden = !step;
  if (step) el.innerHTML = `<span class="n">${esc(t('coachStep', step[0]))}</span>${rich(step[1], L)}`;
}

function renderTools(){
  const chips = LEVELS.filter(l => l.part).map(l => l.part);
  const tools = isSandbox() ? ['SW', 'LAMP', 'NAND', ...chips]
    : cur().rule?.nand ? ['NAND'] : ['NAND', ...LEVELS.slice(0, state.li).filter(l => l.part && prog.best[l.id] != null).map(l => l.part)];
  // Sandbox lists every chip; a chip stays locked until its level is solved.
  const locked = p => partLevel(p) && prog.best[partLevel(p).id] == null;
  const desc = p => p === 'NAND' ? t('startGate') : p === 'SW' ? t('swDesc') : p === 'LAMP' ? t('lampDesc')
    : locked(p) ? LOCK + t('lockedChip', LEVELS.indexOf(partLevel(p)) + 1) : t('builtChip');
  $('tools').innerHTML = tools.map(p =>
    `<button class="tool ${p==='NAND'?'raw':''} ${PARTS[p].ins.length && PARTS[p].outs.length ? '' : 'io'}" data-tool="${p}" ${locked(p)?'disabled':''}><span class="tname">${partName(p)}</span><span class="tdesc">${desc(p)}</span></button>`
  ).join('');
}

const LOCK = '<svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
function renderLevels(){
  const chips = LEVELS.filter(l => l.part);
  $('sandboxSub').textContent = t('sandboxSub', chips.filter(l => prog.best[l.id] != null).length, chips.length);
  const solved = LEVELS.filter(l => prog.best[l.id] != null).length;
  $('progBar').style.width = `${solved/LEVELS.length*100}%`;
  $('progText').textContent = t('progress', solved, LEVELS.length);
  const card = (l, i) => {
    const open = unlocked(i), best = prog.best[l.id];
    let sub = LOCK + t('locked');
    if (open){
      const st = best != null ? stars(best,l.par) : 0;
      sub = best != null ? `<span class="stars" role="img" aria-label="${t('starsAria', st)}">${starText(st)}</span> ${t('best', best)}` : t('notSolved');
    }
    return `<li><button class="level ${best!=null?'done':''}" data-li="${i}" ${open?'':'disabled'}><span class="num">${i+1}</span><span class="lt">${lt(l,'title')}</span><span class="ls">${sub}</span>${l.part ? `<span class="lu ${best!=null?'on':''}">${t('unlocks', partName(l.part))}</span>` : ''}</button></li>`;
  };
  $('levelList').innerHTML = CHAPTERS.map(ch => {
    const items = LEVELS.map((l,i) => [l,i]).filter(([l]) => l.ch === ch), [name, desc] = t('chapters')[ch];
    const done = items.filter(([l]) => prog.best[l.id] != null).length;
    return `<section class="chapter ${ch}"><header class="ch-head"><h2>${name}</h2><span class="ch-n">${done} / ${items.length}</span><p>${desc}</p></header>` +
      `<ol class="level-list">${items.map(([l,i]) => card(l,i)).join('')}</ol></section>`;
  }).join('');
}

function render(){
  const onLevels = state.screen === 'levels';
  $('levels').hidden = !onLevels;
  $('play').hidden = onLevels;
  $('play').classList.toggle('sandbox', isSandbox());
  $('shareTop').hidden = onLevels;
  $('crumb').textContent = onLevels ? '' : isSandbox() ? t('sandbox') : t('levelOf', state.li+1, LEVELS.length);
  if (onLevels) renderLevels(); else { renderBoard(); renderPanel(); }
}

function commit(){ save(); state.tested = false; state.msg = ''; render(); }

/* ---------- actions ---------- */
function openLevel(i){
  $('inside').hidden = true; state.inside = null;
  state.li = i; state.screen = 'play'; state.sandbox = false; state.sim = null;
  setBoard(1000, 620);
  state.inputs = cur().ins.map(() => false);
  Object.assign(state, {sel:null, pending:null, ghost:null, tested:false, msg:''});
  $('hint').hidden = true; $('hintBtn').textContent = t('showHint');
  state.seen = new Set([0]); state.focusRow = -1;
  const learn = isLearn();
  $('play').classList.toggle('learn', learn);
  $('palette').hidden = learn;
  $('actions').hidden = learn;
  if (learn){
    prog.circuits[cur().id] = JSON.parse(JSON.stringify(cur().demo));
    renderQuiz();
  } else $('quiz').hidden = true;
  renderTools(); render(); window.scrollTo(0,0);
}

function openSandbox(){
  $('inside').hidden = true; state.inside = null;
  state.sandbox = true; state.screen = 'play';
  Object.assign(state, {sel:null, pending:null, ghost:null, tested:false, msg:''});
  state.inputs = cur().ins.map(() => false);
  $('hint').hidden = true; $('quiz').hidden = true;
  $('play').classList.remove('learn');
  $('palette').hidden = false; $('actions').hidden = true;
  sbx();
  setBoard(3000, 1860, {x:0, y:496, w:1400});
  renderTools(); render(); measure(); window.scrollTo(0,0);
}
$('sandboxBtn').addEventListener('click', () => { Snd.play('tap'); openSandbox(); });

function connect(a, b){
  if (isSrc(a) === isSrc(b)) return false;
  const from = isSrc(a) ? a : b, to = isSrc(a) ? b : a;
  const c = circ();
  c.wires = c.wires.filter(w => w.to !== to);
  c.wires.push({from, to});
  Snd.play('connect');
  return true;
}

function deleteSelected(){
  const c = circ(), s = state.sel; if (!s) return;
  if (s.kind === 'gate' || s.kind === 'group'){
    const ids = new Set(s.ids || [s.id]), gone = pin => ids.has(pin.split(':')[0]);
    c.gates = c.gates.filter(g => !ids.has(g.id));
    c.wires = c.wires.filter(w => !gone(w.from) && !gone(w.to));
  } else if (s.kind === 'region'){
    c.regions = c.regions.filter(r => r.id !== s.id);
  } else {
    c.wires.splice(s.idx, 1);
  }
  Snd.play('cut');
  state.sel = null; commit();
}

function toSvg(e){
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function toggleInput(k){
  state.inputs[k] = !state.inputs[k];
  Snd.play(state.inputs[k] ? 'on' : 'off');
  if (isLearn()){ state.seen.add(rowIndex(state.inputs)); renderQuiz(); }
  render();
}

// Active pointers, for two-finger pinch zoom in the sandbox.
const ptrs = new Map();
const capture = id => { try { svg.setPointerCapture(id); } catch (err) {} };  // throws if the pointer is already gone
['pointerup','pointercancel'].forEach(ev => addEventListener(ev, e => ptrs.delete(e.pointerId), {capture:true}));

svg.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.button) return;  // left / touch / pen only; right & middle don't start wires or drags
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (isSandbox() && ptrs.size === 2){
    const [a,b] = [...ptrs.values()];
    Object.assign(state, {drag:null, wireDrag:false, pending:null, pan:null, draw:null, pinch:{d:Math.hypot(a.x-b.x, a.y-b.y) || 1, w:view.w}});
    capture(e.pointerId); renderBoard(); return;
  }
  const p = toSvg(e);
  // Box select (button, B, or Shift+drag) and region drawing take over the whole board.
  if (isSandbox() && (state.mode || e.shiftKey)){
    Object.assign(state, {draw:{kind: state.mode || 'box', pts:[[Math.round(p.x), Math.round(p.y)]]}, pending:null});
    capture(e.pointerId); renderBoard(); return;
  }
  const direct = e.target.closest('[data-zoom],[data-toggle]');
  if (direct && direct.dataset.toggle){ toggleInput(+direct.dataset.toggle); return; }
  if (isLearn()) return;
  if (direct && direct.dataset.zoom){ openInside(direct.dataset.zoom); return; }

  const pin = nearestPin(p, pinR());
  if (pin){
    if (state.pending && state.pending !== pin && connect(state.pending, pin)){
      state.pending = null; commit(); return;
    }
    state.pending = pin; state.wireDrag = true; state.ghost = {x:p.x, y:p.y};
    capture(e.pointerId);
    Snd.play('select');
    renderBoard(); return;
  }
  const tg = e.target.closest('[data-gate],[data-wire],[data-region],[data-grp]');
  if (tg?.dataset.grp){
    const g = circ().gates.find(q => q.id === state.sel.ids[0]);
    state.pending = null;
    state.drag = {id:g.id, dx:p.x-g.x, dy:p.y-g.y, moved:false, cx:e.clientX, cy:e.clientY, grp:true};
    capture(e.pointerId); renderBoard(); return;
  }
  if (!tg){
    state.pending = null; state.sel = null;
    if (isSandbox()){ state.pan = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y}; capture(e.pointerId); }
    render(); return;
  }
  if (tg.dataset.region){
    const id = tg.dataset.region, r = circ().regions.find(q => q.id === id);
    state.pending = null;
    if (state.sel?.kind === 'region' && state.sel.id === id){
      const name = prompt(t('regionName'), r.name)?.trim();
      if (name){ r.name = name.slice(0, 40); save(); }
    } else { state.sel = {kind:'region', id}; Snd.play('select'); }
    render(); return;
  }
  if (tg.dataset.gate){
    const g = circ().gates.find(q => q.id === tg.dataset.gate);
    if (!(state.sel?.kind === 'group' && state.sel.ids.includes(g.id))) state.sel = {kind:'gate', id:g.id};  // dragging a group member moves the group
    state.pending = null;
    state.drag = {id:g.id, dx:p.x-g.x, dy:p.y-g.y, moved:false, cx:e.clientX, cy:e.clientY};
    capture(e.pointerId);
    Snd.play('select');
    render(); return;
  }
  state.sel = {kind:'wire', idx:+tg.dataset.wire}; state.pending = null;
  Snd.play('select');
  render();
});

svg.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (state.pinch){
    if (ptrs.size >= 2){ const [a,b] = [...ptrs.values()]; zoomTo(state.pinch.w * state.pinch.d / (Math.hypot(a.x-b.x, a.y-b.y) || 1), (a.x+b.x)/2, (a.y+b.y)/2); }
    return;
  }
  if (state.draw){
    const p = toSvg(e), q = [Math.round(p.x), Math.round(p.y)], pts = state.draw.pts;
    if (state.draw.kind === 'box') pts[1] = q;
    else if (Math.hypot(q[0] - pts.at(-1)[0], q[1] - pts.at(-1)[1]) > 8/boardScale) pts.push(q);
    boardSoon(); return;
  }
  if (state.pan){
    const r = svg.getBoundingClientRect();
    view.x = state.pan.vx - (e.clientX - state.pan.x) * view.w / r.width;
    view.y = state.pan.vy - (e.clientY - state.pan.y) * view.h / r.height;
    applyView(); return;
  }
  if (state.drag){
    // 6px dead zone so a tap (e.g. flipping a sandbox switch) is not read as a drag
    if (!state.drag.moved && Math.hypot(e.clientX - state.drag.cx, e.clientY - state.drag.cy) < 6) return;
    const p = toSvg(e), g = circ().gates.find(q => q.id === state.drag.id); if (!g) return;
    const m = isSandbox() ? 4 : 110;
    const gs = state.sel?.kind === 'group' && state.sel.ids.includes(g.id) ? circ().gates.filter(q => state.sel.ids.includes(q.id)) : [g];
    // one shared delta, clamped so every part in the group stays on the board
    let dx = Math.round(p.x - state.drag.dx) - g.x, dy = Math.round(p.y - state.drag.dy) - g.y;
    dx = clamp(dx, Math.max(...gs.map(q => m - q.x)), Math.min(...gs.map(q => W-m-GW - q.x)));
    dy = clamp(dy, Math.max(...gs.map(q => 24 - q.y)), Math.min(...gs.map(q => H-gh(PARTS[q.type])-10 - q.y)));
    gs.forEach(q => { q.x += dx; q.y += dy; });
    state.drag.moved = true;
    boardSoon();
  } else if (state.wireDrag){
    const p = toSvg(e); state.ghost = {x:p.x, y:p.y};
    boardSoon();
  }
});

function endPointer(e){
  if (state.pinch){ if (ptrs.size < 2) state.pinch = null; return; }
  if (state.draw){ finishDraw(); return; }
  if (state.pan){ state.pan = null; return; }
  if (state.drag){
    const {moved, id, grp} = state.drag; state.drag = null;
    if (moved){ save(); return; }
    if (grp) return;                              // tap inside the outline: keep the group selected
    const g = circ().gates.find(q => q.id === id);
    if (g && g.type === 'SW'){ g.on = !g.on; Snd.play(g.on ? 'on' : 'off'); save(); render(); }
    return;
  }
  if (state.wireDrag){
    state.wireDrag = false;
    const p = toSvg(e), R = pinR();
    const hit = nearestPin(p, R*1.5, state.pending);
    if (hit && connect(state.pending, hit)){ state.pending = null; commit(); return; }
    const own = pinPos(state.pending);
    if (!own || (own.x-p.x)**2 + (own.y-p.y)**2 > R*R) state.pending = null; // tap on same pin keeps it armed
    renderBoard();
  }
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', () => { Object.assign(state, {drag:null, wireDrag:false, pending:null, pan:null, pinch:null, draw:null}); renderBoard(); });
svg.addEventListener('wheel', e => { if (!isSandbox()) return; e.preventDefault(); zoomTo(view.w * Math.exp(e.deltaY * .0015), e.clientX, e.clientY); }, {passive:false});
$('zInBtn').addEventListener('click', () => zoomBy(1/1.25));
$('zOutBtn').addEventListener('click', () => zoomBy(1.25));
$('zFitBtn').addEventListener('click', zoomFit);

// Where a new part appears: switches in a column at the left of the view, lamps at the right,
// everything else spiralling out from the middle, always on a spot that overlaps no existing part.
function freeSpot(type){
  const sb = isSandbox(), h = gh(PARTS[type]), pad = 16, m = sb ? 4 : 110;
  const box = (x, y, hh) => [x - pad, y - 28 - pad, x + GW + pad, y + hh + 10 + pad];   // 28 = label above the part
  const taken = circ().gates.map(g => box(g.x, g.y, gh(PARTS[g.type])));
  const free = (x, y) => { const [a0, b0, a1, b1] = box(x, y, h); return !taken.some(([c0, d0, c1, d1]) => a0 < c1 && c0 < a1 && b0 < d1 && d0 < b1); };
  const v = sb ? view : {x:0, y:0, w:W, h:H};
  const cands = [];
  if (type === 'SW' || type === 'LAMP'){
    // lamps keep ~70 screen px clear of the right edge so the zoom buttons never cover them
    const dir = type === 'SW' ? 1 : -1, x0 = type === 'SW' ? v.x + 40 : v.x + v.w - GW - Math.max(40, 70 / boardScale);
    for (let col = 0; col < 6; col++) for (let y = v.y + 50; y <= v.y + v.h - h - 20; y += 20) cands.push([x0 + dir*col*130, y]);
  } else {
    const cx = v.x + v.w/2 - GW/2, cy = v.y + v.h/2 - h/2;
    cands.push([cx, cy]);
    for (let r = 1; r <= 30; r++) for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++)
      if (Math.max(Math.abs(dx), Math.abs(dy)) === r) cands.push([cx + dx*40, cy + dy*40]);
  }
  const fit = ([x, y]) => ({x: Math.round(clamp(x, m, W - m - GW)), y: Math.round(clamp(y, 30, H - h - 10))});
  for (const c of cands){ const p = fit(c); if (free(p.x, p.y)) return p; }
  return fit(cands[0]);   // ponytail: board full, overlap accepted; player can drag
}

$('tools').addEventListener('click', e => {
  const b = e.target.closest('[data-tool]'); if (!b) return;
  const c = circ(), type = b.dataset.tool, id = nextId(c.gates);
  c.gates.push({id, type, ...freeSpot(type)});
  state.sel = {kind:'gate', id};
  Snd.play('place');
  commit();
});
function nextId(list, pre = 'g'){ return pre + (list.reduce((m,q) => Math.max(m, +q.id.slice(1) || 0), 0) + 1); }

/* ---------- sandbox: box select, copy/paste, regions ---------- */
function setMode(m){
  state.mode = state.mode === m ? null : m; state.draw = null;
  $('boxBtn').setAttribute('aria-pressed', state.mode === 'box');
  $('regionBtn').setAttribute('aria-pressed', state.mode === 'region');
  $('play').classList.toggle('mode', !!state.mode);
  Snd.play('tap'); render();
}
$('boxBtn').addEventListener('click', () => setMode('box'));
$('regionBtn').addEventListener('click', () => setMode('region'));

function finishDraw(){
  const {kind, pts} = state.draw, c = circ();
  state.draw = null;
  if (state.mode) setMode(state.mode);          // one shot: the mode ends after each outline
  if (kind === 'box'){
    const [x0, y0, x1, y1] = bbox(pts);
    // a part is inside when its centre is inside the box
    const ids = c.gates.filter(g => { const cx = g.x + GW/2, cy = g.y + gh(PARTS[g.type])/2; return cx > x0 && cx < x1 && cy > y0 && cy < y1; }).map(g => g.id);
    state.sel = ids.length > 1 ? {kind:'group', ids} : ids.length ? {kind:'gate', id:ids[0]} : null;
    if (ids.length) Snd.play('select');
    render(); return;
  }
  const [x0, y0, x1, y1] = bbox(pts);
  if (pts.length < 3 || Math.max(x1-x0, y1-y0) < 40){ render(); return; }
  c.regions ||= [];
  const name = prompt(t('regionName'), t('regionDefault', c.regions.length + 1))?.trim();
  if (!name){ render(); return; }
  const id = nextId(c.regions, 'r');
  c.regions.push({id, name: name.slice(0, 40), pts});
  state.sel = {kind:'region', id};
  Snd.play('place'); commit();
}

const selIds = () => state.sel?.kind === 'group' ? state.sel.ids : state.sel?.kind === 'gate' ? [state.sel.id] : [];
function copySel(){
  const c = circ(), ids = new Set(selIds()); if (!ids.size) return;
  const inside = pin => ids.has(pin.split(':')[0]);
  state.clip = JSON.parse(JSON.stringify({gates: c.gates.filter(g => ids.has(g.id)), wires: c.wires.filter(w => inside(w.from) && inside(w.to))}));
  Snd.play('select'); renderPanel();
}
function paste(){
  const c = circ(), clip = state.clip; if (!clip) return;
  // Each paste lands one group-width further right of the original, on fresh ids; wires inside the copy come along.
  const [x0, y0, x1] = gatesBox(clip.gates), map = {}, n = clip.n = (clip.n || 0) + 1;
  let dx = (x1 - x0 + 20) * n, dy = 0;
  if (x1 + dx > W){ dx = Math.round(view.x + view.w/2 - (x0+x1)/2); dy = Math.round(view.y + view.h/2 - y0); }   // off the board: drop it in view instead
  clip.gates.forEach(g => {
    const id = map[g.id] = nextId(c.gates), h = gh(PARTS[g.type]);
    c.gates.push({...g, id, x: clamp(g.x + dx, 4, W-4-GW), y: clamp(g.y + dy, 24, H-h-10)});
  });
  const re = pin => { const [g, p] = pin.split(':'); return map[g] + ':' + p; };
  clip.wires.forEach(w => c.wires.push({from: re(w.from), to: re(w.to)}));
  state.sel = {kind:'group', ids:Object.values(map)};
  Snd.play('place'); commit();
}

const partLevel = p => LEVELS.find(l => l.part === p);
function chipDef(p){ const sol = prog.solutions[partLevel(p).id]; return sol || CANON[p]; }

// Expand a part into NAND gates. Refs: 'I<k>' = chip input, 'n<i>' = NAND output, null = unconnected (0).
function flatten(type, inRefs, nands, stack){
  if (type === 'NAND'){ nands.push({a:inRefs[0], b:inRefs[1]}); return ['n'+(nands.length-1)]; }
  const P = PARTS[type];
  if (stack.includes(type)) return P.outs.map(() => null);
  const def = chipDef(type), src = {}, memo = {}, busy = new Set();
  def.wires.forEach(w => src[w.to] = w.from);
  const gates = Object.fromEntries(def.gates.map(g => [g.id, g]));
  const ref = pin => {
    if (!pin) return null;
    const [nid, pk] = pin.split(':');
    if (nid.startsWith('IN')) return inRefs[+nid.slice(2)] ?? null;
    return outsOf(nid)[+pk.slice(1)] ?? null;
  };
  function outsOf(id){
    if (memo[id]) return memo[id];
    const g = gates[id]; if (!g || !PARTS[g.type]) return [];
    if (busy.has(id)) return PARTS[g.type].outs.map((_,j) => () => memo[id] ? memo[id][j] : null);   // loop: resolve later
    busy.add(id);
    const ins = PARTS[g.type].ins.map((_,k) => ref(src[`${id}:i${k}`]));
    memo[id] = flatten(g.type, ins, nands, [...stack, type]);
    busy.delete(id);
    return memo[id];
  }
  return P.outs.map((_,k) => ref(src[`OUT${k}:i0`]));
}

function openInside(gateId){
  const g = circ().gates.find(q => q.id === gateId); if (!g || !isChip(g.type)) return;
  const P = PARTS[g.type], sim = state.sim || simulate(state.inputs), nands = [];
  const res = r => { while (typeof r === 'function') r = r(); return r ?? null; };
  const outRefs = flatten(g.type, P.ins.map((_,k) => 'I'+k), nands, []).map(res);
  nands.forEach(n => { n.a = res(n.a); n.b = res(n.b); });
  state.inside = {type:g.type, vals:P.ins.map((_,k) => !!sim.val[sim.src[`${g.id}:i${k}`]]), nands, outRefs,
                  own: !!prog.solutions[partLevel(g.type).id]};
  state.pending = null; state.drag = null; state.wireDrag = false;
  const el = $('inside');
  el.style.transformOrigin = `${(g.x+48-view.x)/view.w*100}% ${(g.y+gh(P)/2-view.y)/view.h*100}%`;
  el.hidden = false; el.classList.remove('zoom'); void el.offsetWidth; el.classList.add('zoom');
  Snd.play('zoomIn');
  renderInside();
  $('zoomOut').focus();
}
function closeInside(){ $('inside').hidden = true; state.inside = null; Snd.play('zoomOut'); renderBoard(); }

function renderInside(){
  const S = state.inside, P = PARTS[S.type], N = S.nands;
  const v = new Array(N.length).fill(false);
  const sv = r => r == null ? false : (r[0] === 'I' ? !!S.vals[+r.slice(1)] : v[+r.slice(1)]);
  for (let it = 0; it < 100; it++){ let ch = false; N.forEach((n,i) => { const o = !(sv(n.a) && sv(n.b)); if (o !== v[i]){ v[i] = o; ch = true; } }); if (!ch) break; }

  // Column = depth over strongly connected components, so cross-coupled latch pairs stack in one column.
  const nIn = i => [N[i].a, N[i].b].filter(r => r && r[0] === 'n').map(r => +r.slice(1));
  const comp = [], low = [], idx = [], stk = [], onStk = [];
  let cnt = 0, nc = 0;
  const scc = v => {
    idx[v] = low[v] = cnt++; stk.push(v); onStk[v] = true;
    for (const w of nIn(v)){
      if (idx[w] === undefined){ scc(w); low[v] = Math.min(low[v], low[w]); }
      else if (onStk[w]) low[v] = Math.min(low[v], idx[w]);
    }
    if (low[v] === idx[v]){ let w; do { w = stk.pop(); onStk[w] = false; comp[w] = nc; } while (w !== v); nc++; }
  };
  N.forEach((_,i) => idx[i] === undefined && scc(i));
  const cd = [];   // Tarjan numbers components inputs-first, so one forward pass is enough
  for (let c = 0; c < nc; c++){
    let d = 1;
    N.forEach((_,i) => { if (comp[i] === c) nIn(i).forEach(j => { if (comp[j] !== c) d = Math.max(d, cd[comp[j]] + 1); }); });
    cd[c] = d;
  }
  const depth = N.map((_,i) => cd[comp[i]]);
  const maxD = Math.max(1, ...depth), cols = {};
  N.forEach((_,i) => (cols[depth[i]] ??= []).push(i));
  const maxCnt = Math.max(1, ...Object.values(cols).map(c => c.length));
  const HH = Math.max(maxCnt*100, Math.max(P.ins.length, P.outs.length)*90) + 60;
  const WW = 190 + maxD*160 + 110;
  const pos = {};
  P.ins.forEach((_,k) => pos['I'+k] = {x:86, y:HH*(k+1)/(P.ins.length+1)});
  const outPt = r => r == null || !pos[r] ? null : (r[0] === 'I' ? pos[r] : {x:pos[r].x+96, y:pos[r].y+40});   // null until placed (feedback)
  for (let d = 1; d <= maxD; d++){
    const c = cols[d] || [];
    const key = i => { const ys = [N[i].a, N[i].b].map(outPt).filter(Boolean).map(p => p.y); return ys.length ? ys.reduce((a,b) => a+b, 0)/ys.length : HH/2; };
    c.sort((a,b) => key(a) - key(b));
    c.forEach((i,j) => pos['n'+i] = {x:190 + (d-1)*160, y:HH*(j+1)/(c.length+1) - 40});
  }

  let s = `<defs><pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.2" fill="#1E5A53"/></pattern></defs><rect width="${WW}" height="${HH}" fill="url(#grid2)"/><rect width="${WW}" height="${HH}" fill="url(#vign)"/>`;
  const wire = (a, b, on) => a && b ? wirePath(curve(a,b), on) : '';
  N.forEach((n,i) => {
    const p = pos['n'+i];
    s += wire(outPt(n.a), {x:p.x, y:p.y+80/3}, sv(n.a));
    s += wire(outPt(n.b), {x:p.x, y:p.y+160/3}, sv(n.b));
  });
  S.outRefs.forEach((r,k) => { const y = HH*(k+1)/(P.outs.length+1); s += wire(outPt(r), {x:WW-86, y}, sv(r)); });

  const body = 'M14 0 H34 A40 40 0 0 1 34 80 H14 Z';
  N.forEach((n,i) => {
    const {x,y} = pos['n'+i];
    s += `<g transform="translate(${x} ${y})">`;
    s += `<line class="lead" x1="0" y1="${80/3}" x2="14" y2="${80/3}"/><line class="lead" x1="0" y1="${160/3}" x2="14" y2="${160/3}"/><line class="lead" x1="86" y1="40" x2="96" y2="40"/>`;
    s += `<path class="shade" d="${body}" transform="translate(3 5)"/><path class="body nand" d="${body}"/><circle class="bubble" cx="80" cy="40" r="6"/>`;
    s += `<text class="glabel" x="40" y="45" style="font-size:12px">NAND</text>`;
    s += `<circle class="pin ${sv(n.a)?'hi':''}" cx="0" cy="${80/3}" r="5"/><circle class="pin ${sv(n.b)?'hi':''}" cx="0" cy="${160/3}" r="5"/><circle class="pin ${v[i]?'hi':''}" cx="96" cy="40" r="5"/></g>`;
  });
  P.ins.forEach((name,k) => {
    const y = pos['I'+k].y, on = S.vals[k];
    s += switchSvg('data-itoggle', k, y, name, on);
    s += `<circle class="pin ${on?'hi':''}" cx="86" cy="${y}" r="5"/>`;
  });
  P.outs.forEach((name,k) => {
    const y = HH*(k+1)/(P.outs.length+1), r = S.outRefs[k], on = sv(r);
    s += `<line class="lead" x1="${WW-86}" y1="${y}" x2="${WW-68}" y2="${y}"/>`;
    s += lampSvg(WW-50, y, name, on, r == null);
    s += `<circle class="pin ${on?'hi':''}" cx="${WW-86}" cy="${y}" r="5"/>`;
  });

  const svgI = $('insideSvg');
  svgI.setAttribute('viewBox', `0 0 ${WW} ${HH}`);
  svgI.innerHTML = s;
  $('insideTitle').textContent = t('insideTitle', partName(S.type), N.length);
  $('insideSub').textContent = t(S.own ? 'insideOwn' : 'insideStd') + t('insideFlip');
}

$('insideSvg').addEventListener('pointerdown', e => {
  if (e.button) return;
  const el = e.target.closest('[data-itoggle]'); if (!el || !state.inside) return;
  e.preventDefault();
  const k = +el.dataset.itoggle; state.inside.vals[k] = !state.inside.vals[k];
  Snd.play(state.inside.vals[k] ? 'on' : 'off');
  renderInside();
});
$('zoomOut').addEventListener('click', closeInside);
$('insideBtn').addEventListener('click', () => { if (state.sel && state.sel.kind === 'gate') openInside(state.sel.id); });
$('clearBtn').addEventListener('click', () => {
  if (!circ().gates.length) return;
  if (confirm(t('clearConfirm'))){
    Object.assign(circ(), {gates:[], wires:[], regions:[]}); state.sel = null; Snd.play('clear'); commit();
  }
});
$('hintBtn').addEventListener('click', () => {
  const h = $('hint'); h.hidden = !h.hidden;
  $('hintBtn').textContent = t(h.hidden ? 'showHint' : 'hideHint');
  if (!h.hidden) Snd.play('hint');
});
$('homeBtn').addEventListener('click', () => { $('inside').hidden = true; state.inside = null; state.screen = 'levels'; Snd.play('tap'); render(); });

$('testBtn').addEventListener('click', () => {
  const L = cur(), list = rows();
  state.tested = true; state.msgBad = true;
  const unwired = L.outs.filter((_,j) => list[0].got[j] === null);
  const over = L.rule?.max && circ().gates.length > L.rule.max;
  if (list.every(r => r.ok) && !over){ state.msg = ''; state.msgBad = false; render(); solved(); return; }
  if (over && list.every(r => r.ok)) state.msg = t('msgTooMany', L.rule.max);
  else if (list.some(r => !r.stable)) state.msg = t('msgUnstable');
  else if (unwired.length) state.msg = t('msgUnwired', unwired);
  else state.msg = t('msgRows', list.filter(r => r.ok).length, list.length);
  Snd.play('error');
  render();
});

function renderQuiz(){
  const L = cur(), q = $('quiz');
  q.hidden = state.seen.size < (1 << L.ins.length);
  if (q.hidden || $('choices').childElementCount) return;
  $('qText').textContent = lt(L, 'question');
  $('choices').innerHTML = lt(L, 'choices').map((c,i)=>`<button class="choice" data-choice="${i}">${c}</button>`).join('');
}
$('choices').addEventListener('click', e => {
  const b = e.target.closest('[data-choice]'); if (!b) return;
  if (+b.dataset.choice === cur().answer){ state.msg = ''; state.msgBad = false; render(); solved(); }
  else { b.classList.add('wrong'); state.focusRow = rows().findIndex(r => !r.exp[0]); state.msg = t('quizWrong'); state.msgBad = true; Snd.play('error'); render(); }
});

function solved(){
  const L = cur(), n = circ().gates.length, prev = prog.best[L.id];
  if (prev == null || n < prev) prog.best[L.id] = n;
  if (L.part) prog.solutions[L.id] = JSON.parse(JSON.stringify(circ()));
  save();
  // ArcadeDeck personal best: total stars (best per level), max 3 per level.
  if (parent !== window) parent.postMessage({type:'GAME_OVER', score: LEVELS.reduce((t, l) => t + (prog.best[l.id] != null ? stars(prog.best[l.id], l.par) : 0), 0)}, '*');
  const last = state.li === LEVELS.length - 1, st = stars(n, L.par);
  $('winStars').innerHTML = [0,1,2].map(i => `<span class="${i<st?'on':''}" style="--d:${i*140}ms">★</span>`).join('');
  $('winStars').setAttribute('aria-label', t('starsAria', st));
  $('winTitle').textContent = t(last ? 'winLast' : 'winTitle');
  $('choices').innerHTML = '';
  let txt = t('winBuilt', n, L.par);
  if (n > L.par) txt += t('winFewer');
  if (isLearn()) txt = lt(L, 'win') ?? t('winLearn');
  else txt += L.part ? t('winChip', partName(L.part)) : t('winFinal');
  $('winText').textContent = txt;
  $('whyText').innerHTML = rich(lt(L, 'why'), null);
  $('nextBtn').textContent = t(last ? 'backLevels' : 'next');
  $('win').hidden = false;
  Snd.play('win', st);
  $('nextBtn').focus();
}
$('stayBtn').addEventListener('click', () => { $('win').hidden = true; if (isLearn()) renderQuiz(); });
$('nextBtn').addEventListener('click', () => {
  $('win').hidden = true;
  $('choices').innerHTML = '';
  Snd.play('tap');
  if (state.li === LEVELS.length - 1){ state.screen = 'levels'; render(); }
  else openLevel(state.li + 1);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('sndPop').hidden){ toggleSndPop(false); $('sndBtn').focus(); return; }
  if (state.screen !== 'play') return;
  if (e.key === 'Escape' && !$('inside').hidden){ closeInside(); return; }
  if (!$('inside').hidden) return;
  if (e.key === 'Escape'){ if (!$('win').hidden) $('win').hidden = true; if (state.mode) setMode(state.mode); Object.assign(state, {pending:null, sel:null, draw:null}); render(); }
  const k = e.key.toLowerCase();
  if (isSandbox() && (e.ctrlKey || e.metaKey) && !e.altKey && (k === 'c' || k === 'v') && !e.target.closest?.('input,select,textarea')){
    e.preventDefault(); k === 'c' ? copySel() : paste(); return;
  }
  // Tool-action hotkeys: ignore while typing in a control, with modifiers, or when the win dialog is up.
  if (!$('win').hidden || isLearn() || e.ctrlKey || e.metaKey || e.altKey || e.target.closest?.('input,select,textarea')) return;
  if (isSandbox() && (k === 'b' || k === 'r')){ e.preventDefault(); setMode(k === 'b' ? 'box' : 'region'); return; }
  if (isSandbox() && ['+','=','-','0'].includes(k)){ e.preventDefault(); k === '0' ? zoomFit() : zoomBy(k === '-' ? 1.25 : 1/1.25); return; }
  const btn = (k === 'delete' || k === 'backspace' || k === 'x') ? $('delBtn') : k === 'i' ? $('insideBtn') : k === 'c' ? $('clearBtn') : null;
  if (btn){ e.preventDefault(); if (!btn.disabled) btn.click(); }
});

/* ---------- language, sound controls, install ---------- */
function applyLang(){
  document.documentElement.lang = settings.lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.dataset.tip = t(el.dataset.i18nTitle));
  document.querySelectorAll('[data-kbd]').forEach(el => el.dataset.tip = t('shortcut', el.dataset.kbd));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $('langSel').value = settings.lang;
  $('hintBtn').textContent = t($('hint').hidden ? 'showHint' : 'hideHint');
  syncSound(); syncTheme();
  if (state.screen === 'play'){
    renderTools();
    if (isLearn() && $('choices').childElementCount){ $('choices').innerHTML = ''; renderQuiz(); }
    if (state.inside) renderInside();
  }
  render();
}
$('langSel').addEventListener('change', e => { settings.lang = e.target.value; saveSettings(); applyLang(); });

// Styled hover tooltip for anything with data-tip (mouse hover + keyboard focus; touch skips it).
const tip = document.body.appendChild(Object.assign(document.createElement('div'), {id:'tip', role:'tooltip'}));
let tipFor = null, tipTimer;
function showTip(el){
  if (!el.isConnected || !el.dataset.tip) return;
  tip.textContent = el.dataset.tip;
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let y = r.bottom + 8; if (y + h > innerHeight - 4) y = r.top - h - 8;
  tip.style.left = Math.max(4, Math.min(innerWidth - w - 4, r.left + r.width/2 - w/2)) + 'px';
  tip.style.top = y + 'px';
  tip.classList.add('on');
}
function hideTip(){ clearTimeout(tipTimer); tipFor = null; tip.classList.remove('on'); }
document.addEventListener('pointerover', e => {
  if (e.pointerType !== 'mouse') return;
  const el = e.target.closest('[data-tip]');
  if (el === tipFor) return;
  hideTip(); tipFor = el;
  if (el) tipTimer = setTimeout(() => showTip(el), 350);
});
document.documentElement.addEventListener('pointerleave', hideTip);
document.addEventListener('pointerdown', hideTip, {capture:true});
addEventListener('scroll', hideTip, {capture:true, passive:true});
document.addEventListener('focusin', e => { const el = e.target.closest?.('[data-tip]'); if (el?.matches(':focus-visible')) { tipFor = el; showTip(el); } });
document.addEventListener('focusout', hideTip);

function isDark(){ return (settings.theme ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark'; }
function syncTheme(){
  const dark = isDark(), label = t(dark ? 'toLight' : 'toDark');
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('themeBtn').setAttribute('aria-label', label); $('themeBtn').dataset.tip = label;
}
$('themeBtn').addEventListener('click', () => { settings.theme = isDark() ? 'light' : 'dark'; saveSettings(); syncTheme(); Snd.play('tap'); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);

function syncSound(){
  const level = settings.muted || (settings.music === 0 && settings.sfx === 0) ? 'mute' : (Math.max(settings.music, settings.sfx) < 50 ? 'low' : 'high');
  document.querySelectorAll('.spk').forEach(s => s.dataset.state = level);
  $('musicVol').value = settings.music; $('sfxVol').value = settings.sfx;
  $('musicPct').textContent = settings.music; $('sfxPct').textContent = settings.sfx;
  $('muteBtn').setAttribute('aria-pressed', settings.muted);
  $('muteBtn').setAttribute('aria-label', t(settings.muted ? 'unmute' : 'mute'));
  $('muteBtn').dataset.tip = t(settings.muted ? 'unmute' : 'mute');
}
function setSound(patch){ Object.assign(settings, patch); saveSettings(); syncSound(); Snd.apply(); }
function toggleSndPop(open){ $('sndPop').hidden = !open; $('sndBtn').setAttribute('aria-expanded', open); }
$('sndBtn').addEventListener('click', () => toggleSndPop($('sndPop').hidden));
$('musicVol').addEventListener('input', e => setSound({music:+e.target.value, muted:false}));
$('sfxVol').addEventListener('input', e => setSound({sfx:+e.target.value, muted:false}));
$('sfxVol').addEventListener('change', () => Snd.play('on'));
$('muteBtn').addEventListener('click', () => setSound({muted:!settings.muted}));
document.addEventListener('pointerdown', e => { if (!$('sndPop').hidden && !e.target.closest('.snd')) toggleSndPop(false); });

// Game-feel hygiene: no browser context menu / long-press menu, no ghost-dragging text or icons (text fields keep theirs).
const editable = el => el.closest?.('input,textarea,[contenteditable]');
document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); });
document.addEventListener('dragstart', e => { if (!editable(e.target)) e.preventDefault(); });
document.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); });  // middle-click autoscroll

// Audio can only start from a user gesture (iOS/Android autoplay rules).
document.addEventListener('pointerdown', Snd.init, {capture:true});
document.addEventListener('keydown', Snd.init, {capture:true});
document.addEventListener('visibilitychange', Snd.visible);

let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('installBtn').hidden = false; });
addEventListener('appinstalled', () => { installEvt = null; $('installBtn').hidden = true; });
$('installBtn').addEventListener('click', async () => {
  if (!installEvt) return;
  installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('installBtn').hidden = true;
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

applyLang();
</script>
</body>
