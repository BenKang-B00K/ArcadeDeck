<head><script src="/perf.js"></script>

<script>try{const t=JSON.parse(localStorage.getItem('only-nand-settings'))?.theme;if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#E6ECEE; --panel:#FFFFFF; --ink:#17252A; --muted:#56666B; --line:#CBD5D8;
  --accent:#0C6B5F; --accent-ink:#FFFFFF; --ok:#1F8A5B; --bad:#C23B31; --star:#D99100;
  --board:#0D3935; --dot:#1E5A53; --chip:#1B2A2E; --nand:#243A3E; --steel:#9DB2B7;
  --hi:#FFB627; --lo:#58767F; --chip-ink:#E6EEF0;
  --shadow:0 10px 30px -18px rgba(10,40,36,.55);
  --cjk:'Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Yu Gothic UI','Noto Sans CJK KR';
  --display:'Chakra Petch',var(--cjk),'Arial Narrow',system-ui,sans-serif;
  --body:'IBM Plex Sans',var(--cjk),system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root:lang(ja){--cjk:'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans CJK JP'}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1719; --panel:#172124; --ink:#E2EAEC; --muted:#93A3A8; --line:#2A393D;
    --accent:#3DBBA6; --accent-ink:#06201C; --ok:#4CC38A; --bad:#F0736A; --star:#FFC247;
    --shadow:0 12px 32px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1719; --panel:#172124; --ink:#E2EAEC; --muted:#93A3A8; --line:#2A393D;
  --accent:#3DBBA6; --accent-ink:#06201C; --ok:#4CC38A; --bad:#F0736A; --star:#FFC247;
  --shadow:0 12px 32px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);background-image:radial-gradient(1200px 500px at 50% -120px,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%);background-repeat:no-repeat;
  color:var(--ink);font:400 16px/1.5 var(--body);min-height:100vh;min-height:100dvh;overscroll-behavior-y:none;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input,textarea{user-select:text;-webkit-user-select:text}
img,svg,a{-webkit-user-drag:none}
:lang(ko) body{word-break:keep-all}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;transition:transform .08s,border-color .15s,background-color .15s,box-shadow .15s}
button:not(:disabled):active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}

.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;font:700 21px/1 var(--display);letter-spacing:.01em;white-space:nowrap}
.brand svg{width:34px;height:24px;color:var(--accent)}
#crumb{color:var(--muted);font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0}
.icon-btn svg{width:22px;height:22px}
@media (hover:hover){.icon-btn:hover{border-color:var(--accent)}}
.icon-btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lang{position:relative;display:flex;align-items:center}
.lang svg{position:absolute;left:10px;width:18px;height:18px;pointer-events:none;color:var(--muted)}
.lang select{appearance:none;-webkit-appearance:none;height:40px;padding:0 12px 0 34px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px;cursor:pointer}
.snd{position:relative}
#tip{position:fixed;left:0;top:0;z-index:50;max-width:240px;padding:6px 9px;border-radius:7px;background:var(--ink);color:var(--bg);font:500 12px/1.35 var(--body);
  pointer-events:none;box-shadow:var(--shadow);opacity:0;transform:translateY(-2px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
.thm .sun,[data-theme="dark"] .thm .moon{display:none}
[data-theme="dark"] .thm .sun{display:inline}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:232px;display:grid;gap:12px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:20}
.pop .row{display:flex;align-items:center;gap:10px}
.pop .row>svg{width:22px;height:22px;flex:none;color:var(--muted)}
.pop input[type=range]{flex:1;min-width:0;height:28px;accent-color:var(--accent);cursor:pointer}
.pop .pct{width:3ch;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pop .icon-btn{justify-self:end}
.spk .x{display:none}
.spk[data-state="mute"] .w1,.spk[data-state="mute"] .w2,.spk[data-state="low"] .w2{display:none}
.spk[data-state="mute"] .x{display:inline}
@media (max-width:560px){#crumb{display:none} .brand .bt{display:none}}

/* Level select */
.levels{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
/* Hero: dark circuit board with the banner's NAND tree on the right, same in both themes */
.intro{position:relative;overflow:hidden;isolation:isolate;margin:0 0 36px;padding:clamp(28px,5vw,56px) clamp(22px,4vw,48px) 30px;border-radius:20px;color:#E6EEF0;
  background:radial-gradient(900px 420px at 0% 0%,rgba(61,187,166,.14),transparent 60%),radial-gradient(#0F3B37 1px,transparent 1.4px) 0 0/22px 22px,#01201F;
  box-shadow:0 24px 50px -28px rgba(1,32,31,.9),inset 0 0 0 1px rgba(157,178,183,.12)}
.intro::after{content:'';position:absolute;inset:0 0 0 auto;width:min(52%,540px);z-index:-1;pointer-events:none;
  background:url(icons/hero.webp) left center/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%);mask-image:linear-gradient(90deg,transparent,#000 30%)}
@media (max-width:760px){.intro::after{width:100%;opacity:.28}}
.intro h1{font:700 clamp(40px,6vw,68px)/.95 var(--display);margin:0 0 20px;max-width:12ch;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.intro p{max-width:46ch;color:#9FBFBA;font-size:18px;margin:0 0 28px}
.progress{display:flex;align-items:center;gap:12px;margin:0;font-size:14px;color:#9FBFBA}
.progress .bar{flex:0 1 260px;height:8px;border-radius:99px;background:rgba(157,178,183,.18);overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#3DBBA6,var(--hi));box-shadow:0 0 10px rgba(255,182,39,.5);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.level-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.level{position:relative;overflow:hidden;width:100%;height:100%;text-align:left;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;padding:16px;border:1px solid var(--line);background:var(--panel);border-radius:12px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
@media (hover:hover){.level:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}}
.level.done::before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent)}
.level .num{grid-row:1/3;font:700 34px/1 var(--display);color:var(--accent);min-width:1.2em}
.level:disabled .num{color:var(--muted)}
.level .lt{font:600 18px/1.3 var(--display)}
.level .ls{font-size:14px;color:var(--muted)}
.level.done .ls{color:var(--ink)}
.lock{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.level .lu{grid-column:2;margin-top:6px;font-size:12px;color:var(--muted)}
.level .lu::before{content:'\25C7\a0'}
.level .lu.on{color:var(--accent)}
.level .lu.on::before{content:'\25C6\a0'}
.tool:disabled{opacity:.5;cursor:not-allowed;border-style:dashed}
.stars{color:var(--star);letter-spacing:2px}

/* Play */
.play{display:grid;grid-template-columns:176px minmax(0,1fr) 320px;gap:16px;padding:16px;align-items:start}
.palette,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.palette h2{font:600 13px/1 var(--display);margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
#tools{display:flex;flex-direction:column;gap:8px}
.tool{display:flex;flex-direction:column;align-items:flex-start;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:transparent;text-align:left}
@media (hover:hover){.tool:hover:not(:disabled){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}}
.tool .tname{font:600 16px/1.2 var(--display)}
.tool .tdesc{font-size:12px;color:var(--muted)}
.tool.raw{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));border-color:var(--accent);color:var(--accent-ink)}
.tool.raw .tdesc{color:inherit;opacity:.8}
.tool-actions{display:flex;flex-direction:column;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px}
@media (hover:hover){.ghost:hover:not(:disabled){border-color:var(--accent)}}

.board-wrap{background:var(--board);border-radius:12px;overflow:hidden;position:relative;box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.04)}
#inside{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--board);z-index:2}
.inside-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;background:#0A2E2B;color:#E6EEF0}
#insideTitle{font:600 19px/1.2 var(--display);display:block}
#insideSub{font-size:13px;color:#A9C2C0}
#zoomOut{background:var(--hi);color:#2A1C00;border:0;border-radius:9px;padding:8px 14px;font-weight:600;white-space:nowrap}
#insideSvg{flex:1;min-height:0;width:100%;display:block;touch-action:none}
.zoom-btn{cursor:zoom-in}
.zoom-btn .zbg{fill:var(--hi)}
.zoom-btn .zhit{fill:transparent}
.zoom-btn .mag{fill:none;stroke:#2A1C00;stroke-width:2;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  #inside.zoom{animation:zoomIn .38s cubic-bezier(.2,.8,.2,1)}
  @keyframes zoomIn{from{transform:scale(.06);opacity:0}to{transform:none;opacity:1}}
}
#board{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.board-help{margin:0;padding:8px 14px;font-size:13px;color:#A9C2C0;background:#0A2E2B}
.rotate-tip{display:none;color:var(--hi)}
@media (orientation:portrait) and (max-width:600px){.rotate-tip{display:block;margin-top:4px}}

.play.learn{grid-template-columns:minmax(0,1fr) 340px}
@media (max-width:1060px){.play.learn{grid-template-columns:1fr}}
#lesson p{margin:0 0 10px;font-size:15px;color:var(--ink)}
#lesson p:last-child{margin:0}
#lesson{margin:0 0 14px;padding:12px 14px;border-radius:9px;background:color-mix(in srgb,var(--accent) 9%,transparent);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent)}
#quiz{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
#quiz .q{font:600 18px/1.3 var(--display);margin:0 0 10px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;padding:12px;border-radius:9px;border:1px solid var(--line);background:transparent}
@media (hover:hover){.choice:hover{border-color:var(--accent)}}
.choice.wrong{border-color:var(--bad);color:var(--bad)}
.lvl-num{color:var(--accent)}
.lvl-num::after{content:': '}
.panel h1{font:700 26px/1.15 var(--display);margin:0 0 8px}
/* Goal + hint cards */
.card-note{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;margin:0 0 14px;padding:12px 14px;border-radius:10px;
  background:color-mix(in srgb,var(--accent) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.card-note>svg{width:28px;height:28px;color:var(--accent)}
.card-note .k{display:block;font:600 12px/1 var(--display);text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin:2px 0 6px}
.card-note p{margin:0;font-size:16.5px;line-height:1.6;text-wrap:pretty}
#lvlGoal .g-head{display:block;font:700 19px/1.3 var(--display);letter-spacing:.01em;text-wrap:balance}
#lvlGoal .g-desc{display:block;margin-top:6px;font-size:15px;line-height:1.55;font-style:italic;color:var(--muted)}
:lang(ko) #lvlGoal .g-desc,:lang(ja) #lvlGoal .g-desc{font-style:normal}
.card-note.hint{margin:14px 0 0;background:color-mix(in srgb,var(--hi) 11%,var(--panel));border-color:color-mix(in srgb,var(--hi) 45%,transparent)}
.card-note.hint>svg,.card-note.hint .k{color:#B97800}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card-note.hint>svg,:root:not([data-theme="light"]) .card-note.hint .k{color:var(--hi)}}
:root[data-theme="dark"] .card-note.hint>svg,:root[data-theme="dark"] .card-note.hint .k{color:var(--hi)}
@media (prefers-reduced-motion:no-preference){.card-note.hint:not([hidden]){animation:rise .22s ease-out}@keyframes rise{from{transform:translateY(-4px);opacity:0}to{transform:none;opacity:1}}}
/* Inline tokens in instructions */
.sig{display:inline-block;font:600 .92em/1.25 var(--display);padding:0 .42em;border-radius:6px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);white-space:nowrap}
.gt{font:700 .95em var(--display);letter-spacing:.03em}
.bit{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;padding:0 .2em;border-radius:6px;font:700 .85em/1 var(--display);background:#1C3337;color:#E6EEF0;vertical-align:.08em}
.bit.b1{background:var(--hi);color:#2A1C00}
.meta{font-size:14px;color:var(--muted);margin-bottom:14px}
.meta .next{display:block;margin-top:4px;color:var(--ink);font-weight:500}
.tt-cap{caption-side:top;text-align:left;padding:8px 10px 6px;font-size:13px;color:var(--muted)}
tbody tr.focus td{box-shadow:inset 0 2px 0 var(--bad),inset 0 -2px 0 var(--bad);font-weight:700}
/* Visual glossary on the intro level */
.legend{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:1px dashed color-mix(in srgb,var(--accent) 30%,transparent);display:grid;gap:8px}
.legend li{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;font-size:14px}
.legend svg{width:44px;height:24px}
/* Rookie coach under the board */
.coach{margin:0;padding:10px 14px;font-size:14px;line-height:1.5;color:#FFF3D6;background:#123F3A;border-top:1px solid #1E5A53}
.coach .n{display:inline-block;margin-right:8px;padding:1px 8px;border-radius:99px;background:var(--hi);color:#2A1C00;font:700 12px/1.5 var(--display)}
.coach .sig{background:rgba(255,182,39,.18);color:var(--hi)}
.nudge{fill:none;stroke:var(--hi);stroke-width:2.5;pointer-events:none;opacity:.9}
@media (prefers-reduced-motion:no-preference){.nudge{animation:nudge 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes nudge{50%{opacity:.25;transform:scale(1.08)}}}
/* Sandbox */
.play:not(.sandbox) .sb-only,.play.sandbox .lv-only{display:none!important}
.sandbox-card{margin-top:16px;width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:18px 20px;border-radius:14px;text-align:left;
  border:1.5px dashed color-mix(in srgb,var(--accent) 55%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--panel)),var(--panel))}
@media (hover:hover){.sandbox-card:hover{border-style:solid;box-shadow:var(--shadow);transform:translateY(-2px)}}
.sandbox-card>svg{width:44px;height:44px;color:var(--accent)}
.sandbox-card .st{display:block;font:700 22px/1.1 var(--display)}
.sandbox-card .ss{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.zoom-ctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:1}
.zoom-ctl .icon-btn{width:38px;height:38px;box-shadow:0 4px 12px -6px rgba(0,0,0,.6)}
/* Level chapters */
.chapter{margin:0 0 34px}
.ch-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 12px}
.ch-head h2{margin:0;font:700 24px/1.1 var(--display)}
.ch-head .ch-n{font:600 12px/1 var(--display);padding:4px 9px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.ch-head p{flex-basis:100%;margin:0;color:var(--muted);font-size:14px}
.chapter.rules .ch-head h2{color:var(--bad)}
.chapter.rules .level .num{color:var(--bad)}
.wiki{display:inline-flex;align-items:center;gap:6px;min-height:32px;margin-top:8px;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none}
.wiki:hover span,.wiki:focus-visible span{text-decoration:underline}
.wiki svg{width:16px;height:16px;flex:none}
.card-note.rule{background:color-mix(in srgb,var(--bad) 7%,var(--panel));border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.card-note.rule>svg,.card-note.rule .k{color:var(--bad)}
/* Seven-segment digit (seg7 level) */
.seg-box{fill:#0A2624;stroke:#1E5A53;stroke-width:1.5}
.seg{fill:#16322F}
.seg.on{fill:var(--hi)}
.chapter.memory .ch-head h2{color:#7C5CD6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chapter.memory .ch-head h2{color:#A993F0}}
:root[data-theme="dark"] .chapter.memory .ch-head h2{color:#A993F0}
td.step{color:var(--muted);font-size:12px}
/* Sandbox switch / lamp parts */
.tool.io{border-style:dashed}
.io-hit{fill:transparent}
.gate.sel .io-hit{fill:rgba(255,182,39,.07);stroke:var(--hi);stroke-width:1.5;stroke-dasharray:5 4}
/* "Why it works" note in the win dialog */
.why{margin-top:14px;padding:12px 14px;border-radius:10px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.why .k{display:block;font:600 12px/1 var(--display);text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin-bottom:6px}
.why p{margin:0;font-size:15px;line-height:1.6}
/* Keyboard shortcut badges (hidden on touch-only devices) */
.tool-actions .ghost{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left}
kbd{font:600 11px/1 var(--display);padding:3px 6px;border-radius:5px;border:1px solid var(--line);border-bottom-width:2px;color:var(--muted);background:var(--bg)}
@media (hover:none) and (pointer:coarse){.tool-actions kbd{display:none}.tool-actions .ghost{justify-content:center}}
.tt-wrap{overflow:auto;max-height:480px;border:1px solid var(--line);border-radius:9px}
thead{position:sticky;top:0;z-index:1;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:5px 6px;text-align:center;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
thead th{font-weight:600;color:var(--muted);font-size:12px;background:color-mix(in srgb,var(--ink) 3%,transparent)}
th.grp,td.grp{border-left:1px solid var(--line)}
tbody tr.live td{background:color-mix(in srgb,var(--hi) 22%,transparent)}
td.miss{color:var(--bad);font-weight:600}
td.mark-ok{color:var(--ok);font-weight:700} td.mark-bad{color:var(--bad);font-weight:700}
.panel-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));color:var(--accent-ink);border:0;border-radius:9px;padding:11px 18px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px -8px var(--accent)}
.secondary{background:transparent;border:1px solid var(--line);border-radius:9px;padding:10px 14px}
@media (hover:hover){.secondary:hover{border-color:var(--accent)}}
#status{margin:12px 0 0;font-size:15px;min-height:1.5em}
#status:not(:empty){padding:9px 12px;border-radius:9px;background:color-mix(in srgb,var(--ok) 10%,transparent)}
#status.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}

/* SVG */
.wire{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.wire.lo{stroke:var(--lo)} .wire.hi{stroke:#FFC23F}
.wire.sel{stroke-width:8}
.wire-glow{fill:none;stroke:var(--hi);stroke-width:14;stroke-linecap:round;stroke-linejoin:round;opacity:.2;pointer-events:none}
.wire-flow{display:none}
@media (prefers-reduced-motion:no-preference){
  .wire-flow{display:inline;fill:none;stroke:#FFF4CC;stroke-width:2;stroke-linecap:round;stroke-dasharray:1.5 16;pointer-events:none;animation:flow .8s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-17.5}}
}
.wire-hit{fill:none;stroke:transparent;stroke-width:var(--wire-hit,18);pointer-events:stroke;cursor:pointer}
.ghost-wire{fill:none;stroke:var(--hi);stroke-width:3;stroke-dasharray:6 5;pointer-events:none}
.gate{cursor:grab}
.shade{fill:rgba(0,0,0,.32);pointer-events:none}
.body{fill:url(#chipG);stroke:#B4C7CB;stroke-width:2}
.body.nand{fill:url(#nandG)}
.gate.sel .body,.gate.sel .bubble{stroke:var(--hi);stroke-width:3}
.bubble{fill:#1D3033;stroke:#B4C7CB;stroke-width:2}
.lead{stroke:var(--steel);stroke-width:2}
.pin{fill:var(--steel);pointer-events:none}
.pin.hi{fill:var(--hi)}
.pin-hit{fill:transparent;cursor:crosshair}
.pending{fill:none;stroke:var(--hi);stroke-width:2.5;pointer-events:none}
.glabel{fill:var(--chip-ink);font:600 15px var(--display);text-anchor:middle;pointer-events:none}
.gtitle{fill:#CFE0DD;font:600 13px var(--display);text-anchor:middle;pointer-events:none}
.plabel{fill:#AFC3C6;font:500 10px var(--body);pointer-events:none}
.switch{fill:#16292C;stroke:var(--steel);stroke-width:1.5;pointer-events:none}
.switch.on{fill:url(#amberG);stroke:var(--hi)}
.switch-hit{fill:transparent;cursor:pointer}
.knob{fill:#8FA5AA;pointer-events:none}
.knob.on{fill:#FFF6DC}
.klabel{font:700 13px var(--display);fill:#16262A;text-anchor:middle;pointer-events:none}
.klabel.on{fill:#8A5A00}
.tname{font:600 14px var(--display);fill:#CFE0DD;pointer-events:none}
.lamp{fill:#16292C;stroke:var(--steel);stroke-width:1.5}
.lamp.on{fill:url(#lampG);stroke:var(--hi)}
.lamp.off-none{stroke-dasharray:4 3}
/* Box select, groups, regions */
.marquee{fill:rgba(255,182,39,.08);stroke:var(--hi);stroke-width:2;stroke-dasharray:8 6;pointer-events:none}
.grp-hit{fill:rgba(255,182,39,.05);cursor:move}
.grp-box{fill:none;stroke:var(--hi);stroke-width:2.5;stroke-dasharray:10 6;pointer-events:none}
.lasso{fill:rgba(255,182,39,.08);stroke:var(--hi);stroke-width:2.5;stroke-dasharray:4 5;stroke-linejoin:round;pointer-events:none}
.region{fill:var(--rc);fill-opacity:.1;stroke:var(--rc);stroke-width:2.5;stroke-dasharray:12 7;stroke-linejoin:round;pointer-events:none}
.region.sel{fill-opacity:.2;stroke-width:4;stroke-dasharray:none}
.rlabel{cursor:pointer}
.rlabel rect{fill:var(--rc)}
.rlabel text{fill:#0A1F1D;font-weight:700;font-family:var(--display)}
.play.sandbox.mode #board{cursor:crosshair}
.tool-actions .ghost[aria-pressed="true"]{border-color:var(--hi);background:color-mix(in srgb,var(--hi) 18%,transparent)}
/* Sandbox panel: title, share, saves, regions */
.sb-box{display:grid;gap:10px;margin:0 0 14px}
.sb-box label{font:600 12px/1 var(--display);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.sb-box input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font:600 17px/1.2 var(--display)}
.sb-box .row{display:flex;gap:8px;flex-wrap:wrap}
.sb-box .row>button{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.sb-box .row svg{width:18px;height:18px}
.sb-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:210px;overflow:auto}
.sb-list li{display:flex;align-items:center;gap:6px}
.sb-list .ghost{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-list .ghost small{color:var(--muted);margin-left:6px}
.sb-list .icon-btn{width:34px;height:34px;flex:none}
.sb-list .icon-btn svg{width:16px;height:16px}
.sb-list .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:0}
.sb-empty{margin:0;font-size:13px;color:var(--muted)}

/* Win */
.overlay{position:fixed;inset:0;background:rgba(5,20,18,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;z-index:10}
.win-card{background:var(--panel);border-radius:16px;padding:28px;max-width:420px;width:100%;border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.win-card h2{font:700 34px/1.05 var(--display);margin:0 0 10px}
#winStars{display:flex;gap:6px;font-size:34px;line-height:1;margin-bottom:12px}
#winStars span{color:var(--line)}
#winStars span.on{color:var(--star);text-shadow:0 0 18px color-mix(in srgb,var(--star) 60%,transparent)}
.win-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){
  .win-card{animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
  #winStars span.on{animation:star .5s cubic-bezier(.2,.9,.3,1.4) backwards;animation-delay:calc(.15s + var(--d))}
  @keyframes star{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
}

@media (max-width:1060px){
  .play{grid-template-columns:1fr;padding:12px;gap:12px}
  #tools{flex-direction:row;flex-wrap:wrap}
  .tool{flex:1 1 110px}
  .tool-actions{flex-direction:row;flex-wrap:wrap}
  .tool-actions .ghost{flex:1 1 auto;min-height:40px}
  .palette{order:1} .board-wrap{order:2} .panel{order:3}
}
/* Phone held sideways: parts on the left, board fills the height */
@media (max-width:1060px) and (orientation:landscape) and (max-height:560px){
  .play{grid-template-columns:150px minmax(0,1fr)}
  .play.learn{grid-template-columns:minmax(0,1fr) 300px}
  .play:not(.learn) .panel{grid-column:1/-1}
  .palette{order:0;padding:10px;max-height:calc(100dvh - 90px);overflow:auto}
  #tools,.tool-actions{flex-direction:column}
  .tool{flex:none;padding:8px 10px}
  .board-wrap{order:0}
  .top{position:static;padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px}
  #board{max-height:calc(100dvh - 24px)}
  .board-help{display:none}
}
/* Sandbox lists every chip: 3-column parts grid so the list stays short */
.play.sandbox #tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.play.sandbox .tool{min-width:0;padding:8px;overflow-wrap:anywhere}
.play.sandbox .tool .tname{font-size:14px}
.play.sandbox .tool .tdesc{font-size:11px}
@media (min-width:1061px){.play.sandbox{grid-template-columns:360px minmax(0,1fr) 320px}}
@media (max-width:1060px) and (orientation:landscape) and (max-height:560px){.play.sandbox{grid-template-columns:280px minmax(0,1fr)}}
</style>
</head>
<body>
<header class="top">
  <button id="homeBtn" class="brand" data-i18n-aria="brandAria">
    <svg viewBox="0 0 34 24" aria-hidden="true"><path d="M4 2h10a10 10 0 0 1 0 20H4z" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="28" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
    <span class="bt">Only NAND</span>
  </button>
  <span id="crumb"></span>
  <div class="ctl">
    <button id="shareTop" class="icon-btn shareBtn" hidden data-i18n-aria="shareBtn" data-i18n-title="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
    <button id="installBtn" class="icon-btn accent" hidden data-i18n-aria="install" data-i18n-title="install">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/></svg>
    </button>
    <label class="lang">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 2.6 2.8 15.4 0 18M12 3c-2.8 2.6-2.8 15.4 0 18"/></svg>
      <select id="langSel" data-i18n-aria="lang">
        <option value="en">English</option><option value="ko">한국어</option><option value="ja">日本語</option>
      </select>
    </label>
    <button id="themeBtn" class="icon-btn thm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/><g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
    </button>
    <div class="snd">
      <button id="sndBtn" class="icon-btn" aria-expanded="false" aria-controls="sndPop" data-i18n-aria="sound" data-i18n-title="sound">
        <svg class="spk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="w1" d="M16.5 9.5a3.5 3.5 0 0 1 0 5"/><path class="w2" d="M19 7a7 7 0 0 1 0 10"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <div id="sndPop" class="pop" hidden>
        <div class="row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
          <input type="range" id="musicVol" min="0" max="100" step="1" data-i18n-aria="music" data-i18n-title="music"><span class="pct" id="musicPct"></span>
        </div>
        <div class="row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
          <input type="range" id="sfxVol" min="0" max="100" step="1" data-i18n-aria="sfx" data-i18n-title="sfx"><span class="pct" id="sfxPct"></span>
        </div>
        <button id="muteBtn" class="icon-btn" aria-pressed="false">
          <svg class="spk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="w1" d="M16.5 9.5a3.5 3.5 0 0 1 0 5"/><path class="w2" d="M19 7a7 7 0 0 1 0 10"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        </button>
      </div>
    </div>
  </div>
</header>

<main>
  <section id="levels" class="levels">
    <div class="intro">
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroText"></p>
      <div class="progress"><div class="bar"><i id="progBar"></i></div><span id="progText"></span></div>
    </div>
    <div id="levelList"></div>
    <button id="sandboxBtn" class="sandbox-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 8h3M7 12h2M7 16h3M14 8h3M15 12h2M14 16h3M10 8v8M14 8v8"/></svg>
      <span><span class="st" data-i18n="sandbox"></span><span class="ss" id="sandboxSub"></span></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:22px;height:22px;color:var(--muted)"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </section>

  <section id="play" class="play" hidden>
    <aside class="palette" id="palette">
      <h2 data-i18n="parts"></h2>
      <div id="tools"></div>
      <div class="tool-actions">
        <button id="insideBtn" class="ghost" aria-keyshortcuts="I" data-kbd="I"><span data-i18n="insideBtn"></span><kbd>I</kbd></button>
        <button id="delBtn" class="ghost" aria-keyshortcuts="Delete X" data-kbd="Del / X"><span data-i18n="delBtn"></span><kbd>Del</kbd></button>
        <button id="clearBtn" class="ghost" aria-keyshortcuts="C" data-kbd="C"><span data-i18n="clearBtn"></span><kbd>C</kbd></button>
        <button id="boxBtn" class="ghost sb-only" aria-pressed="false" aria-keyshortcuts="B" data-kbd="B / Shift+drag"><span data-i18n="boxBtn"></span><kbd>B</kbd></button>
        <button id="copyBtn" class="ghost sb-only" aria-keyshortcuts="Control+C" data-kbd="Ctrl+C"><span data-i18n="copyBtn"></span><kbd>Ctrl C</kbd></button>
        <button id="pasteBtn" class="ghost sb-only" aria-keyshortcuts="Control+V" data-kbd="Ctrl+V"><span data-i18n="pasteBtn"></span><kbd>Ctrl V</kbd></button>
        <button id="regionBtn" class="ghost sb-only" aria-pressed="false" aria-keyshortcuts="R" data-kbd="R"><span data-i18n="regionBtn"></span><kbd>R</kbd></button>
      </div>
    </aside>

    <div class="board-wrap">
      <svg id="board" viewBox="0 0 1000 620" role="img" data-i18n-aria="boardAria">
        <defs>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="10" cy="10" r="1.2" fill="#1E5A53"/>
          </pattern>
          <radialGradient id="bloom" cx="30%" cy="35%" r="70%"><stop offset="0" stop-color="#155049"/><stop offset="1" stop-color="#155049" stop-opacity="0"/></radialGradient>
          <radialGradient id="vign" cx="50%" cy="45%" r="75%">
            <stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".42"/>
          </radialGradient>
          <linearGradient id="chipG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B4146"/><stop offset="1" stop-color="#15232A"/></linearGradient>
          <linearGradient id="nandG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#355458"/><stop offset="1" stop-color="#1B2E31"/></linearGradient>
          <linearGradient id="amberG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFCB5C"/><stop offset="1" stop-color="#F29F0D"/></linearGradient>
          <radialGradient id="lampG" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFF6D6"/><stop offset=".45" stop-color="#FFC23F"/><stop offset="1" stop-color="#E58E00"/></radialGradient>
          <radialGradient id="glowG"><stop offset="0" stop-color="#FFB627" stop-opacity=".5"/><stop offset="1" stop-color="#FFB627" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="1000" height="620" fill="#0B302D"/>
        <rect width="1000" height="620" fill="url(#bloom)"/>
        <rect width="1000" height="620" fill="url(#grid)"/>
        <rect width="1000" height="620" fill="url(#vign)" pointer-events="none"/>

      </svg>
      <p id="coach" class="coach" role="status" hidden></p>
      <div class="zoom-ctl sb-only">
        <button id="zInBtn" class="icon-btn" data-i18n-aria="zoomIn" data-i18n-title="zoomIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="zOutBtn" class="icon-btn" data-i18n-aria="zoomOut" data-i18n-title="zoomOut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <button id="zFitBtn" class="icon-btn" data-i18n-aria="zoomFit" data-i18n-title="zoomFit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      </div>
      <p class="board-help"><span class="lv-only" data-i18n="boardHelp"></span><span class="sb-only" data-i18n="sandboxHelp"></span><span class="rotate-tip" data-i18n="rotateTip"></span></p>
      <div id="inside" hidden>
        <div class="inside-bar">
          <div><span id="insideTitle"></span><span id="insideSub"></span></div>
          <button id="zoomOut" data-i18n="zoomOut"></button>
        </div>
        <svg id="insideSvg" role="img" data-i18n-aria="insideAria"></svg>
      </div>
    </div>

    <aside class="panel">
      <h1><span class="lvl-num" id="lvlNum"></span><span id="lvlTitle"></span></h1>
      <div id="lesson" hidden></div>
      <div class="sb-box sb-only">
        <label for="sbTitle" data-i18n="circuitTitle"></label>
        <input type="text" id="sbTitle" maxlength="60" autocomplete="off" data-i18n-ph="titlePh">
        <div class="row">
          <button id="saveBtn" class="primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg><span data-i18n="saveBtn"></span></button>
        </div>
        <label data-i18n="savedList"></label>
        <ul id="slots" class="sb-list"></ul>
        <label data-i18n="regionsList"></label>
        <ul id="regionList" class="sb-list"></ul>
      </div>
      <div class="card-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg><div><span class="k" data-i18n="goalLabel"></span><p id="lvlGoal"></p><a id="wikiLink" class="wiki" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/></svg><span></span></a></div></div>
      <div id="ruleCard" class="card-note rule" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M12 8v5M12 16.5v.5"/></svg><div><span class="k" data-i18n="ruleLabel"></span><p id="ruleText"></p></div></div>
      <div class="meta" id="meta"></div>
      <div class="tt-wrap"><table id="tt"></table></div>
      <div class="panel-actions" id="actions">
        <button id="testBtn" class="primary" data-i18n="testBtn"></button>

    partNames:{},
    levels:{
      intro:{title:'What is a NAND gate?', goal:'Flip A and B to try all four combinations. Watch the lamp on the right.',
        lesson:['A computer only understands two signals: 1 (on) and 0 (off). A logic gate takes signals in and gives one signal out.',
          'NAND means "not AND". Its output is 0 only when both inputs are 1. Every other time, the output is 1.',
          'That one simple rule is enough to build every other gate, and eventually a whole computer. That is what this game is about.'],
        question:'When does a NAND gate output 0?',
        choices:['When both inputs are 0','When at least one input is 1','Only when both inputs are 1'],
        hint:'Look at the table you filled in. Find the row where the lamp was off.'},
      not:{title:'Invert', goal:'Make a NOT gate. Y should always be the opposite of A.', hint:'Wire A into both inputs of a single NAND.'},
      and:{title:'Both', goal:'Make an AND gate. Y is 1 only when A and B are both 1.', hint:'AND is a NAND with its answer flipped. You just built the flipper.'},
      or:{title:'Either', goal:'Make an OR gate. Y is 1 when A, B, or both are 1.', hint:'Flip A, flip B, then NAND the two flipped signals.'},
      xor:{title:'Different', goal:'Make an XOR gate. Y is 1 only when A and B are different.', hint:'Y is 1 when (A OR B) is 1 and (A NAND B) is also 1.'},
      half:{title:'Add two bits', goal:'Build a half adder. S is the sum bit and C is the carry.', hint:'In binary, 1 + 1 = 10. The sum bit behaves like XOR, and the carry behaves like AND.'},
      full:{title:'Add with carry', goal:'Build a full adder that adds A, B and a carry-in, Cin.', hint:'Chain two half adders, then OR their two carries together.'},
      mux:{title:'Choose', goal:'Build a multiplexer. When S is 0, Y copies A. When S is 1, Y copies B.', hint:'AND A with NOT S, AND B with S, then OR the two results.'},
      split:{title:'One wire, two places', goal:'Flip A and watch the lamp. The wire from A splits to feed both inputs of the NAND.',
        lesson:['A wire can branch. Every branch carries the same signal, so one switch can feed many inputs at once.',
          'Here the signal splits to feed both inputs of a single NAND. Try both positions of the switch and fill in the table.'],
        question:'What does this circuit do to the input?', choices:['Copies it','Flips it','Always outputs 1'],
        hint:'Compare Y with A in each row of the table.',
        win:'Right: feeding one signal into both inputs of a NAND flips it. You just discovered the NOT gate, and you will build it next.',
        why:'Splitting a signal is called fan-out. A real gate can only drive so many inputs before its signal gets weak, so chip designers budget fan-out carefully.'},
      par3:{title:'Odd one out', goal:'Build a parity checker. P is 1 when an odd number of A, B and C are 1.', hint:'XOR is already a 2-input parity checker. Chain two of them.',
        why:'Parity bits are the simplest error detection: send one extra bit so every message has an even count of 1s. A single flipped bit breaks the pattern.'},
      hsub:{title:'Take away', goal:'Build a half subtractor for A \u2212 B. D is the difference bit and Bo is the borrow.', hint:'The difference behaves like XOR. You only need to borrow when A is 0 and B is 1.',
        why:'Subtraction borrows from the next column, the mirror image of carrying. Early calculators had dedicated subtract circuits like this one.'},
      fsub:{title:'Borrow chain', goal:'Build a full subtractor for A \u2212 B \u2212 Bin. Output the difference D and the borrow-out Bout.', hint:'Chain two half subtractors, then OR their two borrows, just like the full adder.',
        why:'Most CPUs never build a subtractor: they add the two\u2019s complement instead (flip B and add 1). The borrow chain you built is the classic textbook version.'},
      mux4:{title:'Four-way switch', goal:'Build a 4-to-1 multiplexer. S1 S0 picks which of A, B, C, D reaches Y (00 = A, 11 = D).', hint:'Use two MUX chips with S0 to choose inside each pair, then let a third MUX pick a pair with S1.',
        why:'Big multiplexers are trees of small ones. A CPU\u2019s register file uses the same tree to pick one of dozens of registers.'},
      gt:{title:'Greater than', goal:'Output GT = 1 when the 2-bit number A1 A0 is greater than B1 B0.', hint:'Subtract A from B with your subtractor chips. If B \u2212 A needs a borrow, B is smaller than A.',
        why:'CPUs compare numbers by subtracting them and checking the borrow (carry) flag. That is exactly the trick you just used.'},
      penc:{title:'Who goes first', goal:'Build a priority encoder. Y1 Y0 is the number of the highest input that is 1. V is 1 when any input is 1.', hint:'Y1 is I3 OR I2. Y0 is I3, or I1 while I2 is off. V is the OR of all four inputs.',
        why:'Priority encoders decide which interrupt a CPU serves first when several devices ask at once, such as the keyboard, the disk and the network.'},
      mul2:{title:'Times two bits', goal:'Multiply the 2-bit numbers A1 A0 and B1 B0. Output the 4-bit product P3 P2 P1 P0.', hint:'Multiplying bits is AND: A0 AND B0 is P0. Add the middle pair A1\u00b7B0 and A0\u00b7B1 with a half adder, then add A1\u00b7B1 to that carry with another.',
        why:'Binary long multiplication is ANDs plus additions. Hardware multipliers lay out thousands of these in a grid so a CPU can multiply in a single clock cycle.'},
      alu:{title:'Mini ALU', goal:'Build a tiny ALU. When Op is 0, Y1 Y0 = A + B (drop the final carry). When Op is 1, Y1 Y0 = A AND B, bit by bit.', hint:'Compute both answers, then let two MUX chips choose with Op. The half adder\u2019s carry already equals A0 AND B0, so reuse it.',
        why:'The arithmetic logic unit is the heart of a CPU: it computes several results and an operation code picks one. You just built a tiny one from NAND.'},
      add4:{title:'Four-bit adder', goal:'Add the 4-bit numbers A3\u2013A0 and B3\u2013B0 plus the carry-in Cin. Output Cout and S3\u2013S0.', hint:'Chain four full adders. Each carry-out feeds the next column\u2019s carry-in, and Cin goes into the A0 + B0 column.',
        why:'Four bits count to 15. Real CPUs chain the same stage 64 times and use carry-lookahead tricks so they never wait for a carry to ripple through every column.'},
      sub4:{title:'Subtract by adding', goal:'Output D3\u2013D0 = A \u2212 B for the 4-bit numbers A3\u2013A0 and B3\u2013B0, wrapping around below 0 (so 2 \u2212 3 = 15).', hint:'A \u2212 B = A + NOT B + 1. Flip every B bit, feed your 4-bit adder and set Cin to 1. A gate with nothing wired in sees 0s, so a lone NAND always outputs 1.',
        why:'This is two\u2019s complement. One adder does both addition and subtraction, which is why nearly every CPU stores negative numbers this way. Read D3 as a sign bit and 15 means \u22121.'},
      seg7:{title:'Digit display', goal:'Show the number B1 B0 (0 to 3) on the seven-segment display by lighting segments a to g.', hint:'Check which digits use each segment. Segment b is lit for every digit, so it only needs constant 1 from an unwired NAND. Segment g is simply B1.',
        why:'Seven-segment decoders drive calculator, clock and microwave displays. The decoder turns a binary number into the pattern our eyes read as a digit.'},
      srl:{title:'Remember one bit', goal:'Build an SR latch. S = 1 sets Q to 1, R = 1 resets Q to 0, and while both are 0, Q keeps its last value.',
        lesson:['Every circuit so far forgets instantly: change the inputs and the output follows. Memory needs feedback, where a gate\u2019s output loops back into another gate\u2019s input.',
          'Two NOR gates wired in a loop can hold one bit. S (set) stores 1, R (reset) stores 0, and when both are 0 the loop keeps whatever it had.',
          'Memory levels are tested with a sequence: the steps run in order, and your circuit keeps its state between them.'],
        hint:'Cross-couple two NOR gates so each output feeds one input of the other. S and R go into the free inputs, and Q comes from the NOR that R drives.',
        why:'Feedback is how circuits remember. Latches like this one are the ancestors of the static RAM cells inside every CPU cache.'},
      dlatch:{title:'Data latch', goal:'Build a D latch. While E is 1, Q follows D. When E is 0, Q holds its value.', hint:'Drive an SR latch with S = D AND E and R = NOT D AND E, so S and R can never both be 1. Four NANDs are enough for three stars.',
        why:'A D latch removes the forbidden S = R = 1 case. Registers are rows of latches that grab data when their enable line fires.'},
      cnt2:{title:'Count to three', goal:'Build a 2-bit counter. Each time Clk rises, Q1 Q0 counts up: 00, 01, 10, 11, then back to 00. While Rst is 1, a rising Clk resets it to 00.',
        hint:'Use two DFF chips with Clk wired to both. Q0 flips on every tick, so feed its D with NOR(Q0, Rst). Q1 flips when Q0 is 1, so feed it NOR(Q1 XNOR Q0, Rst).',
        why:'Counters are everywhere: the program counter that steps through instructions, timers, and the dividers that turn a fast quartz crystal into a 1 Hz clock tick.'},
      reg4:{title:'Four-bit register', goal:'Build a 4-bit register. When Clk rises and Ld is 1, Q3\u2013Q0 load D3\u2013D0. Otherwise Q keeps its value.',
        hint:'One DFF chip per bit. Put a MUX in front of each: when Ld is 0 it feeds the flip-flop its own Q, when Ld is 1 it feeds the new D.',
        why:'Registers are the CPU\u2019s fastest storage. Every instruction reads its inputs from registers and writes its result back into one, all in step with the clock.'},
      dff:{title:'Edge trigger', goal:'Build a D flip-flop. Q copies D only at the moment Clk rises from 0 to 1, and holds at every other time.', hint:'Chain two D latches. The first (master) is enabled while Clk is 0; the second (slave) is enabled while Clk is 1 and takes the master\u2019s Q as its D.',
        why:'Flip-flops make a whole CPU move in lockstep: on every clock edge, billions of them capture their new value at the same instant. A 4 GHz CPU does this 4 billion times per second.'},
      nor:{title:'Neither', goal:'Make a NOR gate. Y is 1 only when A and B are both 0.', hint:'NOR means "not OR". Put an OR and a NOT in a row.',
        why:'NOR is functionally complete too, just like NAND. The Apollo Guidance Computer that flew to the Moon was built entirely from NOR gates.'},
      xnor:{title:'Same', goal:'Make an XNOR gate. Y is 1 only when A and B are equal.', hint:'XNOR is XOR with its answer flipped.',
        why:'XNOR is a one-bit equality check. Put several side by side and AND their outputs to test whether two whole numbers match.'},
      demux:{title:'Route', goal:'Build a demultiplexer. D goes to Y0 when S is 0 and to Y1 when S is 1. The other output stays 0.', hint:'Y0 is D AND NOT S. Y1 is D AND S.',
        why:'A demultiplexer mirrors a multiplexer: one input, many destinations. Memory chips use the same idea to deliver data to exactly one storage cell.'},
      eq:{title:'Equal?', goal:'Output EQ = 1 when the 2-bit numbers A1 A0 and B1 B0 are equal.', hint:'Check each bit pair with XNOR, then AND the two results.',
        why:'Comparators like this decide every "if (a == b)" in a program. CPUs compare 64-bit numbers with the same pattern, just wider.'},
      dec:{title:'Decode', goal:'Build a 2-to-4 decoder. Exactly one of Y0 to Y3 is 1: the one whose number is A1 A0.', hint:'Make NOT A1 and NOT A0 first. Each output is an AND of one version of A1 and one version of A0.',
        why:'Decoders pick one line out of many. Memory uses them to turn an address into the single row it should read.'},
      maj:{title:'Majority vote', goal:'Y is 1 when at least two of A, B and C are 1.', hint:'You already built a chip that computes this. Look closely at the outputs of the full adder.',
        why:'The carry of a full adder is a majority vote. Spacecraft run three computers and a majority voter so one faulty machine cannot win the vote.'},
      r_xor:{title:'Pure XOR', goal:'Build XOR from NAND gates only, using at most 4.', hint:'NAND A and B first. NAND that result with A, and separately with B. Then NAND those two together.',
        why:'Four NANDs is the smallest XOR you can make from NAND alone. Cutting gate count like this saves chip area and power.'},
      r_half:{title:'Tight adder', goal:'Build a half adder from NAND gates only, using at most 5.', hint:'Build the 4-NAND XOR for S. Its first NAND already computes A NAND B, so one more NAND wired as NOT gives C.',
        why:'Sharing one signal between two outputs is a key optimization. Here the carry reuses a gate the sum already needed.'},
      r_mux:{title:'Tight choice', goal:'Build a multiplexer from NAND gates only, using at most 4.', hint:'One NAND makes NOT S. NAND A with NOT S, NAND B with S, then NAND the two results.',
        why:'NAND-NAND logic equals AND-OR logic. Thanks to De Morgan\u2019s law, any AND-OR circuit can be built from a single gate type.'},
      and3:{title:'All three', goal:'Make a 3-input AND gate. Y is 1 only when A, B and C are all 1.', hint:'AND A with B, then AND that result with C.',
        why:'Wide gates are built by chaining narrow ones. Checking whether every bit of a number is 1 works the same way, just with more inputs.'},
      or3:{title:'Any of three', goal:'Make a 3-input OR gate. Y is 1 when at least one of A, B and C is 1.', hint:'OR A with B, then OR that result with C.',
        why:'A wide OR answers "is anything on?". CPUs NOR every bit of a result to raise the zero flag, which tells the program the answer was 0.'},
      tff:{title:'Toggle', goal:'Build a T flip-flop. When Clk rises and T is 1, Q flips. When T is 0, Q holds. While Rst is 1, a rising Clk resets Q to 0.',
        hint:'Use a DFF chip. The next Q is T XOR Q, so feed its D with NOR(T XNOR Q, Rst).',
        why:'With T held at 1, Q changes at half the clock\u2019s speed. Chain a few and you divide a fast quartz crystal down to the slow tick a watch needs.'},
      jk:{title:'Set, reset, flip', goal:'Build a JK flip-flop. On each rising Clk: J = 1 sets Q to 1, K = 1 resets it to 0, both 1 flips Q, and both 0 keeps it.',
        hint:'Use a DFF chip. When Q is 0 the next value is J; when Q is 1 it is NOT K. A MUX with Q on its S input picks between them.',
        why:'The JK flip-flop gives the SR latch\u2019s forbidden input a meaning: J = K = 1 toggles. It was the workhorse of 1970s logic chips.'},
      shift4:{title:'Bit conveyor', goal:'Build a 4-bit shift register. On each rising Clk, Din moves into Q3, Q3 into Q2, Q2 into Q1 and Q1 into Q0.',
        hint:'Chain four DFF chips with Clk wired to all of them. Each flip-flop\u2019s D takes the Q of the one before it.',
        why:'Shift registers turn one wire into many bits. USB, SPI and serial ports send data one bit at a time, and a shift register gathers the bits back into bytes.'},
      cnt4:{title:'Count to fifteen', goal:'Build a 4-bit counter. On each rising Clk: Rst = 1 resets Q3\u2013Q0 to 0000; otherwise En = 1 adds 1 and En = 0 holds.',
        hint:'Feed your REG4\u2019s Q into the ADD4\u2019s A inputs, leave B at 0 and set Cin to En. Four MUX chips with S = Rst swap the sum for 0 (a MUX with nothing wired into B outputs 0 when S is 1). Load when Rst OR En is 1.',
        why:'This is how a CPU\u2019s program counter works: a register plus an adder that adds 1 every clock tick, so instructions run in order.'},
      acc:{title:'Accumulator', goal:'Build an accumulator. When Clk rises with En = 1: Op = 0 loads X3\u2013X0 into Q3\u2013Q0, and Op = 1 adds X to Q (wrapping past 15). With En = 0, Q holds.',
        hint:'Wire REG4\u2019s Q into ADD4\u2019s A inputs and X into B. Four MUX chips with S = Op choose between X and the sum and feed the register\u2019s D. Ld is En.',
        why:'Early computers such as EDSAC and the 6502 were built around an accumulator: one register that every calculation passes through. You just built the core of one.'},
      r_ram:{title:'Memory cell', goal:'Build one RAM cell from NAND gates only, using at most 8. While Sel and WE are both 1, the cell stores D. Q shows the stored bit while Sel is 1, and is 0 otherwise.',
        hint:'Two NANDs make E = Sel AND WE. Four NANDs make a D latch enabled by E. Two more NANDs AND the latch\u2019s output with Sel.',
        why:'Real memory is a grid of cells like this. A decoder raises one Sel line, and only that cell takes the write or drives the output. The static RAM in CPU caches uses six transistors per cell.'},
      add2:{title:'Two-bit adder', goal:'Add the 2-bit numbers A1 A0 and B1 B0. Output the 3-bit sum S2 S1 S0.', hint:'A half adder handles A0 + B0. A full adder handles A1 + B1 plus that carry.'},
    },
  },

    zoomIn:'확대', zoomFit:'보드 전체 보기', whyLabel:'원리',
    why:{
      intro:'실제 칩이 NAND를 많이 쓰는 이유는 트랜지스터 4개로 만들 수 있고, 다른 모든 게이트를 NAND로 만들 수 있기 때문입니다. 이를 기능적 완전성이라고 합니다.',

    levels:{

        lesson:['컴퓨터는 두 가지 신호만 이해합니다: 1(켜짐)과 0(꺼짐). 논리 게이트는 신호를 받아 하나의 신호를 내보냅니다.',

        hint:'표의 각 행에서 Y와 A를 비교해 보세요.',

      par3:{title:'홀수 찾기', goal:'패리티 검사기를 만드세요. A, B, C 중 1의 개수가 홀수이면 P가 1입니다.', hint:'XOR는 이미 입력 2개짜리 패리티 검사기입니다. 두 개를 이어 보세요.',

      hsub:{title:'빼기', goal:'A \u2212 B를 계산하는 반감산기를 만드세요. D는 차 비트, Bo는 빌림(borrow)입니다.', hint:'차는 XOR처럼 동작합니다. 빌림은 A가 0이고 B가 1일 때만 필요합니다.',

      fsub:{title:'빌림의 사슬', goal:'A \u2212 B \u2212 Bin을 계산하는 전감산기를 만드세요. 차 D와 빌림 출력 Bout을 내보냅니다.', hint:'전가산기처럼 반감산기 두 개를 잇고, 두 빌림을 OR로 합치세요.',
        why:'대부분의 CPU는 감산기를 따로 만들지 않고 2의 보수를 더합니다(B를 뒤집고 1을 더함). 방금 만든 빌림 사슬은 교과서의 고전적인 방식입니다.'},
      mux4:{title:'4방향 스위치', goal:'4-1 멀티플렉서를 만드세요. S1 S0이 A, B, C, D 중 무엇을 Y로 보낼지 고릅니다(00 = A, 11 = D).', hint:'MUX 칩 두 개에 S0을 연결해 각 쌍 안에서 고르고, 세 번째 MUX가 S1로 쌍을 고르게 하세요.',
        why:'큰 멀티플렉서는 작은 것들을 나무처럼 쌓아 만듭니다. CPU의 레지스터 파일도 같은 구조로 수십 개 레지스터 중 하나를 고릅니다.'},
      gt:{title:'더 큰가?', goal:'2비트 수 A1 A0이 B1 B0보다 크면 GT = 1을 출력하세요.', hint:'감산기 칩으로 B에서 A를 빼 보세요. B \u2212 A에 빌림이 필요하면 B가 A보다 작습니다.',
        why:'CPU는 두 수를 빼고 빌림(캐리) 플래그를 확인해 크기를 비교합니다. 방금 쓴 바로 그 기법입니다.'},
      penc:{title:'누가 먼저?', goal:'우선순위 인코더를 만드세요. Y1 Y0은 1인 입력 중 가장 높은 번호입니다. 입력이 하나라도 1이면 V가 1입니다.', hint:'Y1은 I3 OR I2입니다. Y0은 I3이거나, I2가 꺼져 있을 때의 I1입니다. V는 네 입력을 모두 OR 한 것입니다.',
        why:'우선순위 인코더는 키보드, 디스크, 네트워크처럼 여러 장치가 동시에 요청할 때 CPU가 어떤 인터럽트를 먼저 처리할지 정합니다.'},
      mul2:{title:'2비트 곱셈', goal:'2비트 수 A1 A0과 B1 B0을 곱하세요. 4비트 곱 P3 P2 P1 P0을 출력합니다.', hint:'비트 곱은 AND입니다: A0 AND B0이 P0입니다. 가운데 쌍 A1\u00b7B0과 A0\u00b7B1을 반가산기로 더하고, A1\u00b7B1과 그 캐리를 또 다른 반가산기로 더하세요.',
        why:'2진수 곱셈은 AND와 덧셈의 조합입니다. 하드웨어 곱셈기는 이런 회로 수천 개를 격자로 배치해 한 클럭 만에 곱셈을 끝냅니다.'},
      alu:{title:'미니 ALU', goal:'작은 ALU를 만드세요. Op가 0이면 Y1 Y0 = A + B(마지막 캐리는 버림), Op가 1이면 Y1 Y0 = 비트별 A AND B입니다.', hint:'두 답을 모두 계산한 뒤 MUX 칩 두 개가 Op로 고르게 하세요. 반가산기의 캐리가 이미 A0 AND B0이니 재활용하세요.',
        why:'산술 논리 장치(ALU)는 CPU의 심장입니다. 여러 결과를 계산하고 연산 코드가 그중 하나를 고르죠. 방금 NAND로 작은 ALU를 만들었습니다.'},
      add4:{title:'4비트 덧셈기', goal:'4비트 수 A3\u2013A0과 B3\u2013B0, 올림 입력 Cin을 더하세요. Cout과 S3\u2013S0을 출력합니다.', hint:'전가산기 네 개를 이으세요. 각 캐리 출력이 다음 자리의 캐리 입력으로 들어가고, A0 + B0 자리에는 Cin이 들어갑니다.',
        why:'4비트로는 15까지 셀 수 있습니다. 실제 CPU는 같은 단을 64개 이어 붙이고, 캐리가 모든 자리를 물결처럼 지나가길 기다리지 않도록 캐리 예측 기법을 씁니다.'},
      sub4:{title:'더해서 빼기', goal:'4비트 수 A3\u2013A0과 B3\u2013B0에 대해 D3\u2013D0 = A \u2212 B를 출력하세요. 0 아래로 내려가면 한 바퀴 돕니다(2 \u2212 3 = 15).', hint:'A \u2212 B = A + NOT B + 1입니다. B의 모든 비트를 뒤집어 4비트 덧셈기에 넣고 Cin을 1로 만드세요. 아무것도 연결되지 않은 게이트는 0을 보므로, 혼자 놓인 NAND는 항상 1을 출력합니다.',
        why:'이것이 2의 보수입니다. 덧셈기 하나로 덧셈과 뺄셈을 모두 할 수 있어서 거의 모든 CPU가 음수를 이렇게 저장합니다. D3을 부호 비트로 읽으면 15는 \u22121을 뜻합니다.'},
      seg7:{title:'숫자 표시', goal:'7세그먼트 표시기에 숫자 B1 B0(0~3)을 나타내세요. 세그먼트 a~g를 켜서 표시합니다.', hint:'각 세그먼트가 어떤 숫자에서 켜지는지 보세요. 세그먼트 b는 모든 숫자에서 켜지므로 상수 1, 즉 연결하지 않은 NAND 하나면 됩니다. 세그먼트 g는 그냥 B1입니다.',
        why:'7세그먼트 디코더는 계산기, 시계, 전자레인지의 표시창을 구동합니다. 2진수를 우리 눈이 숫자로 읽는 모양으로 바꿔 주죠.'},
      srl:{title:'1비트 기억하기', goal:'SR 래치를 만드세요. S = 1이면 Q가 1로, R = 1이면 Q가 0으로 바뀌고, 둘 다 0인 동안 Q는 마지막 값을 유지합니다.',
        lesson:['지금까지의 회로는 모두 즉시 잊어버립니다. 입력이 바뀌면 출력도 바로 따라가죠. 기억하려면 게이트의 출력이 다른 게이트의 입력으로 되돌아가는 피드백이 필요합니다.',
          'NOR 게이트 두 개를 고리로 연결하면 1비트를 기억할 수 있습니다. S(set)는 1을, R(reset)은 0을 저장하고, 둘 다 0이면 고리는 가지고 있던 값을 유지합니다.',
          '메모리 레벨은 순서대로 테스트합니다. 단계가 차례로 실행되며, 회로는 단계 사이에 상태를 유지합니다.'],
        hint:'NOR 게이트 두 개를 교차 연결해 각 출력이 다른 쪽의 입력 하나로 들어가게 하세요. 남은 입력에 S와 R을 넣고, Q는 R이 들어가는 NOR에서 나옵니다.',
        why:'피드백은 회로가 기억하는 방법입니다. 이런 래치는 모든 CPU 캐시에 들어 있는 SRAM 셀의 조상입니다.'},
      dlatch:{title:'데이터 래치', goal:'D 래치를 만드세요. E가 1인 동안 Q는 D를 따라가고, E가 0이면 Q는 값을 유지합니다.', hint:'S = D AND E, R = NOT D AND E로 SR 래치를 구동하면 S와 R이 동시에 1이 될 수 없습니다. 별 3개는 NAND 4개로 충분합니다.',
        why:'D 래치는 S = R = 1이라는 금지된 경우를 없앱니다. 레지스터는 활성 신호가 들어올 때 데이터를 붙잡는 래치들의 줄입니다.'},
      cnt2:{title:'셋까지 세기', goal:'2비트 카운터를 만드세요. Clk가 올라갈 때마다 Q1 Q0이 00, 01, 10, 11 순서로 늘어나고 다시 00으로 돌아갑니다. Rst가 1인 동안 Clk가 올라가면 00으로 초기화됩니다.',
        hint:'DFF 칩 두 개를 쓰고 Clk를 둘 다에 연결하세요. Q0은 매 박자마다 뒤집히므로 D에 NOR(Q0, Rst)를 넣으세요. Q1은 Q0이 1일 때 뒤집히므로 NOR(Q1 XNOR Q0, Rst)를 넣으세요.',
        why:'카운터는 어디에나 있습니다. 명령어를 차례로 짚어 가는 프로그램 카운터, 타이머, 빠른 수정 진동을 1Hz 시계 박자로 바꾸는 분주기가 모두 카운터입니다.'},
      reg4:{title:'4비트 레지스터', goal:'4비트 레지스터를 만드세요. Clk가 올라갈 때 Ld가 1이면 Q3\u2013Q0에 D3\u2013D0을 저장하고, 그렇지 않으면 Q는 값을 유지합니다.',
        hint:'비트마다 DFF 칩을 하나씩 쓰세요. 각 앞에 MUX를 두어 Ld가 0이면 자기 Q를, Ld가 1이면 새 D를 플립플롭에 넣으세요.',
        why:'레지스터는 CPU에서 가장 빠른 저장소입니다. 모든 명령어는 레지스터에서 입력을 읽고 결과를 레지스터에 다시 쓰며, 이 모든 것이 클럭에 맞춰 움직입니다.'},
      dff:{title:'에지 트리거', goal:'D 플립플롭을 만드세요. Q는 Clk가 0에서 1로 올라가는 순간에만 D를 복사하고, 나머지 시간에는 유지합니다.', hint:'D 래치 두 개를 이으세요. 첫 번째(마스터)는 Clk가 0인 동안, 두 번째(슬레이브)는 Clk가 1인 동안 활성화되고 마스터의 Q를 D로 받습니다.',
        why:'플립플롭은 CPU 전체를 한 박자로 움직이게 합니다. 클럭 에지마다 수십억 개가 같은 순간에 새 값을 붙잡죠. 4GHz CPU는 이를 1초에 40억 번 합니다.'},
      nor:{title:'둘 다 아님', goal:'NOR 게이트를 만드세요. A와 B가 모두 0일 때만 Y가 1입니다.', hint:'NOR는 "NOT OR"라는 뜻입니다. OR와 NOT을 차례로 연결하세요.',
        why:'NOR도 NAND처럼 기능적으로 완전합니다. 달에 간 아폴로 유도 컴퓨터는 NOR 게이트만으로 만들어졌습니다.'},
      xnor:{title:'같음', goal:'XNOR 게이트를 만드세요. A와 B가 같을 때만 Y가 1입니다.', hint:'XNOR는 결과를 뒤집은 XOR입니다.',
        why:'XNOR는 1비트 일치 검사기입니다. 여러 개를 나란히 놓고 출력을 AND 하면 두 수 전체가 같은지 확인할 수 있습니다.'},
      demux:{title:'경로 배정', goal:'디멀티플렉서를 만드세요. S가 0이면 D가 Y0으로, S가 1이면 Y1로 갑니다. 다른 출력은 0을 유지합니다.', hint:'Y0은 D AND NOT S, Y1은 D AND S입니다.',
        why:'디멀티플렉서는 멀티플렉서의 거울입니다: 입력 하나, 목적지 여러 개. 메모리 칩도 같은 원리로 데이터를 정확히 한 저장 칸에 보냅니다.'},
      eq:{title:'같을까?', goal:'2비트 수 A1 A0과 B1 B0이 같으면 EQ = 1을 출력하세요.', hint:'각 비트 쌍을 XNOR로 비교한 다음 두 결과를 AND 하세요.',
        why:'이런 비교기가 프로그램의 모든 "if (a == b)"를 판단합니다. CPU는 같은 방식을 더 넓게 써서 64비트 수를 비교합니다.'},
      dec:{title:'디코드', goal:'2-4 디코더를 만드세요. Y0~Y3 중 정확히 하나만 1이 됩니다: 번호가 A1 A0인 출력입니다.', hint:'먼저 NOT A1과 NOT A0을 만드세요. 각 출력은 A1의 한 형태와 A0의 한 형태를 AND 한 것입니다.',
        why:'디코더는 여러 선 중 하나를 고릅니다. 메모리는 디코더로 주소를 읽어야 할 단 하나의 행으로 바꿉니다.'},
      maj:{title:'다수결', goal:'A, B, C 중 두 개 이상이 1이면 Y가 1입니다.', hint:'이 값을 계산하는 칩을 이미 만들었습니다. 전가산기의 출력을 잘 살펴보세요.',
        why:'전가산기의 캐리는 다수결입니다. 우주선은 컴퓨터 세 대와 다수결 회로를 써서 고장 난 한 대가 결정을 좌우하지 못하게 합니다.'},
      r_xor:{title:'순수 XOR', goal:'NAND 게이트만으로, 최대 4개를 써서 XOR를 만드세요.', hint:'먼저 A와 B를 NAND 하세요. 그 결과를 A와 한 번, B와 한 번 따로 NAND 한 다음, 두 결과를 NAND 하세요.',
        why:'NAND 4개는 NAND만으로 만들 수 있는 가장 작은 XOR입니다. 이렇게 게이트 수를 줄이면 칩 면적과 전력이 절약됩니다.'},
      r_half:{title:'빠듯한 덧셈기', goal:'NAND 게이트만으로, 최대 5개를 써서 반가산기를 만드세요.', hint:'S는 NAND 4개짜리 XOR로 만드세요. 첫 NAND가 이미 A NAND B를 계산하므로, NOT으로 쓰는 NAND 하나만 더하면 C가 됩니다.',
        why:'두 출력이 신호를 공유하는 것은 핵심 최적화 기법입니다. 여기서 캐리는 합이 이미 쓰던 게이트를 재활용합니다.'},
      r_mux:{title:'빠듯한 선택', goal:'NAND 게이트만으로, 최대 4개를 써서 멀티플렉서를 만드세요.', hint:'NAND 하나로 NOT S를 만드세요. A를 NOT S와, B를 S와 NAND 한 다음 두 결과를 NAND 하세요.',
        why:'NAND-NAND 논리는 AND-OR 논리와 같습니다. 드모르간의 법칙 덕분에 어떤 AND-OR 회로도 한 종류의 게이트로 만들 수 있습니다.'},
      and3:{title:'셋 다', goal:'3입력 AND 게이트를 만드세요. A, B, C가 모두 1일 때만 Y가 1입니다.', hint:'A와 B를 AND 한 다음, 그 결과를 C와 AND 하세요.',
        why:'넓은 게이트는 좁은 게이트를 이어서 만듭니다. 수의 모든 비트가 1인지 확인하는 것도 입력만 많을 뿐 같은 방식입니다.'},
      or3:{title:'셋 중 하나', goal:'3입력 OR 게이트를 만드세요. A, B, C 중 하나라도 1이면 Y가 1입니다.', hint:'A와 B를 OR 한 다음, 그 결과를 C와 OR 하세요.',
        why:'넓은 OR는 "켜진 게 하나라도 있나?"에 답합니다. CPU는 결과의 모든 비트를 NOR 해서, 답이 0인지 알려 주는 제로 플래그를 만듭니다.'},
      tff:{title:'토글', goal:'T 플립플롭을 만드세요. Clk가 올라갈 때 T가 1이면 Q가 뒤집히고, T가 0이면 유지됩니다. Rst가 1인 동안 Clk가 올라가면 Q는 0으로 초기화됩니다.',
        hint:'DFF 칩을 쓰세요. 다음 Q는 T XOR Q이므로 D에 NOR(T XNOR Q, Rst)를 넣으세요.',
        why:'T를 1로 두면 Q는 클록의 절반 속도로 바뀝니다. 몇 개를 이으면 빠른 수정 발진기를 시계에 필요한 느린 박자로 나눌 수 있습니다.'},
      jk:{title:'설정, 초기화, 뒤집기', goal:'JK 플립플롭을 만드세요. Clk가 올라갈 때마다 J = 1이면 Q를 1로, K = 1이면 0으로 만들고, 둘 다 1이면 뒤집고, 둘 다 0이면 유지합니다.',
        hint:'DFF 칩을 쓰세요. Q가 0이면 다음 값은 J, Q가 1이면 NOT K입니다. S 입력에 Q를 넣은 MUX로 둘 중 하나를 고르세요.',
        why:'JK 플립플롭은 SR 래치의 금지 입력에 의미를 줍니다. J = K = 1이면 뒤집기죠. 1970년대 논리 칩의 일꾼이었습니다.'},
      shift4:{title:'비트 컨베이어', goal:'4비트 시프트 레지스터를 만드세요. Clk가 올라갈 때마다 Din은 Q3으로, Q3은 Q2로, Q2는 Q1로, Q1은 Q0으로 이동합니다.',
        hint:'DFF 칩 네 개를 잇고 Clk를 모두에 연결하세요. 각 플립플롭의 D는 바로 앞 플립플롭의 Q를 받습니다.',
        why:'시프트 레지스터는 전선 하나를 여러 비트로 바꿉니다. USB, SPI, 시리얼 포트는 데이터를 한 비트씩 보내고, 시프트 레지스터가 이를 다시 바이트로 모읍니다.'},
      cnt4:{title:'열다섯까지 세기', goal:'4비트 카운터를 만드세요. Clk가 올라갈 때마다 Rst = 1이면 Q3\u2013Q0을 0000으로 초기화하고, 아니면 En = 1일 때 1을 더하고 En = 0이면 유지합니다.',
        hint:'REG4의 Q를 ADD4의 A 입력에 넣고, B는 0으로 두고 Cin에 En을 연결하세요. S = Rst인 MUX 칩 네 개가 합을 0으로 바꿉니다(B에 아무것도 연결하지 않은 MUX는 S가 1일 때 0을 냅니다). Rst OR En이 1일 때 저장하세요.',
        why:'CPU의 프로그램 카운터가 이렇게 작동합니다. 레지스터와 덧셈기가 클록마다 1을 더해 명령어를 순서대로 실행합니다.'},
      acc:{title:'누산기', goal:'누산기를 만드세요. En = 1인 채로 Clk가 올라갈 때 Op = 0이면 X3\u2013X0을 Q3\u2013Q0에 저장하고, Op = 1이면 Q에 X를 더합니다(15를 넘으면 0부터 다시). En = 0이면 Q는 유지됩니다.',
        hint:'REG4의 Q를 ADD4의 A 입력에, X를 B에 연결하세요. S = Op인 MUX 칩 네 개가 X와 합 중 하나를 골라 레지스터의 D에 넣습니다. Ld는 En입니다.',
        why:'EDSAC이나 6502 같은 초기 컴퓨터는 누산기를 중심으로 만들어졌습니다. 모든 계산이 거쳐 가는 레지스터 하나죠. 방금 그 핵심을 만들었습니다.'},
      r_ram:{title:'메모리 셀', goal:'NAND 게이트만으로, 최대 8개를 써서 RAM 셀 하나를 만드세요. Sel과 WE가 모두 1인 동안 셀은 D를 저장합니다. Q는 Sel이 1일 때 저장된 비트를 보여 주고, 아니면 0입니다.',
        hint:'NAND 두 개로 E = Sel AND WE를 만드세요. NAND 네 개로 E가 켜는 D 래치를 만들고, NAND 두 개로 래치 출력과 Sel을 AND 하세요.',
        why:'실제 메모리는 이런 셀을 격자로 늘어놓은 것입니다. 디코더가 Sel 선 하나를 올리면 그 셀만 쓰기를 받거나 출력을 냅니다. CPU 캐시의 SRAM은 셀 하나에 트랜지스터 6개를 씁니다.'},
      add2:{title:'2비트 덧셈기', goal:'2비트 수 A1 A0과 B1 B0을 더하세요. 3비트 합 S2 S1 S0을 출력합니다.', hint:'반가산기로 A0 + B0을, 전가산기로 A1 + B1과 그 캐리를 처리하세요.'},
    },
  },

      sub4:{title:'足して引く', goal:'4 ビットの数 A3\u2013A0 と B3\u2013B0 について D3\u2013D0 = A \u2212 B を出力しよう。0 を下回ると一周します（2 \u2212 3 = 15）。', hint:'A \u2212 B = A + NOT B + 1 です。B のすべてのビットを反転して 4 ビット加算器に入れ、Cin を 1 にします。何もつながっていないゲートは 0 を見るので、単独の NAND は常に 1 を出力します。',

      srl:{title:'1 ビットを覚える', goal:'SR ラッチを作ろう。S = 1 で Q が 1 に、R = 1 で Q が 0 になり、両方 0 の間 Q は最後の値を保ちます。',

          'NOR ゲート 2 つをループにつなぐと 1 ビットを保持できます。S（セット）は 1 を、R（リセット）は 0 を記憶し、両方 0 のときループは持っていた値を保ちます。',

      reg4:{title:'4 ビットレジスタ', goal:'4 ビットレジスタを作ろう。Clk が上がるときに Ld が 1 なら Q3\u2013Q0 に D3\u2013D0 を読み込み、そうでなければ Q は値を保ちます。',

        why:'XNOR は 1 ビットの一致検出器です。いくつも並べて出力を AND すれば、2 つの数全体が一致するか確かめられます。'},

      eq:{title:'等しい？', goal:'2 ビットの数 A1 A0 と B1 B0 が等しければ EQ = 1 を出力しよう。', hint:'各ビットの組を XNOR で比べて、2 つの結果を AND しましょう。',
        why:'こうした比較器がプログラムの「if (a == b)」をすべて判定しています。CPU は同じ仕組みを広げて 64 ビットの数を比べます。'},
      dec:{title:'デコード', goal:'2-4 デコーダを作ろう。Y0〜Y3 のうちちょうど 1 つだけが 1 になります：番号が A1 A0 の出力です。', hint:'まず NOT A1 と NOT A0 を作りましょう。各出力は A1 のどちらかと A0 のどちらかの AND です。',
        why:'デコーダは多くの線から 1 本を選びます。メモリはデコーダでアドレスを読むべき 1 行に変換します。'},
      maj:{title:'多数決', goal:'A、B、C のうち 2 つ以上が 1 なら Y が 1 になります。', hint:'これを計算するチップはもう作っています。全加算器の出力をよく見てみましょう。',
        why:'全加算器の桁上がりは多数決です。宇宙船は 3 台のコンピュータと多数決回路を使い、1 台が故障しても結果が狂わないようにしています。'},
      r_xor:{title:'純粋な XOR', goal:'NAND ゲートだけで、4 個以内で XOR を作ろう。', hint:'まず A と B を NAND。その結果を A と、別に B と NAND し、その 2 つを NAND します。',
        why:'NAND 4 個は NAND だけで作れる最小の XOR です。ゲート数を減らすとチップの面積と電力を節約できます。'},
      r_half:{title:'ぎりぎり加算器', goal:'NAND ゲートだけで、5 個以内で半加算器を作ろう。', hint:'S は NAND 4 個の XOR で。最初の NAND がすでに A NAND B を計算しているので、NOT として使う NAND をもう 1 つ足せば C になります。',
        why:'2 つの出力で信号を共有するのは重要な最適化テクニックです。ここでは桁上がりが、和ですでに使っているゲートを再利用しています。'},
      r_mux:{title:'ぎりぎり選択', goal:'NAND ゲートだけで、4 個以内でマルチプレクサを作ろう。', hint:'NAND 1 つで NOT S を作ります。A と NOT S、B と S をそれぞれ NAND して、2 つの結果を NAND しましょう。',
        why:'NAND-NAND 論理は AND-OR 論理と同じです。ド・モルガンの法則のおかげで、どんな AND-OR 回路も 1 種類のゲートで作れます。'},
      and3:{title:'3 つとも', goal:'3 入力 AND ゲートを作ろう。A、B、C がすべて 1 のときだけ Y が 1 になります。', hint:'A と B を AND して、その結果を C と AND しましょう。',
        why:'幅の広いゲートは狭いゲートをつないで作ります。数のすべてのビットが 1 か調べるのも、入力が多いだけで同じ仕組みです。'},
      or3:{title:'3 つのどれか', goal:'3 入力 OR ゲートを作ろう。A、B、C のどれか 1 つでも 1 なら Y が 1 になります。', hint:'A と B を OR して、その結果を C と OR しましょう。',
        why:'幅の広い OR は「どれか点いている？」に答えます。CPU は結果の全ビットを NOR して、答えが 0 かどうかを示すゼロフラグを立てます。'},
      tff:{title:'トグル', goal:'T フリップフロップを作ろう。Clk が上がるとき T が 1 なら Q が反転し、T が 0 なら保ちます。Rst が 1 の間に Clk が上がると Q は 0 にリセットされます。',
        hint:'DFF チップを使います。次の Q は T XOR Q なので、D に NOR(T XNOR Q, Rst) を入れましょう。',
        why:'T を 1 にしておくと、Q はクロックの半分の速さで変わります。いくつかつなげば、速い水晶発振を時計に必要なゆっくりした刻みまで分周できます。'},
      jk:{title:'セット・リセット・反転', goal:'JK フリップフロップを作ろう。Clk が上がるたびに、J = 1 なら Q を 1 に、K = 1 なら 0 にし、両方 1 なら反転、両方 0 なら保ちます。',
        hint:'DFF チップを使います。Q が 0 なら次の値は J、Q が 1 なら NOT K です。S 入力に Q をつないだ MUX でどちらかを選びましょう。',
        why:'JK フリップフロップは SR ラッチの禁止入力に意味を与えます。J = K = 1 は反転です。1970 年代の論理 IC の主力でした。'},
      shift4:{title:'ビットコンベア', goal:'4 ビットシフトレジスタを作ろう。Clk が上がるたびに Din は Q3 へ、Q3 は Q2 へ、Q2 は Q1 へ、Q1 は Q0 へ移ります。',
        hint:'DFF チップを 4 つつなぎ、Clk を全部に接続します。各フリップフロップの D には 1 つ前の Q を入れましょう。',
        why:'シフトレジスタは 1 本の線を多くのビットに変えます。USB、SPI、シリアルポートはデータを 1 ビットずつ送り、シフトレジスタがそれをバイトにまとめ直します。'},
      cnt4:{title:'15 まで数える', goal:'4 ビットカウンタを作ろう。Clk が上がるたびに、Rst = 1 なら Q3\u2013Q0 を 0000 にリセット、そうでなければ En = 1 で 1 を足し、En = 0 なら保ちます。',
        hint:'REG4 の Q を ADD4 の A 入力へつなぎ、B は 0 のまま、Cin に En を入れます。S = Rst の MUX チップ 4 つで和を 0 に置き換えます（B に何もつながない MUX は S が 1 のとき 0 を出します）。Rst OR En が 1 のとき読み込みましょう。',
        why:'CPU のプログラムカウンタはこう動きます。レジスタと加算器がクロックごとに 1 を足し、命令を順番に実行させるのです。'},
      acc:{title:'アキュムレータ', goal:'アキュムレータを作ろう。En = 1 で Clk が上がるとき、Op = 0 なら X3\u2013X0 を Q3\u2013Q0 に読み込み、Op = 1 なら Q に X を足します（15 を超えると 0 に戻ります）。En = 0 なら Q は保ちます。',
        hint:'REG4 の Q を ADD4 の A 入力へ、X を B へつなぎます。S = Op の MUX チップ 4 つで X と和のどちらかを選び、レジスタの D に入れましょう。Ld は En です。',
        why:'EDSAC や 6502 のような初期のコンピュータは、アキュムレータを中心に作られていました。すべての計算が通るたった 1 つのレジスタです。その心臓部をいま作りました。'},
      r_ram:{title:'メモリセル', goal:'NAND ゲートだけで、8 個以内で RAM セルを 1 つ作ろう。Sel と WE が両方 1 の間、セルは D を記憶します。Q は Sel が 1 のとき記憶したビットを示し、それ以外は 0 です。',
        hint:'NAND 2 つで E = Sel AND WE を作ります。NAND 4 つで E で有効になる D ラッチを作り、さらに NAND 2 つでラッチの出力と Sel を AND しましょう。',
        why:'本物のメモリはこのようなセルが格子状に並んだものです。デコーダが Sel 線を 1 本だけ上げ、そのセルだけが書き込みを受けたり出力したりします。CPU キャッシュの SRAM は 1 セルにトランジスタ 6 個を使います。'},
      add2:{title:'2 ビット加算器', goal:'2 ビットの数 A1 A0 と B1 B0 を足そう。3 ビットの和 S2 S1 S0 を出力します。', hint:'半加算器で A0 + B0 を、全加算器で A1 + B1 とその桁上がりを処理します。'},
    },
  },
};

// Highlight gate names, signal names and (optionally) standalone 0/1 bits in instruction text.
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rich(text, L, bits){
  // L = null: gate names only (prose where "A" may be an English article)
  const sig = L ? [...new Set([...L.ins, ...L.outs])].sort((a,b) => b.length - a.length).join('|') : '(?!)';
  const re = new RegExp(`\\b(NAND|NOT|AND|OR|XOR|NOR|XNOR)\\b|\\b(${sig})\\b` + (bits ? '|(?<![\\w-])([01])(?![\\w-])' : ''), 'g');
  return esc(text).replace(re, (m, g, sg, b) => g ? `<span class="gt">${g}</span>` : sg ? `<span class="sig">${sg}</span>` : `<span class="bit b${b}">${b}</span>`);
}

/* ---------- audio: D Dorian synth, SFX + ambient music ---------- */
const Snd = (() => {
  const DOR = [0,2,3,5,7,9,10];                       // Dorian intervals
  const deg = (d, o = 0) => 62 + 12*(o + Math.floor(d/7)) + DOR[((d%7)+7)%7];   // degree -> MIDI, root D4
  const mtof = m => 440 * Math.pow(2, (m-69)/12);
  const BPM = 66, BEAT = 60/BPM;
  // Chords: i (Dm7), IV (G6, the Dorian colour), i, bVII (Cadd9). 8 beats each.
  const CH = [{b:38, p:[50,53,57,60]}, {b:43, p:[55,59,62,64]}, {b:38, p:[50,57,60,65]}, {b:36, p:[52,55,60,62]}];
  // Two 32-beat phrases of long melody notes [midi, beats]
  const MEL = [[69,3],[72,1],[74,4], [71,4],[74,2],[67,2], [65,3],[64,1],[62,4], [64,2],[67,2],[72,4],
               [74,2],[77,2],[76,4], [74,3],[71,1],[67,4], [69,4],[65,4],       [67,4],[64,4]];
  const LOOP = 64, AT = {};
  let beat = 0; MEL.forEach(([m,len]) => { (AT[beat] ??= []).push([m,len]); beat += len; });

  let ctx, master, sfxBus, musBus, verb, timer = 0, nextT = 0, step = 0;
  const vol = v => (v/100) ** 2;

  function impulse(sec, decay){
    const n = ctx.sampleRate*sec | 0, b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++){ const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, decay); }
    return b;
  }
  function init(){
    if (ctx){ if (ctx.state === 'suspended' && !document.hidden) ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC({latencyHint:'interactive'});
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = .005; comp.release.value = .25;
    master = ctx.createGain(); master.connect(comp); comp.connect(ctx.destination);
    sfxBus = ctx.createGain(); musBus = ctx.createGain(); sfxBus.connect(master); musBus.connect(master);
    verb = ctx.createConvolver(); verb.buffer = impulse(2.6, 2.4);
    const wet = ctx.createGain(); wet.gain.value = .8; verb.connect(wet); wet.connect(master);
    apply();
  }
  // One voice: 2 detuned oscillators -> lowpass (closing) -> ADSR -> pan -> bus (+ reverb send)
  function voice({m, t, dur = .15, bus = sfxBus, type = 'triangle', vol = .15, a = .004, sus = .5, r = .3, cut = 5000,
                  send = .2, pan = 0, vib = 0, det = 5, bell = 0}){
    const hz = mtof(m), end = t + a + dur + r;
    const mix = ctx.createGain(), f = ctx.createBiquadFilter(), env = ctx.createGain();
    mix.gain.value = .5; f.type = 'lowpass'; f.Q.value = .6;
    f.frequency.setValueAtTime(cut, t); f.frequency.exponentialRampToValueAtTime(Math.max(220, cut*.45), t + a + dur);
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(vol, t + a);
    env.gain.exponentialRampToValueAtTime(Math.max(vol*sus, 1e-4), t + a + dur);
    env.gain.exponentialRampToValueAtTime(1e-4, end);
    let lfo;
    if (vib){
      lfo = ctx.createOscillator(); const lg = ctx.createGain();
      lfo.frequency.value = 4.8; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(hz*.005*vib, t + .6);
      lfo.connect(lg); lfo.start(t); lfo.stop(end); lfo = lg;
    }
    for (const d of [-det, det]){
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = hz; o.detune.value = d;
      if (lfo) lfo.connect(o.frequency);
      o.connect(mix); o.start(t); o.stop(end + .05);
    }
    if (bell){                                         // bright octave partial that fades faster
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = hz*2;
      g.gain.setValueAtTime(bell, t); g.gain.exponentialRampToValueAtTime(1e-3, t + a + Math.max(.08, dur*.7));
      o.connect(g); g.connect(mix); o.start(t); o.stop(end);
    }
    mix.connect(f); f.connect(env);
    let out = env;
    if (ctx.createStereoPanner && pan){ const p = ctx.createStereoPanner(); p.pan.value = pan; env.connect(p); out = p; }
    out.connect(bus);
    if (send){ const s = ctx.createGain(); s.gain.value = send; out.connect(s); s.connect(verb); }
  }
  function schedule(i, t){
    if (i % 8 === 0){
      const c = CH[(i/8) % 4], len = 8*BEAT;
      c.p.forEach((m,k) => voice({m, t, bus:musBus, type:'sawtooth', dur:len-1.6, a:1.6, sus:.85, r:2.4, cut:1100, vol:.028, send:.6, det:9, pan:(k-1.5)*.3}));
      voice({m:c.b, t, bus:musBus, type:'sine', dur:len-.5, a:.5, sus:.8, r:1.2, cut:500, vol:.13, send:.08, det:0});
    }
    (AT[i] || []).forEach(([m,len]) => voice({m, t, bus:musBus, type:'triangle', dur:len*BEAT*.92, a:.09, sus:.55, r:1.5,
      cut:3000, vol:.085, send:.5, vib:1, bell:.12, pan:.1}));
  }
  function tick(){
    while (nextT < ctx.currentTime + .5){ schedule(step, nextT); nextT += BEAT; step = (step + 1) % LOOP; }
  }
  function music(){
    const on = ctx && !settings.muted && settings.music > 0 && !document.hidden;
    if (on && !timer){ nextT = ctx.currentTime + .15; step = 0; timer = setInterval(tick, 120); tick(); }
    if (!on && timer){ clearInterval(timer); timer = 0; }
  }
  function apply(){
    if (!ctx) return;
    const now = ctx.currentTime;
    master.gain.setTargetAtTime(settings.muted ? 0 : 1, now, .05);
    sfxBus.gain.setTargetAtTime(vol(settings.sfx), now, .03);
    musBus.gain.setTargetAtTime(vol(settings.music) * .9, now, .08);
    music();
  }
  const buzz = p => { if (!settings.muted && navigator.vibrate) navigator.vibrate(p); };
  function play(name, arg){
    if (!ctx || settings.muted || ctx.state !== 'running') return;
    if (settings.sfx === 0) return;
    const t0 = ctx.currentTime + .005, P = (m, dt, o = {}) => voice({m, t:t0 + dt, ...o});
    switch (name){
      case 'on':     P(deg(4,1), 0, {dur:.08, vol:.15, bell:.35, pan:-.25}); buzz(6); break;
      case 'off':    P(deg(0,1), 0, {dur:.08, vol:.13, cut:2400, pan:-.25}); buzz(6); break;
      case 'tap':    P(deg(0,2), 0, {type:'sine', dur:.03, vol:.045, r:.12, send:.1}); break;
      case 'select': P(deg(4,2), 0, {type:'sine', dur:.035, vol:.05, r:.14, send:.12}); break;
      case 'place':  P(deg(0,0), 0, {dur:.1, vol:.15, bell:.25}); P(deg(4,0), .07, {dur:.16, vol:.13, bell:.25}); buzz(8); break;
      case 'connect':P(deg(3,1), 0, {dur:.07, vol:.12, bell:.45, pan:.15}); P(deg(5,1), .06, {dur:.2, vol:.12, bell:.45, pan:.15, send:.35}); buzz(10); break;
      case 'cut':    P(deg(2,0), 0, {dur:.07, vol:.12, cut:1800}); P(deg(0,0), .07, {dur:.14, vol:.11, cut:1300}); buzz(8); break;
      case 'clear':  [4,2,0,-3].forEach((d,i) => P(deg(d,0), i*.06, {dur:.09, vol:.1, cut:1500})); buzz(14); break;
      case 'error':  P(deg(2,-1), 0, {type:'square', dur:.15, vol:.06, cut:1000, sus:.6});
                     P(deg(1,-1), .14, {type:'square', dur:.32, vol:.06, cut:800, sus:.6}); buzz([30,40,30]); break;
      case 'hint':   P(deg(4,1), 0, {type:'sine', dur:.25, vol:.07, bell:.5, send:.5}); P(deg(6,1), .12, {type:'sine', dur:.45, vol:.06, bell:.5, send:.5}); break;
      case 'zoomIn': [0,2,4,6].forEach((d,i) => P(deg(d,1), i*.045, {type:'sine', dur:.06, vol:.07, send:.35})); break;
      case 'zoomOut':[6,4,2,0].forEach((d,i) => P(deg(d,1), i*.045, {type:'sine', dur:.06, vol:.07, send:.35})); break;
      case 'win': {
        [0,2,4,6,8,12].forEach((d,i) => P(deg(d,0), i*.12, {dur:.9, vol:.1, bell:.35, sus:.35, r:1.6, send:.55, pan:(i-2.5)*.12}));
        [0,4,9].forEach(d => P(deg(d,-1), .7, {type:'sawtooth', a:.3, dur:1.6, vol:.03, cut:1400, sus:.7, r:2.2, send:.6, det:9}));
        if ((arg ?? 3) === 3) [9,11,14].forEach((d,i) => P(deg(d,1), .95 + i*.09, {type:'sine', dur:.25, vol:.045, bell:.6, send:.7}));
        buzz([20,60,20]); break;
      }
    }
  }
  const visible = () => { if (!ctx) return; if (document.hidden) ctx.suspend(); else ctx.resume(); music(); };
  return {init, play, apply, visible};
})();

// Sandbox: switches and lamps are ordinary movable parts (SW / LAMP) in circuits.sandbox.
const ioName = k => k < 26 ? String.fromCharCode(65 + k) : 'S' + (k+1);
function sbx(){
  let c = prog.circuits.sandbox;
  if (!c) c = prog.circuits.sandbox = {gates:[{id:'g1', type:'SW', x:80, y:780}, {id:'g2', type:'SW', x:80, y:1000}, {id:'g3', type:'LAMP', x:1150, y:890}], wires:[]};
  if (c.nIn != null){                     // v2.2 layout: fixed side terminals -> movable parts
    const map = {};
    for (let k = 0; k < c.nIn; k++){ c.gates.push({id:'s'+k, type:'SW', x:30, y:Math.round(1500*(k+1)/(c.nIn+1)) - 25}); map[`IN${k}:o0`] = `s${k}:o0`; }
    for (let k = 0; k < c.nOut; k++){ c.gates.push({id:'l'+k, type:'LAMP', x:2270, y:Math.round(1500*(k+1)/(c.nOut+1)) - 25}); map[`OUT${k}:i0`] = `l${k}:i0`; }
    c.wires = c.wires.map(w => ({from: map[w.from] || w.from, to: map[w.to] || w.to}));
    delete c.nIn; delete c.nOut;
  }
  return c;
}

const gh = P => Math.max(P.ins.length, P.outs.length)*30 + 20;
const termY = (i,n) => H*(i+1)/(n+1);
