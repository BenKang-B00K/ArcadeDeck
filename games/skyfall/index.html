<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1d2b53" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Skyfall — ArcadeDeck</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      height: 100%;
      width: 100%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }
    /* Phaser centers the canvas itself (margin-based) — no flex here, it double-offsets.
       Fixed box inset by the safe area so its rect *is* the playable area (notch / home bar excluded). */
    #game {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
    }
    #game canvas {
      display: block;
      touch-action: none;
    }

    /* Rotate-to-landscape overlay — shown only on portrait touch devices */
    #rotate-hint {
      display: none;
      position: fixed;
      inset: 0;
      background: #0a1030;
      color: #fff1e8;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: monospace;
      font-weight: bold;
      z-index: 9999;
      padding: 24px;
    }
    #rotate-hint .icon {
      font-size: 64px;
      line-height: 1;
      animation: rotatePulse 2s ease-in-out infinite;
      color: #ffec27;
      text-shadow: 0 0 8px rgba(255, 236, 39, 0.4);
    }
    #rotate-hint .label {
      font-size: 16px;
      margin-top: 18px;
      color: #fff1e8;
    }
    #rotate-hint .sub {
      font-size: 12px;
      margin-top: 6px;
      color: #c2c3c7;
      font-weight: normal;
    }
    @keyframes rotatePulse {
      0%, 100% { transform: rotate(-20deg); }
      50%      { transform: rotate(70deg); }
    }
    @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
      #rotate-hint { display: flex; }
      #game { visibility: hidden; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-CSole4bw.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/phaser-DdCsgmnN.js">
</head>
<body>
  <div id="game"></div>
  <div id="rotate-hint">
    <div class="icon">⟳</div>
    <div class="label">ROTATE YOUR DEVICE</div>
    <div class="sub">가로 방향으로 돌려주세요</div>
  </div>
</body>
</html>
