<!-- boot splash: one of the banners at random, picked before first paint; game.js lifts it once the game is ready -->
<div id="splash" aria-hidden="true"><img class="blur" alt="" decoding="async"><div class="card"><img class="art" alt="" decoding="async"><svg class="title" viewBox="0 0 640 96"><linearGradient id="spT" x2="0" y2="1"><stop offset=".1" style="stop-color:var(--t1)"/><stop offset=".9" style="stop-color:var(--t2)"/></linearGradient><text x="320" y="74" textLength="560" lengthAdjust="spacingAndGlyphs">SPIN BOARD</text></svg></div></div>
<script>
{
  const b = ['neon-arcade', 'toy-diorama', 'storybook', 'festival'][Math.random() * 4 | 0];
  document.querySelector('#splash').dataset.b = b; // title colours per banner (style.css)
  // the title in the player's language, before game.js runs: the same words as I18N.title there (change both together)
  let L = (navigator.language || 'en').slice(0, 2);
  try { L = JSON.parse(localStorage.getItem('spin-board.v1'))?.lang || L; } catch { /* sandboxed iframe */ }
  const [txt, len] = { ko: ['돌림판', 330], ja: ['ルーレット', 450] }[L] || ['SPIN BOARD', 560], tx = document.querySelector('#splash text');
  tx.textContent = txt; tx.setAttribute('textLength', len);
  document.querySelectorAll('#splash img').forEach(i => { i.onload = () => i.classList.add('on'); i.src = `banners/${b}.webp?1`; }); // ?N: banners are HTTP-cached 7 days (_headers), bump when an artwork changes
}
</script>
