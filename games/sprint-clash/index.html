        <svg class="i3" viewBox="0 0 48 48" aria-hidden="true"><path class="ln" d="M1 28q5-3 10 0t10 0 10 0 10 0 10 0" stroke="#2f9fe0" stroke-width="2.5"/><path class="ln" d="M30 13Q41 20 40 35" stroke="#e8ecff" stroke-width="1"/><path class="o" d="M3 3l27 10" stroke-width="6"/><path class="ln" d="M3 3l27 10" stroke="#c47d3e" stroke-width="3"/><path fill="url(#gG)" d="M17 37l-9-7v14z"/><path fill="url(#gG)" d="M16 37c6-9 19-9 26 0-7 9-20 9-26 0z"/><path class="hl" d="M22 33.5c4-3 10-3 14 0"/><circle cx="35.5" cy="36" r="1.6" fill="#0c1233" stroke="none"/></svg>
        <b data-i18n="gameFish"></b><small data-i18n="gameFishDesc"></small>
      </button>
      <button class="game" data-game="kite" aria-pressed="false">
        <svg class="i3" viewBox="0 0 48 48" aria-hidden="true"><path class="ln" d="M26 17L4 46" stroke="#e8ecff" stroke-width="1"/><path class="o" d="M26 33q-6 5-2 9t-5 5" stroke-width="4.2"/><path class="ln" d="M26 33q-6 5-2 9t-5 5" stroke="#e8ecff" stroke-width="1.2"/><path fill="url(#gP)" d="M26 3l14 14H26z"/><path fill="url(#gY)" d="M40 17L26 33V17z"/><path fill="url(#gP)" d="M26 33L12 17h14z"/><path fill="url(#gY)" d="M12 17L26 3v14z"/><path class="ln" d="M26 3v30M12 17h28" stroke-width="1.2"/><path class="ln" d="M26 3L40 17 26 33 12 17z"/><path fill="url(#gC)" d="M20 38l4 1.5-1 3.5zM22 44l4-.5-1.5 3.5z"/><path class="hl" d="M16 16l9-9"/></svg>
        <b data-i18n="gameKite"></b><small data-i18n="gameKiteDesc"></small>
      </button>
      <button class="game" data-game="crowd" data-online aria-pressed="false">
        <svg class="i3" viewBox="0 0 48 48" aria-hidden="true"><path fill="url(#gS)" d="M2 40v-4a8 8 0 0 1 16 0v4z"/><circle cx="10" cy="17" r="5" fill="url(#gS)"/><path fill="url(#gS)" d="M30 40v-4a8 8 0 0 1 16 0v4z"/><circle cx="38" cy="17" r="5" fill="url(#gS)"/><path fill="url(#gY)" d="M13 46v-6a11 11 0 0 1 22 0v6z"/><circle cx="24" cy="20" r="6.5" fill="url(#gY)"/><circle class="gl" cx="22" cy="18" r="2"/><path class="hl" d="M17 38a7 7 0 0 1 5-5"/></svg>
        <b data-i18n="gameCrowd"></b><small data-i18n="gameCrowdDesc"></small>
      </button>
      <button class="game sel" data-game="random" aria-pressed="true">
        <svg class="i3" viewBox="0 0 48 48" aria-hidden="true"><path fill="url(#gS)" d="M6 14l18 10v20L6 34z"/><path fill="#8b97c0" d="M42 14v20L24 44V24z"/><path fill="#fff" d="M24 4l18 10-18 10L6 14z"/><ellipse cx="24" cy="14" rx="3.4" ry="1.9" fill="url(#gR)" stroke="none"/><g fill="#0c1233" stroke="none"><ellipse cx="11.4" cy="23" rx="1.8" ry="2.4"/><ellipse cx="18.6" cy="35" rx="1.8" ry="2.4"/><ellipse cx="28.5" cy="26.5" rx="1.8" ry="2.4"/><ellipse cx="33" cy="29" rx="1.8" ry="2.4"/><ellipse cx="37.5" cy="31.5" rx="1.8" ry="2.4"/></g></svg>
        <b data-i18n="gameRandom"></b><small data-i18n="gameRandomDesc"></small>
      </button>
    </div>
    <p id="gameInfo" class="ginfo" aria-live="polite"><b data-i18n="gameRandom"></b><span data-i18n="gameRandomDesc"></span></p>
    <div class="playbar">
      <div class="count" role="radiogroup" data-i18n-aria="players">
        <span class="count-l">
          <svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>
          <span data-i18n="players"></span>
        </span>
        <button data-n="1" role="radio" aria-checked="false" data-i18n-label="solo">1</button>
        <button class="sel" data-n="2" role="radio" aria-checked="true">2</button>
        <button data-n="3" role="radio" aria-checked="false">3</button>
        <button data-n="4" role="radio" aria-checked="false">4</button>
      </div>
      <div class="modes">
        <button id="btnLocal" class="mode-ic primary" data-i18n-label="modeLocal">
          <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/></svg>
          <span class="tip" aria-hidden="true"><span data-i18n="modeLocal"></span><small data-i18n="modeLocalDesc"></small></span>
        </button>
        <button id="btnHost" class="mode-ic" data-i18n-label="modeHost">
          <svg class="i" viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0M8 15.5a5.5 5.5 0 0 1 8 0"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/></svg>
          <span class="tip" aria-hidden="true"><span data-i18n="modeHost"></span><small data-i18n="modeHostDesc"></small></span>
        </button>
        <button id="btnJoin" class="mode-ic" data-i18n-label="modeJoin">
          <svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
          <span class="tip" aria-hidden="true"><span data-i18n="modeJoin"></span><small data-i18n="modeJoinDesc"></small></span>
        </button>
        <button id="btnCodex" class="mode-ic" data-i18n-label="codex">
          <svg class="i" viewBox="0 0 24 24"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-3"/><path d="M12 6.5l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z"/></svg>
          <span class="tip" aria-hidden="true"><span data-i18n="codex"></span><small data-i18n="codexDesc"></small></span>
        </button>
      </div>
    </div>
    <p class="keys" data-i18n="keysHint"></p>
  </div>
</div>

<div id="lobby" class="screen">
  <div class="card">
    <h2 data-i18n="roomCode"></h2>
    <div id="code" class="code">····</div>
    <p id="share" class="msg" data-i18n="shareCode"></p>
    <p id="lobbyMsg" class="msg"></p>
    <p id="pickL" class="lineup" data-i18n="pickGame"></p>
    <div id="pick" class="pick" role="group" aria-labelledby="pickL"></div>
    <p id="pickInfo" class="ginfo" aria-live="polite"><b></b><span></span></p>
    <div class="row">
      <button id="btnStart" class="btn primary center" data-i18n="start" disabled></button>
      <button class="btn center" data-back data-i18n="cancel"></button>
    </div>
  </div>
</div>

<div id="join" class="screen">
  <div class="card">
    <h2 data-i18n="modeJoin"></h2>
    <input id="codeIn" maxlength="4" inputmode="email" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" data-i18n-ph="codePlaceholder">
    <p id="joinMsg" class="msg"></p>
    <div class="row">
      <button id="joinGo" class="btn primary center" data-i18n="join"></button>
      <button class="btn center" data-back data-i18n="cancel"></button>
    </div>
  </div>
</div>

<div id="guide" class="screen">
  <div class="card guide">
    <p class="eyebrow" data-i18n="howTo"></p>
    <h2 id="gTitle"></h2>
    <p id="gRec" class="grec"></p>
    <ul id="gRules"></ul>
    <div id="gCtrl" class="gctrl"></div>
    <p id="gKeys" class="msg"></p>
    <div id="gReady" class="gready" aria-live="polite" hidden></div>
    <div class="row">
      <button id="gGo" class="btn primary center"></button>
      <button class="btn center" data-back data-i18n="menu"></button>
    </div>
  </div>
</div>

<div id="results" class="screen">
  <div class="card">
    <h2 id="resTitle"></h2>
    <div id="resLines"></div>
    <div id="resRecord" hidden>
      <div class="rec-top"><span id="recHead"></span><span id="recLead"></span></div>
      <div id="recRows"></div>
    </div>
    <p id="resWait" class="msg"></p>
    <div class="row">
      <button id="btnRematch" class="btn primary center" data-i18n="rematch"></button>
      <button id="btnPick" class="btn center" data-i18n="changeGame" hidden></button>
      <button id="btnMenu" class="btn center" data-i18n="menu"></button>
    </div>
  </div>
</div>

<div id="codex" class="screen">
  <div class="card">
    <h2 data-i18n="codex"></h2>
    <p id="cxSum" class="msg"></p>
    <div id="cxList"></div>
    <div class="row">
      <button class="btn center" data-back data-i18n="menu"></button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
