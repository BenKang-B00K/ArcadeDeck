<title>Tandem</title>

<style>
  :root {
    --p1: #ff5a6e; --p2: #3fa7ff; --ink: #f3f0ff; --dim: #b9b3d8;
    --panel: rgba(20, 16, 48, .78); --line: rgba(255, 255, 255, .14);
    --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
    --sal: env(safe-area-inset-left); --sar: env(safe-area-inset-right);
    --coop-bg: #1d1846; --coop-accent: #3fa7ff;
    font-family: system-ui, "Segoe UI", "Apple SD Gothic Neo", "Hiragino Sans", "Noto Sans KR", "Noto Sans JP", sans-serif;
    color: var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120f2e; overscroll-behavior: none; }
  body { touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* soft vignette: frames the scene for free, no post-processing pass */
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at center, transparent 55%, rgba(8, 6, 24, .55)); }
  * { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .25) transparent; }
  [hidden] { display: none !important; }
  svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  button {
    font: inherit; color: inherit; background: rgba(255, 255, 255, .08); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 20px; min-height: 48px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s, transform .1s;
  }
  button:hover { background: rgba(255, 255, 255, .16); }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: default; }
  button.big { font-size: 1.25rem; font-weight: 700; padding: 14px 40px; background: linear-gradient(90deg, var(--p1), var(--p2)); border: 0; box-shadow: 0 6px 24px rgba(0, 0, 0, .35); }
  button.icon { width: 48px; height: 48px; padding: 0; font-size: 22px; border-radius: 50%; background: var(--panel); backdrop-filter: blur(6px); }
  button.sel { background: rgba(255, 255, 255, .24); border-color: #fff; }

  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 14px;
    padding: calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));
    background: radial-gradient(ellipse at center, rgba(18, 15, 46, .35), rgba(18, 15, 46, .8)); overflow-y: auto; text-align: center;
    animation: fade .25s ease-out;
  }
  @keyframes fade { from { opacity: 0; transform: scale(.98); } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 20px; backdrop-filter: blur(8px); display: flex; flex-direction: column; gap: 12px; align-items: center; max-width: 100%;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .08); }
  .logo { font-size: clamp(3rem, 12vw, 6rem); margin: 0; letter-spacing: .08em; font-weight: 900; line-height: 1;
    background: linear-gradient(90deg, var(--p1), #ffd166 50%, var(--p2)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 20px rgba(0, 0, 0, .5)); }
  h2 { margin: 0; font-size: 2rem; }
  p { margin: 0; color: var(--dim); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .vol-row input { flex: 1; min-width: 0; width: 140px; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 44px; background: none; cursor: pointer; touch-action: pan-y; --v: 70%; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #ffd166 var(--v), rgba(255, 255, 255, .18) var(--v)); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #ffd166 var(--v), rgba(255, 255, 255, .18) var(--v)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%; background: #fff; border: 3px solid #ffd166; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid #ffd166; }
  input[type=range]:focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; border-radius: 8px; }
  .vol-row.off input { opacity: .45; }
  details { color: var(--dim); max-width: 32rem; }
  summary { cursor: pointer; padding: 8px; }
  details ul { text-align: left; margin: 0; padding-left: 1.2em; line-height: 1.7; }

  #stage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; width: min(500px, 100%); }
  #stage-grid h3 { grid-column: 1 / -1; margin: 6px 0 0; text-align: left; color: var(--dim); font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; }
  #stage-grid button { flex-direction: column; gap: 2px; padding: 12px 8px; }
  #stage-grid b { font-size: 1.6rem; }
  #stage-grid small { color: var(--dim); display: inline-flex; gap: 4px; align-items: center; }
  #stage-grid button.done { border-color: rgba(255, 209, 102, .45); }
  #stage-grid button.perfect { border-color: #7df9ff; box-shadow: 0 0 14px rgba(125, 249, 255, .25) inset; }
  #stage-grid button.perfect small { color: #7df9ff; }

  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none;
    padding: calc(10px + var(--sat)) calc(12px + var(--sar)) 0 calc(12px + var(--sal)); }
  #hud > * { pointer-events: auto; }
  .hud-left { background: var(--panel); border-radius: 14px; padding: 8px 14px; display: flex; gap: 14px; align-items: center; font-weight: 600; }
  .hud-right { display: flex; gap: 8px; }
  .gem { color: #7df9ff; display: inline-flex; gap: 4px; align-items: center; }
  .clock { display: inline-flex; gap: 4px; align-items: center; font-variant-numeric: tabular-nums; }
  .record { color: #ffd166; font-weight: 800; font-size: 1.2rem; animation: pop .6s ease-out; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { .record, .screen { animation: none; } }

  /* main menu: banner art behind, logo + panel in a column over the open sky on the right */
  #scr-menu { align-items: flex-end; padding-right: calc(max(16px, 6vw) + var(--sar));
    background: linear-gradient(90deg, transparent 30%, rgba(12, 10, 36, .7) 70%), #120f2e url(icons/splash.webp) 25% center / cover no-repeat; }
  #scr-stages { background: linear-gradient(rgba(12, 10, 36, .7), rgba(12, 10, 36, .85)), #120f2e url(icons/splash.webp) 25% center / cover no-repeat; }
  .menu-col { width: min(400px, 100%); display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
  .menu-col .logo { font-size: clamp(2.8rem, 6vw, 4.6rem); margin-right: -.08em; /* cancel trailing letter-spacing so it centres */ filter: drop-shadow(0 4px 24px rgba(0, 0, 0, .6)) drop-shadow(0 0 30px rgba(255, 209, 102, .25)); }
  .tagline { color: var(--ink); opacity: .85; text-shadow: 0 2px 8px rgba(0, 0, 0, .7); margin-top: -4px; }
  .menu-col .panel { align-items: stretch; position: relative; overflow: hidden; padding: 18px; }
  .menu-col .panel::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: linear-gradient(90deg, var(--p1), #ffd166, var(--p2)); }
  .menu-actions { display: flex; flex-direction: column; gap: 10px; }
  #btn-play { box-shadow: 0 6px 24px rgba(0, 0, 0, .35), 0 0 24px rgba(255, 90, 110, .3), 0 0 24px rgba(63, 167, 255, .3); }
  .menu-col details { align-self: center; }
  /* settings (menu + pause): language row across, SFX | music sliders side by side */
  .settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; width: 100%; min-width: min(320px, 100%); padding-top: 10px; border-top: 1px solid var(--line); }
  .settings .lang { grid-column: 1 / -1; flex-wrap: nowrap; gap: 6px; }
  .settings .lang > svg { color: var(--dim); }
  .settings .lang button[data-lang] { flex: 1; padding: 8px 6px; min-width: 0; }
  .settings .vol-row { flex-wrap: nowrap; gap: 6px; }
  @media (max-aspect-ratio: 1/1) {
    /* portrait: art sits on top at 55% height so the pair stays visible above the panel */
    #scr-menu { align-items: center; justify-content: flex-end; padding-right: calc(16px + var(--sar));
      background: linear-gradient(transparent 30%, #120f2e 55vh), #120f2e url(icons/splash.webp) 22% 0 / auto 55vh no-repeat; }
    .menu-actions { display: grid; grid-template-columns: 1fr 1fr; }
    .menu-actions .big { grid-column: 1 / -1; }
  }

  /* loading splash: banner art until the game has drawn its first frame, then fades out */
  #loader { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 18px;
    padding: 0 16px calc(28px + var(--sab)); background: #120f2e url(icons/splash.webp) 18% center / cover no-repeat; transition: opacity .5s; }
  #loader::before { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(12, 10, 36, .85)); }
  #loader > * { position: relative; }
  #loader.done { opacity: 0; pointer-events: none; }
  .load-bar { width: min(240px, 60vw); height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .15); overflow: hidden; }
  .load-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: inherit;
    background: linear-gradient(90deg, var(--p1), #ffd166, var(--p2)); animation: load 1.1s ease-in-out infinite alternate; }
  @keyframes load { from { transform: translateX(-10%); } to { transform: translateX(160%); } }
  @media (prefers-reduced-motion: reduce) { .load-bar::after { animation: none; width: 100%; } }

  /* tip card: icon badge, small title, message, draining timer bar; gradient hairline ties it to the logo */
  #toast { position: fixed; left: 50%; top: calc(76px + var(--sat)); transform: translate(-50%, -12px) scale(.97); width: max-content; max-width: min(92vw, 34rem);
    display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px 20px 14px 12px; overflow: hidden;
    background: linear-gradient(180deg, rgba(38, 30, 86, .94), rgba(18, 14, 44, .94)); border: 1px solid rgba(255, 255, 255, .12); border-radius: 16px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .1); backdrop-filter: blur(8px);
    opacity: 0; transition: opacity .3s, transform .35s cubic-bezier(.2, 1.4, .4, 1); pointer-events: none; --accent: #ffd166; }
  #toast::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: linear-gradient(90deg, var(--p1), #ffd166, var(--p2)); }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #toast[data-kind="wait"] { --accent: #7df9ff; }
  body:not(.playing) #toast { opacity: 0; }
  .toast-icon { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 19px;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 30%, transparent); }
  .toast-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .toast-title { color: var(--accent); font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  .toast-msg { color: var(--ink); font-size: .95rem; line-height: 1.45; text-wrap: pretty; }
  .toast-bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 3px; background: var(--accent); opacity: .55; transform-origin: left; }
  #toast.show .toast-bar { animation: drain var(--ms, 2.5s) linear forwards; }
  @keyframes drain { to { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { #toast { transition: opacity .3s; } .toast-bar { display: none; } }
  @media (max-height: 500px) { #toast { top: calc(66px + var(--sat)); padding: 8px 16px 10px 10px; } .toast-icon { width: 30px; height: 30px; font-size: 16px; } .toast-msg { font-size: .85rem; } }
  #rotate { display: none; position: fixed; left: 50%; bottom: calc(150px + var(--sab)); transform: translateX(-50%); width: max-content; max-width: 90vw;
    background: var(--panel); border-radius: 14px; padding: 8px 14px; pointer-events: none; font-size: .9rem; align-items: center; gap: 8px; }
  @media (orientation: portrait) and (pointer: coarse) { body.playing #rotate { display: flex; } }

  #touch { display: none; position: fixed; left: 0; right: 0; bottom: 0; justify-content: space-between; pointer-events: none;
    padding: 0 calc(14px + var(--sar)) calc(14px + var(--sab)) calc(14px + var(--sal)); }
  body.playing.touch #touch { display: flex; }
  .pad { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; touch-action: none; }
  .pad button { width: 68px; height: 68px; border-radius: 50%; font-size: 30px; padding: 0; background: rgba(20, 16, 48, .45); border: 2px solid; touch-action: none; }
  .pad button.jump { width: 80px; height: 80px; margin-bottom: 30px; }
  .pad.p1 button { border-color: var(--p1); color: var(--p1); }
  .pad.p2 button { border-color: var(--p2); color: var(--p2); }
  .pad button.on { background: currentColor; }
  .pad button.on svg { stroke: #120f2e; }
  /* phones in landscape: logo shrinks, menu buttons sit side by side so nothing scrolls */
  @media (max-height: 500px) {
    .screen { gap: 8px; }
    .logo { font-size: clamp(2.2rem, 9vh, 3.4rem); }
    h2 { font-size: 1.5rem; }
    .panel { padding: 12px 16px; gap: 8px; }
    .menu-col { gap: 6px; width: min(380px, 100%); }
    .menu-col .logo { font-size: clamp(2.2rem, 11vh, 3.2rem); }
    .menu-col .panel { padding: 12px; }
    .menu-actions { flex-direction: row; flex-wrap: wrap; }
    .menu-actions button { flex: 1 1 auto; padding: 10px 12px; white-space: nowrap; }
    .settings { padding-top: 6px; gap: 4px 10px; }
    button.big { padding: 10px 32px; }
    details { display: none; }
  }
  /* phone link: each phone drives only its own jelly, so one pad spans the width (move left, jump right), in that jelly's color */
  body.linked .pad.p2 { display: none; }
  body.linked .pad.p1 { flex: 1; }
  body.linked .pad.p1 .jump { margin-left: auto; }
  body.net-guest .pad.p1 button { border-color: var(--p2); color: var(--p2); }
  body.net-guest .host-only, .guest-only { display: none !important; }
  body.net-guest .guest-only { display: block !important; }
  @media (max-height: 420px) { .pad button { width: 58px; height: 58px; } .pad button.jump { width: 68px; height: 68px; margin-bottom: 20px; } }
</style>
</head>

<canvas id="c"></canvas>
<div id="loader" role="progressbar" aria-label="Loading">
  <h1 class="logo">TANDEM</h1>
  <div class="load-bar"></div>
</div>

<div id="hud" hidden>
  <div class="hud-left"><span id="hud-level"></span><span class="gem"><svg><use href="#i-gem"/></svg><span id="hud-gems"></span></span><span class="clock"><svg><use href="#i-clock"/></svg><span id="hud-time">0:00.00</span></span></div>
  <div class="hud-right">
    <button class="icon btn-mute" data-i18n-label="mute"><svg><use href="#i-vol"/></svg></button>
    <button class="icon btn-full" data-i18n-label="fullscreen"><svg><use href="#i-full"/></svg></button>
    <button class="icon host-only" id="btn-restart" data-i18n-label="restart"><svg><use href="#i-restart"/></svg></button>
    <button class="icon" id="btn-pause" data-i18n-label="pause"><svg><use href="#i-pause"/></svg></button>
  </div>
</div>
<div id="toast" role="status">
  <span class="toast-icon"><svg><use href="#i-bulb"/></svg></span>
  <span class="toast-body"><b class="toast-title"></b><span class="toast-msg"></span></span>
  <i class="toast-bar"></i>
</div>
<div id="rotate"><svg><use href="#i-phone"/></svg><span data-i18n="rotate"></span></div>

<div id="touch">
  <div class="pad p1">
    <button data-p="0" data-a="left" data-i18n-label="left" data-i18n-prefix="P1 "><svg><use href="#i-left"/></svg></button>
    <button data-p="0" data-a="right" data-i18n-label="right" data-i18n-prefix="P1 "><svg><use href="#i-right"/></svg></button>
    <button data-p="0" data-a="jump" class="jump" data-i18n-label="jump" data-i18n-prefix="P1 "><svg><use href="#i-up"/></svg></button>
  </div>
  <div class="pad p2">
    <button data-p="1" data-a="jump" class="jump" data-i18n-label="jump" data-i18n-prefix="P2 "><svg><use href="#i-up"/></svg></button>
    <button data-p="1" data-a="left" data-i18n-label="left" data-i18n-prefix="P2 "><svg><use href="#i-left"/></svg></button>
    <button data-p="1" data-a="right" data-i18n-label="right" data-i18n-prefix="P2 "><svg><use href="#i-right"/></svg></button>
  </div>
</div>

<template id="settings">
  <div class="row lang"><svg><use href="#i-globe"/></svg>
    <button data-lang="en">English</button><button data-lang="ko">한국어</button><button data-lang="ja">日本語</button>
    <button class="icon btn-full" data-i18n-label="fullscreen"><svg><use href="#i-full"/></svg></button>
  </div>
  <div class="row vol-row sfx">
    <button class="icon btn-mute" data-i18n-label="mute"><svg><use href="#i-vol"/></svg></button>
    <input type="range" min="0" max="1" step="0.05" data-vol="volume" data-i18n-label="sfx">
  </div>
  <div class="row vol-row music">
    <button class="icon btn-music" data-i18n-label="music"><svg><use href="#i-music"/></svg></button>
    <input type="range" min="0" max="1" step="0.05" data-vol="music" data-i18n-label="music">
  </div>
