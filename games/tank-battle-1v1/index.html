// Deterministic noise — same world position always returns same value.
function hashNoise(x, y) {
  return Math.abs(Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1;
}

// Brick / block masonry pattern. cellW/cellH tune block size.
function paintBrick(g, w, T, cellW, cellH) {
  const rows = Math.ceil(w.h / cellH) + 1;
  const cols = Math.ceil(w.w / cellW) + 2;
  const [br, bg, bb] = T.brickRGB;
  for (let r = 0; r < rows; r++) {
    const y = r * cellH;
    const offset = (r % 2) * (cellW / 2);
    for (let c2 = -1; c2 < cols; c2++) {
      const x = c2 * cellW - offset;
      const seed = hashNoise(x + w.x, y + w.y);
      const v = Math.floor(seed * 18) - 9;
      g.fillStyle = `rgb(${br + v}, ${bg + v}, ${bb + v})`;
      g.fillRect(x, y, cellW - 1, cellH - 1);
    }
  }
  g.fillStyle = T.mortar;
  for (let r = 0; r < rows; r++) {
    const y = r * cellH;
    g.fillRect(0, y + cellH - 1, w.w, 1);
    const offset = (r % 2) * (cellW / 2);
    for (let c2 = -1; c2 < cols; c2++) {
      const x = c2 * cellW - offset;
      g.fillRect(x + cellW - 1, y, 1, cellH);
    }
  }
}

// Vertical wood plank pattern with grain streaks + knots.
function paintPlank(g, w, T) {
  const PLANK_W = 14;
  const [br, bg, bb] = T.brickRGB;
  const cols = Math.ceil(w.w / PLANK_W);
  for (let c2 = 0; c2 < cols; c2++) {
    const x = c2 * PLANK_W;
    const seed = hashNoise(x + w.x, w.y);
    const v = Math.floor(seed * 22) - 11;
    g.fillStyle = `rgb(${br + v}, ${bg + v}, ${bb + v})`;
    g.fillRect(x, 0, PLANK_W - 1, w.h);
    // plank gap
    g.fillStyle = T.mortar;
    g.fillRect(x + PLANK_W - 1, 0, 1, w.h);
    // grain streaks
    g.fillStyle = T.shadow;
    for (let s = 0; s < 3; s++) {
      const sy = Math.floor(hashNoise(x + s, w.y + s * 13) * w.h);
      g.fillRect(x + 1, sy, PLANK_W - 3, 1);
    }
    // occasional knot
    if (seed > 0.78) {
      const ky = Math.floor(hashNoise(x, w.y + 7) * (w.h - 4)) + 2;
      g.fillStyle = `rgba(30, 15, 5, 0.5)`;
      g.beginPath();
      g.arc(x + PLANK_W / 2, ky, 2, 0, Math.PI * 2);
      g.fill();
    }
  }
}

// Riveted metal plate pattern. Large square panels with rivet dots at corners.
function paintPlate(g, w, T) {
  const PLATE = 32;
  const [br, bg, bb] = T.brickRGB;
  // base diagonal sheen
  const grad = g.createLinearGradient(0, 0, w.w, w.h);
  grad.addColorStop(0, T.highlight);
  grad.addColorStop(0.4, 'rgba(0,0,0,0)');
  grad.addColorStop(1, T.shadow);
  for (let py = 0; py < w.h; py += PLATE) {
    for (let px = 0; px < w.w; px += PLATE) {
      const seed = hashNoise(px + w.x, py + w.y);
      const v = Math.floor(seed * 14) - 7;
      g.fillStyle = `rgb(${br + v}, ${bg + v}, ${bb + v})`;
      g.fillRect(px, py, PLATE - 1, PLATE - 1);
    }
  }
  // plate seams
  g.fillStyle = T.mortar;
  for (let py = PLATE - 1; py < w.h; py += PLATE) g.fillRect(0, py, w.w, 1);
  for (let px = PLATE - 1; px < w.w; px += PLATE) g.fillRect(px, 0, 1, w.h);
  // rivets
  for (let py = 4; py < w.h - 2; py += PLATE) {
    for (let px = 4; px < w.w - 2; px += PLATE) {
      g.fillStyle = T.shadow;
      g.beginPath(); g.arc(px + 1, py + 1, 1.5, 0, Math.PI*2); g.fill();
      g.fillStyle = T.highlight;
      g.beginPath(); g.arc(px, py, 1.2, 0, Math.PI*2); g.fill();
    }
  }
  // overlay sheen
  g.fillStyle = grad;
  g.fillRect(0, 0, w.w, w.h);
}

// Smooth ice with branching cracks + frost speckle.
function paintIce(g, w, T) {
  // soft gradient base
  const grad = g.createLinearGradient(0, 0, 0, w.h);
  grad.addColorStop(0, '#9cc4dc');
  grad.addColorStop(0.5, T.baseFill);
  grad.addColorStop(1, '#3d5870');
  g.fillStyle = grad;
  g.fillRect(0, 0, w.w, w.h);
  // crack lines — deterministic per wall
  g.strokeStyle = 'rgba(220, 240, 255, 0.55)';
  g.lineWidth = 1;
  const crackCount = Math.max(2, Math.floor((w.w * w.h) / 600));
  for (let i = 0; i < crackCount; i++) {
    const sx = hashNoise(w.x + i, w.y) * w.w;
    const sy = hashNoise(w.x, w.y + i * 7) * w.h;
    g.beginPath();
    g.moveTo(sx, sy);
    let cx = sx, cy = sy;
    const segs = 3 + Math.floor(hashNoise(i, i+1) * 3);
    for (let s = 0; s < segs; s++) {
      cx += (hashNoise(i, s) - 0.5) * 18;
      cy += (hashNoise(i + 1, s) - 0.5) * 18;
      g.lineTo(cx, cy);
    }
    g.stroke();
  }
  // frost specks
  g.fillStyle = 'rgba(255, 255, 255, 0.4)';
  for (let i = 0; i < w.w * w.h / 40; i++) {
    const sx = hashNoise(i, w.x) * w.w;
    const sy = hashNoise(w.y, i) * w.h;
    g.fillRect(sx, sy, 1, 1);
  }
}

// Polished obsidian — glossy black with subtle purple gleam streaks.
function paintGloss(g, w, T) {
  // dark base gradient (top-lit)
  const grad = g.createLinearGradient(0, 0, 0, w.h);
  grad.addColorStop(0, '#3a2e3a');
  grad.addColorStop(0.4, T.baseFill);
  grad.addColorStop(1, '#0e080e');
  g.fillStyle = grad;
  g.fillRect(0, 0, w.w, w.h);
  // diagonal reflective streaks
  g.fillStyle = T.highlight;
  for (let i = 0; i < 3; i++) {
    const y = (w.h / 4) * (i + 0.5);
    g.save();
    g.translate(0, y);
    g.rotate(-0.3);
    g.fillRect(-w.w, 0, w.w * 3, 1);
    g.restore();
  }
  // micro-facets
  for (let i = 0; i < w.w * w.h / 60; i++) {
    const sx = hashNoise(i, w.x) * w.w;
    const sy = hashNoise(w.y, i) * w.h;
    const a = hashNoise(i + 1, sy) * 0.15;
    g.fillStyle = `rgba(180, 140, 200, ${a})`;
    g.fillRect(sx, sy, 1, 1);
  }
}

// Moss splatter overlay (for mossy theme)
function paintMossOverlay(g, w) {
  for (let i = 0; i < w.w * w.h / 25; i++) {
    const sx = hashNoise(i, w.x + 3) * w.w;
    const sy = hashNoise(w.y + 5, i) * w.h;
    const seed = hashNoise(sx, sy);
    if (seed > 0.6) {
      g.fillStyle = `rgba(${110 + seed * 40 | 0}, ${160 + seed * 30 | 0}, 80, ${0.15 + seed * 0.2})`;
      g.fillRect(sx, sy, 2, 2);
    }
  }
}

function bakeWall(w, themeName = 'brick') {
  const T = THEMES[themeName] || THEMES.brick;
  const c = document.createElement('canvas');
  c.width = w.w; c.height = w.h;
  const g = c.getContext('2d');

  g.fillStyle = T.baseFill;
  g.fillRect(0, 0, w.w, w.h);

  switch (T.pattern) {
    case 'plank': paintPlank(g, w, T); break;
    case 'plate': paintPlate(g, w, T); break;
    case 'ice':   paintIce(g, w, T); break;
    case 'gloss': paintGloss(g, w, T); break;
    case 'block': paintBrick(g, w, T, 28, 14); break;
    case 'brick':
    default:      paintBrick(g, w, T, 20, 10); break;
  }
  if (T.moss) paintMossOverlay(g, w);

  // edge lighting — top + left highlight, bottom + right shadow
  g.fillStyle = T.highlight;
  g.fillRect(0, 0, w.w, 2);
  g.fillRect(0, 0, 2, w.h);
  g.fillStyle = T.shadow;
  g.fillRect(0, w.h - 2, w.w, 2);
  g.fillRect(w.w - 2, 0, 2, w.h);
  // outer definition border
  g.strokeStyle = T.border;
  g.lineWidth = 1;
  g.strokeRect(0.5, 0.5, w.w - 1, w.h - 1);

  return c;
}

let wallCanvases = walls.map(w => bakeWall(w, 'brick'));

// Load a map by config object — updates walls, spawn positions, theme, and re-bakes textures
function loadMap(map) {
  currentMap = map;
  // Walls + spawns are authored in 800×500 space — scale to live canvas size.
  const s = MAP_SCALE;
  walls = map.walls.map(w => ({ x: w.x * s, y: w.y * s, w: w.w * s, h: w.h * s }));
  currentMap = {
    ...map,
    spawn1: { ...map.spawn1, x: map.spawn1.x * s, y: map.spawn1.y * s },
    spawn2: { ...map.spawn2, x: map.spawn2.x * s, y: map.spawn2.y * s },
  };
  const themeName = map.theme || 'brick';
  wallCanvases = walls.map(w => bakeWall(w, themeName));
  bakeGround(themeName);
  paintDecorations(themeName, walls, currentMap.spawn1, currentMap.spawn2);
  clearBattleCanvas();   // wipe tread + scorch marks for new round
  canvas.style.background = (THEMES[themeName] || THEMES.brick).canvasBg;
  // Start/switch BGM to match the new theme
  if (!audioMuted) startBGM(themeName);
}

// Pick next map from the remaining pool. Refills pool when exhausted (match end or all 5 used).
function pickNextMap() {
  if (mapPool.length === 0) {
    mapPool = MAPS.map(m => m.id);
  }
  const idx = Math.floor(Math.random() * mapPool.length);
  const chosenId = mapPool.splice(idx, 1)[0];
  return MAPS.find(m => m.id === chosenId);
}

function drawWalls() {
  // Soft drop shadow with feathered falloff
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetX = 3;
  ctx.shadowOffsetY = 4;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  for (const w of walls) {
    ctx.fillRect(w.x, w.y, w.w, w.h);
  }
  ctx.restore();
  for (let i = 0; i < walls.length; i++) {
    ctx.drawImage(wallCanvases[i], walls[i].x, walls[i].y);
  }
}

function drawBullets() {
  for (const b of bullets) {
    if (b.kind === 'homing') {
      // Missile with triangular body
      const ang = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.fillStyle = b.owner === 'p1' ? '#bbf7d0' : '#bfdbfe';
      ctx.beginPath();
      ctx.moveTo(6, 0);
      ctx.lineTo(-4, -3);
      ctx.lineTo(-4, 3);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = b.owner === 'p1' ? '#166534' : '#1e40af';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    } else if (b.kind === 'pierce') {
      // Elongated bright bullet with trail hint
      const ang = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.fillStyle = 'rgba(251, 191, 36, 0.4)';
      ctx.fillRect(-10, -3, 16, 6);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(-6, -2, 10, 4);
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(-2, -1, 6, 2);
      ctx.restore();
    } else if (b.kind === 'shotgun') {
      // Small red-orange pellet
      ctx.fillStyle = 'rgba(220, 38, 38, 0.3)';
      ctx.beginPath(); ctx.arc(b.x, b.y, BULLET_SIZE * 1.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fca5a5';
      ctx.beginPath(); ctx.arc(b.x, b.y, BULLET_SIZE * 0.8, 0, Math.PI*2); ctx.fill();
    } else {
      // Default round bullet
      ctx.fillStyle = b.owner === 'p1' ? 'rgba(74,222,128,0.3)' : 'rgba(96,165,250,0.3)';
      ctx.beginPath(); ctx.arc(b.x, b.y, BULLET_SIZE * 2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = b.owner === 'p1' ? '#bbf7d0' : '#bfdbfe';
      ctx.beginPath(); ctx.arc(b.x, b.y, BULLET_SIZE, 0, Math.PI*2); ctx.fill();
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    if (p.laser) {
      // Laser beam: bright core + glow
      const alpha = p.life / p.maxLife;
      ctx.save();
      ctx.globalAlpha = alpha * 0.4;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 10;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x1, p.y1); ctx.lineTo(p.x2, p.y2); ctx.stroke();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(p.x1, p.y1); ctx.lineTo(p.x2, p.y2); ctx.stroke();
      ctx.restore();
      continue;
    }
    const a = Math.max(0, p.life / (p.maxLife || 1));
    if (p.glow) {
      // Additive radial blob — bright, soft-edged
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a;
      const r = p.size * 2.2;
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      grad.addColorStop(0, p.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      continue;
    }
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawHitVignettes() {
  for (const v of hitVignettes) {
    const a = v.life / v.maxLife;
    const grad = ctx.createRadialGradient(v.x, v.y, 30, v.x, v.y, 260);
    grad.addColorStop(0, `rgba(239, 68, 68, 0)`);
    grad.addColorStop(0.55, `rgba(239, 68, 68, ${a * 0.35})`);
    grad.addColorStop(1, `rgba(120, 10, 10, ${a * 0.55})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
}

// pre-render ground texture once to an offscreen canvas (perf)
const groundCanvas = document.createElement('canvas');
groundCanvas.width = W;
groundCanvas.height = H;

function bakeGround(themeName = 'brick') {
  const T = THEMES[themeName] || THEMES.brick;
  const gctx = groundCanvas.getContext('2d');
  gctx.clearRect(0, 0, W, H);

  // Theme-tinted base wash (slight lift from solid canvasBg)
  const base = gctx.createRadialGradient(W/2, H/2, 80, W/2, H/2, Math.max(W, H));
  base.addColorStop(0, T.dotColor.replace(/[\d.]+\)$/, '0.12)'));
  base.addColorStop(1, 'rgba(0,0,0,0)');
  gctx.fillStyle = base;
  gctx.fillRect(0, 0, W, H);

  // Theme-specific accent under the dots
  if (themeName === 'ice') {
    // faint snow drift streaks
    gctx.strokeStyle = 'rgba(220, 240, 255, 0.04)';
    gctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      gctx.beginPath();
      gctx.moveTo(Math.random() * W, Math.random() * H);
      gctx.bezierCurveTo(
        Math.random()*W, Math.random()*H,
        Math.random()*W, Math.random()*H,
        Math.random()*W, Math.random()*H
      );
      gctx.stroke();
    }
  } else if (themeName === 'sandstone') {
    // sand ripple lines
    gctx.strokeStyle = 'rgba(255, 220, 160, 0.05)';
    for (let y = 30; y < H; y += 18 + (Math.sin(y*0.1)*4)) {
      gctx.beginPath();
      gctx.moveTo(0, y);
      for (let x = 0; x < W; x += 20) {
        gctx.lineTo(x, y + Math.sin(x * 0.05 + y * 0.1) * 2);
      }
      gctx.stroke();
    }
  } else if (themeName === 'metal' || themeName === 'gold') {
    // diamond-plate hint
    gctx.strokeStyle = T.hatchColor;
    gctx.lineWidth = 1;
    for (let i = -H; i < W; i += 24) {
      gctx.beginPath();
      gctx.moveTo(i, 0); gctx.lineTo(i + H, H);
      gctx.moveTo(i + H, 0); gctx.lineTo(i, H);
      gctx.stroke();
    }
  } else {
    // default diagonal hatch
    gctx.strokeStyle = T.hatchColor;
    gctx.lineWidth = 1;
    for (let i = -H; i < W; i += 60) {
      gctx.beginPath();
      gctx.moveTo(i, 0);
      gctx.lineTo(i + H, H);
      gctx.stroke();
    }
  }

  // Pseudo-random dot speckle (deterministic so it doesn't twinkle on rebake)
  gctx.fillStyle = T.dotColor;
  for (let x = 10; x < W; x += 20) {
    for (let y = 10; y < H; y += 20) {
      const seed = Math.abs(Math.sin(x * 0.7 + y * 1.3)) % 1;
      if (seed > 0.6) gctx.fillRect(x, y, 2, 2);
    }
  }

  // Edge vignette — pulls focus to center, hides hard canvas edge
  const vg = gctx.createRadialGradient(W/2, H/2, Math.min(W, H) * 0.35, W/2, H/2, Math.max(W, H) * 0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  gctx.fillStyle = vg;
  gctx.fillRect(0, 0, W, H);

  // Soft inner border highlight
  gctx.strokeStyle = T.highlight;
  gctx.lineWidth = 1;
  gctx.strokeRect(1, 1, W - 2, H - 2);
}
bakeGround('brick');

// --- Map decorations (cosmetic clutter painted into groundCanvas) ---
// Each drawer paints a small sprite at (x, y). All draw to the ground canvas
// so they cost zero per-frame and never block bullets/movement.
const DECOR_DRAWERS = {
  crate(g, x, y, s) {
    g.save(); g.translate(x, y); g.rotate((s - 0.5) * 0.4);
    g.fillStyle = '#7c4f1d'; g.fillRect(-8, -8, 16, 16);
    g.fillStyle = 'rgba(255,210,140,0.18)'; g.fillRect(-8, -8, 16, 2);
    g.strokeStyle = '#2a1606'; g.lineWidth = 1;
    g.strokeRect(-8, -8, 16, 16);
    g.beginPath(); g.moveTo(-8, 0); g.lineTo(8, 0);
    g.moveTo(0, -8); g.lineTo(0, 8); g.stroke();
    g.restore();
  },
  sandbag(g, x, y, s) {
    g.save(); g.translate(x, y); g.rotate((s - 0.5) * 0.3);
    g.fillStyle = '#a08a5a';
    g.beginPath(); g.ellipse(0, 0, 11, 5, 0, 0, Math.PI*2); g.fill();
    g.strokeStyle = '#4a3a18'; g.lineWidth = 0.9; g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.35)';
    g.beginPath(); g.moveTo(-7, -1); g.quadraticCurveTo(0, 2, 7, -1); g.stroke();
    g.restore();
  },
  barrel(g, x, y, s) {
    g.save(); g.translate(x, y);
    g.fillStyle = '#3a3a3a';
    g.beginPath(); g.ellipse(0, 0, 7, 8, 0, 0, Math.PI*2); g.fill();
    g.strokeStyle = '#111'; g.lineWidth = 1; g.stroke();
    g.strokeStyle = '#888'; g.lineWidth = 0.7;
    g.beginPath(); g.ellipse(0, -2, 6.5, 1.5, 0, 0, Math.PI*2); g.stroke();
    g.beginPath(); g.ellipse(0,  2, 6.5, 1.5, 0, 0, Math.PI*2); g.stroke();
    if (s > 0.5) {
      g.fillStyle = '#fbbf24'; g.font = 'bold 5px sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('!', 0, 0);
    }
    g.restore();
  },
  bone(g, x, y, s) {
    g.save(); g.translate(x, y); g.rotate(s * Math.PI * 2);
    g.fillStyle = '#e0d8c0'; g.strokeStyle = '#5a4a20'; g.lineWidth = 0.7;
    g.beginPath();
    g.arc(-6, -1.5, 2, 0, Math.PI*2);
    g.arc(-6,  1.5, 2, 0, Math.PI*2);
    g.arc( 6, -1.5, 2, 0, Math.PI*2);
    g.arc( 6,  1.5, 2, 0, Math.PI*2);
    g.fill(); g.stroke();
    g.fillRect(-6, -1.5, 12, 3);
    g.beginPath(); g.moveTo(-6, -1.5); g.lineTo(6, -1.5);
    g.moveTo(-6, 1.5); g.lineTo(6, 1.5); g.stroke();
    g.restore();
  },
  skull(g, x, y, s) {
    g.save(); g.translate(x, y); g.rotate((s - 0.5) * 0.4);
    g.fillStyle = '#ebe0c8'; g.strokeStyle = '#3a2812'; g.lineWidth = 0.9;
    g.beginPath(); g.arc(0, -1, 5.5, Math.PI, 0); g.lineTo(3, 3); g.lineTo(-3, 3); g.closePath();
    g.fill(); g.stroke();
    g.fillStyle = '#000';
    g.beginPath(); g.arc(-2, -1, 1.4, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc( 2, -1, 1.4, 0, Math.PI*2); g.fill();
    g.fillRect(-0.7, 1, 1.4, 2);
    g.restore();
  },
  grass(g, x, y, s) {
    g.save(); g.translate(x, y);
    g.strokeStyle = '#3f6b25'; g.lineWidth = 1.4; g.lineCap = 'round';
    for (let i = -3; i <= 3; i += 2) {
      g.beginPath();
      g.moveTo(i, 4);
      g.lineTo(i + (s - 0.5) * 3, -4);
      g.stroke();
    }
    g.strokeStyle = '#5a9a35'; g.lineWidth = 0.8;
    for (let i = -2; i <= 2; i += 2) {
      g.beginPath(); g.moveTo(i, 4); g.lineTo(i, -3); g.stroke();
    }
    g.restore();
  },
  mushroom(g, x, y, s) {
    g.save(); g.translate(x, y);
    g.fillStyle = '#fff'; g.fillRect(-1.5, -1, 3, 4);
    g.strokeStyle = '#444'; g.lineWidth = 0.5; g.strokeRect(-1.5, -1, 3, 4);
    g.fillStyle = '#dc2626';
    g.beginPath(); g.ellipse(0, -2, 5, 3.5, 0, Math.PI, 0); g.fill();
    g.strokeStyle = '#7f1d1d'; g.stroke();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(-1.5, -3, 0.7, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc( 1.8, -2.3, 0.5, 0, Math.PI*2); g.fill();
    g.restore();
  },
  rock(g, x, y, s) {
    g.save(); g.translate(x, y); g.rotate(s * Math.PI);
    g.fillStyle = '#6e6e6e'; g.strokeStyle = '#2a2a2a'; g.lineWidth = 0.9;
    g.beginPath();
    g.moveTo(-6, 2); g.lineTo(-4, -3); g.lineTo(2, -4);
    g.lineTo(5, 0); g.lineTo(3, 3); g.lineTo(-3, 4); g.closePath();
    g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.18)';
    g.beginPath(); g.moveTo(-4, -3); g.lineTo(0, -2); g.lineTo(-3, -1); g.closePath(); g.fill();
    g.restore();
  },
  snowpile(g, x, y, s) {
    g.save(); g.translate(x, y);
    g.fillStyle = 'rgba(240, 250, 255, 0.85)';
    g.beginPath(); g.ellipse(0, 1, 11, 4, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.7)';
    g.beginPath(); g.ellipse(-2, -1, 5, 2.5, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = 'rgba(255,255,255,1)';
    for (let i = 0; i < 3; i++) {
      const sx = (s - 0.5 + i * 0.3) * 8;
      g.fillRect(sx, -2 + i, 1, 1);
    }
    g.restore();
  },
  crystal(g, x, y, s) {
    g.save(); g.translate(x, y); g.rotate((s - 0.5) * 0.6);
    g.fillStyle = '#a78bfa'; g.strokeStyle = '#3a1a6e'; g.lineWidth = 0.8;
    g.beginPath();
    g.moveTo(0, -8); g.lineTo(4, 0); g.lineTo(2, 5); g.lineTo(-2, 5); g.lineTo(-4, 0); g.closePath();
    g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.55)';
    g.beginPath(); g.moveTo(0, -8); g.lineTo(1, -1); g.lineTo(-1, -1); g.closePath(); g.fill();
    // glow tint underneath
    const glow = g.createRadialGradient(0, 0, 0, 0, 0, 14);
    glow.addColorStop(0, 'rgba(167, 139, 250, 0.25)');
    glow.addColorStop(1, 'rgba(167, 139, 250, 0)');
    g.fillStyle = glow;
    g.beginPath(); g.arc(0, 0, 14, 0, Math.PI*2); g.fill();
    g.restore();
  },
  coin(g, x, y, s) {
    g.save(); g.translate(x, y);
    g.fillStyle = '#fbbf24'; g.strokeStyle = '#78350f'; g.lineWidth = 0.7;
    g.beginPath(); g.arc(0, 0, 3, 0, Math.PI*2); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.55)';
    g.beginPath(); g.arc(-0.8, -0.8, 0.8, 0, Math.PI*2); g.fill();
    // optional cluster
    if (s > 0.5) {
      g.fillStyle = '#fbbf24'; g.strokeStyle = '#78350f';
      g.beginPath(); g.arc(3, 1, 2.5, 0, Math.PI*2); g.fill(); g.stroke();
      g.beginPath(); g.arc(-2, 2, 2.2, 0, Math.PI*2); g.fill(); g.stroke();
    }
    g.restore();
  },
  crater(g, x, y, s) {
    const r = 10 + s * 6;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
    grad.addColorStop(0.7, 'rgba(0, 0, 0, 0.18)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    g.fillStyle = grad;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
    // dark rim crack
    g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 0.8;
    g.beginPath(); g.arc(x, y, r * 0.6, 0, Math.PI*2); g.stroke();
  },
  sword(g, x, y, s) {
    g.save(); g.translate(x, y); g.rotate(0.7 + (s - 0.5) * 0.6);
    g.strokeStyle = '#3a3a3a'; g.lineWidth = 1.2;
    g.fillStyle = '#cbd5e1';
    g.beginPath();
    g.moveTo(0, -9); g.lineTo(1.5, 4); g.lineTo(-1.5, 4); g.closePath();
    g.fill(); g.stroke();
    g.fillStyle = '#7a4a18';
    g.fillRect(-1.2, 4, 2.4, 3);
    g.fillStyle = '#fbbf24';
    g.fillRect(-3, 3, 6, 1.2);
    g.restore();
  },
  plank(g, x, y, s) {
    g.save(); g.translate(x, y); g.rotate(s * Math.PI);
    g.fillStyle = '#5a3a18'; g.fillRect(-9, -2, 18, 4);
    g.strokeStyle = '#2a1606'; g.lineWidth = 0.7;
    g.strokeRect(-9, -2, 18, 4);
    g.fillStyle = '#000';
    g.fillRect(-7, -1, 1, 1); g.fillRect(6, 0, 1, 1);
    g.restore();
  },
};

const THEME_DECORATIONS = {
  brick:      ['crate', 'sandbag', 'crate', 'crater', 'sandbag', 'rock'],
  stone:      ['bone', 'rock', 'crater', 'rock', 'bone'],
  sandstone:  ['rock', 'sandbag', 'bone', 'rock', 'crater'],
  metal:      ['barrel', 'crate', 'barrel', 'crater', 'plank'],
  mossy:      ['grass', 'mushroom', 'grass', 'rock', 'grass', 'mushroom'],
  wood:       ['crate', 'plank', 'crate', 'plank', 'barrel'],
  bloodstone: ['skull', 'bone', 'skull', 'crater', 'sword', 'bone'],
  ice:        ['snowpile', 'rock', 'snowpile', 'snowpile', 'crystal'],
  obsidian:   ['crystal', 'rock', 'crystal', 'crater', 'skull'],
  gold:       ['coin', 'coin', 'crate', 'coin', 'crystal'],
};

function paintDecorations(themeName, mapWalls, spawn1, spawn2) {
  const types = THEME_DECORATIONS[themeName];
  if (!types || types.length === 0) return;
  const gctx = groundCanvas.getContext('2d');
  // Deterministic LCG seeded by theme + wall count → same map looks the same.
  let seed = themeName.length * 131 + mapWalls.length * 17 + 97;
  function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  const WALL_PAD = 14;
  const SPAWN_CLEAR = 70;
  const target = 38;
  let placed = 0;
  for (let i = 0; i < 400 && placed < target; i++) {
    const x = 22 + rnd() * (W - 44);
    const y = 22 + rnd() * (H - 44);
    let blocked = false;
    for (const w of mapWalls) {
      if (x > w.x - WALL_PAD && x < w.x + w.w + WALL_PAD &&
          y > w.y - WALL_PAD && y < w.y + w.h + WALL_PAD) { blocked = true; break; }
    }
    if (blocked) continue;
    if (spawn1 && Math.hypot(x - spawn1.x, y - spawn1.y) < SPAWN_CLEAR) continue;
    if (spawn2 && Math.hypot(x - spawn2.x, y - spawn2.y) < SPAWN_CLEAR) continue;
    const type = types[Math.floor(rnd() * types.length)];
    DECOR_DRAWERS[type](gctx, x, y, rnd());
    placed++;
  }
}

function drawGrid() {
  ctx.drawImage(groundCanvas, 0, 0);
}

function drawDangerHalo(t) {
  let danger = 0;
  for (const b of bullets) {
    if (b.owner === t.id) continue;
    const dist = Math.hypot(b.x - t.x, b.y - t.y);
    if (dist < DANGER_DIST) {
      const tx = t.x - b.x, ty = t.y - b.y;
      const dot = (tx * b.vx + ty * b.vy) / (dist * BULLET_SPEED);
      if (dot > 0.3) danger = Math.max(danger, 1 - dist / DANGER_DIST);
    }
  }
  if (danger > 0) {
    const pulse = 0.5 + Math.sin(Date.now() / 80) * 0.25;
    const alpha = danger * pulse;
    const grad = ctx.createRadialGradient(t.x, t.y, 25, t.x, t.y, 130);
    grad.addColorStop(0, `rgba(239, 68, 68, 0)`);
    grad.addColorStop(0.7, `rgba(239, 68, 68, ${alpha * 0.35})`);
    grad.addColorStop(1, `rgba(239, 68, 68, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 130, 0, Math.PI*2);
    ctx.fill();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  // Screen shake — random sub-pixel translate, decays each frame
  if (screenShake.mag > 0.1) {
    const sx = (Math.random() - 0.5) * screenShake.mag;
    const sy = (Math.random() - 0.5) * screenShake.mag;
    ctx.translate(sx, sy);
  }
  drawGrid();
  ctx.drawImage(battleCanvas, 0, 0);   // tread marks + scorch under everything
  drawWalls();
  drawPowerups();
  if (roundActive) {
    drawAimLine(tank1, tank2);
    drawAimLine(tank2, tank1);
  }
  drawDangerHalo(tank1);
  drawDangerHalo(tank2);
  drawGhosts();
  drawBullets();
  drawTank(tank1);
  drawTank(tank2);
  drawTankHP(tank1);
  drawTankHP(tank2);
  drawParticles();
  drawFloatingTexts();
  ctx.restore();
  // Hit vignette is NOT shaken — full-screen overlay, drawn last over the shake
  drawHitVignettes();
  drawCountdown();
}

function drawCountdown() {
  if (!roundActive || countdownTimer <= 0) return;
  if (countdownStep >= COUNTDOWN_STEPS.length) return;

  const text = COUNTDOWN_STEPS[countdownStep];
  const isGo = countdownStep === COUNTDOWN_STEPS.length - 1;

  // Progress through the current step (0 at start, 1 at end)
  const t = 1 - countdownTimer / COUNTDOWN_STEP_DURATION;

  // Scale animation: pop in big, settle to 1, optional fade at end
  let scale;
  if (t < 0.15) scale = 2.0 - (t / 0.15) * 1.0;       // 2.0 → 1.0 (pop in)
  else if (t > 0.7) scale = 1.0 + (t - 0.7) * 0.6;     // slowly grow as fading
  else scale = 1.0;

  // Alpha — full for most of the step, fade last 30%
  const alpha = t < 0.7 ? 1 : Math.max(0, 1 - (t - 0.7) / 0.3);

  // Semi-transparent darkening during countdown so the numbers pop
  ctx.fillStyle = `rgba(0, 0, 0, ${0.35 * alpha})`;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2, H / 2);
  ctx.scale(scale, scale);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const fontSize = isGo ? 96 : 120;
  ctx.font = `bold ${fontSize}px "Segoe UI", "Malgun Gothic", sans-serif`;

  // Outline (thick dark stroke)
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)';
  ctx.lineWidth = 10;
  ctx.lineJoin = 'round';
  ctx.strokeText(text, 0, 0);

  // Fill — GO is yellow (action!), numbers are white
  ctx.fillStyle = isGo ? '#f5d742' : '#ffffff';
  ctx.fillText(text, 0, 0);

  ctx.restore();
}

function updateHUD() {
  updateHPBar(tank1, 'hp1', 'hpText1');
  updateHPBar(tank2, 'hp2', 'hpText2');
  document.getElementById('score1').textContent = scores.p1;
  document.getElementById('score2').textContent = scores.p2;
  updatePowerupSlot('pu1', tank1);
  updatePowerupSlot('pu2', tank2);
  updateWeaponSlot('wp1', tank1);
  updateWeaponSlot('wp2', tank2);
  updateRoundTimer();
}

function updateWeaponSlot(elId, t) {
  const el = document.getElementById(elId);
  if (!el) return;   // DOM not ready / element missing
  if (!t.weapon) { el.classList.remove('active'); return; }
  const weapon = WEAPON_ITEMS.find(w => w.id === t.weapon);
  if (!weapon) { el.classList.remove('active'); return; }
  el.classList.add('active');
  const iconEl = el.querySelector('.icon');
  const ammoEl = el.querySelector('.ammo');
  if (iconEl) iconEl.innerHTML = iconHTML(weapon.id, 16);
  if (ammoEl) ammoEl.textContent = '×' + t.ammo;
  el.style.color = weapon.color;
}

function updateRoundTimer() {
  const el = document.getElementById('roundTimer');
  if (!el) return;
  const secs = Math.max(0, Math.ceil(roundTimer));   // roundTimer is seconds now
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  el.textContent = `${m}:${s.toString().padStart(2, '0')}`;
  el.classList.toggle('low', roundActive && roundTimer <= LOW_TIME_THRESHOLD);
}

function updateHPBar(t, fillId, textId) {
  const hp = Math.max(0, t.hp);
  const fill = document.getElementById(fillId);
  const text = document.getElementById(textId);
  fill.style.width = (hp / MAX_HP * 100) + '%';
  text.textContent = hp + ' / ' + MAX_HP;
  // low HP warning color (≤ 2)
  if (hp <= 2 && hp > 0) {
    fill.style.background = '#ef4444';
  } else {
    fill.style.background = ''; // revert to CSS default (p1 green / p2 blue)
  }
}

function updatePowerupSlot(elId, t) {
  const el = document.getElementById(elId);
  if (!el) return;
  if (!t.powerup) { el.classList.remove('active'); return; }
  const type = POWERUP_TYPES.find(p => p.id === t.powerup);
  if (!type) { el.classList.remove('active'); return; }
  el.classList.add('active');
  const iconEl = el.querySelector('.icon');
  if (iconEl) iconEl.innerHTML = iconHTML(type.id, 16);
  const pct = (t.powerupTime / POWERUP_DURATION) * 100;
  const fill = el.querySelector('.timer-fill');
  if (fill) {
    fill.style.width = pct + '%';
    fill.style.background = type.color;
  }
}

function endRound(winnerId) {
  // winnerId: 'p1' | 'p2' | 'draw'
  if (!roundActive) return;
  roundActive = false;
  winner = winnerId;

  // Record per-map outcome for stats
  const mapId = currentMap ? currentMap.id : 'unknown';
  if (!stats.mapResults[mapId]) {
    stats.mapResults[mapId] = { p1Wins: 0, p2Wins: 0, draws: 0 };
  }

  if (winnerId === 'p1') {
    scores.p1++;
    stats.p1.roundsWon++;
    stats.mapResults[mapId].p1Wins++;
  } else if (winnerId === 'p2') {
    scores.p2++;
    stats.p2.roundsWon++;
    stats.mapResults[mapId].p2Wins++;
  } else { // draw
    stats.draws++;
    stats.mapResults[mapId].draws++;
  }

  updateHUD();
  freezeTimer = FREEZE_DURATION;
}

// --- Roulette state ---
// Flow:
//   Round ends → showOverlay('round', ...) → startRoulette(decidedMap) kicks in
//   User presses Space/Enter:
//     - during spin → skip (snap to decided)
//     - after spin (or on match overlay) → advance to next round
let decidedNextMap = null;    // the map that roulette is committing to
let rouletteState = 'idle';   // 'idle' | 'spinning' | 'locked'
let rouletteAnim = null;      // raf id
let rouletteLastItemIdx = -1; // for tick sfx

function showOverlay(kind, winnerName) {
  lastOverlay = { kind, winnerName };
  const lang = L();
  const overlayEl = document.getElementById('overlay');
  const rouletteWrap = document.getElementById('rouletteWrap');
  const nextBtn = document.getElementById('nextBtn');
  const statsBtn = document.getElementById('statsBtn');
  const keyHintEl = document.getElementById('keyHint');

  let title, sub, btnText;
  if (kind === 'match') {
    title   = lang.matchWin(winnerName);
    sub     = lang.finalLine(scores);
    btnText = lang.restart;
    // No roulette on match end — next match will re-roll from full pool
    rouletteWrap.style.display = 'none';
    decidedNextMap = null;
    rouletteState = 'idle';
    keyHintEl.innerHTML = lang.keyHint;
    nextBtn.disabled = false;
    nextBtn.style.opacity = '1';
    // Show the stats button on match end
    statsBtn.classList.remove('hidden');
    statsBtn.innerHTML = `${iconHTML('stats', 16)} <span style="vertical-align:middle">${lang.statsBtn}</span>`;
    // Match is over — quiet the BGM to let the victory fanfare breathe
    stopBGM(1.2);
  } else if (kind === 'draw') {
    title   = lang.drawRound;
    sub     = lang.drawSub;
    btnText = lang.nextRound;
    rouletteWrap.style.display = 'flex';
    document.getElementById('rouletteLabel').textContent = lang.nextMap;
    decidedNextMap = pickNextMap();
    nextBtn.disabled = true;
    nextBtn.style.opacity = '0.5';
    keyHintEl.innerHTML = lang.skipHint;
    statsBtn.classList.add('hidden');
    startRoulette(decidedNextMap);
  } else { // 'round'
    title   = lang.roundWin(winnerName);
    sub     = lang.scoreLine(scores);
    btnText = lang.nextRound;
    rouletteWrap.style.display = 'flex';
    document.getElementById('rouletteLabel').textContent = lang.nextMap;
    // Decide next map NOW (pulls from pool so it's committed fairly)
    decidedNextMap = pickNextMap();
    // Disable the "next round" button while spinning; re-enable when locked
    nextBtn.disabled = true;
    nextBtn.style.opacity = '0.5';
    keyHintEl.innerHTML = lang.skipHint;
    statsBtn.classList.add('hidden');
    startRoulette(decidedNextMap);
  }
  document.getElementById('overlayTitle').textContent = title;
  document.getElementById('overlaySub').textContent = sub;
  nextBtn.textContent = btnText;
  overlayEl.classList.remove('hidden');
}

// Build the roulette track DOM: the decided map lands exactly under the marker.
// We stage N filler items + decided item + tail items, then animate scroll from 0 to the landing offset.
const ROULETTE_ITEM_W = 96; // 90 + 2*3 margin
const ROULETTE_VIEWPORT_W = 360;

function buildRouletteItems(decidedMap) {
  // Pool for display = [decided] + all other maps (shuffled) — we'll repeat until enough items
  const pool = [decidedMap, ...MAPS.filter(m => m.id !== decidedMap.id)];
  // We want at least ~25 items flying past for visual momentum
  const items = [];
  while (items.length < 30) {
    // Shuffle each cycle so item order isn't the same every time
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    items.push(...shuffled);
  }
  // Place the decided map at a specific "landing index" so the final translate looks clean
  const landingIdx = 22 + Math.floor(Math.random() * 4); // 22..25
  // Remove any pre-existing decided map at that slot to replace deliberately
  items[landingIdx] = decidedMap;
  return { items, landingIdx };
}

function renderRouletteTrack(items) {
  const track = document.getElementById('rouletteTrack');
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  track.innerHTML = items.map(m => {
    const T = THEMES[m.theme] || THEMES.brick;
    return `<div class="roulette-item" style="background:${T.canvasBg}; border-color:${T.border};">
      ${iconHTML(m.id, 32)}
      <span class="name">${m.name[currentLang] || m.name.en}</span>
    </div>`;
  }).join('');
}

function startRoulette(decidedMap) {
  cancelRouletteAnim();
  const { items, landingIdx } = buildRouletteItems(decidedMap);
  renderRouletteTrack(items);

  // Calculate final transform: land the decidedMap center on the marker (viewport center)
  const itemCenter = landingIdx * ROULETTE_ITEM_W + ROULETTE_ITEM_W / 2;
  const viewportCenter = ROULETTE_VIEWPORT_W / 2;
  const finalOffset = -(itemCenter - viewportCenter);

  // Animate manually with RAF so we can play tick SFX at each item pass + skip easily
  const track = document.getElementById('rouletteTrack');
  const resultEl = document.getElementById('rouletteResult');
  resultEl.classList.add('pending');
  resultEl.textContent = '—';

  const DURATION = 2800;  // ms
  const startTime = performance.now();
  rouletteState = 'spinning';
  rouletteLastItemIdx = -1;

  function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

  function tick(now) {
    if (rouletteState !== 'spinning') return;  // was skipped → handled elsewhere
    const t = Math.min(1, (now - startTime) / DURATION);
    const eased = easeOutQuart(t);
    const currentOffset = finalOffset * eased;
    track.style.transform = `translateX(${currentOffset}px)`;

    // Which item is currently under the marker? play click when it changes
    const centerLocalX = -currentOffset + viewportCenter;
    const idxUnderMarker = Math.floor(centerLocalX / ROULETTE_ITEM_W);
    if (idxUnderMarker !== rouletteLastItemIdx && t < 1) {
      rouletteLastItemIdx = idxUnderMarker;
      SFX.rouletteTick();
    }

    if (t >= 1) {
      finishRoulette(decidedMap);
    } else {
      rouletteAnim = requestAnimationFrame(tick);
    }
  }
  rouletteAnim = requestAnimationFrame(tick);
}

function finishRoulette(decidedMap) {
  rouletteState = 'locked';
  const resultEl = document.getElementById('rouletteResult');
  resultEl.classList.remove('pending');
  resultEl.innerHTML = `${iconHTML(decidedMap.id, 18)} <span style="vertical-align:middle">${decidedMap.name[currentLang] || decidedMap.name.en}</span>`;
  SFX.rouletteLock();
  // Enable the continue button
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = false;
  nextBtn.style.opacity = '1';
  // Swap the hint to the "proceed" hint
  document.getElementById('keyHint').innerHTML = L().keyHint;
}

function cancelRouletteAnim() {
  if (rouletteAnim) { cancelAnimationFrame(rouletteAnim); rouletteAnim = null; }
}

function skipRoulette() {
  if (rouletteState !== 'spinning') return;
  cancelRouletteAnim();
  // Snap track instantly to final position
  const { items, landingIdx } = buildRouletteItems(decidedNextMap);
  renderRouletteTrack(items);
  const itemCenter = landingIdx * ROULETTE_ITEM_W + ROULETTE_ITEM_W / 2;
  const finalOffset = -(itemCenter - ROULETTE_VIEWPORT_W / 2);
  const track = document.getElementById('rouletteTrack');
  // give it a brief deceleration even on skip so it feels intentional, not instant
  track.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1)';
  track.style.transform = `translateX(${finalOffset}px)`;
  setTimeout(() => finishRoulette(decidedNextMap), 250);
}

// --- Stats modal ---
function buildStatRow(label, v1, v2, higherIsBetter = true, fmt = null) {
  // Returns HTML for a stat row with values and a comparison bar.
  // v1/v2 are raw numbers; fmt(n) optionally formats display strings (e.g. "45%").
  const n1 = Number(v1) || 0;
  const n2 = Number(v2) || 0;
  const total = n1 + n2;
  const pct1 = total > 0 ? (n1 / total * 100) : 50;
  const pct2 = total > 0 ? (n2 / total * 100) : 50;
  let leaderClass = '';
  if (n1 !== n2) {
    const p1Leads = higherIsBetter ? n1 > n2 : n1 < n2;
    leaderClass = p1Leads ? 'stat-leader-p1' : 'stat-leader-p2';
  }
  const disp1 = fmt ? fmt(n1) : n1;
  const disp2 = fmt ? fmt(n2) : n2;
  return `
    <div class="stat-row ${leaderClass === 'stat-leader-p1' ? 'stat-leader' : ''}">
      <span class="stat-p1">${disp1}</span>
      <span class="stat-label">${label}</span>
      <span class="stat-p2 ${leaderClass === 'stat-leader-p2' ? 'stat-leader' : ''}" style="${leaderClass === 'stat-leader-p2' ? 'text-shadow:0 0 8px currentColor;' : ''}">${disp2}</span>
    </div>
    <div class="stat-bar-wrap">
      <div class="stat-bar-p1" style="width: ${pct1}%"></div>
      <div class="stat-bar-p2" style="width: ${pct2}%"></div>
    </div>`;
}

function showStatsModal() {
  const lang = L();
  document.getElementById('statsTitle').textContent = lang.statsTitle;
  document.getElementById('statsMapsHeader').textContent = lang.statsMaps;
  document.getElementById('statsCloseBtn').textContent = lang.statsClose;

  const p1 = stats.p1, p2 = stats.p2;
  const acc1 = p1.shots > 0 ? Math.round(p1.hits / p1.shots * 100) : 0;
  const acc2 = p2.shots > 0 ? Math.round(p2.hits / p2.shots * 100) : 0;
  const dist1 = Math.round(p1.distance);
  const dist2 = Math.round(p2.distance);

  const powerupsTotal1 = Object.values(p1.powerups).reduce((a,b) => a+b, 0);
  const powerupsTotal2 = Object.values(p2.powerups).reduce((a,b) => a+b, 0);

  // Build grid HTML
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = `
    <div class="stat-row header">
      <span class="stat-p1">P1</span>
      <span class="stat-label">${lang.statRounds}</span>
      <span class="stat-p2">P2</span>
    </div>
    ${buildStatRow(lang.statRounds, p1.roundsWon, p2.roundsWon)}
    ${buildStatRow(lang.statShots, p1.shots, p2.shots)}
    ${buildStatRow(lang.statHits, p1.hits, p2.hits)}
    ${buildStatRow(lang.statAccuracy, acc1, acc2, true, n => n + '%')}
    ${buildStatRow(lang.statDamage, p1.damageTaken, p2.damageTaken, false)}
    ${buildStatRow(lang.statShields, p1.shieldsBlocked, p2.shieldsBlocked)}
    ${buildStatRow(lang.statBounces, p1.bounces, p2.bounces)}
    ${buildStatRow(lang.statDistance, dist1, dist2, true, n => n + 'px')}
    ${buildStatRow(lang.statPowerups, powerupsTotal1, powerupsTotal2)}
  `;

  // Build map results grid
  const mapsEl = document.getElementById('statsMaps');
  const mapIds = Object.keys(stats.mapResults);
  if (mapIds.length === 0) {
    mapsEl.innerHTML = `<div style="color:#666; grid-column: 1 / -1; text-align: center;">—</div>`;
  } else {
    mapsEl.innerHTML = mapIds.map(id => {
      const map = MAPS.find(m => m.id === id);
      if (!map) return '';
      const r = stats.mapResults[id];
      const name = map.name[currentLang] || map.name.en;
      const scoreParts = [];
      if (r.p1Wins > 0) scoreParts.push(`<span class="g">${r.p1Wins}</span>`);
      if (r.p2Wins > 0) scoreParts.push(`<span class="b">${r.p2Wins}</span>`);
      if (r.draws > 0) scoreParts.push(`<span class="d">=${r.draws}</span>`);
      return `
        <div class="stats-map-cell" style="border-left: 3px solid ${THEMES[map.theme].border};">
          <span class="map-icon">${iconHTML(map.id, 18)}</span>
          <span class="map-name">${name}</span>
          <span class="map-score">${scoreParts.join(' / ')}</span>
        </div>`;
    }).join('');
  }

  document.getElementById('statsModal').classList.remove('hidden');
}

function hideStatsModal() {
  document.getElementById('statsModal').classList.add('hidden');
}

// Wire up stats modal buttons
document.getElementById('statsBtn').addEventListener('click', showStatsModal);
document.getElementById('statsCloseBtn').addEventListener('click', hideStatsModal);
document.getElementById('statsModal').addEventListener('click', (e) => {
  // Click outside content closes
  if (e.target.id === 'statsModal') hideStatsModal();
});

function advanceFromOverlay() {
  const overlayEl = document.getElementById('overlay');
  if (overlayEl.classList.contains('hidden')) return;

  // If roulette is still spinning, skip instead of proceeding
  if (rouletteState === 'spinning') {
    skipRoulette();
    return;
  }

  overlayEl.classList.add('hidden');
  hideStatsModal();  // also close stats if it was open on match end
  lastOverlay = null;
  // Match ended — reset scores AND map pool so next match starts fresh
  if (scores.p1 >= WIN_SCORE || scores.p2 >= WIN_SCORE) {
    scores.p1 = 0; scores.p2 = 0;
    mapPool = [];
    decidedNextMap = null;
    stats = makeFreshStats();
  }
  // Pass the decided map (if any) to initRound so it uses the roulette result
  initRound(decidedNextMap);
  decidedNextMap = null;
  rouletteState = 'idle';
}

document.getElementById('nextBtn').addEventListener('click', advanceFromOverlay);

// Space / Enter handles both skip-during-spin and advance-after-lock
// Esc closes the stats modal if open
window.addEventListener('keydown', (e) => {
  const statsModalEl = document.getElementById('statsModal');
  const statsOpen = !statsModalEl.classList.contains('hidden');

  if (e.key === 'Escape' && statsOpen) {
    e.preventDefault();
    hideStatsModal();
    return;
  }

  if (e.key === ' ' || e.key === 'Enter') {
    // Don't advance overlay if the stats modal is on top of it
    if (statsOpen) return;
    const overlayEl = document.getElementById('overlay');
    if (!overlayEl.classList.contains('hidden')) {
      e.preventDefault();
      advanceFromOverlay();
    }
  }
});

// Main game loop — delta-time based, frame-rate independent.
// Every update function takes dt (seconds since last frame) so gameplay runs
// at the same speed on 60Hz, 144Hz, 240Hz displays.
let lastFrameTime = 0;   // timestamp (ms) of previous rAF callback
let rafId = 0;

function loop(now) {
  // Compute delta time in SECONDS. First frame uses 1/60 as a safe fallback.
  let rawDt;
  if (lastFrameTime === 0) {
    rawDt = 1 / 60;
  } else {
    rawDt = (now - lastFrameTime) / 1000;
  }
  lastFrameTime = now;
  // Clamp dt to avoid huge jumps (tab backgrounded, debugger pause, etc.)
  // 0.1s cap means the worst case is a 100ms "skip" rather than teleporting.
  if (rawDt > 0.1) rawDt = 0.1;

  // BATTLE: slow-mo on kill — gameplay dt is scaled, but screen-shake/UI use rawDt.
  let dt = rawDt;
  if (slowmoTimer > 0) {
    slowmoTimer -= rawDt;
    dt = rawDt * 0.25;
  }

  updateShake(rawDt);
  updateHitVignettes(rawDt);

  if (roundActive) {
    if (countdownTimer > 0) {
      // Countdown phase: freeze gameplay, tick the countdown by seconds
      countdownTimer -= dt;
      if (countdownTimer <= 0) {
        countdownStep++;
        if (countdownStep < COUNTDOWN_STEPS.length) {
          countdownTimer = COUNTDOWN_STEP_DURATION;
          if (countdownStep === COUNTDOWN_STEPS.length - 1) SFX.countdownGo();
          else SFX.countdownTick();
        } else {
          countdownTimer = 0;   // stop counting; gameplay unlocks next frame
        }
      }
    } else {
      updateTank(tank1, tank2, dt);
      updateTank(tank2, tank1, dt);
      updateBullets(dt);
      updatePowerups(dt);
      // Tick down round timer (now in seconds)
      roundTimer -= dt;
      // Beep once per whole second crossing during the last LOW_TIME_THRESHOLD seconds
      const currentSec = Math.ceil(roundTimer);
      if (roundTimer > 0 && roundTimer <= LOW_TIME_THRESHOLD && currentSec !== lastTimeWarningSec) {
        SFX.timeWarning();
        lastTimeWarningSec = currentSec;
      }
      if (roundTimer <= 0) {
        if (tank1.hp > tank2.hp) endRound('p1');
        else if (tank2.hp > tank1.hp) endRound('p2');
        else endRound('draw');
      }
    }
    updateHUD();
  }
  updateParticles(dt);
  updateGhosts(dt);
  updateFloatingTexts(dt);
  draw();
  if (!roundActive && freezeTimer > 0) {
    freezeTimer -= dt;
    if (freezeTimer <= 0) {
      freezeTimer = 0;
      if (scores.p1 >= WIN_SCORE) { SFX.matchWin(); showOverlay('match', 'P1'); }
      else if (scores.p2 >= WIN_SCORE) { SFX.matchWin(); showOverlay('match', 'P2'); }
      else if (winner === 'draw') { SFX.drawRound(); showOverlay('draw'); }
      else { SFX.roundWin(); showOverlay('round', winner === 'p1' ? 'P1' : 'P2'); }
    }
  }
  rafId = requestAnimationFrame(loop);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  } else if (!rafId) {
    lastFrameTime = 0;   // reset dt so we don't accumulate hidden-time
    rafId = requestAnimationFrame(loop);
  }
});

updateMuteIcon();   // deferred — ICON_SVGS now in scope

// --- AI opponent toggle ---
(function wireBotToggle() {
  const btn = document.getElementById('botToggle');
  if (!btn) return;
  function refresh() {
    btn.textContent = 'AI: ' + (botEnabled ? 'ON' : 'OFF');
    btn.classList.toggle('active', botEnabled);
    if (tank2) tank2.ai = botEnabled;
  }
  btn.addEventListener('click', () => {
    botEnabled = !botEnabled;
    try { localStorage.setItem('tankBattle.bot', botEnabled ? '1' : '0'); } catch (e) {}
    refresh();
  });
  refresh();
})();

// --- Auto-aim toggle ---
(function wireAimToggle() {
  const btn = document.getElementById('aimToggle');
  if (!btn) return;
  function refresh() {
    btn.textContent = 'AIM: ' + (autoAimEnabled ? 'AUTO' : 'MANUAL');
    btn.classList.toggle('active', autoAimEnabled);
  }
  btn.addEventListener('click', () => {
    autoAimEnabled = !autoAimEnabled;
    try { localStorage.setItem('tankBattle.autoAim', autoAimEnabled ? '1' : '0'); } catch (e) {}
    refresh();
  });
  refresh();
})();

applyLang();
initRound();
rafId = requestAnimationFrame(loop);
