  // Use the map decided by roulette (if provided), else pick one now (first round of match)
  loadMap(preDecidedMap || pickNextMap());
  const s1 = currentMap.spawn1, s2 = currentMap.spawn2;

  tank1 = { x: s1.x, y: s1.y, angle: s1.angle, turretAngle: s1.angle,
    color: '#4ade80', light: '#86efac', dark: '#22c55e', stroke: '#166534',
    hp: MAX_HP, cooldown: 0, id: 'p1',
    up: 'w', down: 's', left: 'a', right: 'd', fire: 'g',
    powerup: null, powerupTime: 0, hitFlash: 0,
    weapon: null, ammo: 0 };
  tank2 = { x: s2.x, y: s2.y, angle: s2.angle, turretAngle: s2.angle,
    color: '#60a5fa', light: '#93c5fd', dark: '#3b82f6', stroke: '#1e40af',
    hp: MAX_HP, cooldown: 0, id: 'p2',
    up: 'arrowup', down: 'arrowdown', left: 'arrowleft', right: 'arrowright', fire: '/',
    powerup: null, powerupTime: 0, hitFlash: 0,
    weapon: null, ammo: 0,
    ai: botEnabled, persona: rollPersona() };
  bullets = []; particles = []; powerups = []; floatingTexts = []; ghosts = [];
  nextPowerupIn = 2;   // seconds until first powerup (was 120 frames)
  spawnStars();
  winner = null; roundActive = true; freezeTimer = 0;
  roundTimer = ROUND_TIME;
  countdownStep = 0;
  countdownTimer = COUNTDOWN_STEP_DURATION;
  lastTimeWarningSec = -1;   // track last full-second that played warning beep
  SFX.countdownTick();  // play first tick immediately on round start
  updateHUD();
  updateMapName();
}

const keys = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' ','/'].includes(k)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
// Drop all held keys when window loses focus — otherwise alt-tab can leave a
// tank driving itself forever.
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
function tankCollidesAt(x, y) {
  const half = TANK_SIZE / 2;
  if (x - half < 0 || x + half > W || y - half < 0 || y + half > H) return true;
  for (const w of walls) if (rectsOverlap(x-half, y-half, TANK_SIZE, TANK_SIZE, w.x, w.y, w.w, w.h)) return true;
  return false;
}
function pointInRect(px, py, r) { return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }
function tanksOverlap(x, y, other) {
  const half = TANK_SIZE / 2;
  return rectsOverlap(x-half, y-half, TANK_SIZE, TANK_SIZE, other.x-half, other.y-half, TANK_SIZE, TANK_SIZE);
}

function spawnPowerup() {
  for (let attempt = 0; attempt < 30; attempt++) {
    const x = 40 + Math.random() * (W - 80);
    const y = 40 + Math.random() * (H - 80);
    const size = 24;
    let blocked = false;
    for (const w of walls) {
      if (rectsOverlap(x-size/2-8, y-size/2-8, size+16, size+16, w.x, w.y, w.w, w.h)) { blocked = true; break; }
    }
    if (blocked) continue;
    if (Math.hypot(x - tank1.x, y - tank1.y) < 60) continue;
    if (Math.hypot(x - tank2.x, y - tank2.y) < 60) continue;
    let tooClose = false;
    for (const p of powerups) if (Math.hypot(x - p.x, y - p.y) < 60) { tooClose = true; break; }
    if (tooClose) continue;
    const type = pickRandomItem();
    powerups.push({ x, y, type, spawnTime: 0 });
    return;
  }
}

function updatePowerups(dt) {
  nextPowerupIn -= dt;
  if (nextPowerupIn <= 0 && powerups.length < 2) {
    spawnPowerup();
    nextPowerupIn = POWERUP_SPAWN_MIN + Math.random() * (POWERUP_SPAWN_MAX - POWERUP_SPAWN_MIN);
  }
  for (const p of powerups) p.spawnTime += dt;
  for (const t of [tank1, tank2]) {
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      if (Math.hypot(p.x - t.x, p.y - t.y) < TANK_SIZE/2 + 12) {
        if (p.type.category === 'weapon') {
          t.weapon = p.type.id;
          t.ammo = p.type.ammo;
        } else {
          t.powerup = p.type.id;
          t.powerupTime = POWERUP_DURATION;
        }
        if (stats[t.id].powerups[p.type.id] !== undefined) {
          stats[t.id].powerups[p.type.id]++;
        }
        spawnPickupBurst(p.x, p.y, p.type.color);
        spawnFloatingText(t, L().powerup[p.type.id] || p.type.id.toUpperCase(), p.type.id, p.type.color);
        SFX.pickup(t.x);
        powerups.splice(i, 1);
      }
    }
  }
  for (const t of [tank1, tank2]) {
    if (t.powerup) {
      t.powerupTime -= dt;
      if (t.powerupTime <= 0) t.powerup = null;
    }
    if (t.hitFlash > 0) t.hitFlash -= dt;
  }
}

// --- Stars: alternate win condition ---
// Five stars (NW, NE, SE, SW, center). Stay within STAR_ZONE of one for
// STAR_CAPTURE_TIME to collect it; it then trails the tank. STARS_TO_WIN wins the round.
const STAR_CAPTURE_TIME = 3;
const STARS_TO_WIN = 3;
const STAR_ZONE = 46 * MAP_SCALE;
const STAR_GOLD = '#fde047';
let stars;

// Nearest spot to (x, y) a tank fits in, kept off the spawn points.
function freeSpotNear(x, y) {
  const spawns = [tank1, tank2];
  for (let r = 0; r < 300; r += 8) {
    for (let a = 0; a < Math.PI * 2; a += r ? 8 / r : 7) {
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      if (tankCollidesAt(px, py)) continue;
      if (spawns.some(s => Math.hypot(px - s.x, py - s.y) < STAR_ZONE * 2)) continue;
      return { x: px, y: py };
    }
  }
  return { x, y };
}

function spawnStars() {
  const m = TANK_SIZE * 1.4;   // corner inset: tank fits between star and arena edge
  stars = [[m, m], [W - m, m], [W - m, H - m], [m, H - m], [W / 2, H / 2]].map(([x, y], i) => {
    const p = freeSpotNear(x, y);   // goal: open floor a tank can reach
    // Center star stays dead-center even on a wall; its zone grows to reach open floor around it.
    const center = i === 4;
    return { x: center ? x : p.x, y: center ? y : p.y, goalX: p.x, goalY: p.y,
      zone: center ? Math.max(STAR_ZONE, Math.hypot(p.x - x, p.y - y) + STAR_ZONE * 0.6) : STAR_ZONE,
      owner: null, who: null, progress: 0, age: Math.random() * 6 };
  });
  for (const t of [tank1, tank2]) { t.stars = 0; t.trail = [{ x: t.x, y: t.y }]; }
}

function updateStars(dt) {
  for (const t of [tank1, tank2]) {
    // Breadcrumb trail so collected stars follow the tank's path like a tail
    const last = t.trail[0];
    if (Math.hypot(t.x - last.x, t.y - last.y) > 4) {
      t.trail.unshift({ x: t.x, y: t.y });
      if (t.trail.length > 40) t.trail.pop();
    }
  }
  for (const s of stars) {
    s.age += dt;
    if (s.owner) {
      const t = s.owner, pt = t.trail[Math.min(t.trail.length - 1, s.slot * 7)];
      const k = Math.min(1, dt * 10);
      s.x += (pt.x - s.x) * k; s.y += (pt.y - s.y) * k;
      continue;
    }
    const near = [tank1, tank2].filter(t => t.hp > 0 && Math.hypot(t.x - s.x, t.y - s.y) < s.zone);
    if (near.length === 1) {
      if (s.who !== near[0]) { s.who = near[0]; s.progress = 0; }   // new capturer starts over
      s.progress += dt;
      if (s.progress >= STAR_CAPTURE_TIME) collectStar(s, near[0]);
    } else if (near.length === 0 && s.progress > 0) {
      s.progress = Math.max(0, s.progress - dt);   // left the zone: progress drains back
      if (!s.progress) s.who = null;
    }                                              // both inside: contested, progress holds
  }
}

function collectStar(s, t) {
  s.owner = t; s.progress = 0;
  s.slot = ++t.stars;
  spawnPickupBurst(s.x, s.y, STAR_GOLD);
  spawnFloatingText(t, `${t.stars} / ${STARS_TO_WIN}`, 'star', STAR_GOLD);
  SFX.star(t.x);
  if (t.stars >= STARS_TO_WIN) endRound(t.id);
}

function starPath(g, r) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  g.closePath();
}

function drawStars() {
  for (const s of stars) {
    ctx.save();
    ctx.translate(s.x, s.y);
    if (s.owner) {
      // Collected: smaller star wearing the owner's color
      ctx.rotate(s.age * 2);
      starPath(ctx, 9);
      ctx.fillStyle = STAR_GOLD; ctx.fill();
      ctx.strokeStyle = s.owner.stroke; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
      continue;
    }
    // Capture zone
    ctx.strokeStyle = 'rgba(253,224,71,0.35)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]); ctx.lineDashOffset = -s.age * 12;
    ctx.beginPath(); ctx.arc(0, 0, s.zone, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(253,224,71,0.08)'; ctx.fill();
    // Capture progress ring in the capturer's color
    if (s.progress > 0 && s.who) {
      ctx.strokeStyle = s.who.color; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, 0, s.zone - 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * s.progress / STAR_CAPTURE_TIME);
      ctx.stroke();
    }
    // Star: bobbing, slowly spinning, pulsing glow
    ctx.translate(0, Math.sin(s.age * 2.5) * 2);
    ctx.fillStyle = 'rgba(253,224,71,' + (0.25 + Math.sin(s.age * 4) * 0.1) + ')';
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(Math.sin(s.age) * 0.4);
    starPath(ctx, 15);
    ctx.fillStyle = STAR_GOLD; ctx.fill();
    ctx.strokeStyle = '#a16207'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    starPath(ctx, 7);
    ctx.fillStyle = '#fffbeb'; ctx.fill();
    ctx.restore();
  }
}

function getSpeedFor(t) { return t.powerup === 'speed' ? TANK_SPEED * 1.6 : TANK_SPEED; }
function getCooldownFor(t) { return t.powerup === 'rapid' ? FIRE_COOLDOWN * 0.45 : FIRE_COOLDOWN; }

function fireBullet(t, angleOffset = 0) {
  const muzzleDist = TANK_SIZE / 2 + 4;
  const a = t.turretAngle + angleOffset;
  bullets.push({
    x: t.x + Math.cos(a) * muzzleDist,
    y: t.y + Math.sin(a) * muzzleDist,
    vx: Math.cos(a) * BULLET_SPEED, vy: Math.sin(a) * BULLET_SPEED,
    owner: t.id, bounces: 1, life: 3   // seconds (was 180 frames)
  });
}

// Has line-of-sight between (ax,ay) and (bx,by) — no wall obstructs the segment.
function hasLOS(ax, ay, bx, by) {
  const dist = Math.hypot(bx - ax, by - ay);
  const steps = Math.max(2, Math.ceil(dist / 10));
  const stepX = (bx - ax) / steps, stepY = (by - ay) / steps;
  for (let i = 1; i < steps; i++) {
    const px = ax + stepX * i, py = ay + stepY * i;
    for (const w of walls) {
      if (px >= w.x && px <= w.x + w.w && py >= w.y && py <= w.y + w.h) return false;
    }
  }
  return true;
}

// Number of distinct walls the segment crosses (pierce bullets punch through one).
function wallsOnLine(ax, ay, bx, by) {
  const steps = Math.max(2, Math.ceil(Math.hypot(bx - ax, by - ay) / 8));
  const hit = new Set();
  for (let i = 1; i < steps; i++) {
    const px = ax + (bx - ax) * i / steps, py = ay + (by - ay) * i / steps;
    for (const w of walls) if (pointInRect(px, py, w)) hit.add(w);
  }
  return hit.size;
}

// --- AI navigation grid ---
// Coarse grid of cells a tank center can occupy (walls inflated by tank half +
// margin). BFS distance fields over it let the AI route around walls.
// ponytail: 4-neighbour BFS (Manhattan-ish distances), Dijkstra if paths look boxy.
const NAV = 16;
const NAV_INF = 65535;
let navCols = 0, navRows = 0, navFree = null;
function buildNavGrid() {
  navCols = Math.ceil(W / NAV); navRows = Math.ceil(H / NAV);
  navFree = new Uint8Array(navCols * navRows);
  const half = TANK_SIZE / 2 + 3;
  for (let r = 0; r < navRows; r++) for (let c = 0; c < navCols; c++) {
    const x = (c + 0.5) * NAV, y = (r + 0.5) * NAV;
    let free = x - half >= 0 && x + half <= W && y - half >= 0 && y + half <= H;
    if (free) for (const w of walls) {
      if (rectsOverlap(x - half, y - half, half * 2, half * 2, w.x, w.y, w.w, w.h)) { free = false; break; }
    }
    navFree[r * navCols + c] = free ? 1 : 0;
  }
}
function navCell(x, y) {
  const c = Math.max(0, Math.min(navCols - 1, Math.floor(x / NAV)));
  const r = Math.max(0, Math.min(navRows - 1, Math.floor(y / NAV)));
  return r * navCols + c;
}
// BFS distance (in cells) from (gx,gy) to every free cell.
function navField(gx, gy) {
  const field = new Uint16Array(navCols * navRows).fill(NAV_INF);
  const queue = new Int32Array(navCols * navRows);
  let head = 0, tail = 0;
  const start = navCell(gx, gy);
  field[start] = 0; queue[tail++] = start;
  while (head < tail) {
    const i = queue[head++], c = i % navCols, d = field[i] + 1;
    if (c > 0 && navFree[i - 1] && field[i - 1] > d) { field[i - 1] = d; queue[tail++] = i - 1; }
    if (c < navCols - 1 && navFree[i + 1] && field[i + 1] > d) { field[i + 1] = d; queue[tail++] = i + 1; }
    if (i >= navCols && navFree[i - navCols] && field[i - navCols] > d) { field[i - navCols] = d; queue[tail++] = i - navCols; }
    if (i + navCols < field.length && navFree[i + navCols] && field[i + navCols] > d) { field[i + navCols] = d; queue[tail++] = i + navCols; }
  }
  return field;
}
// Path distance in px from (x,y) along a field (checks neighbours when the
// exact cell is inside a wall's inflated margin).
function navDist(field, x, y) {
  const i = navCell(x, y);
  let best = field[i];
  const c = i % navCols;
  for (const n of [i - 1, i + 1, i - navCols, i + navCols]) {
    if (n < 0 || n >= field.length || (Math.abs((n % navCols) - c) > 1)) continue;
    if (field[n] < best) best = field[n];
  }
  return best === NAV_INF ? Infinity : best * NAV;
}
// Walk downhill a few cells (8-neighbour, no corner cutting) and return the
// angle to steer toward. Null when already at the goal / unreachable.
function navSteer(field, x, y) {
  let i = navCell(x, y), moved = false;
  for (let step = 0; step < 4; step++) {
    const c = i % navCols, r = (i / navCols) | 0;
    let best = i, bestV = navFree[i] ? field[i] : NAV_INF;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nc = c + dc, nr = r + dr;
      if (nc < 0 || nr < 0 || nc >= navCols || nr >= navRows) continue;
      const n = nr * navCols + nc;
      if (!navFree[n]) continue;
      if (dr && dc && (!navFree[r * navCols + nc] || !navFree[nr * navCols + c])) continue;
      if (field[n] < bestV) { bestV = field[n]; best = n; }
    }
    if (best === i) break;
    i = best; moved = true;
  }
  if (!moved) return null;
  return Math.atan2(((i / navCols) | 0) * NAV + NAV / 2 - y, (i % navCols) * NAV + NAV / 2 - x);
}

// How much the AI wants a given pickup right now (0 = ignore).
function aiItemValue(t, p) {
  const id = p.type.id;
  if (p.type.category === 'weapon') {
    if (t.weapon && t.ammo >= 2) return 0;       // keep current weapon
    return id === 'homing' || id === 'pierce' ? 1.4 : 1.2;
  }
  if (t.powerup === id && t.powerupTime > 3) return 0;   // already have it
  if (id === 'shield') return t.hp <= 2 ? 2 : 1.3;
  if (id === 'speed') return 0.7;
  return 1;
}

// AI personalities — one rolled per round so the bot plays differently each time.
//   star:      'always' chase stars · 'deny' contest the star you're capturing · 'late' after items · 'never'
//   itemRange: max path detour (px) for a pickup
//   aimErr:    turret wobble (rad) — misses at range
//   dodge:     chance to react to each incoming bullet
//   range:     preferred fight distance scale
const AI_PERSONAS = {
  collector: { icon: 'star',   star: 'always', itemRange: 150, aimErr: 0.10, dodge: 0.55, range: 1.25 },
  hunter:    { icon: 'swords', star: 'never',  itemRange: 300, aimErr: 0.07, dodge: 0.5,  range: 0.75 },
  guardian:  { icon: 'shield', star: 'deny',   itemRange: 200, aimErr: 0.09, dodge: 0.6,  range: 1 },
  scavenger: { icon: 'rapid',  star: 'late',   itemRange: 520, aimErr: 0.11, dodge: 0.65, range: 1 },
};
const AI_REACTION = 0.3;   // seconds of LOS before the bot may fire
let lastPersona = null;
function rollPersona() {
  const ids = Object.keys(AI_PERSONAS).filter(id => id !== lastPersona);
  return (lastPersona = ids[Math.floor(Math.random() * ids.length)]);
}

// AI controller for an enemy tank. Returns intent {dx, dy, fire} consumed by
// updateTank — same shape as keyboard input.
function runAI(t, other, dt) {
  const P = AI_PERSONAS[t.persona] || AI_PERSONAS.collector;
  // Aim wobble, re-rolled a couple of times a second (also applied to the turret in updateTank)
  t._errT = (t._errT || 0) - dt;
  if (t._errT <= 0) { t._errT = 0.4 + Math.random() * 0.4; t._aimErr = (Math.random() * 2 - 1) * P.aimErr; }
  // Track opponent velocity (rough — from prev pos delta) for target lead.
  if (other._prevX === undefined) { other._prevX = other.x; other._prevY = other.y; }
  const ovx = (other.x - other._prevX) / Math.max(dt, 0.001);
  const ovy = (other.y - other._prevY) / Math.max(dt, 0.001);
  other._prevX = other.x; other._prevY = other.y;

  // Lead target: predict where opponent will be when bullet arrives.
  const dist = Math.hypot(other.x - t.x, other.y - t.y);
  const travelT = dist / BULLET_SPEED;
  const leadX = other.x + ovx * travelT * 0.7;   // 0.7 = imperfect prediction
  const leadY = other.y + ovy * travelT * 0.7;
  const aimAngle = Math.atan2(leadY - t.y, leadX - t.x);

  // Refresh distance fields a few times per second (cheap: ~3k cells each).
  t._navT = (t._navT || 0) - dt;
  if (t._navT <= 0 || !t._fieldEnemy || t._navGrid !== navFree) {
    t._navT = 0.25;
    t._navGrid = navFree;
    t._fieldEnemy = navField(other.x, other.y);   // path to enemy + enemy's reach
    const fieldMe = navField(t.x, t.y);
    // Pick the best pickup: value / my path length, skipping ones the enemy
    // will clearly reach first or that are too far to be worth the detour.
    t._item = null; t._fieldItem = null;
    let bestScore = 0;
    for (const p of powerups) {
      const v = aiItemValue(t, p);
      if (!v) continue;
      const mine = navDist(fieldMe, p.x, p.y), theirs = navDist(t._fieldEnemy, p.x, p.y);
      if (mine > P.itemRange * MAP_SCALE || (mine > 80 && theirs < mine * 0.7)) continue;
      const score = v / (mine + 60);
      if (score > bestScore) { bestScore = score; t._item = p; }
    }
    if (t._item) t._fieldItem = navField(t._item.x, t._item.y);
    // Star target depends on personality: nearest free star, or only the one the enemy is capturing
    t._star = null; t._fieldStar = null;
    let bestStar = Infinity;
    for (const s of stars) {
      if (s.owner || P.star === 'never') continue;
      if (P.star === 'deny' && !(s.who && s.progress > 0)) continue;   // contest yours, finish its own
      const d = navDist(fieldMe, s.goalX, s.goalY);
      if (d < bestStar) { bestStar = d; t._star = s; }
    }
    if (t._star) t._fieldStar = navField(t._star.goalX, t._star.goalY);
  }
  if (t._item && !powerups.includes(t._item)) { t._item = null; t._fieldItem = null; }
  if (t._star && t._star.owner) { t._star = null; t._fieldStar = null; }

  const clearAt = (a, d = 20) => !tankCollidesAt(t.x + Math.cos(a) * d, t.y + Math.sin(a) * d);

  // Movement decision: keep weapon-appropriate range, strafe if LOS, path
  // around walls otherwise.
  const losDirect = hasLOS(t.x, t.y, other.x, other.y);
  let moveAngle = aimAngle;
  const shortRange = t.weapon === 'shotgun';
  const IDEAL_MIN = (shortRange ? 90 : 180 * P.range) * MAP_SCALE;
  const IDEAL_MAX = (shortRange ? 170 : 320 * P.range) * MAP_SCALE;
  if (t._strafeDir === undefined) t._strafeDir = 1;
  const strafe = () => {
    // strafe perpendicular — flip every ~1.5s or when a wall is in the way
    t._strafeT = (t._strafeT || 0) - dt;
    if (t._strafeT <= 0) { t._strafeT = 1 + Math.random() * 1; t._strafeDir = -t._strafeDir; }
    let a = aimAngle + t._strafeDir * Math.PI / 2;
    if (!clearAt(a)) { t._strafeDir = -t._strafeDir; a = aimAngle + t._strafeDir * Math.PI / 2; }
    return a;
  };
  let hold = false;
  const starDist = t._star ? Math.hypot(t._star.x - t.x, t._star.y - t.y) : Infinity;
  if (t._item && t._fieldItem) {   // itemRange already limits detours per personality
    moveAngle = navSteer(t._fieldItem, t.x, t.y) ?? Math.atan2(t._item.y - t.y, t._item.x - t.x);
  } else if (t._star && starDist < t._star.zone - 16 * MAP_SCALE) {
    hold = true;   // sit in the zone until it's captured
  } else if (t._star && t._fieldStar) {
    moveAngle = navSteer(t._fieldStar, t.x, t.y) ?? Math.atan2(t._star.goalY - t.y, t._star.goalX - t.x);
  } else if (losDirect) {
    if (dist < IDEAL_MIN) moveAngle = clearAt(aimAngle + Math.PI) ? aimAngle + Math.PI : strafe();  // back off
    else if (dist > IDEAL_MAX) moveAngle = navSteer(t._fieldEnemy, t.x, t.y) ?? aimAngle;         // close in
    else moveAngle = strafe();
  } else {
    // No LOS — follow the path to the opponent to find one
    moveAngle = navSteer(t._fieldEnemy, t.x, t.y) ?? aimAngle;
  }

  // Bullet dodge (overrides everything): step sideways off the bullet's line,
  // toward the side we're already on, unless a wall blocks that side.
  for (const b of bullets) {
    if (b.owner === t.id) continue;
    const bd = Math.hypot(b.x - t.x, b.y - t.y);
    if (bd > DANGER_DIST) continue;
    const tx = t.x - b.x, ty = t.y - b.y;
    const dot = (tx * b.vx + ty * b.vy) / (bd * Math.hypot(b.vx, b.vy));
    if (b._noticed === undefined) b._noticed = Math.random() < P.dodge;   // one roll per bullet
    if (dot > 0.5 && b._noticed) {
      const side = (b.vx * ty - b.vy * tx) >= 0 ? 1 : -1;
      const ba = Math.atan2(b.vy, b.vx);
      moveAngle = ba + side * Math.PI / 2;
      if (!clearAt(moveAngle)) moveAngle = ba - side * Math.PI / 2;
      hold = false;
      break;
    }
  }

  // Fire when the weapon can actually connect AND turret is on target
  // (turret angle is auto-updated each frame by updateTurret).
  const facingDiff = Math.abs(((t.turretAngle - aimAngle - t._aimErr + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
  let shotOK = losDirect;
  if (t.weapon === 'pierce') shotOK = wallsOnLine(t.x, t.y, other.x, other.y) <= 1;
  else if (t.weapon === 'shotgun') shotOK = losDirect && dist < 230 * MAP_SCALE;
  t._losT = shotOK ? (t._losT || 0) + dt : 0;   // reaction delay after spotting
  const canFire = shotOK && t._losT > AI_REACTION && facingDiff < 0.12;

  return {
    dx: hold ? 0 : Math.cos(moveAngle),
    dy: hold ? 0 : Math.sin(moveAngle),
    fire: canFire,
  };
}

// Smoothly rotate t.turretAngle toward the desired aim direction.
// TURRET_ROT_SPEED is faster than chassis rotation — the turret swivels quickly.
const TURRET_ROT_SPEED = 12;    // rad/s — fast enough to track strafing enemy
function updateTurret(t, targetAngle, dt) {
  let diff = targetAngle - t.turretAngle;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  const step = TURRET_ROT_SPEED * dt;
  if (Math.abs(diff) < step) t.turretAngle = targetAngle;
  else t.turretAngle += Math.sign(diff) * step;
}

function updateTank(t, other, dt) {
  if (!roundActive) return;
  let dx = 0, dy = 0, fireBtn = false;
  if (t.ai) {
    const intent = runAI(t, other, dt);
    dx = intent.dx; dy = intent.dy; fireBtn = intent.fire;
  } else if (netRole === 'host' && t === tank2) {
    dx = netInput.dx; dy = netInput.dy; fireBtn = netInput.fire;
  } else {
    if (keys[t.up]) dy -= 1;
    if (keys[t.down]) dy += 1;
    if (keys[t.left]) dx -= 1;
    if (keys[t.right]) dx += 1;
    fireBtn = !!keys[t.fire];
    const ti = touchInputs[t.id];
    if (ti.active) {
      if (dx === 0 && dy === 0) { dx = ti.dx; dy = ti.dy; }
      fireBtn = fireBtn || ti.fire;
    }
  }
  // Velocity tracker (EMA-smoothed) — runs every frame regardless of toggle so
  // _lastX never goes stale and toggling auto-aim back on doesn't jump turret.
  if (other._lastX === undefined) {
    other._lastX = other.x; other._lastY = other.y;
    other._smoothVX = 0; other._smoothVY = 0;
  }
  const instVX = (other.x - other._lastX) / Math.max(dt, 0.001);
  const instVY = (other.y - other._lastY) / Math.max(dt, 0.001);
  other._lastX = other.x; other._lastY = other.y;
  // Exponential moving average — alpha 0.18 = ~5-frame smoothing
  other._smoothVX = other._smoothVX * 0.82 + instVX * 0.18;
  other._smoothVY = other._smoothVY * 0.82 + instVY * 0.18;

  // Turret aim. AI always auto-aims at the enemy. Human auto-aims only when
  // the global autoAimEnabled toggle is on; otherwise the turret stays locked
  // to the chassis (manual aim — point body at target to shoot it).
  if (t.ai || autoAimEnabled) {
    const distToOther = Math.hypot(other.x - t.x, other.y - t.y);
    const travelT = distToOther / BULLET_SPEED;
    // Modest lead: enemies zigzag, so over-prediction makes turret chase empty
    // space. Cap lead distance to a fraction of range so we don't aim wildly
    // off when an enemy briefly bursts in one direction.
    const leadFactor = t.ai ? 0.35 : 0.4;
    let leadDX = other._smoothVX * travelT * leadFactor;
    let leadDY = other._smoothVY * travelT * leadFactor;
    const leadMag = Math.hypot(leadDX, leadDY);
    const maxLead = Math.min(distToOther * 0.5, 90 * MAP_SCALE);
    if (leadMag > maxLead) {
      const k = maxLead / leadMag;
      leadDX *= k; leadDY *= k;
    }
    const aimToward = Math.atan2(other.y + leadDY - t.y, other.x + leadDX - t.x) + (t.ai ? t._aimErr || 0 : 0);
    updateTurret(t, aimToward, dt);
  } else {
    // Manual aim: turret rigidly follows chassis.
    t.turretAngle = t.angle;
  }

  if (dx !== 0 || dy !== 0) {
    // Chassis always rotates toward movement direction (treads point forward).
    const targetAngle = Math.atan2(dy, dx);
    let diff = targetAngle - t.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    const rotStep = ROT_SPEED * dt;
    if (Math.abs(diff) < rotStep) t.angle = targetAngle;
    else t.angle += Math.sign(diff) * rotStep;
    const speed = getSpeedFor(t);
    const len = Math.hypot(dx, dy);
    const mvx = (dx / len) * speed * dt;
    const mvy = (dy / len) * speed * dt;
    const beforeX = t.x, beforeY = t.y;
    if (!tankCollidesAt(t.x + mvx, t.y) && !tanksOverlap(t.x + mvx, t.y, other)) t.x += mvx;
    if (!tankCollidesAt(t.x, t.y + mvy) && !tanksOverlap(t.x, t.y + mvy, other)) t.y += mvy;
    // Accumulate actual distance traveled (accounts for wall sliding)
    const moved = Math.hypot(t.x - beforeX, t.y - beforeY);
    stats[t.id].distance += moved;
    // Spawn ghost trail when the tank actually moved this frame. Throttle by
    // distance so faster movement (speed powerup) spawns more ghosts naturally.
    t.ghostAccum = (t.ghostAccum || 0) + moved;
    if (t.ghostAccum >= 7) {
      t.ghostAccum = 0;
      ghosts.push({
        x: beforeX, y: beforeY, angle: t.angle,
        color: t.color, dark: t.dark,
        life: 0.35, maxLife: 0.35
      });
    }
    // Tread marks on battle canvas (persist for round)
    t.treadAccum = (t.treadAccum || 0) + moved;
    if (t.treadAccum >= 4) {
      t.treadAccum = 0;
      paintTreadMarks(t);
    }
  } else {
    t.ghostAccum = 0;
  }
  if (t.recoil > 0) t.recoil = Math.max(0, t.recoil - dt * 7);
  if (t.cooldown > 0) t.cooldown -= dt;
  if (fireBtn && t.cooldown <= 0) {
    fireWeapon(t);
  }
}

// Dispatch fire action based on currently held weapon (or default cannon).
function fireWeapon(t) {
  const weapon = t.weapon;
  if (weapon === 'shotgun') {
    fireShotgun(t);
  } else if (weapon === 'homing') {
    fireHoming(t);
  } else if (weapon === 'laser') {
    fireLaser(t);
  } else if (weapon === 'pierce') {
    firePierce(t);
  } else {
    // Default cannon (no weapon equipped) — uses triple buff if active
    const activeCount = bullets.filter(b => b.owner === t.id).length;
    const maxBullets = t.powerup === 'triple' ? MAX_BULLETS + 2 : MAX_BULLETS;
    if (activeCount >= maxBullets) return;
    if (t.powerup === 'triple') {
      fireBullet(t, -0.22); fireBullet(t, 0); fireBullet(t, 0.22);
      stats[t.id].shots += 3;
    } else {
      fireBullet(t, 0);
      stats[t.id].shots++;
    }
    t.cooldown = getCooldownFor(t);
    spawnMuzzleFlash(t);
    addShake(2.5);
    SFX.fire(t.x);
  }
}

function fireShotgun(t) {
  // 5 pellets in a fan, short range (shorter bullet life)
  const angles = [-0.35, -0.18, 0, 0.18, 0.35];
  const ta = t.turretAngle;
  for (const a of angles) {
    const muzzleDist = TANK_SIZE / 2 + 4;
    bullets.push({
      x: t.x + Math.cos(ta) * muzzleDist,
      y: t.y + Math.sin(ta) * muzzleDist,
      vx: Math.cos(ta + a) * (BULLET_SPEED * 1.1),
      vy: Math.sin(ta + a) * (BULLET_SPEED * 1.1),
      owner: t.id,
      bounces: 0,        // shotgun pellets don't bounce
      life: 0.67,        // seconds (was 40 frames)
      kind: 'shotgun',
    });
  }
  stats[t.id].shots += 5;
  t.ammo--;
  if (t.ammo <= 0) { t.weapon = null; }
  t.cooldown = FIRE_COOLDOWN * 1.4;
  spawnMuzzleFlash(t);
  SFX.shotgunFire(t.x);
}

function fireHoming(t) {
  // Homing missile — weaker turn rate so it's not perfect tracking
  const muzzleDist = TANK_SIZE / 2 + 4;
  const ta = t.turretAngle;
  bullets.push({
    x: t.x + Math.cos(ta) * muzzleDist,
    y: t.y + Math.sin(ta) * muzzleDist,
    vx: Math.cos(ta) * (BULLET_SPEED * 0.75),
    vy: Math.sin(ta) * (BULLET_SPEED * 0.75),
    owner: t.id,
    bounces: 0,
    life: 4,             // seconds (was 240 frames)
    kind: 'homing',
    turnRate: 3.3,       // rad/s (was 0.055 rad/frame × 60)
  });
  stats[t.id].shots++;
  t.ammo--;
  if (t.ammo <= 0) { t.weapon = null; }
  t.cooldown = FIRE_COOLDOWN * 1.3;
  spawnMuzzleFlash(t);
  addShake(3);
  SFX.fire(t.x);
}

function firePierce(t) {
  // Pierce bullet — punches through one wall
  const muzzleDist = TANK_SIZE / 2 + 4;
  const ta = t.turretAngle;
  bullets.push({
    x: t.x + Math.cos(ta) * muzzleDist,
    y: t.y + Math.sin(ta) * muzzleDist,
    vx: Math.cos(ta) * (BULLET_SPEED * 1.2),
    vy: Math.sin(ta) * (BULLET_SPEED * 1.2),
    owner: t.id,
    bounces: 0,          // no bouncing
    life: 3.33,          // seconds (was 200 frames)
    kind: 'pierce',
    wallPierces: 1,
    piercedWallSet: new Set(),
  });
  stats[t.id].shots++;
  t.ammo--;
  if (t.ammo <= 0) { t.weapon = null; }
  t.cooldown = getCooldownFor(t);
  spawnMuzzleFlash(t);
  addShake(3);
  SFX.fire(t.x);
}

function fireLaser(t) {
  // Laser — instant beam scan from tank, hits first tank/wall along the line
  // Implemented as a short-lived visual "bullet" entity at the hit point
  const ta = t.turretAngle;
  const startX = t.x + Math.cos(ta) * (TANK_SIZE / 2 + 4);
  const startY = t.y + Math.sin(ta) * (TANK_SIZE / 2 + 4);
  const dx = Math.cos(ta);
  const dy = Math.sin(ta);
  const maxDist = 900;
  const step = 3;
  let endX = startX, endY = startY, hitTank = null;
  for (let d = 0; d < maxDist; d += step) {
    const x = startX + dx * d;
    const y = startY + dy * d;
    if (x < 0 || x > W || y < 0 || y > H) { endX = x; endY = y; break; }
    let wallHit = false;
    for (const w of walls) {
      if (pointInRect(x, y, w)) { endX = x; endY = y; wallHit = true; break; }
    }
    if (wallHit) break;
    // hit opponent tank?
    const half = TANK_SIZE / 2;
    for (const other of [tank1, tank2]) {
      if (other.id === t.id) continue;
      if (x > other.x - half && x < other.x + half && y > other.y - half && y < other.y + half) {
        hitTank = other;
        endX = x; endY = y;
        break;
      }
    }
    if (hitTank) break;
    endX = x; endY = y;
  }
  stats[t.id].shots++;
  if (hitTank) {
    stats[t.id].hits++;
    if (hitTank.powerup === 'shield') {
      hitTank.powerup = null; hitTank.powerupTime = 0;
      spawnShieldBreak(hitTank.x, hitTank.y);
      SFX.shieldBreak(hitTank.x);
      stats[hitTank.id].shieldsBlocked++;
    } else {
      hitTank.hp--;
      if (hitTank.id === 'p1') haptic(hitTank.hp <= 0 ? 90 : 30);
      hitTank.hitFlash = 0.2;   // seconds (was 12 frames)
      stats[hitTank.id].damageTaken++;
      spawnExplosion(endX, endY, hitTank.color);
      spawnHitVignette(hitTank.x, hitTank.y);
      if (hitTank.hp <= 0) {
        SFX.explosion(hitTank.x);
        addShake(14);
        slowmoTimer = 0.55;
        endRound(hitTank === tank1 ? 'p2' : 'p1');
      } else {
        SFX.hit(hitTank.x);
        addShake(6);
      }
    }
  }
  spawnFireText(t);
  // Create visual laser entity
  particles.push({
    laser: true,
    x1: startX, y1: startY, x2: endX, y2: endY,
    color: t.color,
    life: 0.3, maxLife: 0.3,  // seconds (was 18 frames)
    x: 0, y: 0, vx: 0, vy: 0, size: 0,
  });
  t.ammo--;
  if (t.ammo <= 0) { t.weapon = null; }
  t.cooldown = FIRE_COOLDOWN * 1.6;
  t.recoil = 1;
  addShake(4);
  SFX.laserZap(t.x);
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    if (b.life <= 0) { bullets.splice(i, 1); continue; }

    // Trail particle — spawn based on cumulative trail timer (time-based, not frame-based)
    b.trailTimer = (b.trailTimer || 0) + dt;
    const trailInterval = b.kind === 'pierce' ? 0.016    // every ~1 frame @ 60fps
                        : b.kind === 'shotgun' ? 0.05    // every 3 frames
                        : 0.033;                          // every 2 frames
    if (b.trailTimer >= trailInterval) {
      b.trailTimer = 0;
      if (b.kind === 'homing') {
        particles.push({
          x: b.x, y: b.y, vx: 0, vy: 0,
          life: 0.23, maxLife: 0.23, size: 3,
          color: b.owner === 'p1' ? '#86efac' : '#93c5fd',
        });
      } else if (b.kind === 'pierce') {
        particles.push({
          x: b.x, y: b.y, vx: 0, vy: 0,
          life: 0.17, maxLife: 0.17, size: 2,
          color: '#fbbf24',
        });
      } else if (b.kind === 'shotgun') {
        particles.push({
          x: b.x, y: b.y, vx: 0, vy: 0,
          life: 0.13, maxLife: 0.13, size: 1,
          color: '#fca5a5',
        });
      } else {
        particles.push({
          x: b.x, y: b.y, vx: 0, vy: 0,
          life: 0.17, maxLife: 0.17, size: 2,
          color: b.owner === 'p1' ? '#86efac' : '#93c5fd',
        });
      }
    }

    // Homing missile: adjust velocity toward opponent tank
    if (b.kind === 'homing') {
      const target = b.owner === 'p1' ? tank2 : tank1;
      const targetAngle = Math.atan2(target.y - b.y, target.x - b.x);
      const currentAngle = Math.atan2(b.vy, b.vx);
      let diff = targetAngle - currentAngle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      const maxTurn = b.turnRate * dt;
      const turn = Math.max(-maxTurn, Math.min(maxTurn, diff));
      const newAngle = currentAngle + turn;
      const speed = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(newAngle) * speed;
      b.vy = Math.sin(newAngle) * speed;
    }

    // Velocity integration with dt
    let nx = b.x + b.vx * dt, ny = b.y + b.vy * dt;
    const hitX = nx < BULLET_SIZE || nx > W - BULLET_SIZE;
    const hitY = ny < BULLET_SIZE || ny > H - BULLET_SIZE;
    if (hitX || hitY) {
      if (b.bounces > 0) {
        // Spark at impact point — pick the actual edge being hit
        const sx = hitX ? (nx < BULLET_SIZE ? 0 : W) : nx;
        const sy = hitY ? (ny < BULLET_SIZE ? 0 : H) : ny;
        spawnRicochetSparks(sx, sy, b.vx, b.vy);
        addShake(2);
        if (hitX) b.vx = -b.vx;
        if (hitY) b.vy = -b.vy;
        b.bounces--;
        nx = b.x + b.vx * dt;
        ny = b.y + b.vy * dt;
        SFX.bounce(b.x);
        stats[b.owner].bounces++;
      } else {
        bullets.splice(i, 1);
        continue;
      }
    }
    let removed = false;
    for (const w of walls) {
      if (pointInRect(nx, ny, w)) {
        // Pierce: punch through one wall
        if (b.kind === 'pierce' && b.wallPierces > 0 && !b.piercedWallSet.has(w)) {
          b.wallPierces--;
          b.piercedWallSet.add(w);
          // Step through the wall using a small fixed sub-dt so wall thickness is respected
          const subDt = 0.016;  // ~1 frame step
          const exitSteps = 20;
          let px = nx, py = ny;
          for (let s = 0; s < exitSteps; s++) {
            px += b.vx * subDt;
            py += b.vy * subDt;
            if (!pointInRect(px, py, w)) break;
          }
          nx = px; ny = py;
          // Particle puff at entry
          for (let p = 0; p < 6; p++) {
            const a = Math.random() * Math.PI * 2;
            const s = 60 + Math.random() * 120;   // px/s (was 1-3 px/frame × 60)
            particles.push({
              x: b.x, y: b.y,
              vx: Math.cos(a)*s, vy: Math.sin(a)*s,
              life: 0.33, maxLife: 0.33,  // seconds (was 20 frames)
              size: 2, color: '#fbbf24'
            });
          }
          break;
        }
        if (b.bounces > 0) {
          spawnRicochetSparks(b.x, b.y, b.vx, b.vy);
          addShake(2);
          const prevInX = b.x >= w.x && b.x <= w.x + w.w;
          const prevInY = b.y >= w.y && b.y <= w.y + w.h;
          if (!prevInX) b.vx = -b.vx;
          if (!prevInY) b.vy = -b.vy;
          b.bounces--;
          nx = b.x + b.vx * dt; ny = b.y + b.vy * dt;
          SFX.bounce(b.x);
          stats[b.owner].bounces++;
        } else { bullets.splice(i, 1); removed = true; }
        break;
      }
    }
    if (removed) continue;
    b.x = nx; b.y = ny;
    for (const t of [tank1, tank2]) {
      const half = TANK_SIZE / 2;
      if (b.x > t.x - half && b.x < t.x + half && b.y > t.y - half && b.y < t.y + half) {
        if (b.owner !== t.id) stats[b.owner].hits++;
        if (t.powerup === 'shield') {
          t.powerup = null; t.powerupTime = 0;
          spawnShieldBreak(t.x, t.y);
          SFX.shieldBreak(t.x);
          stats[t.id].shieldsBlocked++;
        } else {
          t.hp--;
          if (t.id === 'p1') haptic(t.hp <= 0 ? 90 : 30);
          t.hitFlash = 0.13;   // seconds (was 8 frames)
          stats[t.id].damageTaken++;
          spawnExplosion(b.x, b.y, t.color);
          spawnHitVignette(t.x, t.y);
          if (t.hp <= 0) {
            SFX.explosion(t.x);
            addShake(14);
            slowmoTimer = 0.55;
            endRound(t === tank1 ? 'p2' : 'p1');
          } else {
            SFX.hit(t.x);
            addShake(6);
          }
        }
        bullets.splice(i, 1);
        updateHUD();
        break;
      }
    }
  }
}

function spawnExplosion(x, y, color) {
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 180;   // px/s (was 1-4 px/frame × 60)
    const life = 0.5 + Math.random() * 0.33;   // seconds (was 30-50 frames)
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life, maxLife: life, size: 2+Math.random()*2, color });
  }
  // Bright additive flash core for "BOOM" feel
  for (let i = 0; i < 6; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 30 + Math.random() * 60;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.2, maxLife: 0.2, size: 5, color: '#fff7d0', glow: true });
  }
  // Shockwave ring
  particles.push({ x, y, vx: 0, vy: 0, life: 0.4, maxLife: 0.4, size: 6, grow: 46, color: '#ffe2b0', ring: true });
  // Scorch mark stays on ground
  paintScorch(x, y);
}

function spawnMuzzleFlash(t) {
  t.recoil = 1;   // barrel kick, decays in updateTank
  spawnFireText(t);
  const ta = t.turretAngle;
  const mx = t.x + Math.cos(ta)*(TANK_SIZE/2+4);
  const my = t.y + Math.sin(ta)*(TANK_SIZE/2+4);
  // Sparks
  for (let i = 0; i < 8; i++) {
    const a = ta + (Math.random()-0.5)*0.7;
    const s = 150 + Math.random() * 180;
    const life = 0.18 + Math.random() * 0.14;
    particles.push({ x: mx, y: my, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life, maxLife: life, size: 2, color: '#ffd966' });
  }
  // Bright additive blob at muzzle for big "POP"
  particles.push({ x: mx, y: my, vx: 0, vy: 0, life: 0.1, maxLife: 0.1, size: 9, color: '#fff7d0', glow: true });
  // Cone-shaped flame jet
  for (let i = 0; i < 4; i++) {
    const a = ta + (Math.random()-0.5)*0.35;
    const s = 220 + Math.random() * 80;
    particles.push({ x: mx, y: my, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.12, maxLife: 0.12, size: 4, color: '#ffb84a', glow: true });
  }
}

// --- BATTLE FEEL: screen shake, slow-mo, hit vignettes, ricochet sparks, scorch marks ---
let screenShake = { mag: 0, time: 0 };
let slowmoTimer = 0;
let hitVignettes = [];

function addShake(mag) {
  if (mag > screenShake.mag) screenShake.mag = mag;
  screenShake.time = Math.max(screenShake.time, 0.22);
}
function updateShake(dt) {
  if (screenShake.time > 0) {
    screenShake.time -= dt;
    if (screenShake.time <= 0) { screenShake.mag = 0; screenShake.time = 0; }
    else screenShake.mag *= Math.pow(0.001, dt);  // exponential decay
  }
}
function spawnHitVignette(x, y) {
  hitVignettes.push({ x, y, life: 0.45, maxLife: 0.45 });
}
function updateHitVignettes(dt) {
  for (let i = hitVignettes.length - 1; i >= 0; i--) {
    hitVignettes[i].life -= dt;
    if (hitVignettes[i].life <= 0) hitVignettes.splice(i, 1);
  }
}
function spawnRicochetSparks(x, y, vx, vy) {
  const back = Math.atan2(-vy, -vx);
  for (let i = 0; i < 7; i++) {
    const a = back + (Math.random()-0.5) * Math.PI * 0.9;
    const s = 100 + Math.random() * 200;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.22, maxLife: 0.22, size: 1.6, color: '#fde047', glow: true });
  }
}

// Offscreen canvas accumulates tread marks + scorch marks for the round.
const { c: battleCanvas, g: bctx } = makeLayer(W, H);
function clearBattleCanvas() { bctx.clearRect(0, 0, W, H); }

function paintTreadMarks(t) {
  bctx.save();
  bctx.translate(t.x, t.y);
  bctx.rotate(t.angle);
  bctx.fillStyle = 'rgba(0, 0, 0, 0.10)';
  const S = TANK_SIZE;
  // Two short dark streaks at tread offsets
  bctx.fillRect(-S/2, -S/2 - 1, 4, 2);
  bctx.fillRect(-S/2, S/2 - 1, 4, 2);
  bctx.restore();
}

function paintScorch(x, y) {
  const r = 22 + Math.random() * 8;
  const grad = bctx.createRadialGradient(x, y, 0, x, y, r);
  grad.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
  grad.addColorStop(0.6, 'rgba(20, 10, 5, 0.3)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  bctx.fillStyle = grad;
  bctx.beginPath();
  bctx.arc(x, y, r, 0, Math.PI * 2);
  bctx.fill();
}
function spawnPickupBurst(x, y, color) {
  for (let i = 0; i < 20; i++) {
    const a = (i / 20) * Math.PI * 2;
    const s = 120 + Math.random() * 120;   // px/s
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.42, maxLife: 0.42, size: 3, color });
  }
}
function spawnShieldBreak(x, y) {
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    particles.push({ x, y, vx: Math.cos(a)*240, vy: Math.sin(a)*240, life: 0.33, maxLife: 0.33, size: 3, color: '#22d3ee' });
  }
}
const MAX_PARTICLES = matchMedia('(pointer: coarse)').matches ? 450 : 900;
function updateParticles(dt) {
  if (particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);
  // Velocity-based drag: equivalent to multiplying by 0.94 per frame at 60fps
  // 0.94^60 ≈ 0.024, so decay factor per second is ~0.024; use Math.pow for frame-rate independence
  const drag = Math.pow(0.94, dt * 60);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= drag; p.vy *= drag;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function updateGhosts(dt) {
  for (let i = ghosts.length - 1; i >= 0; i--) {
    ghosts[i].life -= dt;
    if (ghosts[i].life <= 0) ghosts.splice(i, 1);
  }
}

// Render motion-trail silhouettes. Cheap rounded-rect chassis at the captured
// pose, alpha derived from remaining life.
function drawGhosts() {
  const S = TANK_SIZE;
  const half = S / 2;
  for (const g of ghosts) {
    const a = Math.max(0, g.life / g.maxLife);
    ctx.save();
    ctx.globalAlpha = a * 0.35;
    ctx.translate(g.x, g.y);
    ctx.rotate(g.angle);
    ctx.fillStyle = g.color;
    ctx.fillRect(-half + 1, -half + 2, S - 2, S - 4);
    ctx.fillStyle = g.dark;
    ctx.fillRect(-half + 1, -half + 2, S - 2, 2);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// --- Floating text (pickup announcement) ---
const FLOAT_LIFE = 1.25;   // seconds (was 75 frames)
function spawnFloatingText(tank, label, iconId, color) {
  floatingTexts.push({
    tank,
    label, iconId, color,
    offsetY: -TANK_SIZE/2 - 12,
    life: FLOAT_LIFE,
    maxLife: FLOAT_LIFE,
  });
}

// Tiny "fire" popup above tank on each shot (no icon, short life)
function spawnFireText(t) {
  floatingTexts.push({
    tank: t, label: L().fireText, iconId: null, color: '#ffe9a8', tiny: true,
    offsetY: -TANK_SIZE/2 - 6, life: 0.4, maxLife: 0.4,
  });
}

function updateFloatingTexts(dt) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const f = floatingTexts[i];
    f.offsetY -= 33 * dt;     // drift upward at 33 px/s (was 0.55 px/frame × 60)
    f.life -= dt;
    if (f.life <= 0) floatingTexts.splice(i, 1);
  }
}

function drawFloatingTexts() {
  for (const f of floatingTexts) {
    const t = f.progress = 1 - f.life / f.maxLife;
    // pop-in scale: grow fast from 0.6 → 1.1 → settle to 1
    let scale;
    if (t < 0.15) scale = 0.6 + (t / 0.15) * 0.5;         // 0.6 → 1.1
    else if (t < 0.25) scale = 1.1 - ((t - 0.15) / 0.1) * 0.1; // 1.1 → 1.0
    else scale = 1.0;
    // alpha: full for first 70%, fade last 30%
    const alpha = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;

    const x = f.tank.x;
    const y = f.tank.y + f.offsetY;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (f.tiny) {
      ctx.font = 'bold 9px ' + CANVAS_FONT;
      ctx.strokeStyle = 'rgba(20, 12, 8, 0.9)';
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round';
      ctx.strokeText(f.label, 0, 0);
      ctx.fillStyle = f.color;
      ctx.fillText(f.label, 0, 0);
      ctx.restore();
      continue;
    }

    ctx.font = 'bold 16px ' + CANVAS_FONT;
    // Measure label so we can lay icon+text symmetrically around origin
    const labelW = ctx.measureText(f.label).width;
    const iconSize = 18;
    const gap = 4;
    const totalW = iconSize + gap + labelW;
    const labelX = -totalW / 2 + iconSize + gap + labelW / 2;
    const iconX = -totalW / 2 + iconSize / 2;

    // Text with dark outline for readability
    ctx.strokeStyle = 'rgba(20, 12, 8, 0.95)';
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.strokeText(f.label, labelX, 0);
    ctx.fillStyle = f.color;
    ctx.fillText(f.label, labelX, 0);

    drawIcon(ctx, f.iconId, iconX, 0, iconSize);

    ctx.restore();
  }
}

// Raycast for aim line — stops at wall, enemy, or canvas edge
function castAimRay(t, other) {
  const step = 3;
  const maxDist = 500;
  const a = t.turretAngle;
  let x = t.x + Math.cos(a) * (TANK_SIZE/2 + 2);
  let y = t.y + Math.sin(a) * (TANK_SIZE/2 + 2);
  const dx = Math.cos(a) * step;
  const dy = Math.sin(a) * step;
  for (let d = 0; d < maxDist; d += step) {
    x += dx; y += dy;
    if (x < 0 || x > W || y < 0 || y > H) return { x, y, onTarget: false };
    for (const w of walls) if (pointInRect(x, y, w)) return { x, y, onTarget: false };
    const half = TANK_SIZE / 2;
    if (x > other.x - half && x < other.x + half && y > other.y - half && y < other.y + half) {
      return { x, y, onTarget: true };
    }
  }
  return { x, y, onTarget: false };
}

function drawTank(t) {
  // ground shadow (stays below tank, doesn't rotate with it — light from top)
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.beginPath();
  ctx.ellipse(t.x + 3, t.y + 5, TANK_SIZE/2 + 3, TANK_SIZE/3, 0, 0, Math.PI*2);
  ctx.fill();

  // team-color underglow keeps tanks readable on dark themes / small phone screens
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.18;
  ctx.drawImage(glowSprite(t.color), t.x - 34, t.y - 34, 68, 68);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // shield bubble (above shadow, below tank)
  if (t.powerup === 'shield') {
    const pulse = 1 + Math.sin(Date.now() / 150) * 0.08;
    ctx.strokeStyle = 'rgba(34, 211, 238, 0.4)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(t.x, t.y, (TANK_SIZE/2 + 6) * pulse, 0, Math.PI*2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(34, 211, 238, 0.9)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  if (t.powerup === 'speed') {
    ctx.fillStyle = 'rgba(234, 179, 8, 0.2)';
    ctx.beginPath();
    ctx.arc(t.x, t.y, TANK_SIZE/2 + 5, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.rotate(t.angle);

  const S = TANK_SIZE;
  const half = S / 2;
  const flash = t.hitFlash > 0;
  const bodyColor = flash ? '#fff' : t.color;
  const lightColor = flash ? '#fff' : t.light;
  const darkColor = flash ? '#ddd' : t.dark;
  const strokeColor = flash ? '#888' : t.stroke;

  // --- Treads (caterpillar tracks) ---
  // Tank-relative: "forward" is +x direction. Treads run along +x on top and bottom (left/right of barrel axis).
  const treadW = S + 2;
  const treadH = 6;
  // top tread (one side)
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-half - 1, -half - 2, treadW, treadH);
  // bottom tread
  ctx.fillRect(-half - 1, half - 4, treadW, treadH);

  // tread links (little ridges)
  ctx.fillStyle = '#3a3a3a';
  const linkCount = 7;
  const linkSpacing = treadW / linkCount;
  for (let i = 0; i < linkCount; i++) {
    const lx = -half - 1 + i * linkSpacing + 1;
    ctx.fillRect(lx, -half - 2, linkSpacing - 2, 1);
    ctx.fillRect(lx, -half - 2 + treadH - 1, linkSpacing - 2, 1);
    ctx.fillRect(lx, half - 4, linkSpacing - 2, 1);
    ctx.fillRect(lx, half - 4 + treadH - 1, linkSpacing - 2, 1);
  }
  // tread highlight
  ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
  ctx.fillRect(-half - 1, -half - 2, treadW, 1);
  ctx.fillRect(-half - 1, half - 4, treadW, 1);

  // --- Body (between treads) ---
  const bodyTop = -half + 2;
  const bodyBot = half - 2;
  const bodyH = bodyBot - bodyTop;

  // body base (darker)
  ctx.fillStyle = darkColor;
  ctx.fillRect(-half + 1, bodyTop, S - 2, bodyH);
  // body top half lit (lighter) — "sun" is from the tank's forward-left (up-left in screen)
  // but since tank rotates, we use the tank-relative "top" edge (negative y in local space)
  ctx.fillStyle = bodyColor;
  ctx.fillRect(-half + 1, bodyTop, S - 2, bodyH / 2);
  // top edge highlight strip
  ctx.fillStyle = lightColor;
  ctx.fillRect(-half + 1, bodyTop, S - 2, 2);
  // bottom edge shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.fillRect(-half + 1, bodyBot - 2, S - 2, 2);

  // body outline
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(-half + 1, bodyTop, S - 2, bodyH);

  // front plate detail (small rectangle at front)
  ctx.fillStyle = darkColor;
  ctx.fillRect(half - 4, bodyTop + 2, 3, bodyH - 4);
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(half - 4, bodyTop + 2, 3, bodyH - 4);

  // --- Turret + Barrel (rotates independently of chassis for auto-aim) ---
  // Apply the turret's extra rotation relative to the chassis we're already
  // rotated into. This lets the cannon swivel toward the enemy while the
  // tank body still faces movement direction.
  ctx.rotate(t.turretAngle - t.angle);
  const turretR = S / 3;
  // turret shadow (offset slightly back to suggest height)
  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.beginPath();
  ctx.arc(1, 1, turretR + 0.5, 0, Math.PI*2);
  ctx.fill();
  // turret base (darker ring)
  ctx.fillStyle = strokeColor;
  ctx.beginPath();
  ctx.arc(0, 0, turretR, 0, Math.PI*2);
  ctx.fill();
  // turret top (lighter)
  ctx.fillStyle = darkColor;
  ctx.beginPath();
  ctx.arc(0, 0, turretR - 1.5, 0, Math.PI*2);
  ctx.fill();
  // turret highlight (upper-left crescent — in tank-local, forward is +x so highlight at -y side)
  ctx.fillStyle = lightColor;
  ctx.beginPath();
  ctx.arc(-1, -1.5, turretR - 3, Math.PI, 0, false);
  ctx.fill();

  // rivets on turret (3 small dots around the rim)
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  const rivetPositions = [
    [Math.cos(Math.PI * 0.75), Math.sin(Math.PI * 0.75)],
    [Math.cos(Math.PI * 1.25), Math.sin(Math.PI * 1.25)],
    [Math.cos(Math.PI * 1.75), Math.sin(Math.PI * 1.75)],
    [Math.cos(Math.PI * 0.25), Math.sin(Math.PI * 0.25)],
  ];
  for (const [rx, ry] of rivetPositions) {
    ctx.beginPath();
    ctx.arc(rx * (turretR - 2.5), ry * (turretR - 2.5), 1, 0, Math.PI*2);
    ctx.fill();
  }

  // --- Barrel (slides back on recoil) ---
  if (t.recoil) ctx.translate(-t.recoil * t.recoil * 4, 0);
  const barrelLen = S/2 + 7;
  const barrelBaseW = 7;  // chunkier at turret
  const barrelTipW = 5;
  // barrel shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
  ctx.fillRect(2, -barrelBaseW/2 + 1, barrelLen, barrelBaseW);
  // barrel main
  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath();
  ctx.moveTo(2, -barrelBaseW/2);
  ctx.lineTo(barrelLen - 3, -barrelTipW/2);
  ctx.lineTo(barrelLen - 3, barrelTipW/2);
  ctx.lineTo(2, barrelBaseW/2);
  ctx.closePath();
  ctx.fill();
  // barrel top highlight
  ctx.fillStyle = '#4a4a4a';
  ctx.beginPath();
  ctx.moveTo(2, -barrelBaseW/2);
  ctx.lineTo(barrelLen - 3, -barrelTipW/2);
  ctx.lineTo(barrelLen - 3, -barrelTipW/2 + 1);
  ctx.lineTo(2, -barrelBaseW/2 + 1);
  ctx.closePath();
  ctx.fill();
  // muzzle band (ring at the tip)
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(barrelLen - 5, -barrelBaseW/2 - 0.5, 3, barrelBaseW + 1);
  // muzzle opening (dark dot at the very tip)
  ctx.fillStyle = '#000';
  ctx.fillRect(barrelLen - 2, -barrelTipW/2 + 1, 2, barrelTipW - 2);

  ctx.restore();
}

// HP pips above the tank — segmented bar showing current/max HP
function drawTankHP(t) {
  if (t.hp <= 0) return;
  const pipW = 6;       // width of each pip
  const pipH = 4;       // height
  const gap = 1;        // gap between pips
  const totalW = MAX_HP * pipW + (MAX_HP - 1) * gap;
  const startX = t.x - totalW / 2;
  const y = t.y - TANK_SIZE / 2 - 11;

  // background row (empty pips)
  for (let i = 0; i < MAX_HP; i++) {
    const px = startX + i * (pipW + gap);
    // dark outline
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(px - 1, y - 1, pipW + 2, pipH + 2);
    // empty slot
    ctx.fillStyle = 'rgba(40, 40, 40, 0.85)';
    ctx.fillRect(px, y, pipW, pipH);
  }
  // AI personality tag above the pips
  if (t.ai && t.persona) {
    const label = L().persona[t.persona];
    ctx.save();
    ctx.font = `bold 10px ${CANVAS_FONT}`;
    const tw = ctx.measureText(label).width, bx = t.x - (tw + 16) / 2, by = y - 16;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(bx, by, tw + 16, 13);
    drawIcon(ctx, AI_PERSONAS[t.persona].icon, bx + 7, by + 6.5, 10);
    ctx.fillStyle = t.light; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(label, bx + 13, by + 7);
    ctx.restore();
  }
  // filled pips (current HP)
  const filledColor = t.hp <= 2 ? '#ef4444' : t.color;
  const highlightColor = t.hp <= 2 ? '#fca5a5' : t.light;
  for (let i = 0; i < t.hp; i++) {
    const px = startX + i * (pipW + gap);
    ctx.fillStyle = filledColor;
    ctx.fillRect(px, y, pipW, pipH);
    // 1px top highlight for pop
    ctx.fillStyle = highlightColor;
    ctx.fillRect(px, y, pipW, 1);
  }
}

function drawAimLine(t, other) {
  const hit = castAimRay(t, other);
  const startX = t.x + Math.cos(t.turretAngle) * (TANK_SIZE/2 + 2);
  const startY = t.y + Math.sin(t.turretAngle) * (TANK_SIZE/2 + 2);

  ctx.save();
  ctx.setLineDash([3, 7]);
  ctx.lineDashOffset = -Date.now() / 50;
  if (hit.onTarget) {
    ctx.strokeStyle = '#ef4444';
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = 2;
  } else {
    ctx.strokeStyle = t.color;
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 1.5;
  }
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.lineTo(hit.x, hit.y);
  ctx.stroke();
  if (hit.onTarget) {
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(hit.x, hit.y, 5, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawPowerups() {
  for (const p of powerups) {
    if (!p.type) continue;  // defensive: skip malformed pickups
    const t = p.spawnTime, c = p.type.color;
    const weapon = p.type.category === 'weapon';
    const bob = Math.sin(t * 3 + p.x * 0.05) * 3;          // -3..3, up = negative
    const k = Math.min(1, t * 3) - 1;                       // pop-in with overshoot (easeOutBack)
    const scale = 1 + 2.7 * k * k * k + 1.7 * k * k;
    // Gradients are built in local coords, so one per type is reusable every frame.
    const g = p.type._grad || (p.type._grad = {
      glow: (() => { const r = ctx.createRadialGradient(0, 0, 4, 0, 0, 30);
        r.addColorStop(0, c + '66'); r.addColorStop(1, c + '00'); return r; })(),
      body: (() => { const r = ctx.createRadialGradient(-4, -5, 1, 0, 0, 15);
        r.addColorStop(0, '#3b4a66'); r.addColorStop(0.6, '#161d2e'); r.addColorStop(1, '#070a12'); return r; })(),
    });

    // --- ground layer (doesn't bob) ---
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(scale, scale);
    ctx.fillStyle = g.glow;
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';                     // contact shadow shrinks as capsule rises
    ctx.beginPath(); ctx.ellipse(0, 15, 12 + bob * 0.8, 4 + bob * 0.25, 0, 0, Math.PI * 2); ctx.fill();
    const ph = (t * 0.8) % 1;                               // expanding beacon ring
    ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.globalAlpha = (1 - ph) * 0.6;
    ctx.beginPath(); ctx.arc(0, 0, 16 + ph * 16, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();

    // --- capsule (bobs) ---
    ctx.save();
    ctx.translate(p.x, p.y + bob - 2);
    ctx.scale(scale, scale);
    // Rotating frame: circle arcs for buffs, hexagon for weapons
    ctx.save();
    ctx.rotate(weapon ? -t * 1.2 : t * 1.5);
    ctx.strokeStyle = c; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath();
    if (weapon) {
      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.lineTo(Math.cos(a) * 20, Math.sin(a) * 20); }
      ctx.closePath();
    } else {
      for (let i = 0; i < 3; i++) { const a = i * Math.PI * 2 / 3; ctx.moveTo(Math.cos(a) * 19, Math.sin(a) * 19); ctx.arc(0, 0, 19, a, a + 1.4); }
    }
    ctx.stroke();
    ctx.restore();
    // Dark glass orb so the colored icon reads clearly
    ctx.fillStyle = g.body;
    ctx.beginPath(); ctx.arc(0, 0, 14.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = c; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.stroke();
    drawIcon(ctx, p.type.id, 0, 0, 23 + Math.sin(t * 5) * 1);
    // Specular highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.ellipse(-5, -8, 6, 2.4, -0.5, 0, Math.PI * 2); ctx.fill();
    // Weapon ammo pips under the orb
    if (weapon) {
      ctx.fillStyle = '#fff';
      for (let i = 0; i < p.type.ammo; i++) {
        ctx.beginPath(); ctx.arc((i - (p.type.ammo - 1) / 2) * 5, 19, 1.6, 0, Math.PI * 2); ctx.fill();
      }
    }
    // Tiny name label under the capsule
    const label = (L().powerup[p.type.id] || p.type.id).replace(/[!！]$/, '');
    ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineJoin = 'round';
    ctx.strokeText(label, 0, 29);
    ctx.fillStyle = c; ctx.fillText(label, 0, 29);
    ctx.restore();
  }
}
