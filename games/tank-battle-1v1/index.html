// Deterministic noise — same world position always returns same value.
function hashNoise(x, y) {
  return Math.abs(Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1;
}

// Brick / block masonry pattern. cellW/cellH tune block size.
function paintBrick(g, w, T, cellW, cellH) {
  const rows = Math.ceil(w.h / cellH) + 1;
  const cols = Math.ceil(w.w / cellW) + 2;
  const [br, bg, bb] = T.brickRGB;
  for (let r = 0; r < rows; r++) {
    const y = r * cellH;
    const offset = (r % 2) * (cellW / 2);
    for (let c2 = -1; c2 < cols; c2++) {
      const x = c2 * cellW - offset;
      const seed = hashNoise(x + w.x, y + w.y);
      const v = Math.floor(seed * 18) - 9;
      g.fillStyle = `rgb(${br + v}, ${bg + v}, ${bb + v})`;
      g.fillRect(x, y, cellW - 1, cellH - 1);
    }
  }
  g.fillStyle = T.mortar;
  for (let r = 0; r < rows; r++) {
    const y = r * cellH;
    g.fillRect(0, y + cellH - 1, w.w, 1);
    const offset = (r % 2) * (cellW / 2);
    for (let c2 = -1; c2 < cols; c2++) {
      const x = c2 * cellW - offset;
      g.fillRect(x + cellW - 1, y, 1, cellH);
    }
  }
}

// Vertical wood plank pattern with grain streaks + knots.
function paintPlank(g, w, T) {
  const PLANK_W = 14;
  const [br, bg, bb] = T.brickRGB;
  const cols = Math.ceil(w.w / PLANK_W);
  for (let c2 = 0; c2 < cols; c2++) {
    const x = c2 * PLANK_W;
    const seed = hashNoise(x + w.x, w.y);
    const v = Math.floor(seed * 22) - 11;
    g.fillStyle = `rgb(${br + v}, ${bg + v}, ${bb + v})`;
    g.fillRect(x, 0, PLANK_W - 1, w.h);
    // plank gap
    g.fillStyle = T.mortar;
    g.fillRect(x + PLANK_W - 1, 0, 1, w.h);
    // grain streaks
    g.fillStyle = T.shadow;
    for (let s = 0; s < 3; s++) {
      const sy = Math.floor(hashNoise(x + s, w.y + s * 13) * w.h);
      g.fillRect(x + 1, sy, PLANK_W - 3, 1);
    }
    // occasional knot
    if (seed > 0.78) {
      const ky = Math.floor(hashNoise(x, w.y + 7) * (w.h - 4)) + 2;
      g.fillStyle = `rgba(30, 15, 5, 0.5)`;
      g.beginPath();
      g.arc(x + PLANK_W / 2, ky, 2, 0, Math.PI * 2);
      g.fill();
    }
  }
}

// Riveted metal plate pattern. Large square panels with rivet dots at corners.
function paintPlate(g, w, T) {
  const PLATE = 32;
  const [br, bg, bb] = T.brickRGB;
  // base diagonal sheen
  const grad = g.createLinearGradient(0, 0, w.w, w.h);
  grad.addColorStop(0, T.highlight);
  grad.addColorStop(0.4, 'rgba(0,0,0,0)');
  grad.addColorStop(1, T.shadow);
  for (let py = 0; py < w.h; py += PLATE) {
    for (let px = 0; px < w.w; px += PLATE) {
      const seed = hashNoise(px + w.x, py + w.y);
      const v = Math.floor(seed * 14) - 7;
      g.fillStyle = `rgb(${br + v}, ${bg + v}, ${bb + v})`;
      g.fillRect(px, py, PLATE - 1, PLATE - 1);
    }
  }
  // plate seams
  g.fillStyle = T.mortar;
  for (let py = PLATE - 1; py < w.h; py += PLATE) g.fillRect(0, py, w.w, 1);
  for (let px = PLATE - 1; px < w.w; px += PLATE) g.fillRect(px, 0, 1, w.h);
  // rivets
  for (let py = 4; py < w.h - 2; py += PLATE) {
    for (let px = 4; px < w.w - 2; px += PLATE) {
      g.fillStyle = T.shadow;
      g.beginPath(); g.arc(px + 1, py + 1, 1.5, 0, Math.PI*2); g.fill();
      g.fillStyle = T.highlight;
      g.beginPath(); g.arc(px, py, 1.2, 0, Math.PI*2); g.fill();
    }
  }
  // overlay sheen
  g.fillStyle = grad;
  g.fillRect(0, 0, w.w, w.h);
}

// Smooth ice with branching cracks + frost speckle.
function paintIce(g, w, T) {
  // soft gradient base
  const grad = g.createLinearGradient(0, 0, 0, w.h);
  grad.addColorStop(0, '#9cc4dc');
  grad.addColorStop(0.5, T.baseFill);
  grad.addColorStop(1, '#3d5870');
  g.fillStyle = grad;
  g.fillRect(0, 0, w.w, w.h);
  // crack lines — deterministic per wall
  g.strokeStyle = 'rgba(220, 240, 255, 0.55)';
  g.lineWidth = 1;
  const crackCount = Math.max(2, Math.floor((w.w * w.h) / 600));
  for (let i = 0; i < crackCount; i++) {
    const sx = hashNoise(w.x + i, w.y) * w.w;
    const sy = hashNoise(w.x, w.y + i * 7) * w.h;
    g.beginPath();
    g.moveTo(sx, sy);
    let cx = sx, cy = sy;
    const segs = 3 + Math.floor(hashNoise(i, i+1) * 3);
    for (let s = 0; s < segs; s++) {
      cx += (hashNoise(i, s) - 0.5) * 18;
      cy += (hashNoise(i + 1, s) - 0.5) * 18;
      g.lineTo(cx, cy);
    }
    g.stroke();
  }
  // frost specks
  g.fillStyle = 'rgba(255, 255, 255, 0.4)';
  for (let i = 0; i < w.w * w.h / 40; i++) {
    const sx = hashNoise(i, w.x) * w.w;
    const sy = hashNoise(w.y, i) * w.h;
    g.fillRect(sx, sy, 1, 1);
  }
}

// Polished obsidian — glossy black with subtle purple gleam streaks.
function paintGloss(g, w, T) {
  // dark base gradient (top-lit)
  const grad = g.createLinearGradient(0, 0, 0, w.h);
  grad.addColorStop(0, '#3a2e3a');
  grad.addColorStop(0.4, T.baseFill);
  grad.addColorStop(1, '#0e080e');
  g.fillStyle = grad;
  g.fillRect(0, 0, w.w, w.h);
  // diagonal reflective streaks
  g.fillStyle = T.highlight;
  for (let i = 0; i < 3; i++) {
    const y = (w.h / 4) * (i + 0.5);
    g.save();
    g.translate(0, y);
    g.rotate(-0.3);
    g.fillRect(-w.w, 0, w.w * 3, 1);
    g.restore();
  }
  // micro-facets
  for (let i = 0; i < w.w * w.h / 60; i++) {
    const sx = hashNoise(i, w.x) * w.w;
    const sy = hashNoise(w.y, i) * w.h;
    const a = hashNoise(i + 1, sy) * 0.15;
    g.fillStyle = `rgba(180, 140, 200, ${a})`;
    g.fillRect(sx, sy, 1, 1);
  }
}

// Moss splatter overlay (for mossy theme)
function paintMossOverlay(g, w) {
  for (let i = 0; i < w.w * w.h / 25; i++) {
    const sx = hashNoise(i, w.x + 3) * w.w;
    const sy = hashNoise(w.y + 5, i) * w.h;
    const seed = hashNoise(sx, sy);
    if (seed > 0.6) {
      g.fillStyle = `rgba(${110 + seed * 40 | 0}, ${160 + seed * 30 | 0}, 80, ${0.15 + seed * 0.2})`;
      g.fillRect(sx, sy, 2, 2);
    }
  }
}

// Neon panel — dark glass with a faint inner grid; the glowing rim comes
// from the theme's highlight/shadow/border in bakeWall's edge pass.
function paintNeon(g, w, T) {
  g.strokeStyle = T.mortar;
  g.lineWidth = 1;
  g.beginPath();
  for (let x = 8; x < w.w; x += 8) { g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, w.h); }
  for (let y = 8; y < w.h; y += 8) { g.moveTo(0, y + 0.5); g.lineTo(w.w, y + 0.5); }
  g.stroke();
  g.strokeStyle = T.accent;
  g.globalAlpha = 0.35;
  g.strokeRect(3.5, 3.5, w.w - 7, w.h - 7);
  g.globalAlpha = 1;
}

// Glowing cracks (lava / obsidian): wide soft stroke + bright core.
function paintVeins(g, w, [glow, core]) {
  const n = Math.max(1, Math.floor((w.w + w.h) / 40));
  for (const [color, width] of [[glow, 4], [core, 1]]) {
    g.strokeStyle = color; g.lineWidth = width; g.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      let x = hashNoise(w.x + i * 3, w.y) * w.w, y = hashNoise(w.x, w.y + i * 5) * w.h;
      g.beginPath(); g.moveTo(x, y);
      for (let s = 0; s < 4; s++) {
        x += (hashNoise(i + w.x, s) - 0.5) * 22; y += (hashNoise(s, i + w.y) - 0.5) * 22;
        g.lineTo(x, y);
      }
      g.stroke();
    }
  }
}

// Toxic slime dripping from the top edge.
function paintSlime(g, w) {
  g.fillStyle = 'rgba(140, 255, 60, 0.75)';
  g.fillRect(0, 0, w.w, 3);
  for (let x = 2; x < w.w - 3; x += 6) {
    const len = hashNoise(x + w.x, w.y) * Math.min(14, w.h - 4);
    if (len < 4) continue;
    g.fillRect(x, 0, 3, len);
    g.beginPath(); g.arc(x + 1.5, len, 2.2, 0, Math.PI * 2); g.fill();
  }
}

// Snow piled on top of the wall with a lumpy lower edge.
function paintSnowCap(g, w) {
  const cap = Math.min(w.h * 0.45, 12);
  g.fillStyle = '#f4f8fc';
  g.beginPath(); g.moveTo(0, 0);
  for (let x = 0; x <= w.w; x += 5) g.lineTo(x, cap + (hashNoise(x + w.x, w.y) - 0.5) * 5);
  g.lineTo(w.w, 0); g.closePath(); g.fill();
  g.fillStyle = 'rgba(160, 190, 220, 0.5)';
  g.fillRect(0, cap - 1, w.w, 1);
}

// Coral clumps — overlapping rounded lobes dotted with polyps.
function paintCoral(g, w, T) {
  const [r, gg, b] = T.brickRGB;
  const n = Math.max(3, Math.floor(w.w * w.h / 90));
  for (let i = 0; i < n; i++) {
    const x = hashNoise(i, w.x) * w.w, y = hashNoise(w.y, i) * w.h;
    const rad = 3 + hashNoise(i + 3, w.y) * 6, v = hashNoise(x, y);
    const hue = [[r, gg, b], [240, 150, 80], [180, 90, 200]][Math.floor(v * 3)];
    g.fillStyle = `rgb(${hue[0] - 20 + v * 40 | 0},${hue[1]},${hue[2]})`;
    g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.3)';
    g.beginPath(); g.arc(x - rad * 0.3, y - rad * 0.3, rad * 0.35, 0, Math.PI * 2); g.fill();
  }
  g.fillStyle = 'rgba(60,10,30,0.45)';
  for (let i = 0; i < w.w * w.h / 18; i++) g.fillRect(hashNoise(i, w.x + 1) * w.w, hashNoise(w.y + 1, i) * w.h, 1, 1);
}

// Vermilion lacquer beams — torii-style with a black cap and gold studs.
function paintLacquer(g, w, T) {
  const grad = g.createLinearGradient(0, 0, 0, w.h);
  grad.addColorStop(0, '#e0453a'); grad.addColorStop(0.5, T.baseFill); grad.addColorStop(1, '#7a1510');
  g.fillStyle = grad; g.fillRect(0, 0, w.w, w.h);
  g.fillStyle = 'rgba(255,255,255,0.12)';
  if (w.w >= w.h) g.fillRect(0, w.h * 0.3, w.w, 1); else g.fillRect(w.w * 0.3, 0, 1, w.h);
  g.fillStyle = '#1a1210';
  g.fillRect(0, 0, w.w, Math.min(5, w.h * 0.3));
  g.fillStyle = '#e8c060';
  const step = 18;
  if (w.w >= w.h) for (let x = step / 2; x < w.w; x += step) g.fillRect(x - 1, w.h / 2, 2, 2);
  else for (let y = step / 2; y < w.h; y += step) g.fillRect(w.w / 2 - 1, y, 2, 2);
}

// Gold thermal foil panel on space-station modules.
function paintFoil(g, w) {
  const fw = Math.min(w.w, w.h) > 30 ? 0.4 : 0.3;
  const x = w.w * (0.5 - fw / 2), y = w.h * (0.5 - fw / 2), ww = w.w * fw, hh = w.h * fw;
  const grad = g.createLinearGradient(x, y, x + ww, y + hh);
  grad.addColorStop(0, '#f5d27a'); grad.addColorStop(0.5, '#b8862e'); grad.addColorStop(1, '#f0c860');
  g.fillStyle = grad; g.fillRect(x, y, ww, hh);
  g.strokeStyle = 'rgba(90,60,10,0.5)'; g.lineWidth = 0.6;
  for (let i = 0; i < 4; i++) {
    g.beginPath(); g.moveTo(x + hashNoise(i, w.x) * ww, y); g.lineTo(x + hashNoise(w.y, i) * ww, y + hh); g.stroke();
  }
}

function bakeWall(w, themeName = 'brick') {
  const T = THEMES[themeName] || THEMES.brick;
  const { c, g } = makeLayer(w.w, w.h);

  g.fillStyle = T.baseFill;
  g.fillRect(0, 0, w.w, w.h);

  switch (T.pattern) {
    case 'plank': paintPlank(g, w, T); break;
    case 'plate': paintPlate(g, w, T); break;
    case 'ice':   paintIce(g, w, T); break;
    case 'gloss': paintGloss(g, w, T); break;
    case 'neon':  paintNeon(g, w, T); break;
    case 'coral': paintCoral(g, w, T); break;
    case 'lacquer': paintLacquer(g, w, T); break;
    case 'block': paintBrick(g, w, T, 28, 14); break;
    case 'brick':
    default:      paintBrick(g, w, T, 20, 10); break;
  }
  if (T.moss) paintMossOverlay(g, w);
  if (T.veins) paintVeins(g, w, T.veins);
  if (T.slime) paintSlime(g, w);
  if (T.snowCap) paintSnowCap(g, w);
  if (T.foil) paintFoil(g, w);

  // edge lighting — top + left highlight, bottom + right shadow
  g.fillStyle = T.highlight;
  g.fillRect(0, 0, w.w, 2);
  g.fillRect(0, 0, 2, w.h);
  g.fillStyle = T.shadow;
  g.fillRect(0, w.h - 2, w.w, 2);
  g.fillRect(w.w - 2, 0, 2, w.h);
  // outer definition border
  g.strokeStyle = T.border;
  g.lineWidth = 1;
  g.strokeRect(0.5, 0.5, w.w - 1, w.h - 1);

  return c;
}

let wallCanvases = walls.map(w => bakeWall(w, 'brick'));
let arenaBg = THEMES.brick.canvasBg;

// Load a map by config object — updates walls, spawn positions, theme, and re-bakes textures
function loadMap(map) {
  currentMap = map;
  // Walls + spawns are authored in 800×500 space — scale to live canvas size.
  const s = MAP_SCALE;
  walls = map.walls.map(w => ({ x: w.x * s, y: w.y * s, w: w.w * s, h: w.h * s }));
  currentMap = {
    ...map,
    spawn1: { ...map.spawn1, x: map.spawn1.x * s, y: map.spawn1.y * s },
    spawn2: { ...map.spawn2, x: map.spawn2.x * s, y: map.spawn2.y * s },
  };
  const themeName = map.theme || 'brick';
  buildNavGrid();
  wallCanvases = walls.map(w => bakeWall(w, themeName));
  bakeGround(themeName);
  paintDecorations(themeName, walls, currentMap.spawn1, currentMap.spawn2);
  clearBattleCanvas();   // wipe tread + scorch marks for new round
  const T = THEMES[themeName] || THEMES.brick;
  initAmbient(T.ambient);
  arenaBg = T.canvasBg;
  canvas.style.background = T.canvasBg;
  canvas.style.setProperty('--accent', T.accent);
  bakeWallShadows(walls);
  // Start/switch BGM to match the new theme
  if (!audioMuted) startBGM(themeName);
}

// Pick next map from the remaining pool. Refills pool when exhausted (match end or every map used).
function pickNextMap() {
  if (mapPool.length === 0) {
    mapPool = MAPS.map(m => m.id);
  }
  const idx = Math.floor(Math.random() * mapPool.length);
  const chosenId = mapPool.splice(idx, 1)[0];
  return MAPS.find(m => m.id === chosenId);
}

// Soft wall drop shadows baked into the ground layer once per map —
// shadowBlur every frame was the single most expensive draw on mobile.
function bakeWallShadows(ws) {
  const g = groundCtx;
  g.save();
  g.shadowColor = 'rgba(0, 0, 0, 0.6)';
  g.shadowBlur = 10 * RENDER_SCALE;   // shadow params are in device px
  g.shadowOffsetX = 4 * RENDER_SCALE;
  g.shadowOffsetY = 6 * RENDER_SCALE;
  g.fillStyle = 'rgba(0, 0, 0, 0.55)';
  for (const w of ws) g.fillRect(w.x, w.y, w.w, w.h);
  g.restore();
}

function drawWalls() {
  for (let i = 0; i < walls.length; i++) {
    ctx.drawImage(wallCanvases[i], walls[i].x, walls[i].y, walls[i].w, walls[i].h);
  }
}

function drawBullets() {
  for (const b of bullets) {
    if (b.kind === 'homing') {
      // Missile with triangular body
      const ang = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.fillStyle = b.owner === 'p1' ? '#bbf7d0' : '#bfdbfe';
      ctx.beginPath();
      ctx.moveTo(6, 0);
      ctx.lineTo(-4, -3);
      ctx.lineTo(-4, 3);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = b.owner === 'p1' ? '#166534' : '#1e40af';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    } else if (b.kind === 'pierce') {
      // Elongated bright bullet with trail hint
      const ang = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.fillStyle = 'rgba(251, 191, 36, 0.4)';
      ctx.fillRect(-10, -3, 16, 6);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(-6, -2, 10, 4);
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(-2, -1, 6, 2);
      ctx.restore();
    } else if (b.kind === 'shotgun') {
      // Small red-orange pellet
      ctx.fillStyle = 'rgba(220, 38, 38, 0.3)';
      ctx.beginPath(); ctx.arc(b.x, b.y, BULLET_SIZE * 1.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fca5a5';
      ctx.beginPath(); ctx.arc(b.x, b.y, BULLET_SIZE * 0.8, 0, Math.PI*2); ctx.fill();
    } else {
      // Default round bullet — additive glow halo + hot core
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.75;
      ctx.drawImage(glowSprite(b.owner === 'p1' ? '#4ade80' : '#60a5fa'), b.x - 12, b.y - 12, 24, 24);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = b.owner === 'p1' ? '#bbf7d0' : '#bfdbfe';
      ctx.beginPath(); ctx.arc(b.x, b.y, BULLET_SIZE, 0, Math.PI*2); ctx.fill();
    }
  }
}

// Radial glow sprites, one per color, reused by every glow particle.
const glowSprites = new Map();
function glowSprite(color) {
  let c = glowSprites.get(color);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, color);
  grad.addColorStop(0.35, color + 'aa');
  grad.addColorStop(1, color + '00');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  glowSprites.set(color, c);
  return c;
}

function drawParticles() {
  for (const p of particles) {
    if (p.laser) {
      // Laser beam: bright core + glow
      const alpha = p.life / p.maxLife;
      ctx.save();
      ctx.globalAlpha = alpha * 0.4;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 10;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x1, p.y1); ctx.lineTo(p.x2, p.y2); ctx.stroke();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(p.x1, p.y1); ctx.lineTo(p.x2, p.y2); ctx.stroke();
      ctx.restore();
      continue;
    }
    const a = Math.max(0, p.life / (p.maxLife || 1));
    if (p.glow) {
      // Additive soft blob — cached sprite instead of a new gradient per particle per frame
      const r = p.size * 2.2;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a;
      ctx.drawImage(glowSprite(p.color), p.x - r, p.y - r, r * 2, r * 2);
      ctx.globalCompositeOperation = 'source-over';
      continue;
    }
    if (p.ring) {
      // Expanding shockwave ring
      const k = 1 - a;
      ctx.globalAlpha = a * 0.7;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 1 + a * 4;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size + k * p.grow, 0, Math.PI * 2); ctx.stroke();
      continue;
    }
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawHitVignettes() {
  for (const v of hitVignettes) {
    const a = v.life / v.maxLife;
    const grad = ctx.createRadialGradient(v.x, v.y, 30, v.x, v.y, 260);
    grad.addColorStop(0, `rgba(239, 68, 68, 0)`);
    grad.addColorStop(0.55, `rgba(239, 68, 68, ${a * 0.35})`);
    grad.addColorStop(1, `rgba(120, 10, 10, ${a * 0.55})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
}

// pre-render ground texture once to an offscreen canvas (perf)
const { c: groundCanvas, g: groundCtx } = makeLayer(W, H);

// --- Ground painters: one terrain per theme (deterministic via rnd) ---
function blobs(g, rnd, n, rMin, rMax, colors) {
  for (let i = 0; i < n; i++) {
    const x = rnd() * W, y = rnd() * H, r = rMin + rnd() * (rMax - rMin);
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, colors[i % colors.length]);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}
function specks(g, rnd, n, color, size = 1.5) {
  g.fillStyle = color;
  for (let i = 0; i < n; i++) g.fillRect(rnd() * W, rnd() * H, size, size);
}
function crackLines(g, rnd, n, segs, len, color, width) {
  g.strokeStyle = color; g.lineWidth = width; g.lineCap = 'round'; g.lineJoin = 'round';
  for (let i = 0; i < n; i++) {
    let x = rnd() * W, y = rnd() * H, a = rnd() * Math.PI * 2;
    g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < segs; s++) {
      a += (rnd() - 0.5) * 1.2;
      x += Math.cos(a) * len * (0.5 + rnd()); y += Math.sin(a) * len * (0.5 + rnd());
      g.lineTo(x, y);
    }
    g.stroke();
  }
}
function hazardBorder(g) {
  g.save();
  g.beginPath();
  g.rect(0, 0, W, H); g.rect(10, 10, W - 20, H - 20);
  g.clip('evenodd');
  g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(250,200,40,0.35)';
  for (let i = 0; i < W + H; i += 24) {
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 12, 0); g.lineTo(i + 12 - H, H); g.lineTo(i - H, H); g.closePath(); g.fill();
  }
  g.restore();
}
const GROUND_PAINTERS = {
  // Fortress — churned mud battlefield with gravel
  brick(g, T, rnd) {
    blobs(g, rnd, 70, 30, 90, ['rgba(0,0,0,0.18)', 'rgba(120,95,60,0.14)', 'rgba(20,14,8,0.2)']);
    specks(g, rnd, 1400, 'rgba(0,0,0,0.25)');
    specks(g, rnd, 700, 'rgba(255,230,190,0.08)');
  },
  // Corridor — flagstone floor
  stone(g, T, rnd) {
    const TW = 64, TH = 44;
    for (let r = 0; r * TH < H; r++) {
      const off = (r % 2) * TW / 2;
      for (let x = -off; x < W; x += TW) {
        const v = rnd() * 14 - 7;
        g.fillStyle = `rgba(${150 + v},${150 + v},${160 + v},0.07)`;
        g.fillRect(x + 2, r * TH + 2, TW - 4, TH - 4);
        g.fillStyle = 'rgba(0,0,0,0.35)';
        g.fillRect(x, r * TH, TW, 2); g.fillRect(x, r * TH, 2, TH);
        g.fillStyle = 'rgba(255,255,255,0.04)';
        g.fillRect(x + 2, r * TH + 2, TW - 4, 1);
      }
    }
    crackLines(g, rnd, 25, 3, 10, 'rgba(0,0,0,0.3)', 1);
  },
  // Pillars — desert dunes with wind ripples
  sandstone(g, T, rnd) {
    blobs(g, rnd, 12, 150, 300, ['rgba(255,220,160,0.1)', 'rgba(60,35,10,0.14)']);
    g.strokeStyle = 'rgba(255, 220, 160, 0.07)'; g.lineWidth = 1.2;
    for (let y = 10; y < H; y += 11) {
      g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= W; x += 16) g.lineTo(x, y + Math.sin(x * 0.02 + y * 0.3) * 5);
      g.stroke();
    }
    specks(g, rnd, 600, 'rgba(90,60,25,0.25)', 1);
  },
  // Crossroads — steel deck: tread-plate panels + hazard stripe border
  metal(g, T, rnd) {
    const P = 140;
    for (let py = 0; py < H; py += P) for (let px = 0; px < W; px += P) {
      g.fillStyle = `rgba(150,180,220,${0.02 + rnd() * 0.04})`;
      g.fillRect(px, py, P, P);
    }
    g.fillStyle = 'rgba(180,200,230,0.07)';
    for (let y = 6, r = 0; y < H; y += 12, r++) for (let x = 6 + (r % 2) * 6; x < W; x += 12) {
      g.save(); g.translate(x, y); g.rotate(r % 2 ? 0.6 : -0.6); g.fillRect(-3, -1, 6, 2); g.restore();
    }
    g.fillStyle = 'rgba(0,0,0,0.45)';
    for (let x = P; x < W; x += P) g.fillRect(x - 1, 0, 2, H);
    for (let y = P; y < H; y += P) g.fillRect(0, y - 1, W, 2);
    hazardBorder(g);
  },
  // Maze — overgrown grass
  mossy(g, T, rnd) {
    blobs(g, rnd, 40, 40, 110, ['rgba(90,140,50,0.14)', 'rgba(10,25,5,0.25)']);
    g.lineWidth = 1; g.lineCap = 'round';
    for (let i = 0; i < 2600; i++) {
      const x = rnd() * W, y = rnd() * H, h = 3 + rnd() * 4, lean = (rnd() - 0.5) * 3;
      g.strokeStyle = `rgba(${70 + rnd() * 60 | 0},${120 + rnd() * 70 | 0},50,${0.2 + rnd() * 0.25})`;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + lean, y - h); g.stroke();
    }
  },
  // Chambers — wooden floorboards
  wood(g, T, rnd) {
    const BH = 24;
    for (let y = 0; y < H; y += BH) {
      let x = -rnd() * 200;
      while (x < W) {
        const len = 140 + rnd() * 160, v = rnd() * 20 - 10;
        g.fillStyle = `rgba(${150 + v},${100 + v},${60 + v},0.12)`;
        g.fillRect(x, y, len, BH);
        g.fillStyle = 'rgba(20,10,0,0.5)'; g.fillRect(x, y, 2, BH);
        g.fillStyle = 'rgba(0,0,0,0.35)';
        g.fillRect(x + 6, y + 5, 2, 2); g.fillRect(x + 6, y + BH - 7, 2, 2);
        g.fillStyle = 'rgba(30,15,5,0.14)';
        for (let s = 0; s < 3; s++) g.fillRect(x + 10, y + 4 + rnd() * (BH - 8), len - 20, 1);
        x += len;
      }
      g.fillStyle = 'rgba(15,8,0,0.55)'; g.fillRect(0, y, W, 1.5);
    }
  },
  // Arena — raked sand, blood stains, painted ring
  bloodstone(g, T, rnd) {
    blobs(g, rnd, 30, 50, 120, ['rgba(160,110,80,0.08)', 'rgba(0,0,0,0.15)']);
    blobs(g, rnd, 14, 10, 30, ['rgba(120,10,10,0.3)']);
    g.strokeStyle = 'rgba(230,180,150,0.1)';
    for (const [r, lw] of [[H * 0.42, 8], [H * 0.36, 2], [H * 0.15, 3]]) {
      g.lineWidth = lw; g.beginPath(); g.arc(W / 2, H / 2, r, 0, Math.PI * 2); g.stroke();
    }
    specks(g, rnd, 900, 'rgba(0,0,0,0.25)');
  },
  // Zigzag — frozen lake: cracked sheen + snow drifted at the edges
  ice(g, T, rnd) {
    blobs(g, rnd, 16, 90, 220, ['rgba(180,220,255,0.1)', 'rgba(10,30,60,0.15)']);
    crackLines(g, rnd, 20, 6, 30, 'rgba(210,235,255,0.14)', 1);
    crackLines(g, rnd, 50, 3, 12, 'rgba(210,235,255,0.08)', 1);
    const drift = (x0, y0, x1, y1) => {
      const grad = g.createLinearGradient(x0, y0, x1, y1);
      grad.addColorStop(0, 'rgba(235,245,255,0.35)'); grad.addColorStop(1, 'rgba(235,245,255,0)');
      g.fillStyle = grad; g.fillRect(0, 0, W, H);
    };
    drift(0, 0, 0, 50); drift(0, H, 0, H - 50); drift(0, 0, 50, 0); drift(W, 0, W - 50, 0);
  },
  // Cyclone — black glass with violet veins
  obsidian(g, T, rnd) {
    blobs(g, rnd, 20, 60, 160, ['rgba(120,80,160,0.08)', 'rgba(0,0,0,0.3)']);
    crackLines(g, rnd, 14, 7, 26, 'rgba(160,90,240,0.12)', 5);
    crackLines(g, rnd, 14, 7, 26, 'rgba(200,150,255,0.35)', 1);
  },
  // Gates — polished marble checker with gold inlay
  gold(g, T, rnd) {
    const S = 56;
    for (let y = 0, r = 0; y < H; y += S, r++) for (let x = 0, c = 0; x < W; x += S, c++) {
      g.fillStyle = (r + c) % 2 ? 'rgba(255,230,170,0.07)' : 'rgba(0,0,0,0.12)';
      g.fillRect(x, y, S, S);
    }
    crackLines(g, rnd, 30, 4, 20, 'rgba(255,240,210,0.05)', 2);
    g.fillStyle = 'rgba(255,210,100,0.2)';
    for (let x = S; x < W; x += S) g.fillRect(x - 0.5, 0, 1, H);
    for (let y = S; y < H; y += S) g.fillRect(0, y - 0.5, W, 1);
    for (let y = S; y < H; y += S) for (let x = S; x < W; x += S) {
      g.save(); g.translate(x, y); g.rotate(Math.PI / 4); g.fillRect(-3, -3, 6, 6); g.restore();
    }
  },
  // Caldera — cooled basalt split by glowing lava rivers
  lava(g, T, rnd) {
    blobs(g, rnd, 50, 30, 100, ['rgba(0,0,0,0.3)', 'rgba(90,60,50,0.12)']);
    blobs(g, rnd, 6, 30, 60, ['rgba(255,110,20,0.35)']);
    crackLines(g, rnd, 12, 8, 30, 'rgba(255,70,0,0.16)', 9);
    crackLines(g, rnd, 12, 8, 30, 'rgba(255,150,40,0.5)', 1.5);
    specks(g, rnd, 700, 'rgba(255,140,60,0.1)');
  },
  // Grid — synthwave floor
  neon(g, T, rnd) {
    const glow = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.6);
    glow.addColorStop(0, 'rgba(255,60,200,0.14)'); glow.addColorStop(1, 'rgba(255,60,200,0)');
    g.fillStyle = glow; g.fillRect(0, 0, W, H);
    for (const [step, color, lw] of [[40, 'rgba(34,230,255,0.1)', 1], [160, 'rgba(34,230,255,0.12)', 5], [160, 'rgba(34,230,255,0.35)', 1]]) {
      g.strokeStyle = color; g.lineWidth = lw; g.beginPath();
      for (let x = 0; x <= W; x += step) { g.moveTo(x, 0); g.lineTo(x, H); }
      for (let y = 0; y <= H; y += step) { g.moveTo(0, y); g.lineTo(W, y); }
      g.stroke();
    }
  },
  // Swamp — dark mud with glowing sludge pools
  toxic(g, T, rnd) {
    blobs(g, rnd, 50, 40, 110, ['rgba(0,0,0,0.25)', 'rgba(70,90,30,0.15)']);
    for (let i = 0; i < 9; i++) {
      const x = rnd() * W, y = rnd() * H, rx = 30 + rnd() * 50, ry = rx * (0.5 + rnd() * 0.3);
      const grad = g.createRadialGradient(x, y, 0, x, y, rx);
      grad.addColorStop(0, 'rgba(150,255,60,0.35)'); grad.addColorStop(0.8, 'rgba(90,200,30,0.18)');
      grad.addColorStop(1, 'rgba(90,200,30,0)');
      g.fillStyle = grad;
      g.beginPath(); g.ellipse(x, y, rx, ry, rnd() * Math.PI, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(200,255,140,0.35)'; g.lineWidth = 1;
      for (let b = 0; b < 4; b++) {
        g.beginPath(); g.arc(x + (rnd() - 0.5) * rx, y + (rnd() - 0.5) * ry, 1.5 + rnd() * 2.5, 0, Math.PI * 2); g.stroke();
      }
    }
    specks(g, rnd, 800, 'rgba(0,0,0,0.3)');
  },
  // Tundra — packed snow with tire ruts and sparkle
  snow(g, T, rnd) {
    blobs(g, rnd, 30, 60, 160, ['rgba(255,255,255,0.35)', 'rgba(120,145,175,0.14)']);
    g.strokeStyle = 'rgba(100,125,160,0.12)'; g.lineWidth = 7;
    for (let i = 0; i < 4; i++) {
      const y = rnd() * H, a = (rnd() - 0.5) * 120;
      for (const o of [0, 22]) {
        g.beginPath(); g.moveTo(0, y + o); g.bezierCurveTo(W / 3, y + a + o, W * 2 / 3, y - a + o, W, y + o); g.stroke();
      }
    }
    specks(g, rnd, 900, 'rgba(255,255,255,0.8)', 1);
    specks(g, rnd, 400, 'rgba(90,110,140,0.2)', 2);
  },
  // Reef — sandy seabed under shimmering caustics and light shafts
  reef(g, T, rnd) {
    blobs(g, rnd, 20, 80, 200, ['rgba(220,200,150,0.1)', 'rgba(0,20,40,0.2)']);
    g.lineWidth = 1.6; g.strokeStyle = 'rgba(170,245,255,0.09)';
    const C = 46;
    for (let y = 0; y < H + C; y += C) for (let x = 0; x < W + C; x += C) {
      g.beginPath();
      g.moveTo(x + rnd() * 10, y + rnd() * 10);
      g.quadraticCurveTo(x + C / 2 + rnd() * 16, y + rnd() * 20, x + C, y + rnd() * 10);
      g.quadraticCurveTo(x + C - rnd() * 20, y + C / 2, x + rnd() * 10, y + C);
      g.stroke();
    }
    for (let i = 0; i < 5; i++) {
      const x = rnd() * W;
      const grad = g.createLinearGradient(x, 0, x + H * 0.4, H);
      grad.addColorStop(0, 'rgba(180,250,255,0.12)'); grad.addColorStop(1, 'rgba(180,250,255,0)');
      g.fillStyle = grad;
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 50, 0); g.lineTo(x + 50 + H * 0.4, H); g.lineTo(x + H * 0.4 - 30, H); g.closePath(); g.fill();
    }
    specks(g, rnd, 600, 'rgba(255,240,200,0.15)', 1);
  },
  // Lunar — grey regolith pocked with craters
  lunar(g, T, rnd) {
    blobs(g, rnd, 30, 60, 160, ['rgba(255,255,255,0.05)', 'rgba(0,0,0,0.18)']);
    for (let i = 0; i < 45; i++) {
      const x = rnd() * W, y = rnd() * H, r = 5 + Math.pow(rnd(), 2) * 45;
      g.fillStyle = 'rgba(0,0,0,0.22)';
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      g.lineWidth = Math.max(1, r * 0.12);
      g.strokeStyle = 'rgba(255,255,255,0.14)';
      g.beginPath(); g.arc(x, y, r, 0.1 * Math.PI, 0.9 * Math.PI); g.stroke();
      g.strokeStyle = 'rgba(0,0,0,0.3)';
      g.beginPath(); g.arc(x, y, r, 1.1 * Math.PI, 1.9 * Math.PI); g.stroke();
    }
    specks(g, rnd, 1500, 'rgba(0,0,0,0.25)', 1);
    specks(g, rnd, 600, 'rgba(255,255,255,0.12)', 1);
  },
  // Shrine — raked zen gravel, stepping stones, fallen petals
  shrine(g, T, rnd) {
    g.strokeStyle = 'rgba(240,230,210,0.07)'; g.lineWidth = 1.5;
    for (let y = 6; y < H; y += 9) {
      g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= W; x += 20) g.lineTo(x, y + Math.sin(x * 0.012 + y * 0.05) * 3);
      g.stroke();
    }
    for (let i = 0; i < 3; i++) {
      const x = W * (0.2 + 0.3 * i) + (rnd() - 0.5) * 80, y = H * (0.25 + rnd() * 0.5);
      g.fillStyle = 'rgba(58,54,50,0.9)';
      g.beginPath(); g.arc(x, y, 70, 0, Math.PI * 2); g.fill();
      for (let r = 22; r < 70; r += 9) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke(); }
    }
    for (let x = 60; x < W - 40; x += 70) {
      const y = H / 2 + Math.sin(x * 0.01) * 40 + (rnd() - 0.5) * 20;
      g.fillStyle = 'rgba(0,0,0,0.3)';
      g.beginPath(); g.ellipse(x + 2, y + 3, 22, 14, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(130,125,118,0.55)';
      g.beginPath(); g.ellipse(x, y, 22, 14, rnd() * 0.5, 0, Math.PI * 2); g.fill();
    }
    g.fillStyle = 'rgba(255,170,200,0.45)';
    for (let i = 0; i < 260; i++) {
      g.beginPath(); g.ellipse(rnd() * W, rnd() * H, 2.2, 1.2, rnd() * 3, 0, Math.PI * 2); g.fill();
    }
  },
};

function bakeGround(themeName = 'brick') {
  const T = THEMES[themeName] || THEMES.brick;
  const gctx = groundCtx;
  gctx.fillStyle = T.canvasBg;
  gctx.fillRect(0, 0, W, H);

  // Theme-tinted base wash (slight lift from solid canvasBg)
  const base = gctx.createRadialGradient(W/2, H/2, 80, W/2, H/2, Math.max(W, H));
  base.addColorStop(0, T.dotColor.replace(/[\d.]+\)$/, '0.12)'));
  base.addColorStop(1, 'rgba(0,0,0,0)');
  gctx.fillStyle = base;
  gctx.fillRect(0, 0, W, H);

  // Theme terrain — each stage gets its own ground, not just a tint.
  let seed = themeName.length * 977 + themeName.charCodeAt(0) * 31;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  (GROUND_PAINTERS[themeName] || GROUND_PAINTERS.brick)(gctx, T, rnd);

  // Edge vignette — pulls focus to center, hides hard canvas edge
  const vg = gctx.createRadialGradient(W/2, H/2, Math.min(W, H) * 0.35, W/2, H/2, Math.max(W, H) * 0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  gctx.fillStyle = vg;
  gctx.fillRect(0, 0, W, H);

  // Soft inner border highlight
  gctx.strokeStyle = T.highlight;
  gctx.lineWidth = 1;
  gctx.strokeRect(1, 1, W - 2, H - 2);
}
bakeGround('brick');

const THEME_DECORATIONS = {
  brick:      ['crate', 'sandbag', 'crate', 'crater', 'sandbag', 'rock'],
  stone:      ['bone', 'rock', 'crater', 'rock', 'bone'],
  sandstone:  ['rock', 'sandbag', 'bone', 'rock', 'crater'],
  metal:      ['barrel', 'crate', 'barrel', 'crater', 'plank'],
  mossy:      ['grass', 'mushroom', 'grass', 'rock', 'grass', 'mushroom'],
  wood:       ['crate', 'plank', 'crate', 'plank', 'barrel'],
  bloodstone: ['skull', 'bone', 'skull', 'crater', 'sword', 'bone'],
  ice:        ['snowpile', 'rock', 'snowpile', 'snowpile', 'crystal'],
  obsidian:   ['crystal', 'rock', 'crystal', 'crater', 'skull'],
  gold:       ['coin', 'coin', 'crate', 'coin', 'crystal'],
  lava:       ['rock', 'crater', 'rock', 'skull', 'crater'],
  neon:       [],
  toxic:      ['barrel', 'mushroom', 'bone', 'barrel', 'skull', 'grass'],
  snow:       ['snowpile', 'rock', 'snowpile', 'crate', 'barrel'],
  reef:       ['seaweed', 'shell', 'seaweed', 'rock', 'seaweed'],
  lunar:      ['rock', 'crater', 'barrel', 'rock', 'crater'],
  shrine:     ['lantern', 'rock', 'grass', 'lantern', 'rock'],
};

function paintDecorations(themeName, mapWalls, spawn1, spawn2) {
  const types = THEME_DECORATIONS[themeName];
  if (!types || types.length === 0) return;
  const gctx = groundCtx;
  // Deterministic LCG seeded by theme + wall count → same map looks the same.
  let seed = themeName.length * 131 + mapWalls.length * 17 + 97;
  function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  const WALL_PAD = 14;
  const SPAWN_CLEAR = 70;
  const target = 38;
  let placed = 0;
  for (let i = 0; i < 400 && placed < target; i++) {
    const x = 22 + rnd() * (W - 44);
    const y = 22 + rnd() * (H - 44);
    let blocked = false;
    for (const w of mapWalls) {
      if (x > w.x - WALL_PAD && x < w.x + w.w + WALL_PAD &&
          y > w.y - WALL_PAD && y < w.y + w.h + WALL_PAD) { blocked = true; break; }
    }
    if (blocked) continue;
    if (spawn1 && Math.hypot(x - spawn1.x, y - spawn1.y) < SPAWN_CLEAR) continue;
    if (spawn2 && Math.hypot(x - spawn2.x, y - spawn2.y) < SPAWN_CLEAR) continue;
    const type = types[Math.floor(rnd() * types.length)];
    DECOR_DRAWERS[type](gctx, x, y, rnd());
    placed++;
  }
}

function drawGrid() {
  ctx.drawImage(groundCanvas, 0, 0, W, H);
}

  petal: { n: 28, vx: [20, 45],  vy: [15, 30],   s: [2.5, 4], color: 'rgba(255,180,205,0.85)', spin: true },
  star:  { n: 40, vx: [-2, 2],   vy: [-2, 2],    s: [1, 2],   color: '#ffffff', glow: true },
};
let ambient = [], ambientKind = null;
const lerpR = ([a, b]) => a + Math.random() * (b - a);
function initAmbient(kindName) {
  ambientKind = AMBIENT_KINDS[kindName] || null;
  ambient = [];
  if (!ambientKind) return;
  for (let i = 0; i < ambientKind.n; i++) {
    ambient.push({ x: Math.random() * W, y: Math.random() * H, vx: lerpR(ambientKind.vx),
      vy: lerpR(ambientKind.vy), s: lerpR(ambientKind.s), ph: Math.random() * 6.28 });
  }
}
function updateAmbient(dt) {
  for (const m of ambient) {
    m.ph += dt * 2;
    m.x += (m.vx + Math.sin(m.ph) * 10) * dt;
    m.y += m.vy * dt;
    if (m.x < -10) m.x += W + 20; else if (m.x > W + 10) m.x -= W + 20;
    if (m.y < -10) m.y += H + 20; else if (m.y > H + 10) m.y -= H + 20;
  }
}
function drawAmbient() {
  const k = ambientKind;
  if (!k) return;
  if (k.glow) ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = k.color;
  for (const m of ambient) {
    ctx.globalAlpha = k.glow ? 0.45 + Math.sin(m.ph * 1.7) * 0.35 : 1;
    if (k.ring) {
      ctx.strokeStyle = k.color; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.s, 0, Math.PI * 2); ctx.stroke();
    } else if (k.spin) {
      ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.ph);
      ctx.fillRect(-m.s, -m.s / 3, m.s * 2, m.s / 1.5);
      ctx.restore();
    } else {
      ctx.fillRect(m.x - m.s / 2, m.y - m.s / 2, m.s, m.s);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawDangerHalo(t) {
  let danger = 0;
  for (const b of bullets) {
    if (b.owner === t.id) continue;
    const dist = Math.hypot(b.x - t.x, b.y - t.y);
    if (dist < DANGER_DIST) {
      const tx = t.x - b.x, ty = t.y - b.y;
      const dot = (tx * b.vx + ty * b.vy) / (dist * BULLET_SPEED);
      if (dot > 0.3) danger = Math.max(danger, 1 - dist / DANGER_DIST);
    }
  }
  if (danger > 0) {
    const pulse = 0.5 + Math.sin(Date.now() / 80) * 0.25;
    const alpha = danger * pulse;
    const grad = ctx.createRadialGradient(t.x, t.y, 25, t.x, t.y, 130);
    grad.addColorStop(0, `rgba(239, 68, 68, 0)`);
    grad.addColorStop(0.7, `rgba(239, 68, 68, ${alpha * 0.35})`);
    grad.addColorStop(1, `rgba(239, 68, 68, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 130, 0, Math.PI*2);
    ctx.fill();
  }
}

function draw() {
  ctx.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, 0);
  ctx.fillStyle = arenaBg;          // opaque context: paint bg (also covers shake edges)
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  // Screen shake — random sub-pixel translate, decays each frame
  if (screenShake.mag > 0.1) {
    const sx = (Math.random() - 0.5) * screenShake.mag;
    const sy = (Math.random() - 0.5) * screenShake.mag;
    ctx.translate(sx, sy);
  }
  drawGrid();
  ctx.drawImage(battleCanvas, 0, 0, W, H);   // tread marks + scorch under everything
  drawWalls();
  drawPowerups();
  drawStars();
  if (roundActive) {
    drawAimLine(tank1, tank2);
    drawAimLine(tank2, tank1);
  }
  drawDangerHalo(tank1);
  drawDangerHalo(tank2);
  drawGhosts();
  drawBullets();
  drawTank(tank1);
  drawTank(tank2);
  drawTankHP(tank1);
  drawTankHP(tank2);
  drawParticles();
  drawFloatingTexts();
  drawAmbient();
  ctx.restore();
  // Hit vignette is NOT shaken — full-screen overlay, drawn last over the shake
  drawHitVignettes();
  drawCountdown();
}

function drawCountdown() {
  if (!roundActive || countdownTimer <= 0) return;
  if (countdownStep >= COUNTDOWN_STEPS.length) return;

  const isGo = countdownStep === COUNTDOWN_STEPS.length - 1;
  const text = isGo ? L().go : COUNTDOWN_STEPS[countdownStep];

  // Progress through the current step (0 at start, 1 at end)
  const t = 1 - countdownTimer / COUNTDOWN_STEP_DURATION;

  // Scale animation: pop in big, settle to 1, optional fade at end
  let scale;
  if (t < 0.15) scale = 2.0 - (t / 0.15) * 1.0;       // 2.0 → 1.0 (pop in)
  else if (t > 0.7) scale = 1.0 + (t - 0.7) * 0.6;     // slowly grow as fading
  else scale = 1.0;

  // Alpha — full for most of the step, fade last 30%
  const alpha = t < 0.7 ? 1 : Math.max(0, 1 - (t - 0.7) / 0.3);

  // Semi-transparent darkening during countdown so the numbers pop
  ctx.fillStyle = `rgba(0, 0, 0, ${0.35 * alpha})`;
  ctx.fillRect(0, 0, W, H);

  // Face-to-face: P1 copy in the lower half, P2 copy upside-down in the upper half
  const face = document.body.classList.contains('face');
  const seats = face ? [[H * 0.72, 0], [H * 0.28, Math.PI]] : [[H / 2, 0]];
  const fontSize = (isGo ? 96 : 120) * (face ? 0.75 : 1);
  for (const [cy, rot] of seats) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(W / 2, cy);
    ctx.rotate(rot);
    ctx.scale(scale, scale);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `900 ${fontSize}px ${CANVAS_FONT}`;

    // Outline (thick dark stroke)
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)';
    ctx.lineWidth = 10;
    ctx.lineJoin = 'round';
    ctx.strokeText(text, 0, 0);

    // Fill — GO is yellow (action!), numbers are white
    ctx.fillStyle = isGo ? '#f5d742' : '#ffffff';
    ctx.fillText(text, 0, 0);
    ctx.restore();
  }
}

// HUD runs every frame — cache element refs and only touch the DOM when a
// value actually changes (innerHTML/style writes per frame caused layout churn).
const hudEls = {};
const hudCache = {};
function hudEl(id) { return hudEls[id] || (hudEls[id] = document.getElementById(id)); }
function setIfChanged(key, v, apply) {
  if (hudCache[key] === v) return;
  hudCache[key] = v;
  apply(v);
}

function updateHUD() {
  updateHPBar(tank1, 'hp1', 'hpText1');
  updateHPBar(tank2, 'hp2', 'hpText2');
  setIfChanged('score1', scores.p1, v => hudEl('score1').textContent = v);
  setIfChanged('score2', scores.p2, v => hudEl('score2').textContent = v);
  updatePowerupSlot('pu1', tank1);
  updatePowerupSlot('pu2', tank2);
  updateWeaponSlot('wp1', tank1);
  updateWeaponSlot('wp2', tank2);
  updateRoundTimer();
}

function updateWeaponSlot(elId, t) {
  const el = hudEl(elId);
  if (!el) return;
  const weapon = t.weapon && WEAPON_ITEMS.find(w => w.id === t.weapon);
  setIfChanged(elId + ':w', weapon ? weapon.id : '', id => {
    el.classList.toggle('active', !!id);
    if (!id) return;
    el.querySelector('.icon').innerHTML = iconHTML(id, 16);
    el.style.color = weapon.color;
  });
  if (weapon) setIfChanged(elId + ':a', t.ammo, v => el.querySelector('.ammo').textContent = '×' + v);
}

function updateRoundTimer() {
  const el = hudEl('roundTimer');
  if (!el) return;
  const secs = Math.max(0, Math.ceil(roundTimer));   // roundTimer is seconds now
  setIfChanged('timer', secs, v => el.textContent = `${Math.floor(v / 60)}:${(v % 60).toString().padStart(2, '0')}`);
  setIfChanged('timerLow', roundActive && roundTimer <= LOW_TIME_THRESHOLD, v => el.classList.toggle('low', v));
}

function updateHPBar(t, fillId, textId) {
  const hp = Math.max(0, t.hp);
  setIfChanged(fillId, hp, v => {
    const fill = hudEl(fillId);
    fill.style.width = (v / MAX_HP * 100) + '%';
    // low HP warning color (≤ 2); '' reverts to CSS default (p1 green / p2 blue)
    fill.style.background = v <= 2 && v > 0 ? 'linear-gradient(180deg, #f87171, #dc2626)' : '';
    hudEl(textId).textContent = v + ' / ' + MAX_HP;
  });
}

function updatePowerupSlot(elId, t) {
  const el = hudEl(elId);
  if (!el) return;
  const type = t.powerup && POWERUP_TYPES.find(p => p.id === t.powerup);
  setIfChanged(elId + ':p', type ? type.id : '', id => {
    el.classList.toggle('active', !!id);
    if (!id) return;
    el.querySelector('.icon').innerHTML = iconHTML(id, 16);
    el.querySelector('.timer-fill').style.background = type.color;
  });
  if (type) {
    // quantize to 1% so the bar updates ~100×/powerup instead of every frame
    const pct = Math.round((t.powerupTime / POWERUP_DURATION) * 100);
    setIfChanged(elId + ':t', pct, v => el.querySelector('.timer-fill').style.width = v + '%');
  }
}

function endRound(winnerId) {
  // winnerId: 'p1' | 'p2' | 'draw'
  if (!roundActive) return;
  roundActive = false;
  winner = winnerId;

  // Record per-map outcome for stats
  const mapId = currentMap ? currentMap.id : 'unknown';
  if (!stats.mapResults[mapId]) {
    stats.mapResults[mapId] = { p1Wins: 0, p2Wins: 0, draws: 0 };
  }

  if (winnerId === 'p1') {
    scores.p1++;
    stats.p1.roundsWon++;
    stats.mapResults[mapId].p1Wins++;
  } else if (winnerId === 'p2') {
    scores.p2++;
    stats.p2.roundsWon++;
    stats.mapResults[mapId].p2Wins++;
  } else { // draw
    stats.draws++;
    stats.mapResults[mapId].draws++;
  }

  updateHUD();
  freezeTimer = FREEZE_DURATION;
}

// --- Roulette state ---
// Flow:
//   Round ends → showOverlay('round', ...) → startRoulette(decidedMap) kicks in
//   User presses Space/Enter:
//     - during spin → skip (snap to decided)
//     - after spin (or on match overlay) → advance to next round
let decidedNextMap = null;    // the map that roulette is committing to
let rouletteState = 'idle';   // 'idle' | 'spinning' | 'settling' | 'locked'
let rouletteAnim = null;      // raf id
let rouletteLastItemIdx = -1; // for tick sfx

// ArcadeDeck 통합 전송 규격 — vs AI only (bot drives P2): cumulative AI match wins
function reportAiMatch(p1Won) {
  if (!botEnabled) return;
  let aiWins = 0;
  try { aiWins = Number(localStorage.getItem('tankBattle.aiWins')) || 0; } catch (e) {}
  if (p1Won) {
    aiWins++;
    try { localStorage.setItem('tankBattle.aiWins', String(aiWins)); } catch (e) {}
  }
  try { window.parent.postMessage({ type: 'GAME_OVER', score: aiWins, subScore: scores.p1 }, '*'); } catch (e) {}
}

function showOverlay(kind, winnerName) {
  lastOverlay = { kind, winnerName };
  const lang = L();
  const overlayEl = document.getElementById('overlay');
  const rouletteWrap = document.getElementById('rouletteWrap');
  const nextBtn = document.getElementById('nextBtn');
  const statsBtn = document.getElementById('statsBtn');
  const keyHintEl = document.getElementById('keyHint');
  // Unhide first: the roulette measures its viewport width when it starts.
  overlayEl.classList.remove('hidden');

  let title, sub, btnText;
  if (kind === 'match') {
    title   = lang.matchWin(winnerName);
    sub     = lang.finalLine(scores);
    btnText = lang.restart;
    // No roulette on match end — next match will re-roll from full pool
    rouletteWrap.style.display = 'none';
    decidedNextMap = null;
    rouletteState = 'idle';
    keyHintEl.innerHTML = lang.keyHint;
    nextBtn.disabled = false;
    nextBtn.style.opacity = '1';
    // Show the stats button on match end
    statsBtn.classList.remove('hidden');
    statsBtn.innerHTML = `${iconHTML('stats', 16)} <span style="vertical-align:middle">${lang.statsBtn}</span>`;
    // Match is over — quiet the BGM to let the victory fanfare breathe
    stopBGM(1.2);
  } else if (kind === 'draw') {
    title   = lang.drawRound;
    sub     = lang.drawSub;
    btnText = lang.nextRound;
    rouletteWrap.style.display = 'flex';
    document.getElementById('rouletteLabel').textContent = lang.nextMap;
    decidedNextMap = pickNextMap();
    nextBtn.disabled = true;
    nextBtn.style.opacity = '0.5';
    keyHintEl.innerHTML = lang.skipHint;
    statsBtn.classList.add('hidden');
    startRoulette(decidedNextMap);
  } else { // 'round'
    title   = lang.roundWin(winnerName);
    sub     = lang.scoreLine(scores);
    btnText = lang.nextRound;
    rouletteWrap.style.display = 'flex';
    document.getElementById('rouletteLabel').textContent = lang.nextMap;
    // Decide next map NOW (pulls from pool so it's committed fairly)
    decidedNextMap = pickNextMap();
    // Disable the "next round" button while spinning; re-enable when locked
    nextBtn.disabled = true;
    nextBtn.style.opacity = '0.5';
    keyHintEl.innerHTML = lang.skipHint;
    statsBtn.classList.add('hidden');
    startRoulette(decidedNextMap);
  }
  document.getElementById('overlayTitle').textContent = title;
  document.getElementById('overlaySub').textContent = sub;
  nextBtn.textContent = btnText;
}

// Build the roulette track DOM: the decided map lands exactly under the marker.
// We stage N filler items + decided item + tail items, then animate scroll from 0 to the landing offset.
const ROULETTE_ITEM_W = 110; // 104 + 2*3 margin (matches .roulette-item CSS)

// Mini layout preview per map: theme ground tint + walls + spawn dots.
// Cheap vector render (no ground bake), cached as a data URL per map id.
const mapThumbCache = new Map();
function mapThumb(m) {
  let url = mapThumbCache.get(m.id);
  if (url) return url;
  const T = THEMES[m.theme] || THEMES.brick;
  const c = document.createElement('canvas');
  c.width = 192; c.height = 120;
  const g = c.getContext('2d');
  const sx = c.width / ORIG_W, sy = c.height / ORIG_H;
  g.fillStyle = T.canvasBg; g.fillRect(0, 0, c.width, c.height);
  const glow = g.createRadialGradient(96, 60, 5, 96, 60, 110);
  glow.addColorStop(0, T.accent + '40'); glow.addColorStop(1, 'rgba(0,0,0,0.35)');
  g.fillStyle = glow; g.fillRect(0, 0, c.width, c.height);
  const [r, gg, b] = T.brickRGB;
  for (const w of m.walls) {
    const x = w.x * sx, y = w.y * sy, ww = Math.max(2, w.w * sx), hh = Math.max(2, w.h * sy);
    g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(x + 1.5, y + 2, ww, hh);
    g.fillStyle = `rgb(${Math.min(255, r + 40)},${Math.min(255, gg + 40)},${Math.min(255, b + 40)})`;
    g.fillRect(x, y, ww, hh);
    g.fillStyle = 'rgba(255,255,255,0.3)'; g.fillRect(x, y, ww, 1);
    g.strokeStyle = T.accent; g.globalAlpha = 0.6; g.lineWidth = 1;
    g.strokeRect(x + 0.5, y + 0.5, ww - 1, hh - 1); g.globalAlpha = 1;
  }
  for (const [sp, col] of [[m.spawn1, '#4ade80'], [m.spawn2, '#60a5fa']]) {
    g.fillStyle = col; g.beginPath(); g.arc(sp.x * sx, sp.y * sy, 4, 0, Math.PI * 2); g.fill();
  }
  url = c.toDataURL();
  mapThumbCache.set(m.id, url);
  return url;
}

function buildRouletteItems(decidedMap) {
  // Pool for display = [decided] + all other maps (shuffled) — we'll repeat until enough items
  const pool = [decidedMap, ...MAPS.filter(m => m.id !== decidedMap.id)];
  // We want at least ~25 items flying past for visual momentum
  const items = [];
  while (items.length < 30) {
    // Shuffle each cycle so item order isn't the same every time
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    items.push(...shuffled);
  }
  // Place the decided map at a specific "landing index" so the final translate looks clean
  const landingIdx = 22 + Math.floor(Math.random() * 4); // 22..25
  items[landingIdx] = decidedMap;
  return { items, landingIdx };
}

function renderRouletteTrack(items) {
  const track = document.getElementById('rouletteTrack');
  const vp = track.parentElement;
  vp.classList.remove('locked');
  vp.style.removeProperty('--accent');
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  track.style.filter = '';
  track.innerHTML = items.map(m => {
    const T = THEMES[m.theme] || THEMES.brick;
    return `<div class="roulette-item" style="border-color:${T.border}; background:linear-gradient(to bottom, ${T.canvasBg}, #15152a);">
      <div class="roulette-thumb" style="background-image:url(${mapThumb(m)})">${iconHTML(m.id, 20)}</div>
      <span class="name">${mapLabel(m)}</span>
    </div>`;
  }).join('');
}

// Offset that centers item `idx` under the marker.
function rouletteOffsetFor(idx) {
  const vw = document.getElementById('rouletteTrack').parentElement.clientWidth;
  return -(idx * ROULETTE_ITEM_W + ROULETTE_ITEM_W / 2 - vw / 2);
}
function setRouletteActive(idx) {
  const kids = document.getElementById('rouletteTrack').children;
  if (rouletteLastItemIdx >= 0 && kids[rouletteLastItemIdx]) kids[rouletteLastItemIdx].classList.remove('active');
  if (kids[idx]) kids[idx].classList.add('active');
  rouletteLastItemIdx = idx;
}

function startRoulette(decidedMap) {
  cancelRouletteAnim();
  const { items, landingIdx } = buildRouletteItems(decidedMap);
  renderRouletteTrack(items);
  const finalOffset = rouletteOffsetFor(landingIdx);

  // Animate manually with RAF so we can play tick SFX at each item pass + skip easily
  const track = document.getElementById('rouletteTrack');
  const vw = track.parentElement.clientWidth;
  const resultEl = document.getElementById('rouletteResult');
  resultEl.classList.add('pending');
  resultEl.classList.remove('pop');
  resultEl.style.color = '';
  resultEl.textContent = '—';

  const DURATION = 3000;  // ms
  const SETTLE = 0.14;    // last 14%: ease back from a small overshoot
  const OVERSHOOT = ROULETTE_ITEM_W * 0.3;
  const startTime = performance.now();
  rouletteState = 'spinning';
  rouletteLastItemIdx = -1;
  let prevOffset = 0;

  const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
  const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  function tick(now) {
    if (rouletteState !== 'spinning') return;  // was skipped → handled elsewhere
    const t = Math.min(1, (now - startTime) / DURATION);
    // Spin past the target by a fraction of a card, then settle back onto it.
    const past = finalOffset - OVERSHOOT;
    const currentOffset = t < 1 - SETTLE
      ? past * easeOutQuart(t / (1 - SETTLE))
      : past + OVERSHOOT * easeInOut((t - (1 - SETTLE)) / SETTLE);
    track.style.transform = `translateX(${currentOffset}px)`;
    // Motion blur proportional to speed (px/frame), capped
    const speed = Math.abs(currentOffset - prevOffset);
    prevOffset = currentOffset;
    track.style.filter = speed > 6 ? `blur(${Math.min(3, speed / 14).toFixed(1)}px)` : '';

    // Which item is currently under the marker? highlight + click when it changes
    const idxUnderMarker = Math.floor((-currentOffset + vw / 2) / ROULETTE_ITEM_W);
    if (idxUnderMarker !== rouletteLastItemIdx && t < 1) {
      setRouletteActive(idxUnderMarker);
      SFX.rouletteTick();
    }

    if (t >= 1) {
      finishRoulette(decidedMap, landingIdx);
    } else {
      rouletteAnim = requestAnimationFrame(tick);
    }
  }
  rouletteAnim = requestAnimationFrame(tick);
}

function finishRoulette(decidedMap, landingIdx) {
  rouletteState = 'locked';
  const track = document.getElementById('rouletteTrack');
  track.style.filter = '';
  setRouletteActive(landingIdx);
  const accent = (THEMES[decidedMap.theme] || THEMES.brick).accent;
  const vp = track.parentElement;
  vp.style.setProperty('--accent', accent);
  vp.classList.add('locked');
  track.children[landingIdx]?.classList.add('winner');
  const resultEl = document.getElementById('rouletteResult');
  resultEl.classList.remove('pending');
  resultEl.style.color = accent;
  resultEl.innerHTML = `${iconHTML(decidedMap.id, 18)} <span style="vertical-align:middle">${mapLabel(decidedMap)}</span>`;
  resultEl.classList.remove('pop'); void resultEl.offsetWidth; resultEl.classList.add('pop');
  SFX.rouletteLock();
  // Enable the continue button
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = false;
  nextBtn.style.opacity = '1';
  // Swap the hint to the "proceed" hint
  document.getElementById('keyHint').innerHTML = L().keyHint;
}

function cancelRouletteAnim() {
  if (rouletteAnim) { cancelAnimationFrame(rouletteAnim); rouletteAnim = null; }
}

function skipRoulette() {
  if (rouletteState !== 'spinning') return;
  cancelRouletteAnim();
  rouletteState = 'settling';   // blocks a second skip / early advance during the 250ms snap
  const { items, landingIdx } = buildRouletteItems(decidedNextMap);
  renderRouletteTrack(items);
  rouletteLastItemIdx = -1;
  const track = document.getElementById('rouletteTrack');
  // give it a brief deceleration even on skip so it feels intentional, not instant
  track.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1)';
  track.style.transform = `translateX(${rouletteOffsetFor(landingIdx)}px)`;
  setTimeout(() => finishRoulette(decidedNextMap, landingIdx), 250);
}

// --- Stats modal ---
function buildStatRow(icon, label, v1, v2, higherIsBetter = true, fmt = null) {
  // Returns HTML for a stat row with values and a comparison bar.
  // v1/v2 are raw numbers; fmt(n) optionally formats display strings (e.g. "45%").
  // Bars grow outward from the center, each scaled against the larger value.
  const n1 = Number(v1) || 0;
  const n2 = Number(v2) || 0;
  const max = Math.max(n1, n2);
  const w1 = max > 0 ? n1 / max * 100 : 0;
  const w2 = max > 0 ? n2 / max * 100 : 0;
  const lead = n1 === n2 ? 0 : ((higherIsBetter ? n1 > n2 : n1 < n2) ? 1 : 2);
  const disp1 = fmt ? fmt(n1) : n1;
  const disp2 = fmt ? fmt(n2) : n2;
  return `
    <div class="stat-row" style="--i:${buildStatRow.i++}">
      <span class="stat-v p1 ${lead === 1 ? 'lead' : ''}">${disp1}</span>
      <span class="stat-label">${iconHTML(icon, 15)}${label}</span>
      <span class="stat-v p2 ${lead === 2 ? 'lead' : ''}">${disp2}</span>
      <div class="stat-bar">
        <span><i class="b1 ${lead === 2 ? 'dim' : ''}" style="width:${w1}%"></i></span>
        <span><i class="b2 ${lead === 1 ? 'dim' : ''}" style="width:${w2}%"></i></span>
      </div>
    </div>`;
}

function showStatsModal() {
  const lang = L();

// Main game loop — delta-time based, frame-rate independent.
// Every update function takes dt (seconds since last frame) so gameplay runs
// at the same speed on 60Hz, 144Hz, 240Hz displays.
let lastFrameTime = 0;   // timestamp (ms) of previous rAF callback
let rafId = 0;

function loop(now) {
  // Compute delta time in SECONDS. First frame uses 1/60 as a safe fallback.
  let rawDt;
  if (lastFrameTime === 0) {
    rawDt = 1 / 60;
  } else {
    rawDt = (now - lastFrameTime) / 1000;
  }
  lastFrameTime = now;
  // Clamp dt to avoid huge jumps (tab backgrounded, debugger pause, etc.)
  // 0.1s cap means the worst case is a 100ms "skip" rather than teleporting.
  if (rawDt > 0.1) rawDt = 0.1;

  // BATTLE: slow-mo on kill — gameplay dt is scaled, but screen-shake/UI use rawDt.
  let dt = rawDt;
  if (slowmoTimer > 0) {
    slowmoTimer -= rawDt;
    dt = rawDt * 0.25;
  }

  updateShake(rawDt);
  updateHitVignettes(rawDt);
  updateAmbient(rawDt);

  if (netRole === 'host') netBeginFrame();
  if (netRole === 'guest') {
    netSendInput(now);   // state arrives from the host in onmessage
  } else if (roundActive) {
    if (countdownTimer > 0) {
      // Countdown phase: freeze gameplay, tick the countdown by seconds
      countdownTimer -= dt;
      if (countdownTimer <= 0) {
        countdownStep++;
        if (countdownStep < COUNTDOWN_STEPS.length) {
          countdownTimer = COUNTDOWN_STEP_DURATION;
          if (countdownStep === COUNTDOWN_STEPS.length - 1) SFX.countdownGo();
          else SFX.countdownTick();
        } else {
          countdownTimer = 0;   // stop counting; gameplay unlocks next frame
        }
      }
    } else {
      updateTank(tank1, tank2, dt);
      updateTank(tank2, tank1, dt);
      updateBullets(dt);
      updatePowerups(dt);
      updateStars(dt);
      // Tick down round timer (now in seconds)
      roundTimer -= dt;
      // Beep once per whole second crossing during the last LOW_TIME_THRESHOLD seconds
      const currentSec = Math.ceil(roundTimer);
      if (roundTimer > 0 && roundTimer <= LOW_TIME_THRESHOLD && currentSec !== lastTimeWarningSec) {
        SFX.timeWarning();
        lastTimeWarningSec = currentSec;
      }
      if (roundTimer <= 0) {
        if (tank1.hp > tank2.hp) endRound('p1');
        else if (tank2.hp > tank1.hp) endRound('p2');
        else if (tank1.stars !== tank2.stars) endRound(tank1.stars > tank2.stars ? 'p1' : 'p2');   // HP tie → stars break it
        else endRound('draw');
      }
    }
    updateHUD();
  }
  updateParticles(dt);
  updateGhosts(dt);
  updateFloatingTexts(dt);
  draw();
  if (netRole !== 'guest' && !roundActive && freezeTimer > 0) {
    freezeTimer -= dt;
    if (freezeTimer <= 0) {
      freezeTimer = 0;
      if (scores.p1 >= WIN_SCORE) { SFX.matchWin(); showOverlay('match', 'P1'); reportAiMatch(true); }
      else if (scores.p2 >= WIN_SCORE) { SFX.matchWin(); showOverlay('match', 'P2'); reportAiMatch(false); }
      else if (winner === 'draw') { SFX.drawRound(); showOverlay('draw'); }
      else { SFX.roundWin(); showOverlay('round', winner === 'p1' ? 'P1' : 'P2'); }
    }
  }
  if (netRole === 'host') netEndFrame(now);
  rafId = requestAnimationFrame(loop);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    // Mobile: release the audio device while backgrounded (battery + iOS etiquette)
    if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
    for (const k in keys) keys[k] = false;
    resetTouchInputs();
  } else {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (!rafId) {
      lastFrameTime = 0;   // reset dt so we don't accumulate hidden-time
      rafId = requestAnimationFrame(loop);
    }
  }
});

// --- Two-phone link (WebRTC DataChannel, host-authoritative) ---
// Host runs the whole simulation; the guest only sends its stick/fire and
// renders what the host streams back. Each host frame sends one message:
//   { e: [[fnName, args], ...], s: snapshot }
// e = mirrored side-effect calls (SFX, particles, round/overlay flow) replayed
// on the guest; s = authoritative state (tanks, bullets, pickups, stars, timers).
// Signaling (offer/answer swap) goes through a Firestore `coop/{code}` doc via
// REST, once; after that no server is involved.
// ponytail: STUN only, no TURN — same Wi-Fi / hotspot works, strict-NAT cellular
// pairs fail. Add a TURN server to NET_ICE if cross-network play matters.
const NET_FS = 'https://firestore.googleapis.com/v1/projects/ultragames-website/databases/(default)/documents/coop';
const NET_KEY = 'AIzaSyDFwB-Yt7ARcMZoPD6-1vI892PXyLEvdcU';   // public web key (same as arcadedeck.net)
const NET_ICE = [{ urls: 'stun:stun.l.google.com:19302' }];
const NET_CODE_CHARS = 'ACDEFHJKMNPRTWXY';   // no look-alikes (0/O, 1/I, B/8…)
let netPc = null, netDc = null, netDepth = 0, netInFrame = false, netLastSend = 0;
let netEvents = [];
let netNextMap = null;            // guest: map the host's pickNextMap() rolled
let netLastInput = '', netLastInputAt = 0;
let netStatus = ['linkIntro'];
let netBotBefore = false;
let netRoom = null;               // host: room code, deleted once linked

// Tanks and maps travel as tags so references (bullet owner, star owner,
// initRound(map)) resolve to the guest's own objects.
const netReplacer = (k, v) => v === tank1 ? '$p1' : v === tank2 ? '$p2'
  : (v && v.walls && v.spawn1) ? '$m:' + v.id : v;
const netReviver = (k, v) => v === '$p1' ? tank1 : v === '$p2' ? tank2
  : (typeof v === 'string' && v.startsWith('$m:')) ? MAPS.find(m => '$m:' + m.id === v) : v;

// Wrap a side-effect function so the host records its outermost calls.
// `always` = record even outside the game loop (round flow triggered by clicks).
const NET_FN = {};
function netWrap(name, fn, always) {
  NET_FN[name] = fn;
  return function (...a) {
    if (netRole !== 'host') return fn.apply(this, a);
    const record = netDepth === 0 && (always || netInFrame);
    netDepth++;
    try { return fn.apply(this, a); }
    finally { netDepth--; if (record) netEvents.push([name, a]); }
  };
}
for (const k of Object.keys(SFX)) SFX[k] = netWrap('SFX.' + k, SFX[k]);
spawnExplosion = netWrap('spawnExplosion', spawnExplosion);
spawnMuzzleFlash = netWrap('spawnMuzzleFlash', spawnMuzzleFlash);
spawnRicochetSparks = netWrap('spawnRicochetSparks', spawnRicochetSparks);
spawnPickupBurst = netWrap('spawnPickupBurst', spawnPickupBurst);
spawnShieldBreak = netWrap('spawnShieldBreak', spawnShieldBreak);
spawnHitVignette = netWrap('spawnHitVignette', spawnHitVignette);
spawnFloatingText = netWrap('spawnFloatingText', spawnFloatingText);
spawnFireText = netWrap('spawnFireText', spawnFireText);
addShake = netWrap('addShake', addShake);
paintScorch = netWrap('paintScorch', paintScorch);
paintTreadMarks = netWrap('paintTreadMarks', paintTreadMarks);
initRound = netWrap('initRound', initRound, true);
showOverlay = netWrap('showOverlay', showOverlay, true);
skipRoulette = netWrap('skipRoulette', skipRoulette, true);
// The guest must land on the host's roll, not its own.
const netPickOrig = pickNextMap;
pickNextMap = function () {
  if (netRole === 'guest' && netNextMap) { const m = netNextMap; netNextMap = null; return m; }
  const m = netPickOrig();
  if (netRole === 'host') netEvents.push(['$map', [m]]);
  return m;
};

// Inline particles.push / ghosts.push inside the sim (bullet trails, laser beam,
// tank ghosts) aren't function calls — hook the arrays themselves.
function netHookArray(arr, name) {
  if (arr._net) return;
  Object.defineProperty(arr, '_net', { value: true });
  arr.push = function (...a) {
    if (netInFrame && netDepth === 0) netEvents.push([name, a]);
    return Array.prototype.push.apply(this, a);
  };
}
function netBeginFrame() {
  netHookArray(particles, '$particles');
  netHookArray(ghosts, '$ghosts');
  netInFrame = true;
}
function netEndFrame(now) {
  netInFrame = false;
  if (!netDc || netDc.readyState !== 'open' || now - netLastSend < 15) return;
  netLastSend = now;
  const s = {
    t1: { ...tank1 }, t2: { ...tank2 }, b: bullets, pu: powerups, st: stars,
    rt: roundTimer, ct: countdownTimer, cs: countdownStep, ra: roundActive,
    w: winner, ft: freezeTimer, sm: slowmoTimer, sc: scores,
    stats: roundActive ? undefined : stats,   // stats modal only opens between rounds
  };
  netDc.send(JSON.stringify({ e: netEvents, s }, netReplacer));
  netEvents = [];
}

function netSyncTank(t, s) {
  for (const k in t) if (!(k in s)) delete t[k];
  Object.assign(t, s);
}
function netApply(msg) {
  for (const [name, a] of msg.e) {
    if (name === '$map') netNextMap = a[0];
    else if (name === '$particles') particles.push(...a);
    else if (name === '$ghosts') ghosts.push(...a);
    else if (name.startsWith('SFX.')) SFX[name.slice(4)](...a);
    else {
      if (name === 'initRound') {   // host advanced: drop the overlay
        document.getElementById('overlay').classList.add('hidden');
        hideStatsModal(); cancelRouletteAnim(); rouletteState = 'idle'; lastOverlay = null;
      }
      NET_FN[name](...a);
    }
  }
  const s = msg.s;
  netSyncTank(tank1, s.t1); netSyncTank(tank2, s.t2);
  bullets = s.b; powerups = s.pu; stars = s.st;
  roundTimer = s.rt; countdownTimer = s.ct; countdownStep = s.cs; roundActive = s.ra;
  winner = s.w; freezeTimer = s.ft; slowmoTimer = s.sm;
  Object.assign(scores, s.sc);
  if (s.stats) stats = s.stats;
  updateHUD();
}

// Guest: keyboard (either key set) or the on-screen pad → host, on change + 10 Hz keepalive.
function netSendInput(now) {
  if (!netDc || netDc.readyState !== 'open') return;
  let dx = 0, dy = 0;
  if (keys.w || keys.arrowup) dy -= 1;
  if (keys.s || keys.arrowdown) dy += 1;
  if (keys.a || keys.arrowleft) dx -= 1;
  if (keys.d || keys.arrowright) dx += 1;
  let fire = !!(keys.g || keys['/']);
  const ti = touchInputs.p1;
  if (ti.active) {
    if (!dx && !dy) { dx = ti.dx; dy = ti.dy; }
    fire = fire || ti.fire;
  }
  const msg = JSON.stringify({ i: [+dx.toFixed(3), +dy.toFixed(3), fire ? 1 : 0] });
  if (msg === netLastInput && now - netLastInputAt < 100) return;
  netLastInput = msg; netLastInputAt = now;
  netDc.send(msg);
}

// --- Signaling: Firestore REST (no SDK in this build) ---
async function netFsGet(code) {
  const r = await fetch(`${NET_FS}/${code}?key=${NET_KEY}`);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('fs ' + r.status);
  return (await r.json()).fields || null;
}
function netFsCreate(code, offer) {
  return fetch(`${NET_FS}?documentId=${code}&key=${NET_KEY}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields: {
      offer: { stringValue: offer },
      expireAt: { timestampValue: new Date(Date.now() + 3600e3).toISOString() },
    } }),
  });
}
function netFsDelete(code) {
  return fetch(`${NET_FS}/${code}?key=${NET_KEY}`, { method: 'DELETE' });
}
function netFsAnswer(code, answer) {
  return fetch(`${NET_FS}/${code}?updateMask.fieldPaths=answer&currentDocument.exists=true&key=${NET_KEY}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields: { answer: { stringValue: answer } } }),
  });
}
// Non-trickle ICE: wait for all candidates so one doc write carries everything.
function netGathered(pc) {
  return new Promise((res) => {
    if (pc.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, 3000);
    pc.addEventListener('icegatheringstatechange', () => {
      if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); }
    });
  });
}
const netSleep = (ms) => new Promise(r => setTimeout(r, ms));

function netNewPc() {
  netClose();
  const pc = netPc = new RTCPeerConnection({ iceServers: NET_ICE });
  pc.addEventListener('connectionstatechange', () => {
    if (pc !== netPc) return;
    if (pc.connectionState === 'failed' || pc.connectionState === 'closed') netDrop(netRole ? 'linkLost' : 'linkFail');
  });
  return pc;
}
function netWire(dc, role) {
  netDc = dc;
  dc.onopen = () => netStart(role);
  dc.onclose = () => { if (dc === netDc) netDrop('linkLost'); };
  dc.onmessage = (e) => {
    const msg = JSON.parse(e.data, netReviver);
    if (role === 'host') { if (msg.i) { netInput.dx = msg.i[0]; netInput.dy = msg.i[1]; netInput.fire = !!msg.i[2]; } }
    else if (msg.s) netApply(msg);
  };
}

async function netHost() {
  const pc = netNewPc();
  netWire(pc.createDataChannel('game'), 'host');
  setLinkStatus('linkMaking');
  try {
    await pc.setLocalDescription(await pc.createOffer());
    await netGathered(pc);
    let code = null;
    for (let i = 0; i < 5 && !code; i++) {
      const c = Array.from({ length: 4 }, () => NET_CODE_CHARS[Math.floor(Math.random() * NET_CODE_CHARS.length)]).join('');
      const r = await netFsCreate(c, JSON.stringify(pc.localDescription));
      if (r.ok) code = c;
      else if (r.status !== 409) throw new Error('create ' + r.status);
      // Code taken: recycle it if the old room is answered or expired (rules allow that delete).
      else if ((await netFsDelete(c)).ok && (await netFsCreate(c, JSON.stringify(pc.localDescription))).ok) code = c;
    }
    if (!code) throw new Error('no code');
    netRoom = code;
    setLinkStatus('linkShare', code);
    for (let i = 0; i < 180 && pc === netPc && !netRole; i++) {   // poll up to 3 min
      await netSleep(1000);
      const f = await netFsGet(code);
      if (f && f.answer) { await pc.setRemoteDescription(JSON.parse(f.answer.stringValue)); return; }
    }
    if (pc === netPc && !netRole) netDrop('linkFail');
  } catch (e) { if (pc === netPc) netDrop('linkServer'); }
}

async function netJoin(code) {
  code = code.trim().toUpperCase();
  if (code.length !== 4) return setLinkStatus('linkBadCode');
  setLinkStatus('linkJoining');
  let f;
  try { f = await netFsGet(code); } catch (e) { return setLinkStatus('linkServer'); }
  if (!f || !f.offer || f.answer) return setLinkStatus('linkBadCode');
  const pc = netNewPc();
  pc.ondatachannel = (e) => netWire(e.channel, 'guest');
  try {
    await pc.setRemoteDescription(JSON.parse(f.offer.stringValue));
    await pc.setLocalDescription(await pc.createAnswer());
    await netGathered(pc);
    const r = await netFsAnswer(code, JSON.stringify(pc.localDescription));
    if (!r.ok) throw new Error('answer ' + r.status);
    await netSleep(15000);
    if (pc === netPc && !netRole) netDrop('linkFail');
  } catch (e) { if (pc === netPc) netDrop('linkServer'); }
}

function netStart(role) {
  netRole = role;
  netBotBefore = botEnabled;
  botEnabled = false;   // not persisted — restored on disconnect
  document.body.classList.add('linked', role);
  for (const k in keys) keys[k] = false;
  resetTouchInputs();
  refreshToggles();
  setLinkStatus('linkOn', role === 'host');
  if (role === 'host' && netRoom) { netFsDelete(netRoom).catch(() => {}); netRoom = null; }
  if (role === 'host') netFreshMatch();
}
// Host: start a fresh match (mirrored to the guest through initRound).
function netFreshMatch() {
  document.getElementById('overlay').classList.add('hidden');
  hideStatsModal(); cancelRouletteAnim(); rouletteState = 'idle'; lastOverlay = null;
  scores.p1 = 0; scores.p2 = 0; mapPool = []; decidedNextMap = null; stats = makeFreshStats();
  initRound();
}
function netClose() {
  const pc = netPc, dc = netDc;
  netPc = null; netDc = null;
  try { if (dc) dc.close(); } catch (e) {}
  try { if (pc) pc.close(); } catch (e) {}
}
function netDrop(statusKey) {
  const wasLinked = !!netRole;
  netClose();
  netEvents = []; netNextMap = null;
  Object.assign(netInput, { dx: 0, dy: 0, fire: false });
  if (wasLinked) {
    netRole = null;
    botEnabled = netBotBefore;
    document.body.classList.remove('linked', 'host', 'guest');
    refreshToggles();
    netFreshMatch();
  }
  setLinkStatus(statusKey || 'linkIntro');
}

// --- Link panel UI ---
const linkBtn = document.getElementById('linkToggle');
const linkPanel = document.getElementById('linkPanel');
const linkCodeEl = document.getElementById('linkCode');
function setLinkStatus(key, arg) { netStatus = [key, arg]; refreshLink(); }
function refreshLink() {
  const lang = L();
  linkBtn.innerHTML = `${iconHTML('link', 18)}<span class="tb-label">${lang.linkLabel}</span>`;
  linkBtn.classList.toggle('active', !!netRole);
  linkBtn.title = lang.linkTitle;
  linkBtn.setAttribute('aria-label', lang.linkTitle);
  const v = lang[netStatus[0]];
  document.getElementById('linkStatus').innerHTML = typeof v === 'function' ? v(netStatus[1]) : v;
  document.getElementById('linkHost').textContent = lang.linkHost;
  document.getElementById('linkJoin').textContent = lang.linkJoin;
  document.getElementById('linkLeave').textContent = lang.linkLeave;
  document.getElementById('linkWait').textContent = lang.linkWait;
  const busy = !!netPc;
  document.getElementById('linkIdle').hidden = busy;
  document.getElementById('linkLeave').hidden = !busy;
}
linkBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  linkBtn.setAttribute('aria-expanded', linkPanel.classList.toggle('open'));
});
document.addEventListener('pointerdown', (e) => {
  if (!linkPanel.contains(e.target) && !linkBtn.contains(e.target)) {
    linkPanel.classList.remove('open');
    linkBtn.setAttribute('aria-expanded', 'false');
  }
});
document.getElementById('linkHost').addEventListener('click', () => netHost());
document.getElementById('linkJoin').addEventListener('click', () => netJoin(linkCodeEl.value));
document.getElementById('linkLeave').addEventListener('click', () => netDrop('linkIntro'));
linkCodeEl.addEventListener('keydown', (e) => {
  e.stopPropagation();   // typing the code must not drive the tank
  if (e.key === 'Enter') netJoin(linkCodeEl.value);
});
linkCodeEl.addEventListener('keyup', (e) => e.stopPropagation());
refreshLink();


// --- PWA: offline cache + install ---
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

updateMuteIcon();   // deferred — ICON_SVGS now in scope
applyLang();
initRound();
rafId = requestAnimationFrame(loop);
</script>
