<script>
'use strict';
const $ = id => document.getElementById(id);
const VER = '3.0.0'; // bump with CHANGELOG + style.css?v= so cached css/json never mismatch this html
const IS_TOUCH = matchMedia('(pointer:coarse)').matches;
const FRAME_MS = IS_TOUCH ? 1000 / 60 : 0; // ponytail: 60fps cap on touch devices only; desktop draws every vsync

function readJSON(k){
  try{ const v = JSON.parse(localStorage.getItem(k) || '{}'); return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }
  catch(e){ console.warn('Corrupted storage reset:', k, e); return {}; }
}
function writeJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ /* private mode / quota: play on without saving */ } }

// ═══════════════════════════════════════════
// PREFERENCES (volume + language)
// ═══════════════════════════════════════════
const prefs = Object.assign({ music:0.6, sfx:0.8, muted:false, lang:null }, readJSON('tc_prefs'));
const clamp01 = v => Math.min(1, Math.max(0, +v || 0));
prefs.music = clamp01(prefs.music); prefs.sfx = clamp01(prefs.sfx); prefs.muted = !!prefs.muted;
const savePrefs = () => writeJSON('tc_prefs', prefs);

// ═══════════════════════════════════════════
// LOCALIZATION — UI strings inline [en, ko, ja]; dish/step/ingredient data in lang/*.json (lazy)
// ═══════════════════════════════════════════
const LANGS = ['en','ko','ja'];
const UI = {
  docTitle:     ['Timing Chef','타이밍 셰프','タイミングシェフ'],
  tagline:      ['Tap on time to cook the perfect dish. One second separates a masterpiece from a mess.','타이밍을 맞춰 완벽한 요리를 완성하세요. 1초의 차이가 명작과 실패를 가릅니다.','タイミングを合わせて完璧な料理を仕上げよう。1秒の差が傑作と失敗を分けます。'],
  startCooking: ['Start cooking','요리 시작','料理をはじめる'],
  modes:        ['Game modes','모드 선택','モード選択'],
  modeSub:      ['How do you want to cook?','어떻게 요리할까요?','どう料理する？'],
  install:      ['Install app','앱 설치','アプリをインストール'],
  iosInstall:   ['In Safari, tap Share → "Add to Home Screen"','Safari 공유 버튼 → "홈 화면에 추가"를 누르세요','Safariの共有ボタン →「ホーム画面に追加」をタップ'],
  back:         ['Back','뒤로','戻る'],
  close:        ['Close','닫기','閉じる'],
  volume:       ['Volume','볼륨','音量'],
  language:     ['Language','언어','言語'],
  music:        ['Music','음악','音楽'],
  sfx:          ['Sound effects','효과음','効果音'],

function detectLang(){
  for(const l of (navigator.languages || [navigator.language || 'en'])){
    const p = String(l).slice(0,2).toLowerCase();
    if(LANGS.includes(p)) return p;
  }
  return 'en';
}

async function loadLangData(l){
  if(l === 'ko') return null;
  if(trCache[l]) return trCache[l];
  const res = await fetch('lang/' + l + '.json?v=' + VER);
  if(!res.ok) throw new Error('lang ' + l + ' HTTP ' + res.status);
  return (trCache[l] = await res.json());
}

// ═══════════════════════════════════════════
// AUDIO ENGINE — D Dorian, master/music/sfx buses, compressor + generated reverb
// ═══════════════════════════════════════════
const A = { ctx:null, master:null, music:null, sfx:null, verb:null, noise:null };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const DORIAN = [0,2,3,5,7,9,10];                                       // D E F G A B C
const dor = d => 62 + 12 * Math.floor(d / 7) + DORIAN[((d % 7) + 7) % 7]; // degree 0 = D4
const musicOn = () => !prefs.muted && prefs.music > 0;
const sfxOn   = () => !prefs.muted && prefs.sfx > 0;

function ac(){
  if(!A.ctx){
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    const ctx = A.ctx = new C({ latencyHint:'interactive' });
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    A.master = ctx.createGain(); A.master.connect(comp); comp.connect(ctx.destination);
    A.music = ctx.createGain(); A.music.connect(A.master);
    A.sfx = ctx.createGain(); A.sfx.connect(A.master);
    // reverb: decaying stereo noise impulse, generated once
    const len = Math.floor(ctx.sampleRate * 2.2), ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for(let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    A.verb = ctx.createConvolver(); A.verb.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = 0.28; A.verb.connect(wet); wet.connect(A.master);
    // reverb sends ride their bus volume, so the sliders scale the tail too
    A.music.send = ctx.createGain(); A.music.send.connect(A.verb);
    A.sfx.send = ctx.createGain(); A.sfx.send.connect(A.verb);
    // one shared 1s noise buffer for every hat/hit (was re-allocated + refilled on every call)
    A.noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = A.noise.getChannelData(0); for(let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    A.master.gain.value = prefs.muted ? 0 : 1;
    A.music.gain.value = A.music.send.gain.value = prefs.music * 0.55;
    A.sfx.gain.value = A.sfx.send.gain.value = prefs.sfx;
  }
  if(A.ctx.state === 'suspended' && !document.hidden) A.ctx.resume().catch(() => {});
  return A.ctx;
}
function applyVolume(){
  if(!A.ctx) return;
  const now = A.ctx.currentTime;
  A.master.gain.setTargetAtTime(prefs.muted ? 0 : 1, now, 0.03);
  for(const [bus, v] of [[A.music, prefs.music * 0.55], [A.sfx, prefs.sfx]]){
    bus.gain.setTargetAtTime(v, now, 0.03); bus.send.gain.setTargetAtTime(v, now, 0.03);
  }
}
function route(node, pan, bus, wet){
  let n = node;
  if(pan && A.ctx.createStereoPanner){ const p = A.ctx.createStereoPanner(); p.pan.value = pan; n.connect(p); n = p; }
  n.connect(bus);
  if(wet){ const s = A.ctx.createGain(); s.gain.value = wet; n.connect(s); s.connect(bus.send); }
}
// subtractive voice: detuned osc pair → lowpass → AD(S)R, optional delayed vibrato
function voice(m, t, dur, o){
  const ctx = A.ctx, f = mtof(m);
  const { type='triangle', vol=0.2, atk=0.01, rel=0.25, cut=4000, det=6, pan=0, bus=A.sfx, wet=0.25, vib=0 } = o;
  const lp = ctx.createBiquadFilter(), g = ctx.createGain(), end = t + dur + rel * 1.6;
  lp.type = 'lowpass'; lp.frequency.value = cut; lp.Q.value = 0.7;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + atk);
  g.gain.setTargetAtTime(vol * 0.72, t + atk, dur * 0.35);
  g.gain.setTargetAtTime(0, t + dur, rel / 4);
  lp.connect(g); route(g, pan, bus, wet);
  let lfoG = null;
  if(vib){
    const lfo = ctx.createOscillator(); lfoG = ctx.createGain();
    lfo.frequency.value = 5.2;
    lfoG.gain.setValueAtTime(0, t); lfoG.gain.linearRampToValueAtTime(f * (Math.pow(2, vib / 1200) - 1), t + Math.min(0.45, dur * 0.6));
    lfo.connect(lfoG); lfo.start(t); lfo.stop(end);
  }
  for(const d of (det ? [-det, det] : [0])){
    const os = ctx.createOscillator(); os.type = type; os.frequency.value = f; os.detune.value = d;
    if(lfoG) lfoG.connect(os.frequency);
    os.connect(lp); os.start(t); os.stop(end);
  }
}
// FM bell: sine carrier, modulator at ratio, decaying index → glassy kitchen-timer ding
function bell(m, t, o){
  const ctx = A.ctx, f = mtof(m);
  const { vol=0.15, dur=1, ratio=3.5, idx=2.2, pan=0, wet=0.35, bus=A.sfx } = o;
  const car = ctx.createOscillator(), mod = ctx.createOscillator(), mg = ctx.createGain(), g = ctx.createGain();
  car.frequency.value = f; mod.frequency.value = f * ratio;
  mg.gain.setValueAtTime(f * idx, t); mg.gain.exponentialRampToValueAtTime(f * 0.05, t + dur * 0.6);
  mod.connect(mg); mg.connect(car.frequency); car.connect(g);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  route(g, pan, bus, wet);
  car.start(t); mod.start(t); car.stop(t + dur + 0.05); mod.stop(t + dur + 0.05);
}
function hiss(t, dur, o){
  const ctx = A.ctx, { vol=0.1, freq=2000, q=1, type='bandpass', bus=A.sfx, pan=0, wet=0 } = o;
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = A.noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  s.connect(f); f.connect(g); route(g, pan, bus, wet);
  s.start(t, Math.random() * 0.5, dur + 0.02);
}
function kick(t, vol, bus){
  const ctx = A.ctx, o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.35);
}
function sfx(fn){ if(!sfxOn()) return; const ctx = ac(); if(ctx) fn(ctx.currentTime + 0.005); }

const sfxWin     = () => sfx(t => {

  [67,71,74].forEach(m => voice(m, t + 0.42, 0.9, { type:'triangle', vol:0.07, atk:0.05, rel:0.9, cut:2400, wet:0.5 }));
  bell(dor(12), t + 0.42, { vol:0.08, dur:1, wet:0.5 });

});
const sfxLose    = () => sfx(t => {

  voice(dor(0), t + 0.68, 1.1, { type:'triangle', vol:0.13, cut:1100, det:7, rel:1, wet:0.5, vib:10 });
  voice(dor(-7), t + 0.68, 1.1, { type:'sine', vol:0.12, cut:600, det:0, rel:1, wet:0.3 });
});

// ── BGM: 92 BPM, 8-bar Dorian vamp (Dm7 | G | Dm7 | G | Fmaj7 | Em7 | Am7 | G) under a 16-bar long-note melody
const BEAT = 60 / 92, STEP = BEAT / 2;            // 8th-note grid
const BARS = [ // [pad voicing, bass root]
  [[57,60,62,65],38], [[55,59,62,64],43], [[57,60,62,65],38], [[55,59,62,64],43],
  [[57,60,64,65],41], [[59,62,64,67],40], [[57,60,64,67],45], [[55,59,62,64],43],
];
const MELODY = [ // [midi, startBeat, beats] over 64 beats — mostly half/whole notes
  [69,0,2],[72,2,1],[74,3,1], [71,4,3],[69,7,1], [65,8,2],[69,10,2], [67,12,4],
  [76,16,2],[72,18,1],[69,19,1], [71,20,2],[67,22,2], [72,24,1.5],[74,25.5,.5],[76,26,2], [74,28,3],[71,31,1],
  [74,32,2],[77,34,1],[76,35,1], [74,36,2],[71,38,2], [69,40,3],[72,43,1], [71,44,2],[67,46,2],
  [69,48,2],[72,50,2], [71,52,2],[76,54,2], [72,56,2],[71,58,1],[69,59,1], [74,60,4],
];
const MEL_AT = new Map(MELODY.map(n => [n[1] * 2, n]));   // 8th-step → note (precomputed lookup)
const bgm = { on:false, step:0, next:0, timer:0, out:null };

function bgmStep(s, t){
  const inBar = s & 7, [pad, root] = BARS[(s >> 3) & 7], m = MEL_AT.get(s & 127), M = bgm.out;
  if(inBar === 0){
    for(const p of pad) voice(p, t, BEAT * 4, { type:'sawtooth', vol:0.034, atk:0.6, rel:1.2, cut:900, det:9, bus:M, wet:0.5 });
    voice(root, t, BEAT * 2.4, { type:'triangle', vol:0.24, atk:0.02, rel:0.25, cut:650, det:0, bus:M, wet:0.05 });
  }
  if(inBar === 5) voice(root + 7, t, BEAT * 1.3, { type:'triangle', vol:0.18, atk:0.02, rel:0.2, cut:650, det:0, bus:M, wet:0.05 });
  if(m) voice(m[0], t, m[2] * BEAT * 0.95, { type:'triangle', vol:0.14, atk:0.05, rel:0.5, cut:2600, det:4, bus:M, wet:0.42, pan:0.1, vib:12 });
  if(inBar & 1) bell(pad[(s >> 1) & 3] + 12, t, { vol:0.022, dur:0.4, ratio:2, idx:1, bus:M, wet:0.3, pan:-0.25 });
  if(inBar === 0 || inBar === 4) kick(t, 0.42, M);
  if(inBar === 2 || inBar === 6) hiss(t, 0.09, { vol:0.045, freq:1800, q:0.9, bus:M, wet:0.15 });
  hiss(t, 0.035, { vol:inBar & 1 ? 0.016 : 0.028, freq:7500, type:'highpass', bus:M, pan:0.2 });
}
function bgmTick(){
  if(!bgm.on) return;
  const now = A.ctx.currentTime;
  if(bgm.next < now - 0.1) bgm.next = now + 0.05;           // resumed after suspend: don't burst-play the backlog
  while(bgm.next < now + 0.25){ bgmStep(bgm.step++, bgm.next); bgm.next += STEP; }
  bgm.timer = setTimeout(bgmTick, 90);                      // lookahead scheduler: audio clock, not timer, sets the beat
}
function startBgm(){
  if(bgm.on || !musicOn()) return;
  const ctx = ac(); if(!ctx) return;
  // fresh gain per run: stopping fades this run's queued notes and tails without touching the next run
  const out = bgm.out = ctx.createGain(); out.connect(A.music);
  out.send = ctx.createGain(); out.send.connect(A.music.send);
  bgm.on = true; bgm.step = 0; bgm.next = ctx.currentTime + 0.08;
  bgmTick();
  $('audio-pulse').hidden = false;
}
function stopBgm(){
  bgm.on = false; clearTimeout(bgm.timer); $('audio-pulse').hidden = true;
  const out = bgm.out; bgm.out = null;
  if(out){
    const now = A.ctx.currentTime;
    out.gain.setTargetAtTime(0, now, 0.08); out.send.gain.setTargetAtTime(0, now, 0.08);
    setTimeout(() => { out.disconnect(); out.send.disconnect(); }, 1500);
  }
}
function syncMusic(){
  const playing = $('game-screen').classList.contains('active') && !$('result-overlay').classList.contains('show');
  if(musicOn() && playing) startBgm(); else if(!musicOn()) stopBgm();
}

// iOS/Android: audio may only start inside a user activation (pointerup/keydown/touchend)

let RECIPES, RECIPE_INGREDIENTS, CODEX_INGREDIENTS, UPGRADES;
let dataLoaded = false, CH_COUNT = 0, BY_CH = {}, ID_IDX = new Map(), SPECIALS = [], CODEX_BY_EMOJI = new Map(), ING_INDEX = null;

async function loadGameData(){
  const get = async p => { const r = await fetch(p + '?v=' + VER); if(!r.ok) throw new Error(p + ' HTTP ' + r.status); return r.json(); };
  const bootLang = LANG;
  const [recipes, ri, ci, up, tr] = await Promise.all([
    get('recipes.json'), get('recipe_ingredients.json'), get('codex_ingredients.json'), get('upgrades.json'),
    loadLangData(bootLang).catch(e => { console.warn(e); showToast(t('langFail')); return null; }),
  ]);
  RECIPES = recipes; RECIPE_INGREDIENTS = ri; CODEX_INGREDIENTS = ci; UPGRADES = up;
  if(LANG === bootLang) TR = tr;   // user may have switched language while data was loading
  RECIPES.forEach((r, i) => {
    r.idx = i; ID_IDX.set(r.id, i);
    (BY_CH[r.chapter] || (BY_CH[r.chapter] = [])).push(r);
    if(r.chapter > CH_COUNT) CH_COUNT = r.chapter;
    if(r.special) SPECIALS.push(r);
  });
  CODEX_INGREDIENTS.forEach(c => CODEX_BY_EMOJI.set(c.emoji, c));
  dataLoaded = true;
}

});

function today(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); } // local date, not UTC

const getUpgradeLv = id => save.upgrades[id] || 0;
function getUpgradeCost(u){ return Math.floor(u.baseCost * Math.pow(u.costMult || 1.6, getUpgradeLv(u.id))); }
const getZoneWidths = () => { const z = getUpgradeLv('timing'); return { perfect:0.12 + z * 0.012, good:0.22 + z * 0.018 }; };

// HUB — each tab renders only when save/lang changed since its last render
// ═══════════════════════════════════════════
let hubTab = 'stages';
const hubCache = {};
const HUB_RENDER = { stages:renderStages, endless:renderEndlessHub, upgrade:renderUpgrades, codex:renderCodex, codex_ing:renderCodexIngredients };
function loadHub(tab){
  hubTab = tab;
  showScreen('hub-screen');
  stopBgm();
  document.querySelectorAll('.hub-tab').forEach(b => { const on = b.id === 'tab-' + tab; b.classList.toggle('active', on); b.setAttribute('aria-selected', on); });
  try{ $('tab-' + tab).scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' }); }catch(e){}
  setCoinDisplay(save.coins);
  const c = $('hub-content');
  if(!dataLoaded){ c.innerHTML = `<div class="hub-loading">${t('loading')}</div>`; c.dataset.key = ''; return; }
  const key = tab + '|' + saveVer + '|' + LANG;
  if(c.dataset.key === key) return;                              // nothing changed → no redraw
  let hit = hubCache[tab];
  if(!hit || hit.key !== key) hit = hubCache[tab] = { key, html:HUB_RENDER[tab]() };
  const sameTab = (c.dataset.key || '').startsWith(tab + '|');
  c.innerHTML = hit.html; c.dataset.key = key;
  if(!sameTab) c.scrollTop = 0;                                  // keep scroll position when e.g. buying an upgrade
}

const starRow = (n, cls) => [0,1,2].map(j => `<span class="${cls}${j < n ? ' lit' : ''}">★</span>`).join('');
const pips = d => `<span class="pips d${d}" role="img" aria-label="${t('diff' + d)}"><i></i><i></i><i></i></span>`;
function todaysSpecial(){ const day = Math.floor(Date.parse(today()) / 864e5); return SPECIALS[day % SPECIALS.length]; }

function renderStages(){
  const ev = todaysSpecial();
  let html = ev ? `<button class="event-banner" onclick="triggerEvent()">
    <span class="eb-emoji" aria-hidden="true">${ev.emoji}</span>
    <span class="eb-text"><span class="eb-kicker">${t('todaySpecial')}</span><span class="eb-title">${rName(ev)}</span><span class="eb-sub">${t('eventSub')}</span></span>
    <span class="eb-chip">×2</span></button>` : '';
  for(let ch = 1; ch <= CH_COUNT; ch++){
    const list = BY_CH[ch] || [];
    const open = chapterUnlocked(ch);
    const stars = list.reduce((s, r) => s + (save.stageStars[r.id] || 0), 0);
    html += `<section class="chapter"><h2 class="section-title">${t('ch' + ch)} <span class="section-tag">${t('chapterN', { n:ch })}</span>
      <span class="section-meta">${open ? `${chapterCleared(ch)}/${list.length} · ★${stars}` : ''}</span></h2>`;
    if(!open){
      html += `<div class="chapter-locked"><svg class="ico" aria-hidden="true"><use href="#i-lock"/></svg>${t('lockedChapter')}</div></section>`;
      continue;
    }
    html += '<div class="stage-grid">';
    for(const r of list){
      const st = save.stageStars[r.id] || 0;
      html += `<button class="stage-card${st === 3 ? ' perfect' : st ? ' cleared' : ''}" onclick="startStage(${r.idx})">
        ${r.special ? `<span class="sc-badge">${t('specialTag')}</span>` : ''}
        <span class="sc-emoji" aria-hidden="true">${r.emoji}</span>
        <span class="sc-name">${rName(r)}</span>
        <span class="sc-stars">${starRow(st, 'sc-star')}</span>
        <span class="sc-foot"><span>🪙 ${r.coin}</span>${pips(r.diff)}</span>
      </button>`;
    }
    html += '</div></section>';
  }
  return html;
}

function renderEndlessHub(){
  return `<div class="endless-panel">
    <div class="big-emoji" aria-hidden="true">♾️</div>
    <div class="ep-title">${t('endlessMode')}</div>
    <div class="ep-sub">${t('endlessHubSub')}</div>
    <div class="ep-best">${save.bestEndless}</div>
    <div class="ep-best-label">${t('bestRecord')}</div>
    <button class="btn btn-primary" onclick="startEndless()">${t('startEndless')}</button>
  </div>`;
}

function renderUpgrades(){
  return '<div class="upgrade-grid">' + UPGRADES.map(u => {
    const lv = getUpgradeLv(u.id), maxed = lv >= u.maxLv, cost = getUpgradeCost(u);
    return `<div class="upgrade-card${maxed ? ' is-maxed' : ''}">
      <div class="uc-icon" aria-hidden="true">${u.emoji}</div>
      <div class="uc-info">
        <div class="uc-name">${uName(u)}</div>
        <div class="uc-desc">${uDesc(u)}</div>
        <div class="uc-progress"><div class="uc-bar"><div class="uc-bar-fill" style="transform:scaleX(${lv / u.maxLv})"></div></div><span class="uc-level">${maxed ? 'MAX' : 'Lv ' + lv + '/' + u.maxLv}</span></div>
      </div>
      <button class="uc-btn${maxed ? ' maxed' : save.coins >= cost ? '' : ' cant-afford'}" ${maxed ? 'disabled' : `onclick="buyUpgrade('${u.id}')"`}>
        ${maxed ? t('maxed') : t('upgrade') + `<span class="uc-cost">🪙${cost}</span>`}
      </button>
    </div>`;
  }).join('') + '</div>';
}

function buyUpgrade(id){
  const u = UPGRADES.find(x => x.id === id);
  if(getUpgradeLv(id) >= u.maxLv){ showToast(t('maxLv')); return; }
  const cost = getUpgradeCost(u);
  if(save.coins < cost){ showToast(t('noCoins')); sfxBad(); return; }
  save.coins -= cost;
  save.upgrades[id] = getUpgradeLv(id) + 1;
  persist();
  sfxUnlock();
  showToast(t('upgraded', { e:u.emoji }));
  loadHub('upgrade');
}

function pick(arr, k){ // partial Fisher–Yates: k unbiased picks without copying-and-sorting the whole list
  const a = arr.slice(), n = Math.min(k, a.length);
  for(let i = 0; i < n; i++){ const j = i + Math.floor(Math.random() * (a.length - i)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n);
}

function recipesWithIng(ing){
  if(!ING_INDEX){
    ING_INDEX = new Map();
    for(const r of RECIPES) for(const it of RECIPE_INGREDIENTS[r.id] || []) for(const k of [it.n, it.e]){
      let s = ING_INDEX.get(k); if(!s) ING_INDEX.set(k, s = new Set()); s.add(r);
    }
  }
  return [...new Set([...(ING_INDEX.get(ing.name) || []), ...(ING_INDEX.get(ing.emoji) || [])])];
}
function openIngredient(id){
  const ing = CODEX_INGREDIENTS.find(x => x.id === id); if(!ing) return;
  $('ing-title').textContent = cName(ing);
  $('ing-emoji').textContent = ing.emoji;
  $('ing-name').textContent = cName(ing);
  $('ing-desc').textContent = cDesc(ing);
  const all = recipesWithIng(ing), picks = pick(all, 3), have = new Set(save.codexDishes);
  $('ing-count').textContent = all.length ? t('relatedCount', { n:all.length, k:picks.length }) : '';
  $('ing-related').innerHTML = picks.length
    ? picks.map((r, i) => miniCard(r, i, `ingToRecipe('${r.id}',${have.has(r.id)})`)).join('')
    : `<div class="empty-note">${t('noRelated')}</div>`;
  openOverlay('ing-overlay');
  sfxTap();
}
function ingToRecipe(id, known){
  closeIngredient();
  launch(() => known ? openCodexDish(id) : startStage(ID_IDX.get(id)), 250);
}
function closeIngredient(){ $('ing-overlay').classList.remove('show'); }

function renderHearts(){
  const n = getBaseLife(), lives = gameState.lives;
  let h = '';
  for(let i = 0; i < n; i++) h += `<span class="heart${i >= lives ? ' empty' : ''}">❤️</span>`;
  $('g-hearts').innerHTML = h;
}
function renderRecipeCard(){
  const r = gameState.recipe;
  $('rc-emoji').textContent = r.emoji;
  $('rc-name').textContent = rName(r);
  $('rc-desc').textContent = rDesc(r);
  $('rc-stars').innerHTML = starRow(save.stageStars[r.id] || 0, 'sc-star');
  $('multitask-warn').classList.toggle('show', !!r.multitask);
}
function renderSteps(){
  const g = gameState, z = g.zones;
  $('stage-progress').innerHTML = g.steps.map(() => '<div class="stage-dot"></div>').join('');
  $('steps-container').innerHTML = g.steps.map((s, i) => {
    const c = s.center = 0.3 + Math.random() * 0.4;
    const pl = (c - z.perfect / 2) * 100, gl = (c - z.good / 2) * 100;
    return `<div class="step-card locked" id="step-card-${i}">
      <div class="step-header"><div class="step-num">${i + 1}</div><div class="step-name">${stepTxt(s.name)}</div><div class="step-result-badge"></div></div>
      <div class="step-timing-bar">
        <div class="timing-labels"><span class="tl-chip tl-perfect" style="left:${c * 100}%">PERFECT</span></div>
        <div class="timing-track">
          <div class="tt-ticks"></div>
          <div class="zone-good" style="left:${gl}%;width:${z.good * 100}%"></div>
          <div class="zone-perfect" style="left:${pl}%;width:${z.perfect * 100}%"><div class="zp-stripes"></div></div>
          <div class="zone-perfect-center" style="left:${c * 100}%"></div>
          <div class="needle-rail" style="transform:translate3d(10%,0,0)"><div class="timing-needle"><div class="tn-top"></div><div class="tn-bar"></div><div class="tn-bot"></div></div></div>
        </div>
        <div class="tap-instruction">${t('tapHint')}</div>
      </div>
    </div>`;
  }).join('');
  const dots = $('stage-progress').children;
  g.steps.forEach((s, i) => {
    s.card = $('step-card-' + i);
    s.badge = s.card.querySelector('.step-result-badge');
    s.track = s.card.querySelector('.timing-track');
    s.rail = s.card.querySelector('.needle-rail');
    s.dot = dots[i];
  });
}

function startStage(idx, opt = {}){
  if(!dataLoaded){ showToast(t('loading')); return; }
  const r = RECIPES[idx];
  if(!r){ showToast(t('stageFail')); return; }
  cancelPlay();
  const g = gameState;
  g.mode = opt.endless ? 'endless' : 'stage';
  g.stageIdx = idx; g.recipe = r; g.bonus = opt.bonus || 1;
  g.steps = r.steps.map(name => ({ name, result:null }));
  g.zones = getZoneWidths();                       // constant for the whole dish → computed once
  g.currentStep = 0; g.score = 0; g.perfects = g.goods = g.bads = 0;
  if(!opt.keepLives) g.lives = getBaseLife();
  renderRecipeCard(); renderSteps(); renderHearts();
  $('g-score').textContent = 0;
  $('endless-hud').hidden = g.mode !== 'endless';
  $('g-stage-label').textContent = g.mode === 'endless'
    ? 'ENDLESS ×' + g.endlessChain
    : t('chapterN', { n:r.chapter }) + ' · ' + t('ch' + r.chapter);
  if(g.mode === 'endless') updateEndlessHud();
  showScreen('game-screen');
  $('cook-area').scrollTop = 0;
  activateStep(0);
  startBgm();
}

// needle = closed-form triangle wave of time: frame-rate independent (120Hz phones no longer run 2× fast)
// and judged at the exact input timestamp rather than the last painted frame.
function needleSpeed(){
  const g = gameState, ch = g.recipe.chapter || 1;
  const perFrame = getNeedleSpeed() + Math.min(0.004, (ch - 1) * 0.0008) + (g.mode === 'endless' ? Math.min(0.004, g.endlessChain * 0.0003) : 0);
  return perFrame * (g.recipe.multitask ? 1.15 : 1) * 0.06;   // 60fps-normalised → track units per ms
}
function needlePos(ts){
  const s = Math.max(0, ts - gameState.t0) * gameState.speed % 1.6;
  return 0.1 + (s <= 0.8 ? s : 1.6 - s);
}
const railX = pos => 'translate3d(' + (pos * 100).toFixed(2) + '%,0,0)';
function drawNeedle(ts){
  const g = gameState;
  if(!g.running) return;
  g.raf = requestAnimationFrame(drawNeedle);
  if(ts < g.nextDraw - 1) return;                  // fps cap (mobile): skip vsyncs until the frame budget is spent
  g.nextDraw = (ts - g.nextDraw > FRAME_MS ? ts : g.nextDraw) + FRAME_MS;
  g.steps[g.currentStep].rail.style.transform = railX(needlePos(ts));
}

function activateStep(idx){
  const g = gameState;
  if(idx > 0){ const p = g.steps[idx - 1]; p.card.className = 'step-card ' + (p.result === 'bad' ? 'failed' : 'done'); }
  if(idx >= g.steps.length) return finishCooking();
  g.currentStep = idx; g.running = true;
  const s = g.steps[idx];
  s.card.className = 'step-card active';
  g.steps.forEach((x, i) => { x.dot.className = 'stage-dot' + (i < idx ? ' done' : i === idx ? ' current' : ''); });
  try{ s.card.scrollIntoView({ behavior:'smooth', block:'center' }); }catch(e){}
  g.speed = needleSpeed();
  g.t0 = performance.now(); g.nextDraw = 0;
  const btn = $('timing-btn'); btn.hidden = false; btn.disabled = false;
  cancelAnimationFrame(g.raf);
  g.raf = requestAnimationFrame(drawNeedle);
}

function onTap(e){
  if(e){ if(e.button > 0) return; e.preventDefault(); }
  const g = gameState;
  if(!g.running) return;
  const now = performance.now();
  const ts = e && e.timeStamp > 0 && e.timeStamp <= now && now - e.timeStamp < 250 ? e.timeStamp : now;
  tapStep(g.currentStep, ts);
}
const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };

function tapStep(idx, ts){
  const g = gameState, s = g.steps[idx];
  g.running = false; cancelAnimationFrame(g.raf);
  $('timing-btn').disabled = true;
  const pos = needlePos(ts);
  s.rail.style.transform = railX(pos);             // freeze needle exactly where it was judged
  const dist = Math.abs(pos - s.center), z = g.zones;
  const fx = (s.track.getBoundingClientRect());
  const fxX = fx.left + fx.width * pos, fxY = fx.top - 6;
  let result, pts;
  if(dist <= z.perfect / 2){
    result = 'perfect'; pts = Math.round(100 * getScoreMult()); g.perfects++;
    sfxPerfect(); buzz(12);
    floatScore('PERFECT +' + pts, fxX, fxY, '#b07a10');
    if(g.lives < getBaseLife() && Math.random() < getReviveChance()){
      g.lives++; renderHearts(); sfxCoin();
      floatScore('+1 ❤️', fxX, fxY - 28, '#d63c27');
    }
  } else if(dist <= z.good / 2){
    result = 'good'; pts = 50; g.goods++;
    sfxGood(); buzz(8);
    floatScore('GOOD +' + pts, fxX, fxY, '#1f6a42');
  } else {
    result = 'bad'; pts = 0; g.bads++;
    sfxBad(); buzz([30, 40, 30]);
    g.lives--; renderHearts();
    floatScore('MISS', fxX, fxY, '#d63c27');
  }
  s.result = result;
  s.card.className = 'step-card active judged' + (result === 'bad' ? ' shake' : '');
  s.badge.className = 'step-result-badge badge-' + result;
  s.badge.textContent = result === 'perfect' ? 'PERFECT ★' : result === 'good' ? 'GOOD ✓' : 'MISS ✗';
  const ring = document.createElement('span');
  ring.className = 'hit-ring ' + result; ring.style.left = pos * 100 + '%';
  ring.addEventListener('animationend', () => ring.remove());
  s.track.appendChild(ring);

  if(result === 'bad' && g.lives <= 0){ later(() => endGame(), 600); return; }

  g.score += pts;
  $('g-score').textContent = g.score;
  if(g.mode === 'endless'){
    if(result === 'bad') g.endlessCombo = 0;
    else {
      g.endlessCombo++;
      if(g.endlessCombo > g.bestCombo) g.bestCombo = g.endlessCombo;
      g.endlessScore += Math.round(pts * (1 + g.endlessCombo * getComboStep()));
    }
    updateEndlessHud();
  }
  maybeCollectIngredient();
  later(() => activateStep(idx + 1), 500);
}

function maybeCollectIngredient(){
  if(Math.random() >= 0.3) return;
  const ing = CODEX_INGREDIENTS[Math.floor(Math.random() * CODEX_INGREDIENTS.length)];
  if(save.codexIngredients.includes(ing.id)) return;
  save.codexIngredients.push(ing.id); persist();
  showToast(t('newIng', { e:ing.emoji, name:cName(ing) }));
}

function finishCooking(){
  const g = gameState, r = g.recipe, total = g.steps.length;
  $('timing-btn').hidden = true;
  const pct = g.perfects / total;
  const stars = pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : g.bads < total ? 1 : 0;
  if(!save.codexDishes.includes(r.id)) save.codexDishes.push(r.id);

  if(g.mode === 'endless'){
    g.endlessChain++;
    const earned = Math.round(r.coin * Math.max(1, stars) * 0.5 * getCoinMult());
    save.coins += earned; persist();
    sfxCoin();
    showToast(t('endlessDish', { e:r.emoji, n:earned, c:g.endlessCombo }));
    let next; do{ next = Math.floor(Math.random() * RECIPES.length); }while(next === g.stageIdx && RECIPES.length > 1);
    later(() => startStage(next, { endless:true, keepLives:true }), 800);
    return;
  }

  stopBgm();
  const earned = Math.round(r.coin * stars * getCoinMult() * g.bonus);
  save.coins += earned;
  if((save.stageStars[r.id] || 0) < stars) save.stageStars[r.id] = stars;
  persist();
  stars > 0 ? sfxWin() : sfxLose();
  const nextR = RECIPES[g.stageIdx + 1];
  showResult({
    emoji:['😓','😊','😄','🏆'][stars], verdict:t('verdict' + stars), dish:rName(r), stars, gold:stars === 3,
    stats:[
      { label:t('totalScore'), val:g.score },
      { label:t('perfects'), val:g.perfects + '/' + total, cls:'gold' },
      { label:t('coinsEarned'), val:'🪙 ' + earned + (g.bonus > 1 ? ' (×' + g.bonus + ')' : ''), cls:'green' },
    ],
    nextAvail:!!nextR && chapterUnlocked(nextR.chapter),
  });
}

function endGame(){
  const g = gameState;
  stopBgm(); sfxLose();
  $('timing-btn').hidden = true;
  if(g.mode === 'endless'){
    const finalScore = g.endlessScore, newBest = finalScore > (save.bestEndless || 0);
    if(newBest) save.bestEndless = finalScore;
    persist();
    showResult({
      emoji:newBest ? '🏆' : '🍳', verdict:t(newBest ? 'newBest' : 'endlessOver'),
      dish:t('dishesDone', { n:g.endlessChain }), stars:0, gold:newBest,
      stats:[
        { label:t('endlessScore'), val:finalScore, cls:'gold' },
        { label:t('bestCombo'), val:'×' + g.bestCombo },
        { label:t('bestRecord'), val:save.bestEndless, cls:'green' },
      ],
      nextAvail:false,
    });
    return;
  }
  showResult({
    emoji:'💀', verdict:t('failed'), dish:rName(g.recipe), stars:0,
    stats:[
      { label:t('totalScore'), val:g.score },
      { label:t('perfects'), val:g.perfects, cls:'gold' },
      { label:t('livesLeft'), val:g.lives },
    ],
    nextAvail:false,
  });
}

function startEndless(){
  if(!dataLoaded){ showToast(t('loading')); return; }
  const g = gameState;
  g.endlessScore = 0; g.endlessCombo = 0; g.bestCombo = 0; g.endlessChain = 0;
  $('el-best').textContent = save.bestEndless;
  startStage(Math.floor(Math.random() * RECIPES.length), { endless:true });
}
function updateEndlessHud(){
  $('el-score').textContent = gameState.endlessScore;
  $('el-combo').textContent = '×' + gameState.endlessCombo;
}

function showResult({ emoji, verdict, dish, stars, stats, nextAvail, gold }){

  $('res-dish').textContent = dish;

  });
  $('res-stats').innerHTML = stats.map(s => `<div class="res-stat"><span class="res-stat-label">${s.label}</span><span class="res-stat-val ${s.cls || ''}">${s.val}</span></div>`).join('');
  setCoinDisplay(save.coins);
  $('res-next-btn').hidden = !nextAvail;
  openOverlay('result-overlay');
  sendArcadeDeckScore('GAME_OVER');
  sendArcadeDeckScore('GAME_SCORE');
}
function closeResult(){ $('result-overlay').classList.remove('show'); }
function nextStage(){ closeResult(); startStage(gameState.stageIdx + 1); }
function retryStage(){
  closeResult();
  if(gameState.mode === 'endless') startEndless();
  else startStage(gameState.stageIdx, { bonus:gameState.bonus });
}

function sendArcadeDeckScore(eventType){
  let totalStars = 0;
  for(const k in save.stageStars) totalStars += save.stageStars[k];
  // origin '*' required because ArcadeDeck host origin unknown at build time;
  // payload contains no secrets (only public game stats), so broadcast is safe.
  if(window.parent && window.parent !== window){
    window.parent.postMessage({
      type: eventType,
      score: totalStars,                    // 별점 총합
      subScore: save.codexDishes.length     // 해금된 요리 개수
    }, '*');
  }
}

const MG = { run:false, score:0, left:30, tick:0, spawn:0, token:0, rect:null };
const MG_EMOJIS = ['🧅','🧄','🍅','🥕','🥔','🍄','🫑','🌽','🥦','🍆','🥬','🥒','🥑','🥚','🥩','🍗','🐟','🦐','🍣','🦀','🧈','🧀','🍚','🍝','🌾','🍞','🫙','🍶','🌶️','🧂','🌿','🌱','🍂','🍋','🍫','🍯','🥥','🍷','🧴','🍬'];
const mgBasket = $('mg-basket'), mgIcon = $('mg-basket-icon');

function showMinigame(){
  if(!dataLoaded){ showToast(t('loading')); return; }
  openOverlay('mg-overlay');
  resetMinigame();
}
function closeMinigame(){ $('mg-overlay').classList.remove('show'); stopMinigame(); }
function mgHud(){
  $('mg-score').textContent = MG.score;
  $('mg-reward').textContent = '+' + Math.round(MG.score * getMgCoinPerItem()) + ' 🪙';
}
function resetMinigameButton(){
  const b = $('mg-start-btn'), played = save.mgLastPlayed === today();
  b.textContent = t(MG.run ? 'mgRunning' : played ? 'mgTomorrow' : 'mgStart');
  b.disabled = MG.run || played;
}
function resetMinigame(){
  stopMinigame();
  MG.score = 0; MG.left = 30; mgHud();
  $('mg-timer-fill').style.transform = 'scaleX(1)';
  resetMinigameButton();
}
function startMinigame(){
  if(MG.run) return;
  if(save.mgLastPlayed === today()){ showToast(t('mgAlready')); return; }
  MG.run = true; MG.score = 0; MG.left = 30; mgHud();
  resetMinigameButton();
  const tok = ++MG.token;
  spawnIng(tok);
  MG.tick = setInterval(() => {
    MG.left--;
    $('mg-timer-fill').style.transform = 'scaleX(' + MG.left / 30 + ')';
    if(MG.left <= 0) finishMinigame();
  }, 1000);
}
function spawnIng(tok){
  if(!MG.run || tok !== MG.token) return;
  const el = document.createElement('div');
  el.className = 'mg-ingredient';
  el.textContent = MG_EMOJIS[Math.floor(Math.random() * MG_EMOJIS.length)];
  el.style.left = (10 + Math.random() * 80) + '%';
  el.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
  el.addEventListener('animationend', () => el.remove());
  mgBasket.appendChild(el);
  MG.spawn = setTimeout(() => spawnIng(tok), 600 + Math.random() * 400);
}
function mgMove(e){
  const r = MG.rect || (MG.rect = mgBasket.getBoundingClientRect());
  const x = Math.max(-0.4, Math.min(0.4, (e.clientX - r.left) / r.width - 0.5)) * r.width;
  mgIcon.style.transform = `translateX(calc(-50% + ${x.toFixed(1)}px))`;
}
// pointerdown (not click): fires immediately on touch and isn't swallowed by the basket's drag handling
mgBasket.addEventListener('pointerdown', e => {
  MG.rect = mgBasket.getBoundingClientRect();
  mgMove(e);
  const el = e.target.closest('.mg-ingredient');
  if(!el || !MG.run) return;
  MG.score++; sfxCoin(); mgHud();
  const pop = document.createElement('span');
  pop.className = 'mg-pop'; pop.textContent = '+1';
  pop.style.left = (e.clientX - MG.rect.left) + 'px'; pop.style.top = (e.clientY - MG.rect.top - 20) + 'px';
  pop.addEventListener('animationend', () => pop.remove());
  mgBasket.appendChild(pop);
  el.remove();
  const ing = CODEX_BY_EMOJI.get(el.textContent);
  if(ing && !save.codexIngredients.includes(ing.id)){ save.codexIngredients.push(ing.id); persist(); }
});
mgBasket.addEventListener('pointermove', mgMove);
function stopMinigame(){
  MG.run = false; MG.token++; MG.rect = null;
  clearInterval(MG.tick); clearTimeout(MG.spawn);
  mgBasket.querySelectorAll('.mg-ingredient,.mg-pop').forEach(el => el.remove());
}
function finishMinigame(){
  stopMinigame();
  const earned = Math.round(MG.score * getMgCoinPerItem());
  save.coins += earned;
  save.mgLastPlayed = today();
  persist();
  setCoinDisplay(save.coins);
  resetMinigameButton();
  sfxWin();
  showToast(t('mgDone', { n:earned }));
}

function floatScore(text, x, y, color){
  const el = document.createElement('div');

  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.addEventListener('animationend', () => el.remove());
  document.body.appendChild(el);
}

let wfdPicks = [], wfdSelected = null;
function openWFD(){ openOverlay('wfd-overlay'); if(!wfdPicks.length) spinWFD(); }
function closeWFD(){ $('wfd-overlay').classList.remove('show'); }

}
function playFromWFD(){
  const idx = ID_IDX.get(wfdSelected); if(idx == null) return;
  closeWFD();
  launch(() => startStage(idx), 200);
}

// ═══════════════════════════════════════════
// INSTALLABLE APP
// ═══════════════════════════════════════════
let installEvt = null;
const IN_FRAME = window.top !== window;
const STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if(!IN_FRAME) $('install-btn').hidden = false; });
addEventListener('appinstalled', () => { installEvt = null; $('install-btn').hidden = true; });
if(IS_IOS && !STANDALONE && !IN_FRAME) $('install-btn').hidden = false;
function installApp(){
  if(!installEvt){ showToast(t('iosInstall')); return; }
  installEvt.prompt();
  installEvt.userChoice.finally(() => { installEvt = null; $('install-btn').hidden = true; });
}

// ═══════════════════════════════════════════
// INPUT: tap button, keyboard, Android back, ESC, backdrop
// ═══════════════════════════════════════════
const tapBtn = $('timing-btn');
tapBtn.addEventListener('pointerdown', e => { tapBtn.classList.add('pressed'); onTap(e); });
['pointerup','pointercancel','pointerleave'].forEach(ev => tapBtn.addEventListener(ev, () => tapBtn.classList.remove('pressed')));
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ handleBack(); return; }
  if((e.code === 'Space' || e.key === 'Enter') && !e.target.closest('button:not(#timing-btn),input,select') && $('game-screen').classList.contains('active') && !$('quit-modal').classList.contains('show') && !$('result-overlay').classList.contains('show')){
    e.preventDefault();
    if(!e.repeat) onTap(null);
  }
});
// one dummy history entry so the Android/browser back button closes sheets / leaves the game instead of the app
function armBackTrap(){ if(!history.state || !history.state.tc) history.pushState({ tc:1 }, ''); }
addEventListener('popstate', () => { if(handleBack()) armBackTrap(); });
function handleBack(){
  const shown = id => $(id).classList.contains('show');
  if(!$('vol-panel').hidden){ $('vol-panel').hidden = true; return true; }
  if(shown('wfd-overlay')){ closeWFD(); return true; }
  if(shown('codex-overlay')){ closeCodexDish(); return true; }
  if(shown('ing-overlay')){ closeIngredient(); return true; }
  if(shown('mg-overlay')){ closeMinigame(); return true; }
  if(shown('quit-modal')){ closeQuitModal(); return true; }
  if(shown('result-overlay')){ exitToHub(); return true; }
  if($('game-screen').classList.contains('active')){ openQuitModal(); return true; }
  if(!$('title-screen').classList.contains('active')){ showScreen('title-screen'); return false; }
  return false;
}
[['wfd-overlay',closeWFD],['codex-overlay',closeCodexDish],['ing-overlay',closeIngredient],['quit-modal',closeQuitModal],['mg-overlay',closeMinigame]]
  .forEach(([id, fn]) => $(id).addEventListener('click', e => { if(e.target === e.currentTarget) fn(); }));

// idle menus: pause decorative CSS animation after 8s without input (gameplay excluded via body.in-game)
let idleTimer = 0;
function poke(){ document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 8000); }
['pointerdown','keydown','wheel'].forEach(ev => addEventListener(ev, poke, { passive:true }));
poke();

applyStaticI18n();
syncVolUI();
</script>
