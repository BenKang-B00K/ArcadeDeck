<!doctype html>
<html lang="en">
<head><script src="/perf.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<title>Personal Travel Diary</title>
<style>
:root{--paper:#f5eee0;--paper2:#ebe1cd;--card:#fff8ea;--ink:#2b2420;--muted:#7b6f63;--line:#dccfb6;--accent:#d2452d;--sea:#0d1424}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--sea);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Apple SD Gothic Neo","Malgun Gothic","Yu Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;background:radial-gradient(120% 90% at 60% 40%,#17223a 0%,#0d1424 55%,#070b15 100%)}
#panel{position:fixed;left:16px;top:16px;bottom:16px;width:340px;background:var(--paper);border-radius:14px;
  box-shadow:0 24px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;z-index:2}
header{padding:20px 20px 14px;border-bottom:1px dashed var(--line);position:relative}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;font-family:inherit;border:0;background:none;padding:4px 6px;margin:-4px -6px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.kicker svg{width:14px;height:14px}
.kicker:hover,.kicker:focus-visible{background:var(--paper2);outline:none}
.steps:empty::after{content:attr(data-empty);display:block;padding:12px 10px;font-size:13px;color:var(--muted);font-style:italic}
.privacy{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted);line-height:1.3}
.privacy>svg{width:14px;height:14px;flex:none}
#privText{flex:1}
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:999px;border:0;background:var(--ink);color:var(--paper);font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.pill[hidden]{display:none}
.pill svg{width:14px;height:14px}
.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body.ro .grip,body.ro .acts,body.ro #add,body.ro #newDay{display:none}
body.ro .privacy{color:var(--accent);font-weight:600}
#sh{margin:auto;border:0;border-radius:14px;background:var(--paper);color:var(--ink);padding:20px;width:min(92vw,400px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
#sh::backdrop{background:rgba(5,8,15,.8)}
#sh h3{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho","Batang",serif;font-size:22px;margin-bottom:8px}
.shNote{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.45}
.shBtns{display:flex;flex-direction:column;gap:8px}
.shBtns button{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:15px;color:var(--ink);cursor:pointer;text-align:left}
.shBtns button:hover,.shBtns button:focus-visible{border-color:var(--accent);outline:none}
#shUrl{width:100%;margin-top:10px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 10px;font:inherit;font-size:13px;color:var(--ink)}
#shMsg{font-size:13px;color:var(--accent);min-height:18px;margin-top:8px}
.shWarn{font-size:12px;color:var(--muted);background:var(--paper2);border-radius:8px;padding:8px 10px;margin-top:6px;line-height:1.45}
.linkBtn{border:0 !important;background:none !important;padding:0 !important;color:var(--accent) !important;text-decoration:underline;font-weight:600}
h1{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho","Batang",serif;font-size:28px;line-height:1.15;margin-top:6px;padding-right:96px}
.langs{position:absolute;right:14px;top:14px;display:flex;gap:2px;background:var(--paper2);border-radius:9px;padding:2px}
.langs button{border:0;background:none;font-family:inherit;font-weight:600;font-size:12px;color:var(--muted);min-width:30px;height:28px;border-radius:7px;cursor:pointer}
.langs button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#tripSel{margin:10px 20px 0;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
#days{list-style:none;padding:4px 12px 16px;overflow:auto;flex:1;overscroll-behavior:contain}
.day h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 8px 6px;display:flex;gap:10px;align-items:center}
.day.target h2{color:var(--accent)}
.day h2{cursor:pointer}
.day h2::after{content:"";flex:1;border-top:1px solid var(--line)}
.steps{list-style:none}
.steps li{position:relative}
.steps li:not(:last-child)::before{content:"";position:absolute;left:27px;top:48px;bottom:-8px;border-left:2px dotted var(--line)}
.step{display:flex;gap:12px;width:100%;text-align:left;padding:10px;border-radius:10px;border:0;background:none;font:inherit;color:inherit;cursor:pointer;align-items:flex-start;min-height:56px}
.step:hover{background:rgba(255,248,234,.7)}
.step:focus-visible,.ctrl button:focus-visible,.langs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.step .ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--paper2);position:relative;z-index:1;transition:background .2s,color .2s}
.step b{font-weight:600;font-size:15px;line-height:1.35}
.step small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.step.on{background:var(--card);box-shadow:inset 3px 0 0 var(--accent)}
.step.on .ic{background:var(--accent);color:#fff}
.step.plan b::after{content:attr(data-plan);margin-left:6px;font-size:10px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 4px;vertical-align:2px}
#add{position:relative;padding:10px 16px 0;border-top:1px dashed var(--line)}
#add .row{display:flex;gap:6px}
#add .sm{align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);padding:6px 2px 0;gap:10px}
#add .sm label{display:flex;align-items:center;gap:5px;cursor:pointer;min-height:32px}
#status{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#q{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;font:inherit;font-size:16px;color:var(--ink)}
#q:focus,#kind:focus{outline:2px solid var(--accent);outline-offset:1px}
#kind{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit;font-size:14px;padding:0 6px;color:var(--ink)}
#newDay{border:1px solid var(--line);background:none;border-radius:8px;height:32px;padding:0 10px;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
#sugg{position:absolute;left:16px;right:16px;bottom:calc(100% - 4px);list-style:none;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 -10px 30px rgba(0,0,0,.18);max-height:260px;overflow-y:auto;z-index:3}
#sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;font:inherit;color:inherit;cursor:pointer;min-height:44px}
#sugg button:hover,#sugg button:focus-visible{background:var(--paper2);outline:none}
#sugg b{font-size:14px;font-weight:600}
#sugg small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li{display:grid;grid-template-columns:20px 1fr auto;align-items:start;border-radius:10px}
.steps li:not(:last-child)::before{left:47px}
.grip{width:20px;height:56px;border:0;background:none;color:var(--muted);cursor:grab;touch-action:none;display:grid;place-items:center;opacity:.45;border-radius:6px}
.grip:hover,.grip:focus-visible{opacity:1;outline:none;background:var(--paper2)}
.grip svg{width:16px;height:16px;stroke-width:3}
.acts{display:flex;flex-direction:column;padding-top:4px}
.act{flex:none;width:32px;height:32px;border:0;background:none;color:var(--muted);border-radius:8px;cursor:pointer;display:grid;place-items:center;opacity:.55}
.act:hover,.act:focus-visible{opacity:1;background:var(--paper2);outline:none}
.act svg{width:17px;height:17px}
.thumbs{grid-column:2/4;display:flex;gap:6px;overflow-x:auto;padding:0 8px 8px 56px;scrollbar-width:thin}
.th{flex:none;width:56px;height:56px;border:0;padding:0;border-radius:8px;overflow:hidden;cursor:zoom-in;background:var(--paper2)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.steps li.dragging{opacity:.35}
.steps li.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.steps li.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.day.drop-into .steps{outline:2px dashed var(--accent);outline-offset:2px;border-radius:10px}
.steps:empty{min-height:44px}
#lb{margin:auto;border:0;padding:0;background:#0b0f1a;border-radius:12px;max-width:min(94vw,1100px);max-height:92vh;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#lb::backdrop,#nd::backdrop{background:rgba(5,8,15,.8)}
#nd h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.dl{list-style:none;display:flex;flex-direction:column;gap:6px}
.dl li{display:flex;gap:6px;align-items:stretch}
.dl .dlDel{flex:none;width:44px;min-height:52px;display:grid;place-items:center;padding:0;color:var(--muted)}
.dl .dlDel:hover,.dl .dlDel:focus-visible{color:var(--accent)}
.dl button{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;min-height:52px}
.dl button:hover,.dl button:focus-visible{border-color:var(--accent);outline:none}
.dl b{font-size:15px;font-weight:600}
.dl small{grid-column:1;font-size:12px;color:var(--muted)}
.dl .cur{grid-row:1/3;grid-column:2;font-size:11px;font-weight:700;color:var(--accent)}
.ndSep{border:0;border-top:1px dashed var(--line);margin:16px 0 14px}
#nd{max-height:90vh;overflow:auto;margin:auto;border:0;border-radius:14px;background:var(--paper);color:var(--ink);padding:20px;width:min(92vw,380px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
#nd h3{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho","Batang",serif;font-size:22px;margin-bottom:14px}
#nd label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin-bottom:12px;flex:1}
#nd input{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px;font:inherit;font-size:16px;color:var(--ink);width:100%}
#nd input:focus{outline:2px solid var(--accent);outline-offset:1px}
#nd .dates{display:flex;gap:10px}
.ndBtns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.ndBtns button{height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
.ndBtns .primary{background:var(--accent);border-color:var(--accent);color:#fff}
#lbImg{display:block;max-width:min(94vw,1100px);max-height:calc(92vh - 56px);object-fit:contain;margin:auto}
.lbbar{display:flex;align-items:center;gap:6px;padding:6px 8px;color:var(--paper);font-size:13px}
.lbbar button{width:44px;height:44px;border:0;background:none;color:var(--paper);border-radius:8px;cursor:pointer;display:grid;place-items:center}
.lbbar button:hover,.lbbar button:focus-visible{background:rgba(255,255,255,.1);outline:none}
.ctrl{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px dashed var(--line)}
.ctrl button{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ctrl #play{background:var(--ink);color:var(--paper);border-color:var(--ink)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lbl{pointer-events:none}
.lbl span{display:block;transform:translateY(-22px);font:600 12px/1 system-ui,sans-serif;color:var(--paper);background:rgba(13,20,36,.82);
  border:1px solid rgba(245,238,224,.22);padding:6px 9px;border-radius:999px;white-space:nowrap;backdrop-filter:blur(4px)}
.lbl.city span{background:none;border:0;padding:0;backdrop-filter:none;transform:translateY(-50%);font-size:11px;letter-spacing:.04em;color:rgba(214,224,245,.85);text-shadow:0 1px 3px #0d1424,0 0 8px #0d1424}
.lbl.lm span{transform:translateY(10px);background:rgba(52,36,12,.85);border-color:rgba(232,184,74,.45);color:#f6dca0;font-size:11px;padding:4px 7px}
.lbl.on span{background:var(--accent);border-color:transparent;color:#fff}
#attr{position:fixed;right:8px;bottom:6px;z-index:1;font-size:10px;color:rgba(245,238,224,.6);background:rgba(13,20,36,.6);padding:2px 6px;border-radius:4px}
#attr a{color:inherit}
@media (max-width:700px){
  #attr{bottom:auto;top:calc(6px + env(safe-area-inset-top))}
  #panel{left:0;right:0;bottom:0;top:auto;width:auto;max-height:52vh;border-radius:16px 16px 0 0}
  header{padding:14px 16px 10px}
  h1{font-size:22px}
  .ctrl{padding-top:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="map"></div>
<aside id="panel">
  <header>
    <button class="kicker" id="newTrip"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v4M10 15h4"/></svg><span data-t="subtitle"></span></button>
    <h1 id="title"></h1>
    <div class="privacy">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span id="privText"></span>
      <button type="button" id="shareBtn" class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span data-t="share"></span></button>
      <button type="button" id="saveCopy" class="pill" hidden data-t="saveCopy"></button>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="ko">한</button><button data-lang="ja">日</button>
    </div>
  </header>
  <select id="tripSel" hidden></select>
  <ol id="days"></ol>
  <form id="add" autocomplete="off">
    <ul id="sugg" role="listbox" hidden></ul>
    <div class="row">
      <input id="q" type="search" enterkeyhint="search">
      <select id="kind"></select>
    </div>
    <div class="row sm">
      <label><input type="checkbox" id="plan"> <span data-t="planLbl"></span></label>
      <span id="status" aria-live="polite"></span>
      <button type="button" id="newDay" data-t="newDay"></button>
    </div>
  </form>
  <nav class="ctrl">
    <button id="prev"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button id="play"></button>
    <button id="next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button id="ovw"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></button>
  </nav>
</aside>
<dialog id="nd">
  <form method="dialog">
    <h3 data-t="myDiaries"></h3>
    <div id="ndLists"></div>
    <hr class="ndSep">
    <h3 data-t="newTrip"></h3>
    <label><span data-t="tripName"></span><input id="ndName" maxlength="60" autocomplete="off"></label>
    <div class="dates">
      <label><span data-t="start"></span><input type="date" id="ndStart" required></label>
      <label><span data-t="end"></span><input type="date" id="ndEnd"></label>
    </div>
    <div class="ndBtns"><button type="button" id="ndImport" class="linkBtn" data-t="importFile"></button><span style="flex:1"></span><button value="cancel" formnovalidate data-t="cancel"></button><button value="ok" class="primary" data-t="create"></button></div>
  </form>
</dialog>
<dialog id="sh">
  <form method="dialog">
    <h3 data-t="shareTitle"></h3>
    <p class="shNote" data-t="shareNote"></p>
    <div class="shBtns">
      <button type="button" id="shLink"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg><span data-t="copyLink"></span></button>
      <button type="button" id="shFile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span data-t="downloadFile"></span></button>
      <button type="button" id="shNative" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg><span data-t="nativeShare"></span></button>
    </div>
    <input id="shUrl" readonly hidden aria-label="Link">
    <p id="shMsg" aria-live="polite"></p>
    <p id="shWarn" class="shWarn" hidden data-t="localWarn"></p>
    <div class="ndBtns"><button value="close" data-t="close"></button></div>
  </form>
</dialog>
<dialog id="lb">
  <img id="lbImg" alt="">
  <div class="lbbar">
    <button id="lbPrev"></button><span id="lbN"></span><button id="lbNext"></button>
    <span style="flex:1"></span>
    <button id="lbDel"></button><button id="lbClose"></button>
  </div>
</dialog>

  }
  const days = o.days.slice(0, 120).map(d => ({ user: true, ...(/^\d{4}-\d{2}-\d{2}$/.test(d?.date) && { date: d.date }),
    steps: (Array.isArray(d?.steps) ? d.steps : []).filter(st => places[st?.to]).slice(0, 300).map(st => {
      const text = names(st.text), kind = ['visit', 'eat', 'stay', 'train', 'flight'].includes(st.kind) ? st.kind : null;

}
const sh = $('#sh'), shMsg = $('#shMsg'), shUrl = $('#shUrl');

function flatLL() { // inverse projection of flat camera target → [lat, lon]
  const t = controls.target, md = -t.z / KX + M0;
  return [(2 * Math.atan(Math.exp(md * Math.PI / 180)) - Math.PI / 2) * 180 / Math.PI, t.x / KX + LON0];
}
const viewLL = () => { const [la, lo] = mode === 'globe' ? llOf(gCamera.position) : flatLL(); return [la, ((lo + 540) % 360) - 180]; };
const norm = s => s.normalize('NFKC').toLowerCase();
const latin = s => /^[\x00-\x7f]/.test(s);
// "starts with" for short input; any word start once 3+ chars typed ("tow" → "Tokyo Tower")
const prefixHit = (name, text) => { const n = norm(name), t = norm(text); return n.startsWith(t) || (t.length > 2 && n.split(/[\s\-]+/).some(w => w.startsWith(t))); };
function localMatches(text) { // diary places: instant, offline
  return Object.entries(PLACES).filter(([, p]) => Object.values(p.name).some(n => prefixHit(n, text)))
    .map(([id, p]) => ({ id, ll: p.ll, name: p.name, sub: '★ ' + T[lang].subtitle }));
}
const nearKm = () => mode === 'globe' ? 3000 : Math.max(camera.position.distanceTo(controls.target) * 3, 50);
async function photon(text, signal) { // prefix autocomplete, biased toward where the map is looking
  const [lat, lon] = viewLL();
  const r = await fetch(`https://photon.komoot.io/api/?limit=25&lang=${latin(text) ? 'en' : 'default'}&lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}&q=${encodeURIComponent(text)}`, { signal });
  if (!r.ok) throw new Error(r.status);
  const seen = new Set();
  return (await r.json()).features.flatMap(f => {
    const pr = f.properties, n = pr.name, osm = pr.osm_type + pr.osm_id, key = n + '|' + (pr.city || pr.county || pr.state);
    if (!n || [...n].length < 2 || seen.has(key)) return []; // dedupe same-name hits in same city (stations/exits)
    const ll = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
    // Latin input: enforce prefix. Non-Latin: Photon only knows local-script names (Korean text → places in Korea),
    // so keep only hits near the view; far ones are noise. Enter falls back to Nominatim (knows name:ko/ja).
    if (latin(text) ? !prefixHit(n, text) : proj(...ll).distanceTo(controls.target) > nearKm()) return [];
    seen.add(key);
    return [{ osm, ll,
      sub: [pr.city || pr.county, pr.state, pr.country].filter(x => x && x !== n).join(', '), name: { en: n, ko: n, ja: n } }];
  });
}
async function nominatim(text, signal) { // full search, explicit Enter only (Nominatim policy: no autocomplete)
  const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&namedetails=1&accept-language=${lang}&q=${encodeURIComponent(text)}`, { signal });
  if (!r.ok) throw new Error(r.status);
  return (await r.json()).map(x => ({ ll: [+x.lat, +x.lon], sub: x.display_name, name: namesOf(x.namedetails, x.name) }));
}
function namesOf(nd = {}, fb = '') { // OSM may hold several values "a;b" → first
  const f = v => v?.split(';')[0].trim(), b = f(nd.name) || fb;
  return { en: f(nd['name:en']) || b, ko: f(nd['name:ko']) || b, ja: f(nd['name:ja']) || b };
}
async function lookupNames(osm, fallback) { // one call on pick → EN/KO/JA names
  try {

    const nd = (await r.json())[0]?.namedetails;

let results = [], ctl, timer;
const q = $('#q'), sugg = $('#sugg'), status = $('#status');
const setStatus = k => status.textContent = k ? T[lang][k] : '';
function showSugg() {
  sugg.hidden = !results.length;
  sugg.innerHTML = results.map((r, i) => `<li><button type="button" data-r="${i}"><b>${esc(L(r.name))}</b><small>${esc(r.sub)}</small></button></li>`).join('');
}
async function suggest() {
  const text = q.value.trim();
  ctl?.abort();
  if (!text) { results = []; showSugg(); return setStatus(); }
  const local = localMatches(text);
  results = local.slice(0, 5); showSugg();
  ctl = new AbortController(); setStatus('searching');
  try {
    const remote = await photon(text, ctl.signal), have = new Set(local.map(r => L(r.name)));
    results = [...local, ...remote.filter(r => !have.has(L(r.name)))].slice(0, 5);
    setStatus(results.length ? '' : 'none'); showSugg();
  } catch (e) { if (e.name !== 'AbortError') setStatus(local.length ? '' : 'err'); }
}
q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(suggest, 200); });
q.addEventListener('keydown', e => {
  if (e.key === 'Escape') { results = []; showSugg(); }
  if (e.key === 'ArrowDown') { e.preventDefault(); sugg.querySelector('button')?.focus(); }
});
sugg.addEventListener('keydown', e => {
  const li = e.target.closest('li');

$('#add').addEventListener('submit', async e => {
  e.preventDefault(); clearTimeout(timer);
  const text = q.value.trim(); if (!text) return;
  // Enter: top suggestion only if it really starts with the full typed text; else full-text search
  const hit = results.find(r => Object.values(r.name).some(n => norm(n).startsWith(norm(text))));
  if (hit) return addPlace(hit);
  ctl?.abort(); ctl = new AbortController(); setStatus('searching');
  try { results = await nominatim(text, ctl.signal); } catch (err) { if (err.name !== 'AbortError') setStatus('err'); return; }
  if (results.length) addPlace(results[0]); else setStatus('none');
});
sugg.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) addPlace(results[+b.dataset.r]); });
$('#newDay').onclick = () => { const last = trip.days.at(-1)?.date; trip.days.push({ user: true, steps: [], ...(last && { date: addDays(last, 1) }) }); activeDay = trip.days.at(-1); save(); renderText(); $('#days').lastElementChild?.scrollIntoView({ block: 'nearest' }); };

async function addPlace(r) {
  ctl?.abort(); results = []; showSugg(); q.value = ''; setStatus();
  let id = r.id; // diary place picked → reuse it

// keep focus centered in the visible map area (right of panel on desktop, above sheet on mobile)
function resize() {
  const W = innerWidth, H = innerHeight, r = panel.getBoundingClientRect(), sheet = r.width >= W - 1;
  renderer.setSize(W, H); labelR.setSize(W, H); gLabelR.setSize(W, H); res.set(W, H);
  for (const sc of [scene, gScene]) sc.traverse(o => o.material?.isLineMaterial && o.material.resolution.set(W, H)); // LineMaterial copies res, not refs it
  for (const cam of [camera, gCamera]) { cam.aspect = W / H; cam.setViewOffset(W, H, sheet ? 0 : -r.right / 2, sheet ? (H - r.top) / 2 : 0, W, H); }
}

// ─── LOOP ───
const v = new THREE.Vector3(), clock = new THREE.Clock();
const ease = t => t < .5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2;
const toCam = new THREE.Vector3();
function declutter(list, cam, dist) { // list order = priority (places → landmarks → cities, biggest first)
  // ponytail: O(n²) box check, fine for dozens of places; grid bucket if hundreds
  const W = innerWidth, H = innerHeight, shown = [];
  const act = cur >= 0 ? [FLAT[cur].from, FLAT[cur].to] : [];
  for (const l of [...list].sort((a, b) => act.includes(b.id) - act.includes(a.id))) {
    if (dist > (l.maxD ?? Infinity) || (l.ref && !l.ref.visible) || (l.globe && toCam.subVectors(cam.position, l.obj.position).dot(l.obj.position) < 0)) { l.obj.visible = false; continue; } // zoomed out / far side
    v.copy(l.obj.position).project(cam);
    if (v.z > 1 || Math.abs(v.x) > 1.05 || Math.abs(v.y) > 1.05) { l.obj.visible = false; continue; } // off-screen
    const x = (v.x + 1) * W / 2, y = (1 - v.y) * H / 2, w = l.w ||= l.el.firstChild.offsetWidth || 90;
    const hit = shown.some(s => Math.abs(s.x - x) < (s.w + w) / 2 + 4 && Math.abs(s.y - y) < 26);
    l.obj.visible = !hit;
    if (!hit) shown.push({ x, y, w });
  }
}
const qTmp = new THREE.Quaternion(), qFly = new THREE.Quaternion();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  if (mode === 'globe') return globeFrame(dt);
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 1.8);
    const e = ease(fly.t);
    controls.target.lerpVectors(fly.a, fly.b, e);
    camera.position.copy(controls.target).addScaledVector(fly.dir, Math.exp(THREE.MathUtils.lerp(Math.log(fly.d0), Math.log(fly.d1), e)));
    if (fly.t === 1) fly = null;
  }
  controls.update();
  const d = camera.position.distanceTo(controls.target);
  camera.near = d / 400; camera.far = d * 120; camera.updateProjectionMatrix();
  grid.material.uniforms.uH.value = d;
  scene.fog.near = d * 1.8; scene.fog.far = d * 4.5;
  for (const o of mapLayers) o.visible = d < o.userData.maxD;
  { const u = grid.material.uniforms, l = Math.log10(d), f = Math.floor(l), sz = 10 ** (f - 1), fr = x => x - Math.floor(x), tx = controls.target.x, tz = controls.target.z;
    u.uC.value.set(tx, tz); u.uS.value = sz; u.uT.value = l - f; u.uF.value.set(fr(tx / sz), fr(tz / sz), fr(tx / sz / 10), fr(tz / sz / 10)); }
  coastMat.opacity = THREE.MathUtils.smoothstep(d, 4, 25);
  borderMat.opacity = .75 * THREE.MathUtils.smoothstep(d, 3, 15); // coarse 1:50m lines: fade at street zoom
  flatPeaks.visible = d > 20; // no 16 km cones at street level
  if (!fly && d > FLAT_MAX * .97) toGlobe(sph(...flatLL(), 1), R + d * 1.2); // zoomed out past flat map

  if (playing && !fly && (playT += dt) > 2.2) {
    playT = 0;
    if (cur < FLAT.length - 1) setStep(cur + 1); else { playing = false; updPlay(); }
  }
  if (cur >= 0) {
    const t = (clock.elapsedTime % 2.6) / 2.6;
    traveler.position.copy(routes[cur].curve.getPointAt(ease(t)));
    traveler.scale.setScalar(.045 + Math.sin(clock.elapsedTime * 6) * .006);
  }
  urbanMat.opacity = THREE.MathUtils.smoothstep(d, 2, 10);
  scaleLandmarks(lmFlat, camera, 46);
  declutter([...labels, ...lmLabels, ...cityLbl], camera, d);
  renderer.render(scene, camera);
  labelR.render(scene, camera);
});
function globeFrame(dt) {
  if (gfly) {
    gfly.t = Math.min(1, gfly.t + dt / 2);
    const e = ease(gfly.t);
    qFly.setFromUnitVectors(gfly.a, gfly.b);
    gCamera.position.copy(gfly.a).applyQuaternion(qTmp.identity().slerp(qFly, e))
      .setLength(Math.exp(THREE.MathUtils.lerp(Math.log(gfly.d0), Math.log(gfly.d1), e)));
    if (gfly.t === 1) gfly = null;
  }
  gControls.update();
  if (!gfly && gCamera.position.length() < R * 1.33) { // zoomed into the globe → flat map at that spot
    toFlat(proj(...llOf(gCamera.position)), FLAT_MAX * .8); return;
  }
  if (playing && !gfly && (playT += dt) > 2.2) {
    playT = 0;
    if (cur < FLAT.length - 1) setStep(cur + 1); else { playing = false; updPlay(); }
  }
  if (cur >= 0) {
    const gp = routes[cur].gpts, t = ease((clock.elapsedTime % 2.6) / 2.6) * (gp.length - 1), i = Math.min(Math.floor(t), gp.length - 2);

    gTraveler.scale.setScalar(.045 + Math.sin(clock.elapsedTime * 6) * .006);
  }
  scaleLandmarks(lmGlobe, gCamera, 28, true);
  declutter([...gLabels, ...lmGLabels, ...cityGLbl], gCamera, gCamera.position.length() - R);
  renderer.render(gScene, gCamera);
  gLabelR.render(gScene, gCamera);
}

resize();
load();
await loadPhotos();
